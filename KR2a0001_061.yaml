body:
  text: 傳伯夷列傳第一夫學者載籍極博猶考信於六藝詩書雖缺然虞夏之文可知也堯將遜位讓於虞舜舜禹之間嶽牧咸薦乃試之於位典職數十年功用既興然後授政示天下重器王者大統傳天下若斯之難也而説者曰堯讓天下於許由許由不受恥之逃隱及夏之時有卞隨務光者此何以稱焉太史公曰余登箕山其上蓋有許由冢云孔子序列古之仁聖賢人如吳太伯伯夷之倫詳矣余以所聞由光義至高其文辭不少概見何哉孔子曰伯夷叔齊不念舊惡怨是用希求仁得仁又何怨乎余悲伯夷之意睹軼詩可異焉其傳曰伯夷叔齊孤竹君之二子也父欲立叔齊及父卒叔齊讓伯夷伯夷曰父命也遂逃去叔齊亦不肯立而逃之國人立其中子於是伯夷叔齊聞西伯昌善養老盍往歸焉及至西伯卒武王載木主號為文王東伐紂伯夷叔齊叩馬而諫曰父死不葬爰及干戈可謂孝乎以臣弒君可謂仁乎左右欲兵之太公曰此義人也扶而去之武王已平殷亂天下宗周而伯夷叔齊恥之義不食周粟隱於首陽山采薇而食之及餓且死作歌其辭曰登彼西山兮采其薇矣以暴易暴兮不知其非矣神農虞夏忽焉沒兮我安適歸矣于嗟徂兮命之衰矣遂餓死於首陽山由此觀之怨邪非邪或曰天道無親常與善人若伯夷叔齊可謂善人者非邪積仁潔行如此而餓死且七十子之徒仲尼獨薦顏淵為好學然回也屢空糟粳不厭而卒蚤夭天之報施善人其何如哉盜跖日殺不辜肝人之肉暴戾恣睢聚黨數千人橫行天下竟以壽終是遵何德哉此其尤大彰明較著者也若至近世操行不軌專犯忌諱而終身逸樂富厚纍世不絶或擇地而蹈之時然後出言行不由徑非公正不發憤而遇禍災者不可勝數也余甚惑焉儻所謂天道是邪非邪子曰道不同不相為謀亦各從其志也故曰富貴如可求雖執鞭之士吾亦為之如不可求從吾所好歲寒然後知松柏之後凋舉世混濁清士乃見豈以其重若彼其輕若此哉君子疾沒世而名不稱焉賈子曰貪夫徇財烈士徇名夸者死權衆庶馮生同明相照同類相求雲從龍風從虎聖人作而萬物覩伯夷叔齊雖賢得夫子而名益彰顏淵雖篤學附驥尾而行益顯巖穴之士趣舍有時若此類名堙滅而不稱悲夫閭巷之人欲砥行立名者非附青雲之士惡能施于後世哉
