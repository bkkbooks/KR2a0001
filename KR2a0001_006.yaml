body:
  text: 秦始皇本紀秦始皇帝者秦莊襄王子也莊襄王為秦質子於趙見呂不韋姬悅而取之生始皇以秦昭王四十八年正月生於邯鄲及生名為政姓趙氏年十三歲莊襄王死政代立為秦王當是之時秦地已并巴蜀漢中越宛有郢置南郡矣北收上郡以東有河東太原上黨郡東至滎陽滅二周置三川郡呂不韋為相封十萬戶號曰文信侯招致賓客游士欲以并天下李斯為舍人蒙驁王齮麃公等為將軍王年少初即位委國事大臣晉陽反元年將軍蒙驁擊定之二年麃公將卒攻卷斬首三萬三年蒙驁攻韓取十三城王齮死十月將軍蒙驁攻魏氏畼有詭歲大饑四年拔畼有詭三月軍罷秦質子歸自趙趙太子出歸國十月庚寅蝗蟲從東方來蔽天天下疫百姓內粟千石拜爵一級五年將軍驁攻魏定酸棗燕虛長平雍丘山陽城皆拔之取二十城初置東郡冬雷六年韓魏趙衛楚共擊秦取壽陵秦出兵五國兵罷拔衛迫東郡其君角率其支屬徙居野王阻其山以保魏之河內七年彗星先出東方見北方五月見西方將軍驁死以攻龍孤慶都還兵攻汲彗星復見西方十六日夏太后死八年王弟長安君成蟜將軍擊趙反死屯留軍吏皆斬死遷其民於臨洮將軍壁死卒屯留蒲鸇反戮其尸河魚大上輕車重馬東就食嫪毐封為長信侯豫之山陽地令毐居之宮室車長衣服苑囿馳獵恣毐事無小大皆決於毐又以河西太原郡更為毐國九年彗星見或竟天攻魏垣蒲陽四月上宿雍己酉王冠帶劍長信侯毐作亂而覺矯王御璽及太后璽以發縣卒乃衛卒官騎戎翟君公舍人將欲攻蘄年宮為亂王知之令相國昌平君昌文君發卒攻毐戰咸陽斬首數百皆拜爵及宦者皆在戰中亦拜爵一級毐等敗走即令國中有生得毐賜錢百萬殺之五十萬盡得毐等衛尉竭內史肆佐弋竭中大夫令齊等二十人皆梟首車裂以徇滅其宗及其舍人輕者為鬼薪及奪爵遷蜀四千餘家家房陵四是月寒凍有死者楊端和攻衍氏彗星見西方又見北方從斗以南八十日十年相國呂不韋坐嫪毐免桓齮為將軍齊趙來置酒齊人茅焦說秦王曰秦方以天下為事而大王有遷母太后之名恐諸侯聞之由此倍秦也秦王乃迎太后於雍而入咸陽復居甘泉宮大索逐客李斯上書說乃止逐客令李斯因說秦王請先取韓以恐他國於是使斯下韓韓王患之與韓非謀弱秦大梁人尉繚來說秦王曰以秦之彊諸侯譬如郡縣之君臣但恐諸侯合從翕而出不意此乃智伯夫差湣王之所以亡也願大王毋愛財物賂其豪臣以亂其謀不過亡三十萬金則諸侯可盡秦王從其計見尉繚亢禮衣服食飲與繚同繚曰秦王為人蜂準長目摯鳥膺豺聲少恩而虎狼心居約易出人下得志亦輕食人我布衣然見我常身自下我誠使秦王得志於天下天下皆為虜矣不可與久游乃亡去秦王覺固止以為秦國尉卒用其計策而李斯用事十一年王翦桓齮楊端和攻鄴取九城王翦攻閼與橑楊皆并為一軍翦將十八日軍歸斗食以下什推二人從軍取鄴安陽桓齮將十二年文信侯不韋死竊葬其舍人臨者晉人也逐出之秦人六百石以上奪爵遷五百石以下不臨遷勿奪爵自今以來操國事不道如嫪毐不韋者籍其門視此秋復嫪毐舍人遷蜀者當是之時天下大旱六月至八月乃雨十三年桓齮攻趙平陽殺趙將扈輒斬首十萬王之河南正月彗星見東方十月桓齮攻趙十四年攻趙軍於平陽取宜安破之殺其將軍桓齮定平陽武城韓非使秦秦用李斯謀留非非死雲陽韓王請為臣十五年大興兵一軍至鄴一軍至太原取狼孟地動十六年九月發卒受地韓南陽假守騰初令男子書年魏獻地於秦秦置麗邑十七年內史騰攻韓得韓王安盡納其地以其地為郡命曰潁川地動華陽太后卒民大饑十八年大興兵攻趙王翦將上地下井陘端和將河內羌瘣伐趙端和圍邯鄲城十九年王翦羌瘣盡定取趙地東陽得趙王引兵欲攻燕屯中山秦王之邯鄲諸嘗與王生趙時母家有仇怨皆坑之秦王還從太原上郡歸始皇帝母太后崩趙公子嘉率其宗數百人之代自立為代王東與燕合兵軍上谷大饑二十年燕太子丹患秦兵至國恐使荊軻刺秦王秦王覺之體解軻以徇而使王翦辛勝攻燕燕代發兵擊秦軍秦軍破燕易水之西二十一年王賁攻荊乃益發卒詣王翦軍遂破燕太子軍取燕薊城得太子丹之首燕王東收遼東而王之王翦謝病老歸新鄭反昌平君徙於郢大雨雪深二尺五寸二十二年王賁攻魏引河溝灌大梁大梁城壞其王請降盡取其地二十三年秦王復召王翦彊起之使將擊荊取陳以南至平輿虜荊王秦王游至郢陳荊將項燕立昌平君為荊王反秦於淮南二十四年王翦蒙武攻荊破荊軍昌平君死項燕遂自殺二十五年大興兵使王賁將攻燕遼東得燕王喜還攻代虜代王嘉王翦遂定荊江南地降越君置會稽郡五月天下大酺二十六年齊王建與其相后勝發兵守其西界不通秦秦使將軍王賁從燕南攻齊得齊王建秦初并天下令丞相御史曰異日韓王納地效璽請為藩臣已而倍約與趙魏合從畔秦故興兵誅之虜其王寡人以為善庶幾息兵革趙王使其相李牧來約盟故歸其質子已而倍盟反我太原故興兵誅之得其王趙公子嘉乃自立為代王故舉兵擊滅之魏王始約服入秦已而與韓趙謀襲秦秦兵吏誅遂破之荊王獻青陽以西已而畔約擊我南郡故發兵誅得其王遂定其荊地燕王昏亂其太子丹乃陰令荊軻為賊兵吏誅滅其國齊王用后勝計絶秦使欲為亂兵吏誅虜其王平齊地寡人以眇眇之身興兵誅暴亂賴宗廟之靈六王咸伏其辜天下大定今名號不更無以稱成功傳後世其議帝號丞相綰御史大夫劫廷尉斯等皆曰昔者五帝地方千里其外侯服夷服諸侯或朝或否天子不能制今陛下興義兵誅殘賊平定天下海內為郡縣法令由一統自上古以來未嘗有五帝所不及臣等謹與博士議曰古有天皇有地皇有泰皇泰皇最貴臣等昧死上尊號王為秦皇命為制令為詔天子自稱曰朕王曰去泰著皇采上古帝位號號曰皇帝他如議制曰可追尊莊襄王為太上皇制曰朕聞太古有號毋諡中古有號死而以行為諡如此則子議父臣議君也甚無謂朕弗取焉自今已來除諡法朕為始皇帝後世以計數二世三世至于萬世傳之無窮始皇推終始五德之傳以為周得火德秦代周德從所不勝方今水德之始改年始朝賀皆自十月朔衣服旄旌節旗皆上黑數以六為紀符法冠皆六寸而輿六尺六尺為步乘六馬更名河曰德水以為水德之始剛毅戾深事皆決於法刻削毋仁恩和義然後合五德之數於是急法久者不赦丞相綰等言諸侯初破燕齊荊地遠不為置王毋以填之請立諸子唯上幸許始皇下其議於群臣群臣皆以為便廷尉李斯議曰周文武所封子弟同姓甚衆然後屬疏遠相攻擊如仇讎諸侯更相誅伐周天子弗能禁止今海內賴陛下神靈一統皆為郡縣諸子功臣以公賦稅重賞賜之甚足易制天下無異意則安寧之術也置諸侯不便始皇曰天下共苦戰鬭不休以有侯王賴宗廟天下初定又復立國是樹兵也而求其寧息豈不難哉廷尉議是分天下以為三十六郡郡置守尉監更名民曰黔首大酺收天下兵聚之咸陽銷以為鍾鐻金人十二重各千石置廷宮中一法度衡石丈尺車同軌書同文字地東至海暨朝鮮西至臨洮羌中南至北嚮戶北據河為塞並陰山至遼東徙天下豪富於咸陽十二萬戶諸廟及章臺上林皆在渭南秦每破諸侯寫放其宮室作之咸陽北阪上南臨渭自雍門以東至涇渭殿屋復道周閣相屬所得諸侯美人鍾鼓以充入之二十七年始皇巡隴西北地出雞頭山過回中焉作信宮渭南已更命信宮為極廟象天極自極廟道通酈山作甘泉前殿築甬道自咸陽屬之是歲賜爵一級治馳道二十八年始皇東行郡縣上鄒嶧山立石與魯諸儒生議刻石頌秦德議封禪望祭山川之事乃遂上泰山立石封祠祀下風雨暴至休於樹下因封其樹為五大夫禪梁父刻所立石其辭曰皇帝臨位作制明法臣下修飭二十有六年初并天下罔不賓服親巡遠方黎民登茲泰山周覽東極從臣思迹本原事業祗誦功德治道運行諸産得宜皆有法式大義休明垂于後世順承勿革皇帝躬聖既平天下不懈於治夙興夜寐建設長利專隆教誨訓經宣達遠近畢理咸承聖志貴賤分明男女禮順慎遵職事昭隔內外靡不清淨施于後嗣化及無窮尊奉遺詔永承重戒於是乃並勃海以東過黃腄窮成山登之罘立石頌秦德焉而去南登琅邪大樂之留三月乃徙黔首三萬戶琅邪臺下復十二歲作琅邪臺立石刻頌秦德明得意曰維二十八年皇帝作始端平法度萬物之紀以明人事合同父子聖智仁義顯白道理東撫東土以省卒士事已大畢乃臨于海皇帝之功勤勞本事上農除末黔首是富普天之下搏心揖志器械一量同書文字日月所照舟輿所載皆終其命莫不得意應時動事是維皇帝匡飭異俗陵水經地憂恤黔首朝夕不懈除疑定法咸知所辟方伯分職諸治經易舉錯必當莫不如畫皇帝之明臨察四方尊卑貴賤不踰次行姦邪不容皆務貞良細大盡力莫敢怠荒遠邇辟隱專務肅莊端直敦忠事業有常皇帝之德存定四極誅亂除害興利致福節事以時諸産繁殖黔首安寧不用兵革六親相保終無寇賊歡欣奉教盡知法式六合之內皇帝之土西涉流沙南盡北戶東有東海北過大夏人迹所至無不臣者功蓋五帝澤及牛馬莫不受德各安其宇維秦王兼有天下立名為皇帝乃撫東土至于琅邪列侯武城侯王離列侯通武王賁倫侯建成侯趙亥倫侯昌武侯成倫侯武信侯馮毋擇丞相隗林丞相王綰卿李斯卿王戊五大夫趙嬰五大夫楊樛從與議於海上曰古之帝者地不過千里諸侯各守其封域或朝或否相侵暴亂殘伐不止猶刻金石以自為紀古之五帝三王知教不同法度不明假威鬼神以欺遠方實不稱名故不久長其身未歿諸侯倍叛法令不行今皇帝并一海內以為郡縣天下和平昭明宗廟體道行德尊號大成群臣相與誦皇帝功德刻于金石以為表經既已齊人徐巿等上書言海中有三神山名曰蓬萊方丈瀛洲仙人居之請得齊戒與童男女求之於是遣徐巿發童男女數千人入海求仙人始皇還過彭城齊戒禱祠欲出周鼎泗水使千人沒水求之弗得乃西南渡淮水之衡山南郡浮江至湘山祠逢大風幾不得渡上問博士曰湘君何神博士對曰聞之堯女舜之妻而葬此於是始皇大怒使刑徒三千人皆伐湘山樹赭其山上自南郡由武關歸二十九年始皇東游至陽武博狼沙中為盜所驚求弗得乃令天下大索十日登之罘刻石其辭曰維二十九年時在中春陽和方起皇帝東游巡登之罘臨照于海從臣嘉觀原念休烈追誦本始大聖作治建定法度顯箸綱紀外教諸侯光施文惠明以義理六國回辟貪戾無厭虐殺不已皇帝哀衆遂發討師奮揚武德義誅信行威燀旁達莫不賓服烹滅彊暴振救黔首周定四極普施明法經緯天下永為儀則大矣哉宇縣之中承順聖意群臣誦功請刻于石表垂于常式其東觀曰維二十九年皇帝春游覽省遠方逮于海隅遂登之罘昭臨朝陽觀望廣麗從臣咸念原道至明聖法初興清理疆內外誅暴彊武威旁暢振動四極禽滅六王闡并天下災害絶息永偃戎兵皇帝明德經理宇內視聽不怠作立大義昭設備器咸有章旗職臣遵分各知所行事無嫌疑黔首改化遠邇同度臨古絶尤常職既定後嗣循業長承聖治群臣嘉德祗誦聖烈請刻之罘旋遂之琅邪道上黨入三十年無事三十一年十二月更名臘曰嘉平賜黔首里六石米二羊始皇為微行咸陽與武士四人俱夜出逢盜蘭池見窘武士擊殺盜關中大索二十日米石千六百三十二年始皇之碣石使燕人盧生求羡門高誓刻碣石門壞城郭決通隄防其辭曰遂興師旅誅戮無道為逆滅息武殄暴逆文復無罪庶心咸服惠論功勞賞及牛馬恩肥土域皇帝奮威德并諸侯初一泰平墮壞城郭決通川防夷去險阻地勢既定黎庶無繇天下咸撫男樂其疇女修其業事各有序惠被諸産久並來田莫不安所群臣誦烈請刻此石垂著儀矩因使韓終侯公石生求仙人不死之藥始皇巡北邊從上郡入燕人盧生使入海還以鬼神事因奏録圖書曰亡秦者胡也始皇乃使將軍蒙恬發兵三十萬人北擊胡略取河南地三十三年發諸嘗逋亡人贅壻賈人略取陸梁地為桂林象郡南海以適遣戍西北斥逐胸奴自榆中並河以東屬之陰山以為四十四縣城河上為塞又使蒙恬渡河取高闕陶陽山北假中築亭障以逐戎人徙謫實之初縣禁不得祠明星出西方三十四年適治獄吏不直者築長城及南越地始皇置酒咸陽宮博士七十人前為壽僕射周青臣進頌曰他時秦地不過千里賴陛下神靈明聖平定海內放逐蠻夷日月所照莫不賓服以諸侯為郡縣人人自安樂無戰爭之患傳之萬世自上古不及陛下威德始皇悅博士齊人淳于越進曰臣聞殷周之王千餘歲封子弟功臣自為枝輔今陛下有海內而子弟為匹夫卒有田常六卿之臣無輔拂何以相救哉事不師古而能長久者非所聞也今青臣又面諛以重陛下之過非忠臣始皇下其議丞相李斯曰五帝不相復三代不相襲各以治非其相反時變異也今陛下創大業建萬世之功固非愚儒所知且越言乃三代之事何足法也異時諸侯並爭厚招游學今天下已定法令出一百姓當家則力農工士則學習法令辟禁今諸生不師今而學古以非當世惑亂黔首丞相臣斯昧死言古者天下散亂莫之能一是以諸侯並作語皆道古以害今飾虛言以亂實人善其所私學以非上之所建立今皇帝并有天下別黑白而定一尊私學而相與非法教人聞令下則各以其學議之入則心非出則巷議夸主以為名異取以為高率群下以造謗如此弗禁則主勢降乎上黨與成乎下禁之便臣請史官非秦記皆燒之非博士官所職天下敢有藏詩書百家語者悉詣守尉雜燒之有敢偶語詩書者棄市以古非今者族吏見知不舉者與同罪令下三十日不燒黥為城旦所不去者醫藥卜筮種樹之書若欲有學法令以吏為師制曰可三十五年除道道九原抵雲陽塹山堙谷直通之於是始皇以為咸陽人多先王之宮廷小吾聞周文王都豐武王都鎬豐鎬之閒帝王之都也乃營作朝宮渭南上林苑中先作前殿阿房東西五百步南北五十丈上可以坐萬人下可以建五丈旗周馳為閣道自殿下直抵南山表南山之顛以為闕為復道自阿房渡渭屬之咸陽以象天極閣道絶漢抵營室也阿房宮未成成欲更擇令名名之作宮阿房故天下謂之阿房宮隱宮徒刑者七十餘萬人乃分作阿房宮或作麗山發北山石椁乃寫蜀荊地材皆至關中計宮三百關外四百餘於是立石東海上朐界中以為秦東門因徙三萬家麗邑五萬家雲陽皆復不事十歲盧生說始皇曰臣等求芝奇藥仙者常弗遇類物有害之者方中人主時為微行以辟惡鬼惡鬼辟真人至人主所居而人臣知之則害於神真人者入水不濡入火不爇陵雲氣與天地久長今上治天下未能恬倓願上所居宮毋令人知然后不死之藥殆可得也於是始皇曰吾慕真人自謂真人不稱朕乃令咸陽之旁二百里內宮觀二百七十復道甬道相連帷帳鍾鼓美人充之各案署不移徙行所幸有言其處者罪死始皇帝幸梁山宮從山上見丞相車騎衆弗善也中人或告丞相丞相後損車騎始皇怒曰此中人泄吾語案問莫服當是時詔捕諸時在旁者皆殺之自是後莫知行之所在聽事群臣受決事悉於咸陽宮侯生盧生相與謀曰始皇為人天性剛戾自用起諸侯并天下意得欲從以為自古莫及己專任獄吏獄吏得親幸博士雖七十人特備員弗用丞相諸大臣皆受成事倚辨於上上樂以刑殺為威天下畏罪持祿莫敢盡忠上不聞過而日驕下懾伏謾欺以取容秦法不得兼方不驗輒死然候星氣者至三百人皆良士畏忌諱諛不敢端言其過天下之事無小大皆決於上上至以衡石量書日夜有呈不中呈不得休息貪於權勢至如此未可為求仙藥於是乃亡去始皇聞亡乃大怒曰吾前收天下書不中用者盡去之悉召文學方術士甚衆欲以興太平方士欲練以求奇藥今聞韓衆去不報徐巿等費以巨萬計終不得藥徒姦利相告日聞盧生等吾尊賜之甚厚今乃誹謗我以重吾不德也諸生在咸陽者吾使人廉問或為訞言以亂黔首於是使御史悉案問諸生諸生傳相告引乃自除犯禁者四百六十餘人皆坑之咸陽使天下知之以懲後益發謫徙邊始皇長子扶蘇諫曰天下初定遠方黔首未集諸生皆誦法孔子今上皆重法繩之臣恐天下不安唯上察之始皇怒使扶蘇北監蒙恬於上郡三十六年熒惑守心有墜星下東郡至地為石黔首或刻其石曰始皇帝死而地分始皇聞之遣御史逐問莫服盡取石旁居人誅之因燔銷其石始皇不樂使博士為仙真人詩乃行所游天下傳令樂人歌弦之秋使者從關東夜過華陰平舒道有人持璧遮使者曰為吾遺滈池君因言曰今年祖龍死使者問其故因忽不見置其璧去使者奉璧具以聞始皇默然良久曰山鬼固不過知一歲事也退言曰祖龍者人之先也使御府視璧乃二十八年行渡江所沈璧也於是始皇卜之卦得游徙吉遷北河榆中三萬家拜爵一級三十七年十月癸丑始皇出游左丞相斯從右丞相去疾守少子胡亥愛慕請從上許之十一月行至雲夢望祀虞舜於九疑山浮江下觀籍柯渡海渚過丹陽至錢唐臨浙江水波惡乃西百二十里從狹中渡上會稽祭大禹望于南海而立石刻頌秦德其文曰皇帝休烈平一宇內德惠修長三十有七年親巡天下周覽遠方遂登會稽宣省習俗黔首齊莊群臣誦功本原事迹追首高明秦聖臨國始定刑名顯陳舊章初平法式審別職任以立恆常六王專倍貪戾慠猛率衆自彊暴虐恣行負力而驕數動甲兵陰通閒使以事合從行為辟方內飾詐謀外來侵邊遂起禍殃義威誅之殄熄暴悖亂賊滅亡聖德廣密六合之中被澤無疆皇帝并宇兼聽萬事遠近畢清運理群物考驗事實各載其名貴賤並通善否陳前靡有隱情飾省宣義有子而嫁倍死不貞防隔內外禁止淫泆男女潔誠夫為寄豭殺之無罪男秉義程妻為逃嫁子不得母咸化廉清大治濯俗天下承風蒙被休經皆遵度軌和安敦勉莫不順令黔首修潔人樂同則嘉保太平後敬奉法常治無極輿舟不傾從臣誦烈請刻此石光垂休銘還過吳從江乘渡並海上北至琅邪方士徐巿等入海求神藥數歲不得費多恐譴乃詐曰蓬萊藥可得然常為大鮫魚所苦故不得至願請善射與俱見則以連弩射之始皇夢與海神戰如人狀問占夢博士曰水神不可見以大魚蛟龍為候今上禱祠備謹而有此惡神當除去而善神可致乃令入海者齎捕巨魚具而自以連弩候大魚出射之自琅邪北至榮成山弗見至之罘見巨魚射殺一魚遂並海西至平原津而病始皇惡言死群臣莫敢言死事上病益甚乃為璽書賜公子扶蘇曰與喪會咸陽而葬書已封在中車府令趙高行符璽事所未授使者七月丙寅始皇崩於沙兵平臺丞相斯為上崩在外恐諸公子及天下有變乃祕之不發喪棺載轀涼車中故幸宦者參乘所至上食百官奏事如故宦者輒從轀涼車中可其奏事獨子胡亥趙高及所幸宦者五六人知上死趙高故嘗教胡亥書及獄律令法事胡亥私幸之高乃與公子胡亥丞相斯陰謀破去始皇所封書賜公子扶蘇者而更詐為丞相斯受始皇遺詔沙丘立子胡亥為太子更為書賜公子扶蘇蒙恬數以罪其賜死語具在李斯傳中行遂從井陘抵九原會暑上轀車臭乃詔從官令車載一石鮑魚以亂其臭行從直道至咸陽發喪太子胡亥襲位為二世皇帝九月葬始皇酈山始皇初即位穿治酈山及并天下天下徒送詣七十餘萬人穿三泉下銅而致椁宮觀百官奇器珍怪徙臧滿之令匠作機弩矢有所穿近者輒射之以水銀為百川江河大海機相灌輸上具天文下具地理以人魚膏為燭度不滅者久之二世曰先帝後宮非有子者出焉不宜皆令從死死者甚衆葬既已下或言工匠為機臧皆知之臧重即泄大事畢已臧閉中羡下外羡門盡閉工匠臧者無復出者樹草木以象山二世皇帝元年年二十一趙高為郎中令任用事二世下詔增始皇寢廟犧牲及山川百祀之禮令群臣議尊始皇廟群臣皆頓首言曰古者天子七廟諸侯五大夫三雖萬世世不軼毀令始皇為極廟四海之內皆獻貢職增犧牲禮咸備毋以加先王廟或在西雍或在咸陽天子儀當獨奉酌祠始皇廟自襄公已下軼毀所置凡七廟群臣以禮進祠以尊始皇廟為帝者祖廟皇帝復自稱朕二世與趙高謀曰朕年少初即位黔首未集附先帝巡行郡縣以示彊威服海內今晏然不巡行即見弱毋以臣畜天下春二世東行郡縣李斯從到碣石並海南至會稽而盡刻始皇所立刻石石旁著大臣從者名以章先帝成功盛德焉皇帝曰金石刻盡始皇帝所為也今襲號而金石刻辭不稱始皇帝其於久遠也如後嗣為之者不稱成功盛德丞相臣斯臣去疾御史大夫臣德昧死言臣請具刻詔書刻石因明白矣臣昧死請制曰可遂至遼東而還於是二世乃遵用趙高申法令乃陰與趙高謀曰大臣不服官吏尚彊及諸公子必與我爭為之奈何高曰臣固願言而未敢也先帝之大臣皆天下纍世名貴人也積功勞世以相傳久矣今高素小賤陛下幸稱舉令在上位管中事大臣鞅鞅特以貌從臣其心實不服今上出不因此時案郡縣守尉有罪者誅之上以振威天下下以除去上生平所不可者今時不師文而決於武力願陛下遂從時毋疑即群臣不及謀明主收舉餘民賤者貴之貧者富之遠者近之則上下集而國安矣二世曰善乃行誅大臣及諸公子以罪過連逮少近官三郎無得立者而六公子戮死於杜公子將閭昆弟三人囚於內宮議其罪獨後二世使使令將閭曰公子不臣罪當死吏致法焉將閭曰闕廷之禮吾未嘗敢不從賓贊也廊廟之位吾未嘗敢失節也受命應對吾未嘗敢失辭也何謂不臣願聞罪而死使者曰臣不得與謀奉書從事將閭乃仰天大呼天者三曰天乎吾無罪昆弟三人皆流涕拔劍自殺宗室振恐群臣諫者以為誹謗大吏持祿取容黔首振恐四月二世還至咸陽曰先帝為咸陽朝廷小故營阿房宮為室堂未就會上崩罷其作者復土酈山酈山事大畢今釋阿房宮弗就則是章先帝舉事過也復作阿房宮外撫四夷如始皇計盡徵其材士五萬人為屯衛咸陽令教射狗馬禽獸當食者多度不足下調郡縣轉輸菽粟芻藁皆令自齎糧食咸陽三百里內不得食其穀用法益刻深七月戍卒陳勝等反故荊地為張楚勝自立為楚王居陳遣諸將徇地山東郡縣少年苦秦吏皆殺其守尉令丞反以應陳涉相立為侯王合從西鄉名為伐秦不可勝數也謁者使東方來以反者聞二世二世怒下吏後使者至上問對曰群盜郡守尉方逐捕今盡得不足憂上悅武臣自立為趙王魏咎為魏王田儋為齊王沛公起沛項梁舉兵會稽郡二年冬陳涉所遣周章等將西至戲兵數十萬二世大驚與群臣謀曰奈何少府章邯曰盜已至衆彊今發近縣不及矣酈山徒多請赦之授兵以擊之二世乃大赦天下使章邯將擊破周章軍而走遂殺章曹陽二世益遣長史司馬欣董翳佐章邯擊盜殺陳勝城父破項梁定陶滅魏咎臨濟楚地盜名將已死章邯乃北渡河擊趙王歇等於巨鹿趙高說二世曰先帝臨制天下久故群臣不敢為非進邪說今陛下富於春秋初即位奈何與公卿廷決事事即有誤二群臣短也天子稱朕固不聞聲於是二世常居禁中與高決諸事其後公卿希得朝見盜賊益多而關中卒發東擊盜者毋已右丞相去疾左丞相斯將軍馮劫進諫曰關東群盜並起秦發兵誅擊所殺亡甚衆然猶不止盜多皆以戍漕轉作事苦賦稅大也請且止阿房宮作者減省四邊戍轉二世曰吾聞之韓子曰堯舜采椽不刮茅茨不翦飯土塯啜土形雖監門之養不觳於此禹鑿龍門通大夏決河亭水放之海身自持築臿脛毋毛臣虜之勞不烈於此矣凡所為貴有天下者得肆意極欲主重明法下不敢為非以制御海內矣夫虞夏之主貴為天子親處窮苦之實以徇百姓尚何於法朕尊萬乘毋其實吾欲造千乘之駕萬乘之屬充吾號名且先帝起諸侯兼天下天下已定外攘四夷以安邊竟作宮室以章得意而君觀先帝功業有緒今朕即位二年之閒群盜並起君不能禁又欲罷先帝之所為是上毋以報先帝次不為朕盡忠力何以在位下去疾斯劫吏案責他罪去疾劫曰將相不辱自殺斯卒囚就五刑三年章邯等將其卒圍巨鹿楚上將軍項羽將楚卒往救巨鹿冬趙高為丞相竟案李斯殺之夏章邯等戰數卻二世使人讓邯邯恐使長史欣請事趙高弗見又弗信欣恐亡去高使人捕追不及欣見邯曰趙高用事於中將軍有功亦誅無功亦誅項羽急擊秦軍虜王離邯等遂以兵降諸侯八月己亥趙高欲為亂恐群臣不聽乃先設驗持鹿獻於二世曰馬也二世笑曰丞相誤邪謂鹿為馬問左右左右或默或言馬以阿順趙高或言鹿者高因陰中諸言鹿者以法後群臣皆畏高高前數言關東盜毋能為也及項羽虜秦將王離等巨鹿下而前章邯等軍數卻上書請益助燕趙齊楚韓魏皆立為王自關以東大氐盡畔秦吏應諸侯諸侯咸率其衆西鄉沛公將數萬人已屠武關使人私於高高恐二世怒誅及其身乃謝病不朝見二世夢白虎齧其左驂馬殺之心不樂怪問占夢卜曰涇水為祟二世乃齊於望夷宮欲祠涇沈四白馬使使責讓高以盜賊事高懼乃陰與其壻咸陽令閻樂其弟趙成謀曰上不聽諫今事急欲歸禍於吾宗吾欲易置上更立公子嬰子嬰仁儉百姓皆載其言使郎中令為內應詐為有大賊令樂召吏發卒追劫樂母置高舍遣樂將吏卒千餘人至望夷宮殿門縛衛令僕射曰賊入此何不止衛令曰周廬設卒甚謹安得賊敢入宮樂遂斬衛令直將吏入行射郎宦者大驚或走或格格者輒死死者數十人郎中令與樂俱入射上幄坐幃二世怒召左右左右皆惶擾不鬭旁有宦者一人侍不敢去二世入內謂曰公何不蚤告我乃至於此宦者曰臣不敢言故得全使臣蚤言皆已誅安得至今閻樂前即二世數曰足下驕恣誅殺無道天下共畔足下足下其自為計二世曰丞相可得見否樂曰不可二世曰吾願得一郡為王弗許又曰願為萬戶侯弗許曰願與妻子為黔首比諸公子閻樂曰臣受命於丞相為天下誅足下足下雖多言臣不敢報麾其兵進二世自殺閻樂歸報趙高趙高乃悉召諸大臣公子告以誅二世之狀曰秦故王國始皇君天下故稱帝今六國復自立秦地益小乃以空名為帝不可宜為王如故便立二世之兄子公子嬰為秦王以黔首葬二世杜南宜春苑中令子嬰齊當廟見受王璽齊五日子嬰與其子二人謀曰丞相高殺二世望夷宮恐群臣誅之乃詳以義立我我聞趙高乃與楚約滅秦宗室而王關中今使我齊見廟此欲因廟中殺我我稱病不行丞相必自來來則殺之高使人請子嬰數輩子嬰不行高果自往曰宗廟重事王奈何不行子嬰遂刺殺高於齊宮三族高家以徇咸陽子嬰為秦王四十六日楚將沛公破秦軍入武關遂至霸上使人約降子嬰子嬰即係頸以組白馬素車奉天子璽符降軹道旁沛公遂入咸陽封宮室府庫還軍霸上居月餘諸侯兵至項籍為從長殺子嬰及秦諸公子宗族遂屠咸陽燒其宮室虜其子女收其珍寶貨財諸侯共分之滅秦之後各分其地為三名曰壅王塞王翟王號曰三秦項羽為西楚霸王主命分天下王諸侯秦竟滅矣後五年天下定於漢太史公曰秦之先伯翳嘗有勳於唐虞之際受土賜姓及殷夏之閒微散至周之衰秦興邑于西垂自繆公以來稍蠶食諸侯竟成始皇始皇自以為功過五帝地廣三王而羞與之侔善哉乎賈生推言之也曰秦并兼諸侯山東三十餘郡繕津關據險塞修甲兵而守之然陳涉以戍卒散亂之衆數百奮臂大呼不用弓戟之兵鉏耰白梃望屋而食橫行天下秦人阻險不守關梁不闔長戟不刺彊弩不射楚師深入戰於鴻門曾無藩籬之艱於是山東大擾諸侯並起豪俊相立秦使章邯將而東征章邯因以三軍之衆要市於外以謀其上群臣之不信可見於此矣子嬰立遂不寤藉使子嬰有庸主之材僅得中佐山東雖亂秦之地可全而有宗廟之祀未當絶也秦地被山帶河以為固四塞之國也自繆公以來至於秦王二十餘君常為諸侯雄豈世世賢哉其勢居然也且天下嘗同心并力而攻秦矣當此之世賢智並列良將行其師賢相通其謀然困於阻險而不能進秦乃延入戰而為之開關百萬之徒逃北而遂壞豈勇力智慧不足哉形不利勢不便也秦小邑并大城守險塞而軍高壘毋戰閉關據厄荷戟而守之諸侯起於匹夫以利合非有素王之行也其交未親其下未附名為亡秦其實利之也彼見秦阻之難犯也必退師安土息民以待其敝收弱扶罷以令大國之君不患不得意於海內貴為天子富有天下而身為禽者其救敗非也秦王足己不問遂過而不變二世受之因而不改暴虐以重禍子嬰孤立無親危弱無輔三主惑而終身不悟亡不亦宜乎當此時也世非無深慮知化之士也然所以不敢盡忠拂過者秦俗多忌諱之禁忠言未卒於口而身為戮沒矣故使天下之士傾耳而聽重足而立拑口而不言是以三主失道忠臣不敢諫智士不敢謀天下已亂姦不上聞豈不哀哉先王知雍蔽之傷國也故置公卿大夫士以飾法設刑而天下治其彊也禁暴誅亂而天下服其弱也五伯征而諸侯從其削也內守外附而社稷存故秦之盛也繁法嚴刑而天下振及其衰也百生怨望而海內畔矣故周五序得其道而千餘歲不絶秦本末並失故不長久由此觀之安危之統相去遠矣野諺曰前事之不忘後事之師也是以君子為國觀之上古驗之當世參以人事察盛衰之理審權勢之宜去就有序變化有時故曠日長久而社稷安矣秦孝公據殽函之固擁雍州之地君臣固守而窺周室有席卷天下包舉宇內囊括四海之意并吞八荒之心當是時商君佐之內立法度務耕織修守戰之備外連衡而鬭諸侯於是秦人拱手而取西河之外孝公既沒惠王武王蒙故業因遺冊南兼漢中西舉巴蜀東割膏腴之地收要害之郡諸侯恐懼會盟而謀弱秦不愛珍器重寶肥美之地以致天下之士合從締交相與為一當是時齊有孟嘗趙有平原楚有春申魏有信陵此四君者皆明知而忠信寬厚而愛人尊賢重士約從離衡并韓魏燕楚齊趙宋衛中山之衆於是六國之士有寧越徐尚蘇秦杜赫之屬為之謀齊明周最陳軫昭滑樓緩翟景蘇厲樂毅之徒通其意吳起孫臏帶他兒良王廖田忌廉頗趙奢之朋制其兵常以十倍之地百萬之衆叩關而攻秦秦人開關延敵九國之師逡巡遁逃而不敢進秦無亡矢遺鏃之費而天下諸侯已困矣於是從散約解爭割地而奉秦秦有餘力而制其敝追亡逐北伏尸百萬流血漂鹵因利乘便宰割天下分裂河山彊國請服弱國入朝延及孝文王莊襄王享國日淺國家無事及至秦王續六世之餘烈振長策而御宇內吞二周而亡諸侯履至尊而制六合執棰拊以鞭笞天下威振四海南取百越之地以為桂林象郡百越之君俯首係頸委命下吏乃使蒙恬北築長城而守藩籬卻胸奴七百餘里胡人不敢南下而牧馬士不敢彎弓而報怨於是廢先王之道焚百家之言以愚黔首墮名城殺豪俊收天下之兵聚之咸陽銷鋒鑄鐻以為金人十二以弱黔首之民然後斬華為城因河為津據億丈之城臨不測之溪以為固良將徑弩守要害之處信臣精卒陳利兵而誰何天下以定秦王之心自以為關中之固金城千里子孫帝王萬世之業也秦王既沒餘威振於殊俗陳涉罋牖繩樞之子氓隸之人而遷徙之徒才能不及中人非有仲尼墨翟之賢陶朱猗頓之富躡足行伍之閒而倔起什伯之中率罷散之卒將數百之衆而轉攻秦斬木為兵揭竿為旗天下雲集響應贏糧而景從山東豪俊遂並起而亡秦族矣且夫天下非小弱也雍州之地殽函之固自若也陳涉之位非尊於齊楚燕趙韓魏宋衛中山之君鉏耰棘矜非錟於句戟長鎩也適戍之衆非抗於九國之師深謀遠慮行軍用兵之道非及鄉時之士也然而成敗異變功業相反也試使山東之國與陳涉度長潔大比權量力則不可同年而語矣然秦以區區之地千乘之權招八州而朝同列百有餘年矣然后以六合為家殽函為宮一夫作難而七廟墮身死人手為天下笑者何也仁義不施而攻守之勢異也秦并海內兼諸侯南面稱帝以養四海天下之士斐然鄉風若是者何也曰近古之無王者久矣周室卑微五霸既歿令不行於天下是以諸侯力政彊侵弱衆暴寡兵革不休士民罷敝今秦南面而王天下是上有天子也既元元之民冀得安其性命莫不虛心而仰上當此之時守威定功安危之本在於此矣秦王懷貪鄙之心行自奮之智不信功臣不親士民廢王道立私權禁文書而酷刑法先詐力而後仁義以暴虐為天下始夫并兼者高詐力安定者貴順權此言取與守不同術也秦離戰國而王天下其道不易其政不改是其所以取之守之者無異也孤獨而有之故其亡可立而待借使秦王計上世之事並殷周之迹以制御其政後雖有淫驕之主而未有傾危之患也故三王之建天下名號顯美功業長久今秦二世立天下莫不引領而觀其政夫寒者利裋褐而飢者甘糟穅天下之嗷嗷新主之資也此言勞民之易為仁也鄉使二世有庸主之行而任忠賢臣主一心而憂海內之患縞素而正先帝之過裂地分民以封功臣之後建國立君以禮天下虛囹圉而免刑戮除去收帑汙穢之罪使各反其鄉里發倉廩散財幣以振孤獨窮困之士輕賦少事以佐百姓之急約法省刑以持其後使天下之人皆得自新更節修行各慎其身塞萬民之望而以威德與天下天下集矣即四海之內皆歡然各自安樂其處唯恐有變雖有狡猾之民無離上之心則不軌之臣無以飾其智而暴亂之姦止矣二世不行此術而重之以無道壞宗廟與民更始作阿房宮繁刑嚴誅吏治刻深賞罰不當賦斂無度天下多事吏弗能紀百姓困窮而主弗收恤然後姦僞並起而上下相遁蒙罪者衆刑戮相望於道而天下苦之自君卿以下至于衆庶人懷自危之心親處窮苦之實咸不安其位故易動也是以陳涉不用湯武之賢不藉公侯之尊奮臂於大澤而天下響應者其民危也故先王見始終之變知存亡之機是以牧民之道務在安之而已天下雖有逆行之臣必無響應之助矣故曰安民可與行義而危民易與為非此之謂也貴為天子富有天下身不免於戮殺者正傾非也是二世之過也襄公立享國十二年初為西畤葬西垂生文公文公立居西垂宮五十年死葬西垂生靜公靜公不享國而死生憲公憲公享國十二年居西新邑死葬衙生武公德公出子出子享國六年居西陵庶長弗忌威纍參父三人率賊賊出子鄙衍葬衙武公立武公享國二十年居平陽封宮葬宣陽聚東南三庶長伏其罪德公立德公享國二年居雍大鄭宮生宣公成公繆公葬陽初伏以御蠱宣公享國十二年居陽宮葬陽初志閏月成公享國四年居雍之宮葬陽齊伐山戎孤竹繆公享國三十九年天子致霸葬雍繆公學著人生康公康公享國十二年居雍高寢葬竘社生共公共公享國五年居雍高寢葬康公南生桓公桓公享國二十七年居雍太寢葬義里丘北生景公景公享國四十年居雍高寢葬丘里南生畢公畢公享國三十六年葬車里北生夷公夷公不享國死葬左宮生惠公惠公享國十年葬車里生悼公悼公享國十五年葬僖公西城雍生刺龔公刺龔公享國三十四年葬入里生躁公懷公其十年彗星見躁公享國十四年居受寢葬悼公南其元年彗星見懷公從晉來享國四年葬櫟圉氏生靈公諸臣圍懷公懷公自殺肅靈公昭子子也居涇陽享國十年葬悼公西生簡公簡公從晉來享國十五年葬僖公西生惠公其七年百生初帶劍惠公享國十三年葬陵圉生出公出公享國二年出公自殺葬雍獻公享國二十三年葬囂圉生孝公孝公享國二十四年葬弟圉生惠文王其十三年始都咸陽惠文王享國二十七年葬公陵生悼武王悼武王享國四年葬永陵昭襄王享國五十六年葬茝陽生孝文王孝文王享國一年葬壽陵生莊襄王莊襄王享國三年葬茝陽生始皇帝呂不韋相獻公立七年初行為市十年為戶籍相伍孝公立十六年時桃李冬華惠文王生十九年而立立二年初行錢有新生嬰兒曰秦且王悼武王生十九年而立立三年渭水赤三日昭襄王生十九年而立立四年初為田開阡陌孝文王生五十三年而立莊襄王生三十二年而立立二年取太原地莊襄王元年大赦修先王功臣施德厚骨肉布惠於民東周與諸侯謀秦秦使相國不韋誅之盡入其國秦不絶其祀以陽人地賜周君奉其祭祀始皇享國三十七年葬酈邑生二世皇帝始皇生十三年而立二世皇帝享國三年葬宜春趙高為丞相安武侯二世生十二年而立右秦襄公至二世六百一十歲孝明皇帝十七年十月十五日乙丑曰周曆已移仁不代母秦直其位呂政殘虐然以諸侯十三并兼天下極情縱欲養育宗親三十七年兵無所不加制作政令施於後王蓋得聖人之威河神授圖據狼狐伐蹈參佐政驅除距之稱始皇始皇既歿胡亥極愚酈山未畢復作阿房以遂前策云凡所為貴有天下者肆意極欲大臣至欲罷先君所為誅斯去疾任用趙高痛哉言乎人頭畜鳴不威不伐惡不篤不虛亡距之不得留殘虐以促期雖居形便之國猶不得存子嬰度次得嗣冠玉冠佩華紱車黃屋從百司謁七廟小人乘非位莫不恍忽失守偷安日日獨能長念卻慮父子作權近取於戶牖之閒竟誅猾臣為君討賊高死之後賓婚未得盡相勞餐未及下咽酒未及濡脣楚兵已屠關中真人翔霸上素車嬰組奉其符璽以歸帝者鄭伯茅旌鸞刀嚴王退舍河決不可復壅魚爛不可復全賈誼司馬遷曰向使嬰有庸主之才僅得中佐山東雖亂秦之地可全而有宗廟之祀未當絶也秦之積衰天下土崩瓦解雖有周旦之材無所復陳其巧而以責一日之孤誤哉俗傳秦始皇起罪惡胡亥極得其理矣復責小子云秦地可全所謂不通時變者也紀季以酅春秋不名吾讀秦紀至於子嬰車裂趙高未嘗不健其決憐其志嬰死生之義備矣
