body:
  text: 漢興以來將相名臣年表大事記相位將位御史大夫位公元前高皇帝元年春沛公為漢王之南鄭秋還定雍一丞相蕭何守漢中御史大夫周苛守滎陽二春定塞翟魏河南韓殷國夏伐項籍至彭城立太子還據滎陽二守關中一太尉長安侯盧綰三魏豹反使韓信別定魏伐趙楚圍我滎陽三二四使韓信別定齊及燕太公自楚歸與楚界洪渠四三周苛守滎陽死御史大夫汾陰侯周昌五冬破楚垓下殺項籍春王踐皇帝位定陶入都關中五罷太尉官四後九月綰為燕王六尊太公為太上皇劉仲為代王立大市更命咸陽曰長安六封為酇侯張蒼為計相七長樂宮成自櫟陽徙長安伐胸奴胸奴圍我平城七八擊韓信反虜於趙城貫高作亂明年覺誅之胸奴攻代王代王棄國亡廢為郃陽侯八九未央宮成置酒前殿太上皇輦上坐帝奉玉卮上壽曰始常以臣不如仲力今臣功孰與仲多太上皇笑殿上稱萬歲徙齊田楚昭屈景于關中九遷為相國御史大夫昌為趙丞相十太上皇崩陳豨反代地十御史大夫江邑侯趙堯十一誅淮陰彭越黥布反十一周勃為太尉攻代後官省十二冬擊布還過沛夏上崩葬長陵十二孝惠元年趙隱王如意死始作長安城西北方除諸侯丞相為相十三二楚元王齊悼惠王來朝七月辛未何薨十四七月癸巳齊相平陽侯曹參為相國三初作長安城蜀湔氐反擊之二四三月甲子赦無所復作三五為高祖立廟於沛城成置歌兒一百二十人八月乙丑參卒四六七月齊悼惠王薨立太倉西市一十月己巳安國侯王陵為右丞相曲逆侯陳平為左丞相堯抵罪廣阿侯任敖為御史大夫七上崩大臣用張辟強計呂氏權重以呂台為呂王立少帝九月辛巳葬安陵二高后元年王孝惠諸子置孝悌力田三十一月甲子徙平為右丞相辟陽侯審食其為左丞相二十二月呂王台薨子嘉代立為呂王行八銖錢四平二食其平陽侯曹窋為御史大夫三五三四廢少帝更立常山王弘為帝六四置太尉官一絳侯周勃為太尉五八月淮陽王薨以其弟壺關侯武為淮陽王令戍卒歲更七五二六以呂産為呂王四月丁酉赦天下晝昏八六三七趙王幽死以呂祿為趙王梁王徙趙自殺九七四八七月高后崩九月誅諸呂後九月代王至踐皇帝位後九月食其免相十七月辛巳為帝太傅九月壬戌復為丞相八五隆慮侯竈為將軍擊南越御史大夫蒼孝文元年除收孥相坐律立太子賜民爵十一十一月辛巳平徙為左丞相太尉絳侯周勃為右丞相六勃為相潁陰侯灌嬰為太尉二除誹謗律皇子武為代王參為太原王揖為梁王十月丞相平薨一十一月乙亥絳侯勃復為丞相一三徙代王武為淮陽王上幸太原濟北王反胸奴大入上郡以地盡與太原太原更號代十一月壬子勃免相之國一十二月乙亥太尉潁陰侯灌嬰為丞相罷太尉官二棘蒲侯陳武為大將軍擊濟北昌侯盧卿共侯盧罷師寧侯遫深澤侯將夜皆為將軍屬武祁侯賀將兵屯滎陽四十二月己巳嬰卒一正月甲午御史大夫北平侯張蒼為丞相安丘侯張説為將軍擊胡出代關中侯申屠嘉為御史大夫五除錢律民得鑄錢二六廢淮南王遷嚴道道死雍三七四月丙子初置南陵四八太僕汝陰侯滕公卒五九溫室鐘自鳴以芷陽鄉為霸陵六御史大夫敬十諸侯王皆至長安七十一上幸代地動八十二河決東郡金隄徙淮陽王為梁王九十三除肉刑及田租稅律戍卒令十十四胸奴大入蕭關發兵擊之及屯長安旁十一成侯董赤內史欒布昌侯盧卿隆慮侯竈寧侯遫皆為將軍東陽侯張相如為大將軍皆擊胸奴中尉周舍郎中令張武皆為將軍屯長安旁十五黃龍見成紀上始郊見雍五帝十二十六上始郊見渭陽五帝十三後元年新垣平詐言方士覺誅之十四二胸奴和親地動八月戊辰蒼免相十五八月庚午御史大夫申屠嘉為丞相封故安侯御史大夫青三置谷口邑二四三五上幸雍四六胸奴三萬人入上郡二萬人入雲中五以中大夫令免為車騎將軍軍飛狐故楚相蘇意為將軍軍句注將軍張武屯北地河內守周亞夫為將軍軍細柳宗正劉禮軍霸上祝茲侯徐厲軍棘門以備胡數月胡去亦罷七六月己亥孝文皇帝崩丁未太子立民出臨三日葬霸陵六中尉亞夫為車騎將軍郎中令張武為復土將軍屬國捍為將屯將軍詹事戎奴為車騎將軍侍太后孝景元年立孝文皇帝廟郡國為太宗廟七置司徒官二立皇子德為河間王閼為臨江王餘為淮陽王非為汝南王彭祖為廣川王發為長沙王四月中孝文太后崩嘉卒八開封侯陶青為丞相御史大夫錯三吳楚七國反發兵擊皆破之皇子端為膠西王勝為中山王二置太尉官中尉條侯周亞夫為太尉擊吳楚曲周侯酈寄為將軍擊趙竇嬰為大將軍屯滎陽欒布為將軍擊齊四立太子三二太尉亞夫御史大夫蚡五置陽陵邑丞相北平侯張蒼卒四三六徙廣川王彭祖為趙王五四御史大夫陽陵侯岑邁七廢太子榮為臨江王四月丁巳膠東王立為太子青罷相六月乙巳太尉條侯亞夫為丞相罷太尉官五遷為丞相御史大夫舍中元年二二皇子越為廣川王寄為膠東王三三皇子乘為清河王亞夫免相四御史大夫桃侯劉舍為丞相御史大夫綰四臨江王徵自殺葬藍田燕數萬為銜土置冢上二五皇子舜為常山王三六梁孝王武薨分梁為五國王諸子子買為梁王明為濟川王彭離為濟東王定為山陽王不識為濟陰王四後元年五月地動七月乙巳日蝕舍免相五八月壬辰御史大夫建陵侯衛綰為丞相御史大夫不疑二二六月丁丑御史大夫岑邁卒三正月甲子孝景皇帝崩二月丙子太子立三孝武建元元年綰免相四魏其侯竇嬰為丞相置太尉武安侯田蚡為太尉御史大夫抵二置茂陵嬰免相二月乙未太常柏至侯許昌為丞相蚡免太尉罷太尉官御史大夫趙綰三東甌王廣武侯望率其衆四萬餘人來降處廬江郡二四三御史大夫青翟五行三分錢四六正月閩越王反孝景太后崩昌免相五六月癸巳武安侯田蚡為丞相青翟為太子太傅御史大夫安國元光元年二二帝初之雍郊見五畤三夏御史大夫韓安國為護軍將軍衛尉李廣為驍騎將軍太僕公孫賀為輕車將軍大行王恢為將屯將軍太中大夫李息為材官將軍篡單于馬邑不合誅恢三五月丙子河決于瓠子四四十二月丁亥地動蚡卒五平棘侯薛澤為丞相御史大夫歐五十月族灌夫家棄魏其侯市二六南夷始置郵亭三太中大夫衛青為車騎將軍出上谷衛尉李廣為驍騎將軍出鴈門大中大夫公孫敖為騎將軍出代太僕公孫賀為輕車將軍出雲中皆擊胸奴元朔元年衛夫人立為皇后四車騎將軍青出雁門擊胸奴衛尉韓安國為將屯將軍軍代明年屯漁陽卒二五春車騎將軍衛青出雲中至高闕取河南地三胸奴殺代太守友六御史大夫弘四胸奴入定襄代上郡七五胸奴殺代都尉朱英澤免相八十一月乙丑御史大夫公孫弘為丞相封平津侯春長平侯衛青為大將軍擊右賢衛尉蘇建為遊擊將軍屬青左內史李沮為強弩將軍太僕賀為車騎將軍代相李蔡為輕車將軍岸頭侯張次公為將軍大行息為將軍皆屬大將軍擊胸奴六二大將軍青再出定襄擊胡合騎侯公孫敖為中將軍太僕賀為左將軍郎中令李廣為後將軍翕侯趙信為前將軍敗降胸奴衛尉蘇建為右將軍敗身脫左內史沮為強弩將軍皆屬青元狩元年十月中淮南王安衡山王賜謀反皆自殺國除三御史大夫蔡二胸奴入鴈門代郡江都王建反膠東王子慶立為六安王弘卒四御史大夫樂安侯李蔡為丞相冠軍侯霍去病為驃騎將軍擊胡至祁連合騎侯敖為將軍出北地博望侯張騫郎中令李廣為將軍出右北平御史大夫湯三胸奴入右北平定襄二四三大將軍青出定襄郎中令李廣為前將軍太僕公孫賀為左將軍主爵趙食其為右將軍平陽侯曹襄為後將軍擊單于五蔡坐侵園堧自殺四太子少傅武強侯莊青翟為丞相六四月乙巳皇子閎為齊王旦為燕王胥為廣陵王二元鼎元年三二青翟有罪自殺四太子太傅高陵侯趙周為丞相湯有罪自殺御史大夫慶三二四立常山憲王子平為真定王商為泗水王六月中河東汾陰得寶鼎三五三月中南越相嘉反殺其王及漢使者八月周坐酎金自殺四九月辛巳御史大夫石慶為丞相封牧丘侯衛尉路博德為伏波將軍出桂陽主爵楊僕為樓船將軍出豫章皆破南越六十二月東越反二故龍侯韓説為橫海將軍出會稽樓船將軍楊僕出豫章中尉王溫舒出會稽皆破東越御史大夫式元封元年三御史大夫寬二四秋樓船將軍楊僕左將軍荀彘出遼東擊朝鮮三五四六五七六八太初元年改曆以正月為歲首九二正月戊寅慶卒十三月丁卯太僕公孫賀為丞相封葛繹侯三二御史大夫延廣四三天漢元年四御史大夫卿二五三六御史大夫周四七春二師將軍李廣利出朔方至余吾水上遊擊將軍韓説出五原因杅將軍公孫敖皆擊胸奴太始元年八二九三十御史大夫勝之四十一征和元年冬賀坐為蠱死十二二七月壬午太子發兵殺遊擊將軍説使者江充三月丁巳涿郡太守劉屈氂為丞相封彭城侯御史大夫成三六月劉屈氂因蠱斬二春二師將軍李廣利出朔方以兵降胡重合侯莽通出酒泉御史大夫商丘成出河西擊胸奴四六月丁巳大鴻臚田千秋為丞相封富民侯後元元年二二三二月己巳光祿大夫霍光為大將軍博陸侯都尉金日磾為車騎將軍秺侯太僕安陽侯上官桀為大將軍孝昭始元元年四九月日磾卒二五三六四七三月癸酉衛尉王莽為左將軍騎都尉上官安為車騎將軍五八六九元鳳元年十九月庚午光祿勳張安世為右將軍御史大夫欣二十一三十二十二月庚寅中郎將范明友為度遼將軍擊烏丸四三月甲戌千秋卒三月乙丑御史大夫王欣為丞相封富春侯御史大夫楊敞五十二月庚戌欣卒二六十一月乙丑御史大夫楊敞為丞相封安平侯九月庚寅衛尉平陵侯范明友為度遼將軍擊烏丸元平元年敞卒九月戊戌御史大夫蔡義為丞相封陽平侯四月甲申光祿大夫龍侯韓曾為前將軍五月丁酉水衡都尉趙充國為後將軍右將軍張安世為車騎將軍御史大夫昌水侯田廣明孝宣本始元年二二三七月庚寅御史大夫田廣明為祁連將軍龍侯韓曾為後將軍營平侯趙充國為蒲類將軍度遼將軍平陵侯范明友為雲中太守富民侯田順為虎牙將軍皆擊胸奴三三月戊子皇后崩六月乙丑義薨六月甲辰長信少府韋賢為丞相封扶陽侯田廣明田順擊胡還皆自殺充國奪將軍印御史大夫魏相四十月乙卯立霍后二地節元年三二四三月庚午將軍光卒二月丁卯侍中中郎將霍禹為右將軍三立太子五月甲申賢老賜金百斤六月壬辰御史大夫魏相為丞相封高平侯七月安世為大司馬衛將軍禹為大司馬御史大夫邴吉四二七月壬寅禹腰斬元康元年三二四三五四六八月丙寅安世卒神爵元年上郊甘泉太畤汾陰后土七四月樂成侯許延壽為強弩將軍後將軍充國擊羌酒泉太守辛武賢為破羌將軍韓曾為大司馬車騎將軍二上郊雍五畤祋祤出寶璧玉器八三三月相卒四月戊戌御史大夫邴吉為丞相封博陽侯御史大夫望之四二五鳳元年三二四五月己丑曾卒五月延壽為大司馬車騎將軍御史大夫霸三正月吉卒三月壬申御史大夫黃霸為丞相封建成侯御史大夫延年四二甘露元年三三月丁未延壽卒二赦殊死賜高年及鰥寡孤獨帛女子牛酒四御史大夫定國三三月己丑霸薨七月丁巳御史大夫于定國為丞相封西平侯太僕陳萬年為御史大夫四二黃龍元年三樂陵侯史子長為大司馬車騎將軍太子太傅蕭望之為前將軍孝元初元元年四二五三六十二月執金吾馮奉世為右將軍四七五八二月丁巳平恩侯許嘉為左將軍中少府貢禹為御史大夫十二月丁未長信少府薛廣德為御史大夫永光元年十月戊寅定國免九七月子長免就第九月衛尉平昌侯王接為大司馬車騎將軍二月廣德免七月太子太傅韋玄成為御史大夫二三月壬戌朔日蝕二月丁酉御史大夫韋玄成為丞相封扶陽侯丞相賢子七月太常任千秋為奮武將軍擊西羌雲中太守韓次君為建威將軍擊羌後不行二月丁酉右扶風鄭弘為御史大夫三二右將軍平恩侯許嘉為車騎將軍侍中光祿大夫樂昌侯王商為右將軍右將軍馮奉世為左將軍四三五四建昭元年五二六弘免光祿勳匡衡為御史大夫三六月甲辰玄成薨七月癸亥御史大夫匡衡為丞相封樂安侯衛尉繁延壽為御史大夫四二五三竟寧元年四六月己未衛尉楊平侯王鳳為大司馬大將軍延壽卒三月丙寅太子少傅張談為御史大夫孝成建始元年五二六三十二月丁丑衡免七八月癸丑遣光祿勳詔嘉上印綬免賜金二百斤十月右將軍樂昌侯王商為光祿大夫右將軍執金吾弋陽侯任千秋為右將軍談免廷尉尹忠為御史大夫四三月甲申右將軍樂昌侯王商為右丞相任千秋為左將軍長樂衛尉史丹為右將軍十月己亥尹忠自剌殺少府張忠為御史大夫河平元年二二三三四十月辛卯史丹為左將軍太僕平安侯王章為右將軍四四月壬寅丞相商免六月丙午諸吏散騎光祿大夫張禹為丞相陽朔元年二二三張忠卒六月太僕王音為御史大夫三九月甲子御史大夫王音為車騎將軍十月乙卯光祿勳于永為御史大夫四七月乙丑右將軍光祿勳平安侯王章卒閏月壬戌永卒鴻嘉元年三月禹卒四月庚辰薛宣為丞相
