body:
  text: 韓信盧綰列傳第三十三韓王信者故韓襄王孽孫也長八尺五寸及項梁之立楚後懷王也燕齊趙魏皆已前王唯韓無有後故立韓諸公子橫陽君成為韓王欲以撫定韓故地項梁敗死定陶成奔懷王沛公引兵擊陽城使張良以韓司徒降下韓故地得信以為韓將將其兵從沛公入武關沛公立為漢王韓信從入漢中乃說漢王曰項王王諸將近地而王獨遠居此此左遷也士卒皆山東人跂而望歸及其鋒東鄉可以爭天下漢王還定三秦乃許信為韓王先拜信為韓太尉將兵略韓地項籍之封諸王皆就國韓王成以不從無功不遣就國更以為列侯及聞漢遣韓信略韓地乃令故項籍游吳時吳令鄭昌為韓王以距漢漢二年韓信略定韓十餘城漢王至河南韓信急擊韓王昌陽城昌降漢王乃立韓信為韓王常將韓兵從三年漢王出滎陽韓王信周苛等守滎陽及楚敗滎陽信降楚已而得亡復歸漢漢復立以為韓王竟從擊破項籍天下定五年春遂與剖符為韓王王潁川明年春上以韓信材武所王北近鞏洛南迫宛葉東有淮陽皆天下徑兵處乃詔徙韓王信王太原以北備禦胡都晉陽信上書曰國被邊胸奴數入晉陽去塞遠請治馬邑上許之信乃徙治馬邑秋胸奴冒頓大圍信信數使使胡求和解漢發兵救之疑信數閒使有二心使人責讓信信恐誅因與胸奴約共攻漢反以馬邑降胡擊太原七年冬上自往擊破信軍銅鞮斬其將王喜信亡走胸奴其將白土人曼丘臣王黃等立趙苗裔趙利為王復收信敗散兵而與信及冒頓謀攻漢胸奴使左右賢王將萬餘騎與王黃等屯廣武以南至晉陽與漢兵戰漢大破之追至于離石復破之胸奴復聚兵樓煩西北漢令車騎擊破胸奴胸奴常敗走漢乘勝追北聞冒頓居代上谷高皇帝居晉陽使人視冒頓還報曰可擊上遂至平城上出白登胸奴騎圍上上乃使人厚遣閼氏閼氏乃說冒頓曰今得漢地猶不能居且兩主不相厄居七日胡騎稍引去時天大霧漢使人往來胡不覺護軍中尉陳平言上曰胡者全兵請令彊弩傅兩矢外嚮徐行出圍入平城漢救兵亦到胡騎遂解去漢亦罷兵歸韓信為胸奴將兵來擊邊漢十年信令王黃等說誤陳豨十一年春故韓王信復與胡騎入居參合距漢漢使柴將軍擊之遺信書曰陛下寬仁諸侯雖有畔亡而復歸輒復故位號不誅也大王所知今王以敗亡走胡非有大罪急自歸韓王信報曰陛下擢僕起閭巷南面稱孤此僕之幸也滎陽之事僕不能死囚於項籍此一罪也及寇攻馬邑僕不能堅守以城降之此二罪也今反為寇將兵與將軍爭一旦之命此三罪也夫種蠡無一罪身死亡今僕有三罪於陛下而欲求活於世此伍子胥所以僨於吳也今僕亡匿山谷閒旦暮乞貸蠻夷僕之思歸如痿人不忘起盲者不忘視也勢不可耳遂戰柴將軍屠參合斬韓王信信之入胸奴與太子俱及至穨當城生子因名曰穨當韓太子亦生子命曰嬰至孝文十四年穨當及嬰率其衆降漢漢封穨當為弓高侯嬰為襄城侯吳楚軍時弓高侯功冠諸將傳子至孫孫無子失侯嬰孫以不敬失侯穨當孽孫韓嫣貴幸名富顯於當世其弟說再封數稱將軍卒為案道侯子代歲餘法死後歲餘說孫曾拜為龍額侯續說後盧綰者豐人也與高祖同里盧綰親與高祖太上皇相愛及生男高祖盧綰同日生里中持羊酒賀兩家及高祖盧綰壯俱學書又相愛也里中嘉兩家親相愛生子同日壯又相愛復賀兩家羊酒高祖為布衣時有吏事辟匿盧綰常隨出入上下及高祖初起沛盧綰以客從入漢中為將軍常待中從東擊項籍以太尉常從出入臥內衣被飲食賞賜群臣莫敢望雖蕭曹等特以事見禮至其親幸莫及盧綰綰封為長安侯長安故咸陽也漢五年冬以破項籍乃使盧綰別將與劉賈擊臨江王共尉破之七月還從擊燕王臧荼臧荼降高祖已定天下諸侯非劉氏而王者七人欲王盧綰為群臣觖望及虜臧荼乃下詔諸將相列侯擇群臣有功者以為燕王群臣知上欲王盧綰皆言曰太尉長安侯盧綰常從平定天下功最多可王燕詔許之漢五年八月乃立盧綰為燕王諸侯王得幸莫如燕王漢十一年秋陳豨反代地高祖如邯鄲擊豨兵燕王綰亦擊其東北當是時陳豨使王黃求救胸奴燕王綰亦使其臣張勝於胸奴言豨等軍破張勝至胡故燕王臧荼子衍出亡在胡見張勝曰公所以重於燕者以習胡事也燕所以久存者以諸侯數反兵連不決也今公為燕欲急滅豨等豨等已盡次亦至燕公等亦且為虜矣公何不令燕且緩陳豨而與胡和事寬得長王燕即有漢急可以安國張勝以為然乃私令胸奴助豨等擊燕燕王綰疑張勝與胡反上書請族張勝勝還具道所以為者燕王寤乃詐論它人脫勝家屬使得為胸奴閒而陰使范齊之陳豨所欲令久亡連兵勿決漢十二年東擊黥布豨常將兵居代漢使樊噲擊斬豨其裨將降言燕王綰使范齊通計謀於豨所高祖使使召盧綰綰稱病上又使辟陽侯審食其御史大夫趙堯往迎燕王因驗問左右綰愈恐閉匿謂其幸臣曰非劉氏而王獨我與長沙耳往年春漢族淮陰夏誅彭越皆呂后計今上病屬任呂后呂后婦人專欲以事誅異姓王者及大功臣乃遂稱病不行其左右皆亡匿語頗泄辟陽侯聞之歸具報上上益怒又得胸奴降者降者言張勝亡在胸奴為燕使於是上曰盧綰果反矣使樊噲擊燕燕王綰悉將其宮人家屬騎數千居長城下候伺幸上病愈自入謝四月高祖崩盧綰遂將其衆亡入胸奴胸奴以為東胡盧王綰為蠻夷所侵奪常思復歸居歲餘死胡中高后時盧綰妻子亡降漢會高后病不能見舍燕邸為欲置酒見之高后竟崩不得見盧綰妻亦病死孝景中六年盧綰孫他之以東胡王降封為亞谷侯陳豨者宛朐人也不知始所以得從及高祖七年冬韓王信反入胸奴上至平城還乃封豨為列侯以趙相國將監趙代邊兵邊兵皆屬焉豨常告歸過趙趙相周昌見豨賓客隨之者千餘乘邯鄲官舍皆滿豨所以待賓客布衣交皆出客下豨還之代周昌乃求入見見上具言豨賓客盛甚擅兵於外數歲恐有變上乃令人覆案豨客居代者財物諸不法事多連引豨豨恐陰令客通使王黃曼丘臣所及高祖十年七月太上皇崩使人召豨豨稱病甚九月遂與王黃等反自立為代王劫略趙代上聞乃赦趙代吏人為豨所詿誤劫略者皆赦之上自往至邯鄲喜曰豨不南據漳水北守邯鄲知其無能為也趙相奏斬常山守尉曰常山二十五城豨反亡其二十城上問曰守尉反乎對曰不反上曰是力不足也赦之復以為常山守尉上問周昌曰趙亦有壯士可令將者乎對曰有四人四人謁上謾罵曰豎子能為將乎四人慚伏上封之各千戶以為將左右諫曰從入蜀漢伐楚功未遍行今此何功而封上曰非若所知陳豨反邯鄲以北皆豨有吾以羽檄徵天下兵未有至者今唯獨邯鄲中兵耳吾胡愛四千戶封四人不以慰趙子弟皆曰善於是上曰陳豨將誰曰王黃曼丘臣皆故賈人上曰吾知之矣乃各以千金購黃臣等十一年冬漢兵擊斬陳豨將侯敞王黃於曲逆下破豨將張春於聊城斬首萬餘太尉勃入定太原代地十二月上自擊東垣東垣不下卒罵上東垣降卒罵者斬之不罵者黥之更命東垣為真定王黃曼兵臣其麾下受購賞之皆生得以故陳豨軍遂敗上還至洛陽上曰代居常山北趙乃從山南有之遠乃立子恆為代王都中都代鴈門皆屬代高祖十二年冬樊噲軍卒追斬豨於靈丘太史公曰韓信盧綰非素積德纍善之世徼一時權變以詐力成功遭漢初定故得列地南面稱孤內見疑彊大外倚蠻貊以為援是以日疏自危事窮智困卒赴胸奴豈不哀哉陳豨梁人其少時數稱慕魏公子及將軍守邊招致賓客而下士名聲過實周昌疑之疵瑕頗起懼禍及身邪人進說遂陷無道於戲悲夫夫計之生孰成敗於人也深矣
