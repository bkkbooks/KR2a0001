body:
  text: 夏本紀第二夏禹名曰文命禹之父曰鯀鯀之父曰帝顓頊顓頊之父曰昌意昌意之父曰黃帝禹者黃帝之玄孫而帝顓頊之孫也禹之曾大父昌意及父鯀皆不得在帝位為人臣當帝堯之時鴻水滔天浩浩懷山襄陵下民其憂堯求能治水者群臣四嶽皆曰鯀可堯曰鯀為人負命毀族不可四嶽曰等之未有賢於鯀者願帝試之於是堯聽四嶽用鯀治水九年而水不息功用不成於是帝堯乃求人更得舜舜登用攝行天子之政巡狩行視鯀之治水無狀乃殛鯀於羽山以死天下皆以舜之誅為是於是舜舉鯀子禹而使續鯀之業堯崩帝舜問四嶽曰有能成美堯之事者使居官皆曰伯禹為司空可成美堯之功舜曰嗟然命禹女平水土維是勉之禹拜稽首讓於契后稷皋陶舜曰女其往視爾事矣禹為人敏給克勤其德不違其仁可親其言可信聲為律身為度稱以出亹亹穆穆為綱為紀禹乃遂與益后稷奉帝命命諸侯百姓興人徒以傅土行山表木定高山大川禹傷先人父鯀功之不成受誅乃勞身焦思居外十三年過家門不敢入薄衣食致孝于鬼神卑宮室致費於溝淢陸行乘車水行乘船泥行乘橇山行乘檋左準繩右規矩載四時以開九州通九道陂九澤度九山令益豫衆庶稻可種卑溼命后稷豫衆庶難得之食食少調有餘相給以均諸侯禹乃行相地宜所有以貢及山川之便利禹行自冀州始冀州既載壺口治梁及岐既修太原至于嶽陽覃懷致功至於衡漳其土白壤賦上上錯田中中常衛既從大陸既為鳥夷皮服夾右碣石入于海濟河維沇州九河既道雷夏既澤雍沮會同桑土既蠶於是民得下丘居土其土黑墳草繇木條田中下賦貞作十有三年乃同其貢漆絲其篚織文浮於濟漯通於河海岱維青州堣夷既略濰淄其道其土白墳海濱廣潟厥田斥鹵田上下賦中上厥貢鹽絺海物維錯岱畎絲枲鉛松怪石萊夷為牧其篚酓絲浮於汶通於濟海岱及淮維徐州淮沂其治蒙羽其藝大野既都東原砥平其土赤埴墳草木漸包其田上中賦中中貢維土五色羽畎夏狄嶧陽孤桐泗濱浮磬淮夷蠙珠臮魚其篚玄纖縞浮于淮泗通于河淮海維揚州彭蠡既都陽鳥所居三江既入震澤致定竹箭既布其草惟夭其木惟喬其土塗泥田下下賦下上上雜貢金三品瑤琨竹箭齒革羽旄島夷卉服其篚扉織貝其包橘柚錫貢均江海通淮泗荊及衡陽維荊州江漢朝宗于海九江甚中沱涔已道雲土夢為治其土塗泥田下中賦上下貢羽旄齒革金三品杶幹栝柏礪砥砮丹維箘簬楛三國致貢其名包匭菁茅其篚玄纁璣組九江入賜大龜浮于江沱涔漢踰于雒至于南河荊河惟豫州伊雒瀍㵎既入于河滎播既都道荷澤被明都其土壤下土墳壚田中上賦雜上中貢漆絲絺紵其篚纖絮錫貢磬錯浮於雒達於河華陽黑水惟梁州汶嶓既藝沱涔既道蔡蒙旅平和夷砥績其土青驪田下上賦下中三錯貢璆鐵銀鏤砮磬熊羆狐貍織皮西傾因桓是來浮于潛踰于沔入于渭亂于河黑水西河惟雍州弱水既西涇屬渭汭漆沮既從灃水所同荊岐已旅終南敦物至于鳥鼠原隰砥績至于都野三危既度三苗大序其土黃壤田上上賦中下貢璆琳琅玕浮于積石至于龍門西河會于渭汭織皮昆侖析支渠搜西戎即序道九山汧及岐至于荊山踰于河壺口雷首至于太嶽砥柱析城至于王屋太行常山至于碣石入于海西傾朱圉鳥鼠至于太華熊耳外方桐柏至于負尾道嶓冢至于荊山內方至于大別汶山之陽至衡山過九江至于敷淺原道九川弱水至於合黎餘波入于流沙道黑水至于三危入于南海道河積石至于龍門南至華陰東至砥柱又東至于盟津東過雒汭至于大邳北過降水至于大陸北播為九河同為逆河入于海嶓冢道漾東流為漢又東為蒼浪之水過三澨入于大別南入于江東匯澤為彭蠡東為北江入于海汶山道江東別為沱又東至于醴過九江至于東陵東迆北會于匯東為中江入于海道沇水東為濟入于河泆為滎東出陶丘北又東至于荷又東北會于汶又東北入于海道淮自桐柏東會于泗沂東入于海道渭自鳥鼠同穴東會于灃又東北至于涇東過漆沮入于河道雒自熊耳東北會于㵎瀍又東會于伊東北入于河於是九州攸同四奧既居九山刊旅九川滌原九澤既陂四海會同六府甚修衆土交正致慎財賦咸則三壤成賦中國賜土姓祗台德先不距朕行令天子之國以外五百里甸服百里賦納總二百里納銍三百里納秸服四百里粟五百里米甸服外五百里侯服百里采二百里任國三百里諸侯侯服外五百里綏服三百里揆文教二百里奮武衛綏服外五百里要服三百里夷二百里蔡要服外五百里荒服三百里蠻二百里流東漸于海西被于流沙朔南暨聲教訖于四海於是帝錫禹玄圭以告成功于天下天下於是太平治皋陶作士以理民帝舜朝禹伯夷皋陶相與語帝前皋陶述其謀曰信其道德謀明輔和禹曰然如何皋陶曰於慎其身修思長敦序九族衆明高翼近可遠在已禹拜美言曰然皋陶曰於在知人在安民禹曰吁皆若是惟帝其難之知人則智能官人能安民則惠黎民懷之能知能惠何憂乎歡兜何遷乎有苗何畏乎巧言善色佞人皋陶曰然於亦行有九德亦言其有德乃言曰始事事寬而栗柔而立願而共治而敬擾而毅直而溫簡而廉剛而實彊而義章其有常吉哉日宣三德蚤夜翊明有家日嚴振敬六德亮采有國翕受普施九德咸事俊乂在官百吏肅謹毋教邪淫奇謀非其人居其官是謂亂天事天討有罪五刑五用哉吾言砥可行乎禹曰女言致可績行皋陶曰余未有知思贊道哉帝舜謂禹曰女亦昌言禹拜曰於豫何言豫思日孳孳皋陶難禹曰何謂孳孳禹曰鴻水滔天浩浩懷山襄陵下民皆服於水豫陸行乘車水行乘舟泥行乘橇山行乘檋行山刊木與益豫衆庶稻鮮食以決九川致四海浚畎澮致之川與稷豫衆庶難得之食食少調有餘補不足徙居衆民乃定萬國為治皋陶曰然此而美也禹曰於帝慎乃在位安爾止輔德天下大應清意以昭待上帝命天其重命用休帝曰吁臣哉臣哉臣作朕股肱耳目豫欲左右有民女輔之余欲觀古人之象日月星辰作文繡服色女明之豫欲聞六律五聲八音來始滑以出入五言女聽豫即辟女匡拂豫女無面諛退而謗豫敬四輔臣諸衆讒嬖臣君德誠施皆清矣禹曰然帝即不時布同善惡則毋功帝曰毋若丹朱傲維慢游是好毋水行舟朋淫于家用絶其世豫不能順是禹曰豫娶塗山辛壬癸甲生啓豫不子以故能成水土功輔成五服至于五千里州十二師外薄四海咸建五長各道有功苗頑不即功帝其念哉帝曰道吾德乃女功序之也皋陶於是敬禹之德令民皆則禹不如言刑從之舜德大明於是夔行樂祖考至群后相讓鳥獸翔舞簫韶九成鳳皇來儀百獸率舞百官信諧帝用此作歌曰陟天之命維時維幾乃歌曰股肱喜哉元首起哉百工熙哉皋陶拜手稽首揚言曰念哉率為興事慎乃憲敬哉乃更為歌曰元首明哉股肱良哉庶事康哉又歌曰元首叢脞哉股肱惰哉萬事墮哉帝拜曰然往欽哉於是天下皆宗禹之明度數聲樂為山川神主帝舜薦禹於天為嗣十七年而帝舜崩三年喪畢禹辭辟舜之子商均於陽城天下諸侯皆去商均而朝禹禹於是遂即天子位南面朝天下國號曰夏后姓姒氏帝禹立而舉皋陶薦之且授政焉而皋陶卒封皋陶之後於英六或在許而后舉益任之政十年帝禹東巡狩至于會稽而崩以天下授益三年之喪畢益讓帝禹之子啓而辟居箕山之陽禹子啓賢天下屬意焉及禹崩雖授益益之佐禹日淺天下未洽故諸侯皆去益而朝啓曰吾君帝禹之子也於是啓遂即天子之位是為夏后帝啓夏后帝啓禹之子其母塗山氏之女也有扈氏不服啓伐之大戰於甘將戰作甘誓乃召六卿申之啓曰嗟六事之人豫誓告女有扈氏威侮五行怠棄三正天用勦絶其命今豫維共行天之罰左不攻于左右不攻于右女不共命御非其馬之政女不共命用命賞于祖不用命僇于社豫則帑僇女遂滅有扈氏天下咸朝夏后帝啓崩子帝太康立帝太康失國昆弟五人須于洛汭作五子之歌太康崩弟中康立是為帝中康帝中康時羲和湎淫廢時亂日胤往征之作胤征中康崩子帝相立帝相崩子帝少康立帝少康崩子帝豫立帝豫崩子帝槐立帝槐崩子帝芒立帝芒崩子帝泄立帝泄崩子帝不降立帝不降崩弟帝扃立帝扃崩子帝廑立帝廑崩立帝不降之子孔甲是為帝孔甲帝孔甲立好方鬼神事淫亂夏后氏德衰諸侯畔之天降龍二有雌雄孔甲不能食未得豢龍氏陶唐既衰其后有劉纍學擾龍于豢龍氏以事孔甲孔甲賜之姓曰御龍氏受豕韋之後龍一雌死以食夏后夏后使求懼而遷去孔甲崩子帝皋立帝皋崩子帝發立帝發崩子帝履癸立是為桀帝桀之時自孔甲以來而諸侯多畔夏桀不務德而武傷百姓百姓弗堪乃召湯而囚之夏臺已而釋之湯修德諸侯皆歸湯湯遂率兵以伐夏桀桀走鳴條遂放而死桀謂人曰吾悔不遂殺湯於夏臺使至此湯乃踐天子位代夏朝天下湯封夏之後至周封於𣏌也太史公曰禹為姒姓其後分封用國為姓故有夏后氏有扈氏有男氏斟尋氏彤城氏褒氏費氏𣏌氏繒氏辛氏冥氏斟氏戈氏孔子正夏時學者多傳夏小正云自虞夏時貢賦備矣或言禹會諸侯江南計功而崩因葬焉命曰會稽會稽者會計也
