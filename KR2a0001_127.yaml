body:
  text: 日者列傳第六十七自古受命而王王者之興何嘗不以卜筮決於天命哉其於周尤甚及秦可見代王之入任於卜者太卜之起由漢興而有司馬季主者楚人也卜於長安東市宋忠為中大夫賈誼為博士同日俱出洗沐相從論議誦易先王聖人之道術究遍人情相視而歎賈誼曰吾聞古之聖人不居朝廷必在卜醫之中今吾已見三公九卿朝士大夫皆可知矣試之卜數中以觀采二人即同輿而之市遊於卜肆中天新雨道少人司馬季主間坐弟子三四人侍方辨天地之道日月之運陰陽吉凶之本二大夫再拜謁司馬季主視其狀貌如類有知者即禮之使弟子延坐坐定司馬季主復理前語分別天地之終始日月星辰之紀差次仁義之際列吉凶之符語數千言莫不順理宋忠賈誼瞿然而悟獵纓正襟危坐曰吾望先生之狀聽先生之辭小子竊觀於世未嘗見也今何居之卑何行之汙司馬季捧腹大笑曰觀大夫類有道術者今何言之陋也何辭之野也今夫子所賢者何也所高者誰也今何以卑汙長者二君曰尊官厚祿世之所高也賢才處之今所處非其地故謂之卑言不信行不驗取不當故謂之汙夫卜筮者世俗之所賤簡也世皆言曰夫卜者多言誇嚴以得人情虛高人祿命以説人志擅言禍災以傷人心矯言鬼神以盡人財厚求拜謝以私於己此吾之所恥故謂之卑汙也司馬季主曰公且安坐公見夫被髮童子乎日月照之則行不照則止問之日月疵瑕吉凶則不能理由是觀之能知別賢與不肖者寡矣賢之行也直道以正諫三諫不聽則退其譽人也不望其報惡人也不顧其怨以便國家利衆為務故官非其任不處也祿非其功不受也見人不正雖貴不敬也見人有污雖尊不下也得不為喜去不為恨非其罪也雖纍辱而不愧也今公所謂賢者皆可為羞矣卑疵而前孅趨而言相引以勢相導以利比周賓正以求尊譽以受公奉事私利枉主法獵農民以官為威以法為機求利逆暴譬無異於操白刃劫人者也初試官時倍力為巧詐飾虛功執空文以誷主上用居上為右試官不讓賢陳功見偽增實以無為有以少為多以求便勢尊位食飲驅馳從姬歌兒不顧於親犯法害民虛公家此夫為盜不操矛弧者也攻而不用弦刃者也欺父母未有罪而弒君未伐者也何以為高賢才乎盜賊發不能禁夷貊不服不能攝姦邪起不能塞官耗亂不能治四時不和不能調歲穀不孰不能適才賢不為是不忠也才不賢而託官位利上奉妨賢者處是竊位也有人者進有財者禮是偽也子獨不見鴟梟之與鳳皇翔乎蘭芷芎藭棄於廣野蒿蕭成林使君子退而不顯衆公等是也述而不作君子義也今夫卜者必法天地象四時順於仁義分策定卦旋式正棊然後言天地之利害事之成敗昔先王之定國家必先龜策日月而後乃敢代正時日乃後入家産子必先占吉凶後乃有之自伏羲作八卦周文王演三百八十四爻而天下治越王句踐放文王八卦以破敵國霸天下由是言之卜筮有何負哉且夫卜筮者掃除設坐正其冠帶然後乃言事此有禮也言而鬼神或以饗忠臣以事其上孝子以養其親慈父以畜其子此有德者也而以義置數十百錢病者或以愈且死或以生患或以免事或以成嫁子娶婦或以養生此之為德豈直數十百錢哉此夫老子所謂上德不德是以有德今夫卜筮者利大而謝少老子之云豈異於是乎莊子曰君子內無飢寒之患外無劫奪之憂居上而敬居下不為害君子之道也今夫卜筮者之為業也積之無委聚藏之不用府庫徙之不用輜車負裝之不重止而用之無盡索之時持不盡索之物遊於無窮之世雖莊氏之行未能增於是也子何故而云不可卜哉天不足西北星辰西北移地不足東南以海為池日中必移月滿必虧先王之道乍存乍亡公責卜者言必信不亦惑乎公見夫談士辨人乎慮事定計必是人也然不能以一言説人主意故言必稱先王語必道上慮事定計飾先王之成功語其敗害以恐喜人主之志以求其欲多言誇嚴莫大於此矣然欲強國成功盡忠於上非此不立今夫卜者導惑教愚也夫愚惑之人豈能以一言而知之哉言不厭多故騏驥不能與罷驢為駟而鳳皇不與燕雀為群而賢者亦不與不肖者同列故君子處卑隱以辟衆自匿以辟倫微見德順以徐群害以明天性助上養下多其功利不求尊譽公之等喁喁者也何知長者之道乎宋忠賈誼忽而自失芒乎無色悵然噤口不能言於是攝衣而起再拜而辭行洋洋也出門僅能自上車伏軾低頭卒不能出氣居三日宋忠見賈誼於殿門外乃相引屏語相謂自歎曰道高益安勢高益危居赫赫之勢失身且有日矣夫卜而有不審不見奪糈為人主計而不審身無所處此相去遠矣猶天冠地屨也此老子之所謂無名者萬物之始也天地曠曠物之熙熙或安或危莫知居之我與若何足預彼哉彼久而愈安雖曾氏之義未有以異也久之宋忠使胸奴不至而還抵罪而賈誼為梁懷王傅王墮馬薨誼不食毒恨而死此務華絶根者也太史公曰古者卜人所以不載者多不見于篇及至司馬季主余志而著之褚先生曰臣為郎時遊觀長安中見卜筮之賢大夫觀其起居行步坐起自動誓正其衣冠而當鄉人也有君子之風見性好解婦來卜對之顏色嚴振未嘗見齒而笑也從古以來賢者避世有居止舞澤者有居民間閉口不言有隱居卜筮間以全身者夫司馬季主者楚賢大夫遊學長安通易經術黃帝老子博聞遠見觀其對二大夫貴人之談言稱引古明王聖人道固非淺聞小數之能及卜筮立名聲千里者各往往而在傳曰富為上貴次之既貴各各學一伎能立其身黃直大夫也陳君夫婦人也以相馬立名天下齊張仲曲成侯以善擊刺學用劍立名天下留長孺以相彘立名榮陽褚氏以相牛立名能以伎能立名者甚多皆有高世絶人之風何可勝言故曰非其地樹之不生非其意教之不成夫家之教子孫當視其所以好好含苟生活之道因而成之故曰制宅命子足以觀士子有處所可謂賢人臣為郎時與太卜待詔為郎者同署言曰孝武帝時聚會占家問之某日可取婦乎五行家曰可堪輿家曰不可建除家曰不吉叢辰家曰大凶曆家曰小凶天人家曰小吉太一家曰大吉辨訟不決以狀聞制曰避諸死忌以五行為主人取於五行者也
