body:
  text: 建元已來王子侯者年表制詔御史諸侯王或欲推私恩分子弟邑者令各條上朕且臨定其號名太史公曰盛哉天子之德一人有慶天下賴之國名王子號元光元朔元狩元鼎元封太初茲河間獻王子二五年正月壬子侯劉明元年二三年侯明坐謀反殺人棄市國除安成長沙定王子一六年七月乙巳思侯劉蒼元年六六六元年今侯自當元年六四宜春長沙定王子一六年七月乙巳侯劉成元年六六四五年侯成坐酎金國除句容長沙定王子一六年七月乙巳哀侯劉黨元年元年哀侯黨薨無後國除句陵長沙定王子一六年七月乙巳侯劉福元年六六四五年侯福坐酎金國除杏山楚安王子一六年後九月壬戌侯劉成元年六六四五年侯成坐酎金國除浮丘楚安王子一六年後九月壬戌侯劉不審元年六四二五年侯霸元年四五年侯霸坐酎金國除廣戚魯共王子六元年十月丁酉節侯劉擇元年六元年侯始元年四五年侯始坐酎金國除丹楊江都易王子六元年十二月甲辰哀侯敢元年元狩元年侯敢薨無後國除盱台江都易王子六元年十二月甲辰侯劉象之元年六四五年侯象之坐酎金國除湖孰江都易王子六元年正月丁卯頃侯劉胥元年六四二五年今侯聖元年六四秩陽江都易王子六元年正月丁卯終侯劉漣元年六三四年終侯漣薨無後國除睢陵江都易王子六元年正月丁卯侯劉定國元年六四五年侯定國坐酎金國除龍丘江都易王子五二年五月乙巳侯劉代元年六四五年侯代坐酎金國除張梁江都易王子五二年五月乙巳哀侯劉仁元年六二四三年今侯順元年六四劇災川懿王子五二年五月乙巳原侯劉錯元年六一五二年孝侯廣昌元年六四壤災川懿王子五二年五月乙巳夷侯劉高遂元年六六元年今侯延元年六四平望災川懿王子五二年五月乙巳夷侯劉賞元年二四三年今侯楚人元年六六四臨原災川懿王子五二年五月乙巳敬侯劉始昌元年六六六四葛魁災川懿王子五二年五月乙巳節侯劉寬元年三三四年侯戚元年二三年侯戚坐殺人棄市國除益都災川懿王子五二年五月乙巳侯劉胡元年六六六四平酌災川懿王子五二年五月乙巳戴侯劉強元年六六元年思侯中時元年六四劇魁災川懿王子五二年五月乙巳夷侯劉墨元年六六三元年侯昭元年三四年侯德元年四壽梁災川懿王子五二年五月乙巳侯劉守元年六四五年侯守坐酎金國除平度災川懿王子五二年五月乙巳侯劉衍元年六六六四宜成災川懿王子五二年五月乙巳康侯劉偃元年六六元年侯福元年六元年侯福坐殺弟棄市國除臨朐災川懿王子五二年五月乙巳哀侯劉奴元年六六六四雷城陽共王子五二年五月甲戌侯劉稀元年六五五年侯稀坐酎金國除東莞城陽共王子三二年五月甲戌侯劉吉元年五年侯吉有痼疾不朝廢國除辟城陽共王子三二年五月甲戌節侯劉壯元年二五年侯朋元年六四五年侯朋坐酎金國除尉文趙敬肅王子五二年六月甲午節侯劉丙元年六元年侯犢元年四五年侯犢坐酎金國除封斯趙敬肅王子五二年六月甲午共侯劉胡陽元年六六六二二三年今侯如意元年榆丘趙敬肅王子五二年六月甲午侯劉壽福元年六四五年侯壽福坐酎金國除襄饞趙敬肅王子五二年六月甲午侯劉建元年六四五年侯建坐酎金國除邯會趙敬肅王子五二年六月甲午侯劉仁元年六六六四朝趙敬肅王子五二年六月甲午侯劉義元年六二四三年今侯祿元年六四東城趙敬肅王子五二年六月甲午侯劉遺元年六元年侯遺有罪國除陰城趙敬肅王子五二年六月甲午侯劉蒼元年六六元年侯蒼有罪國除廣望中山靖王子五二年六月甲午侯劉安中元年六六六四將梁中山靖王子五二年六月甲午侯劉朝平元年六四五年侯朝平坐酎金國除新館中山靖王子五二年六月甲午侯劉未央元年六四五年侯未央坐酎金國除新處中山靖王子五二年六月甲午侯劉嘉元年六四五年侯嘉坐酎金國除陘城中山靖王子五二年六月甲午侯劉貞元年六四五年侯貞坐酎金國除蒲領廣川惠王子四三年十月癸酉侯劉嘉元年西熊廣川惠王子四三年十月癸酉侯劉明元年棗強廣川惠王子四三年十月癸酉侯劉晏元年畢梁廣川惠王子四三年十月癸酉侯劉嬰元年六六三四年侯嬰有罪國除房光河間獻王子四三年十月癸酉侯劉殷元年六元年侯殷有罪國除距陽河間獻王子四三年十月癸酉侯劉丐元年四二五年侯渡元年四五年侯渡有罪國除蔞河間獻王子四三年十月癸酉侯劉邈元年六六六元年今侯嬰元年四阿武河間獻王子四三年十月癸酉湣侯劉豫元年六六六二二三年今侯寬元年參戶河間獻王子四三年十月癸酉侯劉勉元年六六六四州鄉河間獻王子四三年十月癸酉節侯劉禁元年六六五一六年今侯惠元年四成平河間獻王子四三年十月癸酉侯劉禮元年二三年侯禮有罪國除廣河間獻王子四三年十月癸酉侯劉順元年六四五年侯順坐酎金國除蓋胥河間獻王子四三年十月癸酉侯劉讓元年六四五年侯讓坐酎金國除陪安濟北貞王子四三年十月癸酉康侯劉不害元年六一二年哀侯秦客元年二三年侯秦客薨無後國除榮簡濟北貞王子四三年十月癸酉侯劉騫元年二三年侯騫有罪國除周堅濟北貞王子四三年十月癸酉侯劉何元年四二五年侯當時元年四五年侯當時坐酎金國除安陽濟北貞王子四三年十月癸酉侯劉桀元年六六六四五㯫濟北貞王子四三年十月癸酉侯劉臒丘元年六四五年侯臒丘坐酎金國除富濟北貞王子四三年十月癸酉侯劉襲元年六六六四陪濟北貞王子四三年十月癸酉繆侯劉明元年六二三年侯邑元年二五年侯邑坐酎金國除叢濟北貞王子四三年十月癸酉侯劉信元年六四五年侯信坐酎金國除平濟北貞王子四三年十月癸酉侯劉遂元年元年侯遂有罪國除羽濟北貞王子四三年十月癸酉侯劉成元年六六六四胡母濟北貞王子四三年十月癸酉侯劉楚元年六四五年侯楚坐酎金國除離石代共王子四三年正月壬戌侯劉綰元年六六六四邵代共王子四三年正月壬戌侯劉慎元年六六六四利昌代共王子四三年正月壬戌侯劉嘉元年六六六四藺代共王子三年正月壬戌侯劉熹元年臨河代共王子三年正月壬戌侯劉賢元年隰成代共王子三年正月壬戌侯劉忠元年土軍代共王子三年正月壬戌侯劉郢客元年侯郢客坐與人妻姦棄市皋狼代共王子三年正月壬戌侯劉遷元年千章代共王子三年正月壬戌侯劉遇元年博陽齊孝王子四三年三月乙卯康侯劉就元年六二三年侯終吉元年二五年侯終吉坐酎金國除寧陽魯共王子四三年三月乙卯節侯劉恢元年六六六四瑕丘魯共王子四三年三月乙卯節侯劉貞元年六六六四公丘魯共王子四三年三月乙卯夷侯劉順元年六六六四郁狼魯共王子四三年三月乙卯侯劉騎元年六四五年侯騎坐酎金國除西昌魯共王子四三年三月乙卯侯劉敬元年六四五年侯敬坐酎金國除陘城中山靖王子四三年三月癸酉侯劉義元年六四五年侯義坐酎金國除邯平趙敬肅王子四三年四月庚辰侯劉順元年六四五年侯順坐酎金國除武始趙敬肅王子四三年四月庚辰侯劉昌元年六六六四象氏趙敬肅王子四三年四月庚辰節侯劉賀元年六六二四三年思侯安德元年四易四三年四月庚辰安侯劉平元年六六四二五年今侯種元年四洛陵長沙定王子三四年三月乙丑侯劉章元年一二年侯章有罪國除攸輿長沙定王子三四年三月乙丑侯劉則元年六六六元年侯則篡死罪棄市國除荼陵長沙定王子三四年三月乙丑侯劉欣元年六一五二年哀侯陽元年六元年侯陽薨無後國除建成長沙定王子三四年二月乙丑侯劉拾元年五六年侯拾坐不朝不敬國除安衆長沙定王子三四年三月乙丑康侯劉丹元年六六五一六年今侯山拊元年四葉長沙定王子三四年三月乙丑康侯劉嘉元年六四五年侯嘉坐酎金國除利鄉城陽共王子三四年三月乙丑康侯劉嬰元年二三年侯嬰有罪國除有利城陽共王子三四年三月乙丑侯劉釘元年元年侯釘坐遺淮南書稱臣棄市國除東平城陽共王子三四年三月乙丑侯劉慶元年二三年侯慶坐與姊妹姦有罪國除運平城陽共王子三四年三月乙丑侯劉欣元年六四五年侯欣坐酎金國除山州城陽共王子三四年三月乙丑侯劉齒元年六四五年侯齒坐酎金國除海常城陽共王子三四年三月乙丑侯劉福元年六四五年侯福坐酎金國除鈞丘城陽共王子三四年三月乙丑侯劉憲元年三三四年今侯執德元年六六四南城城陽共王子三四年三月乙丑侯劉貞元年六六六四廣陵城陽共王子三四年三月乙丑常侯劉表元年四二五年侯成元年四五年侯成坐酎金國除莊原城陽共王子三四年三月乙丑侯劉皋元年六四五年侯皋坐酎金國除臨樂中山靖王子三四年四月甲午敦侯劉光元年六六五一六年今侯建元年四東野中山靖王子三四年四月甲午侯劉章元年六六六四高平中山靖王子三四年四月甲午侯劉嘉元年六四五年侯嘉坐酎金國除廣川中山靖王子三四年四月甲午侯劉頗元年六四五年侯頗坐酎金國除千鍾河間獻王子三四年四月甲午侯劉搖元年一二年侯陰不使人為秋請有罪國除披陽齊孝王子三四年四月乙卯敬侯劉燕元年六四二五年今侯隅元年六四定齊孝王子三四年四月乙卯敬侯劉越元年六三三四年今侯德元年六四稻齊孝王子三四年四月乙卯夷侯劉定元年六二四三年今侯都陽元年六四山齊孝王子三四年四月乙卯侯劉國元年六六六四繁安齊孝王子三四年四月乙卯侯劉忠元年六六六三一四年今侯壽元年柳齊孝王子三四年四月乙卯康侯劉陽元年六三三四年侯罷師元年四二五年今侯自為元年四雲齊孝王子三四年四月乙卯夷侯劉信元年六五一六年今侯歲發元年六四牟平齊孝王子三四年四月乙卯共侯劉泄元年二四三年今侯奴元年六六四柴齊孝王子三四年四月乙卯原侯劉代元年六六六四柏陽趙敬肅王子二五年十一月辛酉侯劉終古元年六六六四鄗趙敬肅王子二五年十一月辛酉侯劉延年元年六四五年侯延年坐酎金國除桑丘中山靖王子二五年十一月辛酉節侯劉洋元年六三三四年今侯德元年六四高丘中山靖王子二五年三月癸酉哀侯劉破胡元年六元年侯破胡薨無後國除柳宿中山靖王子二五年三月癸酉夷侯劉蓋元年二四三年侯蘇元年四五年侯蘇坐酎金國除戎丘中山靖王子二五年三月癸酉侯劉讓元年六四五年侯讓坐酎金國除樊輿中山靖王子二五年三月癸酉節侯劉條元年六六六四曲成中山靖王子二五年三月癸酉侯劉萬歲元年六四五年侯萬歲坐酎金國除安郭中山靖王子二五年三月癸酉侯劉博元年六六六四安險中山靖王子二五年三月癸酉侯劉應元年六四五年侯應坐酎金國除安遙中山靖王子二五年三月癸酉侯劉恢元年六四五年侯恢坐酎金國除夫夷長沙定王子二五年三月癸酉敬侯劉義元年六四六五年今侯禹元年六四舂陵長沙定王子二五年六月壬子侯劉買元年六六六四都梁長沙定王子二五年六月壬子敬侯劉遂元年六六元年今侯係元年六四洮陽長沙定王子二五年六月壬子靖侯劉狗彘元年五六年侯狗彘薨無後國除泉陵長沙定王子二五年六月壬子節侯劉賢元年六六六四終弋衡山王賜子一六年四月丁丑侯劉廣置