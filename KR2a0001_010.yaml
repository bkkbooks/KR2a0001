body:
  text: 孝文本紀孝文皇帝高祖中子也高祖十一年春已破陳豨軍定代地立為代王都中都太后薄氏子即位十七年高后八年七月高后崩九月諸呂呂産等欲為亂以危劉氏大臣共誅之謀召立代王事在呂后語中丞相陳平太尉周勃等使人迎代王代王問左右郎中令張武等張武等議曰漢大臣皆故高帝時大將習兵多謀詐此其屬意非止此也特畏高帝呂太后威耳今已誅諸呂新喋血京師此以迎大王為名實不可信願大王稱疾毋往以觀其變中尉宋昌進曰群臣之議皆非也夫秦失其政諸侯豪桀並起人人自以為得之者以萬數然卒踐天子之位者劉氏也天下絶望一矣高帝封王子弟地犬牙相制此所謂盤石之宗也天下服其強二矣漢興除秦苛政約法令施德惠人人自安難動搖三矣夫以呂太后之嚴立諸呂為三王擅權專制然而太尉以一節入北軍一呼士皆左袒為劉氏叛諸呂卒以滅之此乃天授非人力也今大臣雖欲為變百姓弗為使其黨寧能專一邪方今內有朱虛東牟之親外畏吳楚淮南琅邪齊代之強方今高帝子獨淮南王與大王大王又長賢聖仁孝聞於天下故大臣因天下之心而欲迎立大王大王勿疑也代王報太后計之猶與未定卜之龜卦兆得大橫占曰大橫庚庚余為天王夏啓以光代王曰寡人固已為王矣又何王卜人曰所謂天王者乃天子於是代王乃遣太后弟薄昭往見絳侯絳侯等具為昭言所以迎立王意薄昭還報曰信矣毋可疑者代王乃笑謂宋昌曰果如公言乃命宋昌參乘張武等六人乘傳詣長安至高陵休止而使宋昌先馳之長安觀變昌至渭橋丞相以下皆迎宋昌還報代王馳至渭橋群臣拜謁稱臣代王下車拜太尉勃進曰願請間言宋昌曰所言公公言之所言私王者不受私太尉乃跪上天子璽符代王謝曰至代邸而議之遂馳入代邸群臣從至丞相陳平太尉周勃大將軍陳武御史大夫張蒼宗正劉郢朱虛侯劉章東牟侯劉興居典客劉揭皆再拜言曰子弘等皆非孝惠帝子不當奉宗廟臣謹請陰安侯列侯頃王后與琅邪王宗室大臣列侯吏二千石議曰大王高帝長子宜為高帝嗣願大王即天子位代王曰奉高帝宗廟重事也寡人不佞不足以稱宗廟願請楚王計宜者寡人不敢當群臣皆伏固請代王西鄉讓者三南鄉讓者再丞相平等皆曰臣伏計之大王奉高帝宗廟最宜稱雖天下諸侯萬民以為宜臣等為宗廟社稷計不敢忽願大王幸聽臣等臣謹奉天子璽符再拜上代王曰宗室將相王列侯以為莫宜寡人寡人不敢辭遂即天子位群臣以禮次侍及使太僕嬰與東牟侯興居清宮奉天子法駕迎于代邸皇帝即日夕入未央宮乃夜拜宋昌為衛將軍鎮撫南北軍以張武為郎中令行殿中還坐前殿於是夜下詔書曰間者諸呂用事擅權謀為大逆欲以危劉氏宗廟賴將相列侯宗室大臣誅之皆伏其辜朕初即位其赦天下賜民爵一級女子百戶牛酒酺五日孝文皇帝元年十月庚戌徙立故琅邪王澤為燕王辛亥皇帝即阼謁高廟右丞相平徙為左丞相太尉勃為右丞相大將軍灌嬰為太尉諸呂所奪齊楚故地皆復與之壬子遣車騎將軍薄昭迎皇太后于代皇帝曰呂産自置為相國呂祿為上將軍擅矯遣灌將軍嬰將兵擊齊欲代劉氏嬰留滎陽弗擊與諸侯合謀以誅呂氏呂産欲為不善丞相陳平與太尉周勃謀奪呂産等軍朱虛侯劉章首先捕呂産等太尉身率襄平侯通持節承詔入北軍典客劉揭身奪趙王呂祿印益封太尉勃萬戶賜金五千斤丞相陳平灌將軍嬰邑各三千戶金二千斤朱虛侯劉章襄平侯通東牟侯劉興居邑各二千戶金千斤封典客揭為陽信侯賜金千斤十二月上曰法者治之正也所以禁暴而率善人也今犯法已論而使毋罪之父母妻子同産坐之乃為收帑朕甚不取其議之有司皆曰民不能自治故為法以禁之相坐坐收所以纍其心使重犯法所從來遠矣如故便上曰朕聞法正則民愨罪當則民從且夫牧民而導之善者吏也其既不能導又以不正之法罪之是反害於民為暴者也何以禁之朕未見其便其孰計之有司皆曰陛下加大惠德甚盛非臣等所及也請奉詔書除收帑諸相坐律令正月有司言曰蚤建太子所以尊宗廟請立太子上曰朕既不德上帝神明未歆享天下人民未有嗛志今縱不能博求天下賢聖有德之人而禪天下焉而曰豫建太子是重吾不德也謂天下何其安之有司曰豫建太子所以重宗廟社稷不忘天下也上曰楚王季父也春秋高閲天下之義理多矣明於國家之大體吳王於朕兄也惠仁以好德淮南王弟也秉德以陪朕豈為不豫哉諸侯王宗室昆弟有功臣多賢及有德義者若舉有德以陪朕之不能終是社稷之靈天下之福也今不選舉焉而曰必子人其以朕為忘賢有德者而專於子非所以憂天下也朕甚不取也有司皆固請曰古者殷周有國治安皆千餘歲古之有天下者莫長焉用此道也立嗣必子所從來遠矣高帝親率士大夫始平天下建諸侯為帝者太祖諸侯王及列侯始受國者皆亦為其國祖子孫繼嗣世世弗絶天下之大義也故高帝設之以撫海內今釋宜建而更選於諸侯及宗室非高帝之志也更議不宜子某最長純厚慈仁請建以為太子上乃許之因賜天下民當代父後者爵各一級封將軍薄昭為軹侯三月有司請立皇后薄太后曰諸侯皆同姓立太子母為皇后皇后姓竇氏上為立后故賜天下鰥寡孤獨窮困及年八十已上孤兒九歲已下布帛米肉各有數上從代來初即位施德惠天下填撫諸侯四夷皆洽歡乃循從代來功臣上曰方大臣之誅諸呂迎朕朕狐疑皆止朕唯中尉宋昌勸朕朕以得保奉宗廟已尊昌為衛將軍其封昌為壯武侯諸從朕六人官皆至九卿上曰列侯從高帝入蜀漢中者六十八人皆益封各三百戶故吏二千石以上從高帝潁川守尊等十人食邑六百戶淮陽守申徒嘉等十人五百戶衛尉定等十人四百戶封淮南王舅父趙兼為周陽侯齊王舅父駟鈞為清郭侯秋封故常山丞相蔡兼為樊侯人或説右丞相曰君本誅諸呂迎代王今又矜其功受上賞處尊位禍且及身右丞相勃乃謝病免罷左丞相平專為丞相二年十月丞相平卒復以絳侯勃為丞相上曰朕聞古者諸侯建國千餘歲各守其地以時入貢民不勞苦上下歡欣靡有遺德今列侯多居長安邑遠吏卒給輸費苦而列侯亦無由教馴其民其令列侯之國為吏及詔所止者遣太子十一月晦日有食之十二月望日又食上曰朕聞之天生蒸民為之置君以養治之人主不德布政不均則天示之以災以誡不治乃十一月晦日有食之適見于天災孰大焉朕獲保宗廟以微眇之身託于兆民君王之上天下治亂在朕一人唯二三執政猶吾股肱也朕下不能理育群生上以纍三光之明其不德大矣令至其悉思朕之過失及知見思之所不及丐以告朕及舉賢良方正能直言極諫者以匡朕之不逮因各飭其任職務省繇費以便民朕既不能遠德故憪然念外人之有非是以設備未息今縱不能罷邊屯戍而又飭兵厚衛其罷衛將軍軍太僕見馬遺財足餘皆以給傳置正月上曰農天下之本其開籍田朕親率耕以給宗廟粢盛三月有司請立皇子為諸侯王上曰趙幽王幽死朕甚憐之已立其長子遂為趙王遂弟辟強及齊悼惠王子朱虛侯章東牟侯興居有功可王乃立趙幽王少子辟強為河間王以齊劇郡立朱虛侯為城陽王立東牟侯為濟北王皇子武為代王子參為太原王子揖為梁王上曰古之治天下朝有進善之旌誹謗之木所以通治道而來諫者今法有誹謗妖言之罪是使衆臣不敢盡情而上無由聞過失也將何以來遠方之賢良其除之民或祝詛上以相約結而後相謾吏以為大逆其有他言而吏又以為誹謗此細民之愚無知抵死朕甚不取自今以來有犯此者勿聽治九月初與郡國守相為銅虎符竹使符三月十月丁酉晦日有食之十一月上曰前日詔遣列侯之國或辭未行丞相朕之所重其為朕率列侯之國絳侯勃免丞相就國以太尉潁陰侯嬰為丞相罷太尉官屬丞相四月城陽王章薨淮南王長與從者魏敬殺辟陽侯審食其五月胸奴入北地居河南為寇帝初幸甘泉六月帝曰漢與胸奴約為昆弟毋使害邊境所以輸遺胸奴甚厚今右賢王離其國將衆居河南降地非常故往來近塞捕殺吏卒驅保塞蠻夷令不得居其故陵轢邊吏入盜甚敖無道非約也其發邊吏騎八萬五千詣高奴遣丞相潁陰侯灌嬰擊胸奴胸奴去發中尉材官屬衛將軍軍長安辛卯帝自甘泉之高奴因幸太原見故群臣皆賜之舉功行賞諸民里賜牛酒復晉陽中都民三歲留遊太原十餘日濟北王興居聞帝之代欲往擊胡乃反發兵欲襲滎陽於是詔罷丞相兵遣棘蒲侯陳武為大將軍將十萬往擊之祁侯賀為將軍軍滎陽七月辛亥帝自太原至長安乃詔有司曰濟北王背德反上詿誤吏民為大逆濟北吏民兵未至先自定及以軍地邑降者皆赦之復官爵與王興居去來亦赦之八月破濟北軍虜其王赦濟北諸吏民與王反者六年有司言淮南王長廢先帝法不聽天子詔居處毋度出入擬於天子擅為法令與棘蒲侯太子奇謀反遣人使閩越及胸奴發其兵欲以危宗廟社稷群臣議皆曰長當棄市帝不忍致法於王赦其罪廢勿王群臣請處王蜀嚴道邛都帝許之長未到處所行病死上憐之後十六年追尊淮南王長諡為厲王立其子三人為淮南王衡山王廬江王十三年夏上曰蓋聞天道禍自怨起而福繇德興百官之非宜由朕躬今祕祝之官移過于下以彰吾之不德朕甚不取其除之五月齊太倉令淳于公有罪當刑詔獄逮徙繫長安太倉公無男有女五人太倉公將行會逮罵其女曰生子不生男有緩急非有益也其少女緹縈自傷泣乃隨其父至長安上書曰妾父為吏齊中皆稱其廉平今坐法當刑妾傷夫死者不可復生刑者不可復屬雖復欲改過自新其道無由也妾願沒入為官婢贖父刑罪使得自新書奏天子天子憐悲其意乃下詔曰蓋聞有虞氏之時畫衣冠異章服以為僇而民不犯何則至治也今法有肉刑三而姦不止其咎安在非乃朕德薄而教不明歟吾甚自愧故夫馴道不純而愚民陷焉詩曰愷悌君子民之父母今人有過教未施而刑加焉或欲改行為善而道毋由也朕甚憐之夫刑至斷支體刻肌膚終身不息何其楚痛而不德也豈稱為民父母之意哉其除肉刑上曰農天下之本務莫大焉今勤身從事而有租稅之賦是為本末者毋以異其於勸農之道未備其除田之租稅十四年冬胸奴謀入邊為寇攻朝那塞殺北地都尉卬上乃遣三將軍軍隴西北地上郡中尉周舍為衛將軍郎中令張武為車騎將軍軍渭北車千乘騎卒十萬帝親自勞軍勒兵申教令賜軍吏卒帝欲自將擊胸奴群臣諫皆不聽皇太后固要帝帝乃止於是以東陽侯張相如為大將軍成侯赤為內史欒布為將軍擊胸奴胸奴遁走春上曰朕獲執犧牲圭幣以事上帝宗廟十四年于今歷日綿長以不敏不明而久撫臨天下朕甚自愧其廣增諸祀墠場圭幣昔先王遠施不求其報望祀不祈其福右賢左戚先民後己至明之極也今吾聞祠官祝釐皆歸福朕躬不為百姓朕甚愧之夫以朕不德而躬享獨美其福百姓不與焉是重吾不德其令祠官致敬毋有所祈是時北平侯張蒼為丞相方明律曆魯人公孫臣上書陳終始傳五德事言方今土德時土德應黃龍見當改正朔服色制度天子下其事與丞相議丞相推以為今水德始明正十月上黑事以為其言非是請罷之十五年黃龍見成紀天子乃復召魯公孫臣以為博士申明土德事於是上乃下詔曰有異物之神見于成紀無害於民歲以有年朕親郊祀上帝諸神禮官議毋諱以勞朕有司禮官皆曰古者天子夏躬親禮祀上帝於郊故曰郊於是天子始幸雍郊見五帝以孟夏四月答禮焉趙人新垣平以望氣見因説上設立渭陽五廟欲出周鼎當有玉英見十六年上親郊見渭陽五帝廟亦以夏答禮而尚赤十七年得玉杯刻曰人主延壽於是天子始更為元年令天下大酺其歲新垣平事覺夷三族後二年上曰朕既不明不能遠德是以使方外之國或不寧息夫四荒之外不安其生封畿之內勤勞不處二者之咎皆自於朕之德薄而不能遠達也間者纍年胸奴並暴邊境多殺吏民邊臣兵吏又不能諭吾內志以重吾不德也夫久結難連兵中外之國將何以自寧今朕夙興夜寐勤勞天下憂苦萬民為之怛惕不安未嘗一日忘於心故遣使者冠蓋相望結軼於道以諭朕意於單于今單于反古之道計社稷之安便萬民之利親與朕俱棄細過偕之大道結兄弟之義以全天下元元之民和親已定始于今年後六年冬胸奴三萬人入上郡三萬人入雲中以中大夫令勉為車騎將軍軍飛狐故楚相蘇意為將軍軍句注將軍張武屯北地河內守周亞夫為將軍居細柳宗正劉禮為將軍居霸上祝茲侯軍棘門以備胡數月故人去亦罷天下旱蝗帝加惠令諸侯毋入貢弛山澤減諸服御狗馬損郎吏員發倉庾以振貧民民得賣爵孝文帝從代來即位二十三年宮室苑囿狗馬服御無所增益有不便輒弛以利民嘗欲作露臺召匠計之直百金上曰百金中民十家之産吾奉先帝宮室常恐羞之何以臺為上常衣綈衣所幸慎夫人令衣不得曳地幃帳不得文繡以示敦朴為天下先治霸陵皆以瓦器不得以金銀銅錫為飾不治墳欲為省毋煩民南越王尉他自立為武帝然上召貴尉他兄弟以德報之他遂去帝稱臣與胸奴和親胸奴背約入盜然令邊備守不發兵深入惡煩苦百姓吳王詐病不朝就賜几杖群臣如袁盎等稱説雖切常假借用之群臣如張武等受賂遺金錢覺上乃發御府金錢賜之以愧其心弗下吏專務以德化民是以海內殷富興於禮義後七年六月己亥帝崩於未央宮遺詔曰朕聞蓋天下萬物之萌生靡不有死死者天地之理物之自然者奚可甚哀當今之時世咸嘉生而惡死厚葬以破業重服以傷生吾甚不取且朕既不德無以佐百姓今崩又使重服久臨以離寒暑之數哀人之父子傷長幼之志損其飲食絶鬼神之祭祀以重吾不德也謂天下何朕獲保宗廟以眇眇之身託于天下君王之上二十有餘年矣賴天地之靈社稷之福方內安寧靡有兵革朕既不敏常畏過行以羞先帝之遺德維年之久長懼于不終今乃幸以天年得復供養于高廟朕之不明與嘉之其奚哀悲之有其令天下吏民令到出臨三日皆釋服毋禁取婦嫁女祠祀飲酒食肉者自當給喪事服臨者皆無踐絰帶無過三寸毋布車及兵器毋發民男女哭臨宮殿宮殿中當臨者皆以旦夕各十五舉聲禮畢罷非旦夕臨時禁毋得擅哭已下服大紅十五日小紅十四日纖七日釋服他不在令中者皆以此令比率從事布告天下使明知朕意霸陵山川因其故毋有所改歸夫人以下至少使令中尉亞夫為車騎將軍屬國悍為將屯將軍郎中令武為復土將軍發近縣見卒萬六千人發內史卒萬五千人藏郭穿復土屬將軍武乙巳群臣皆頓首上尊號曰孝文皇帝太子即位于高廟丁未襲號曰皇帝孝景皇帝元年十月制詔御史蓋聞古者祖有功而宗有德制禮樂各有由聞歌者所以發德也舞者所以明功也高廟酎奏武德文始五行之舞孝惠廟酎奏文始五行之舞孝文皇帝臨天下通關梁不異遠方除誹謗去肉刑賞賜長老收恤孤獨以育群生減嗜欲不受獻不私其利也罪人不帑不誅無罪除宮刑出美人重絶人之世朕既不敏不能識此皆上古之所不及而孝文皇帝親行之德厚侔天地利澤施四海靡不獲福焉明象乎日月而廟樂不稱朕甚懼焉其為孝文皇帝廟為昭德之舞以明休德然后祖宗之功德著於竹帛施于萬世永永無窮朕甚嘉之其與丞相列侯中二千石禮官具為禮儀奏丞相臣嘉等言陛下永思孝道立昭德之舞以明孝文皇帝之盛德皆臣嘉等愚所不及臣謹議世功莫大於高皇帝德莫盛於孝文皇帝高皇廟宜為帝者太祖之廟孝文皇帝廟宜為帝者太宗之廟天子宜世世獻祖宗之廟郡國諸侯宜各為孝文皇帝立太宗之廟諸侯王列侯使者侍祠天子歲獻祖宗之廟請著之竹帛宣布天下制曰可太史公曰孔子言必世然後仁善人之治國百年亦可以勝殘去殺誠哉是言漢興至孝文四十有餘載德至盛也廩廩鄉改正服封襌矣謙讓未成於今嗚呼豈不仁哉
