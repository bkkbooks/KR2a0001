body:
  text: 陳丞相世家第二十六陳丞相平者陽武戶牖鄉人也少時家貧好讀書有田三十畝獨與兄伯居伯常耕田縱平使游學平為人長大美色人或謂陳平曰貧何食而肥若是其嫂嫉平之不視家生產曰亦食穅覈耳有叔如此不如無有伯聞之逐其婦而棄之及平長可娶妻富人莫肯與者貧者平亦恥之久之戶牖富人有張負張負女孫五嫁而夫輒死人莫敢娶平欲得之邑中有喪平貧侍喪以先往後罷為助張負既見之喪所獨視偉平平亦以故後去負隨平至其家家乃負郭窮巷以獘席為門然門外多有長者車轍張負歸謂其子仲曰吾欲以女孫予陳平張仲曰平貧不事事一縣中盡笑其所為獨奈何予女乎負曰人固有好美如陳平而長貧賤者乎卒與女為平貧乃假貸幣以聘予酒肉之資以內婦負誡其孫曰毋以貧故事人不謹事兄伯如事父事嫂如母平既娶張氏女齎用益饒游道日廣里中社平為宰分肉食甚均父老曰善陳孺子之為宰平曰嗟乎使平得宰天下亦如是肉矣陳涉起而王陳使周市略定魏地立魏咎為魏王與秦軍相攻於臨濟陳平固已前謝其兄伯從少年往事魏王咎於臨濟魏王以為太僕說魏王不聽人或讒之陳平亡去久之項羽略地至河上陳平往歸之從入破秦賜平爵卿項羽之東王彭城也漢王還定三秦而東殷王反楚項羽乃以平為信武君將魏王咎客在楚者以往擊降殷王而還項王使項悍拜平為都尉賜金二十溢居無何漢王攻下殷項王怒將誅定殷者將吏陳平懼誅乃封其金與印使使歸項王而平身閒行杖劍亡渡河船人見其美丈夫獨行疑其亡將要中當有金玉寶器目之欲殺平平恐乃解衣躶而佐刺船船人知其無有乃止平遂至修武降漢因魏無知求見漢王漢王召入是時萬石君奮為漢王中涓受平謁入見平平等七人俱進賜食王曰罷就舍矣平曰臣為事來所言不可以過今日於是漢王與語而說之問曰子之居楚何官曰為都尉是日乃拜平為都尉使為參乘典護軍諸將盡讙曰大王一日得楚之亡卒未知其高下而即與同載反使監護軍長者漢王聞之愈益幸平遂與東伐項王至彭城為楚所敗引而還收散兵至滎陽以平為惡將屬於韓王信軍廣武絳侯灌嬰等咸讒陳平曰平雖美丈夫如冠玉耳其中未必有也臣聞平居家時盜其嫂事魏不容亡歸楚歸楚不中又亡歸漢今日大王尊官之令護軍臣聞平受諸將金金多者得善處金少者得惡處平反覆亂臣也願王察之漢王疑之召讓魏無知無知曰臣所言者能也陛下所問者行也今有尾生孝己之行而無益處於勝負之數陛下何暇用之乎楚漢相距臣進奇謀之士顧其計誠足以利國家不耳且盜嫂受金又何足疑乎漢王召讓平曰先生事魏不中遂事楚而去今又從吾游信者固多心乎平曰臣事魏王魏王不能用臣說故去事項王項王不能信人其所任愛非諸項即妻之昆弟雖有奇士不能用平乃去楚聞漢王之能用人故歸大王臣躶身來不受金無以為資誠臣計畫有可采者願大王用之使無可用者金具在請封輸官得請骸骨漢王乃謝厚賜拜為護軍中尉盡護諸將諸將乃不敢復言其後楚急攻絕漢甬道圍漢王於滎陽城久之漢王患之請割滎陽以西以和項王不聽漢王謂陳平曰天下紛紛何時定乎陳平曰項王為人恭敬愛人士之廉節好禮者多歸之至於行功爵邑重之士亦以此不附今大王慢而少禮士廉節者不來然大王能饒人以爵邑士之頑鈍嗜利無恥者亦多歸漢誠各去其兩短襲其兩長天下指麾則定矣然大王恣侮人不能得廉節之士顧楚有可亂者彼項王骨鯁之臣惡父鍾離眛龍且周殷之屬不過數人耳大王誠能出捐數萬斤金行反閒閒其君臣以疑其心項王為人意忌信讒必內相誅漢因舉兵而攻之破楚必矣漢王以為然乃出黃金四萬斤與陳平恣所為不問其出入陳平既多以金縱反閒於楚軍宣言諸將鍾離眛等為項王將功多矣然而終不得裂地而王欲與漢為一以滅項氏而分王其地項羽果意不信鍾離眛等項王既疑之使使至漢漢王為太牢具舉進見楚使即詳驚曰吾以為亞父使乃項王使復持去更以惡草具進楚使楚使歸具以報項王項王果大疑亞父亞父欲急攻下滎陽城項王不信不肯聽亞父聞項王疑之乃怒曰天下事大定矣君王自為之願請骸骨歸歸未至彭城疽發背而死陳平乃夜出女子二千人滎陽城東門楚因擊之陳平乃與漢王從城西門夜出去遂入關收散兵復東其明年淮陰侯破齊自立為齊王使使言之漢王漢王大怒而罵陳平躡漢王漢王亦悟乃厚遇齊使使張子房卒立信為齊王封平以戶牖鄉用其奇計策卒滅楚常以護軍中尉從定燕王臧荼漢六年人有上書告楚王韓信反高帝問諸將諸將曰亟發兵阬豎子耳高帝默然問陳平平固辭謝曰諸將云何上具告之陳平曰人之上書言信反有知之者乎曰未有曰信知之乎曰不知陳平曰陛下精兵孰與楚上曰不能過平曰陛下將用兵有能過韓信者乎上曰莫及也平曰今兵不如楚精而將不能及而舉兵攻之是趣之戰也竊為陛下危之上曰為之柰何平曰古者天子巡狩會諸侯南方有雲夢陛下弟出偽游雲夢會諸侯於陳陳楚之西界信聞天子以好出游其勢必無事而郊迎謁謁而陛下因禽之此特一力士之事耳高帝以為然乃發使告諸侯會陳吾將南游雲夢上因隨以行行未至陳楚王信果郊迎道中高帝豫具武士見信至即執縛之載後車信呼曰天下已定我固當烹高帝顧謂信曰若毋聲而反明矣武士反接之遂會諸侯于陳盡定楚地還至雒陽赦信以為淮陰侯而與功臣剖符定封於是與平剖符世世勿絕為戶牖侯平辭曰此非臣之功也上曰吾用先生謀計戰勝剋敵非功而何平曰非魏無知臣安得進上曰若子可謂不背本矣乃復賞魏無知其明年以護軍中尉從攻反者韓王信於代卒至平城為匈奴所圍七日不得食高帝用陳平奇計使單于閼氏圍以得開高帝既出其計祕世莫得聞高帝南過曲逆上其城望見其屋室甚大曰壯哉縣吾行天下獨見洛陽與是耳顧問御史曰曲逆戶口幾何對曰始秦時三萬餘戶閒者兵數起多亡匿今見五千戶於是乃詔御史更以陳平為曲逆侯盡食之除前所食戶牖其後常以護軍中尉從攻陳豨及黥布凡六出奇計輒益邑凡六益封奇計或頗祕世莫能聞也高帝從破布軍還病創徐行至長安燕王盧綰反上使樊噲以相國將兵攻之既行人有短惡噲者高帝怒曰噲見吾病乃冀我死也用陳平謀而召絳侯周勃受詔床下曰陳平亟馳傳載勃代噲將平至軍中即斬噲頭二人既受詔馳傳未至軍行計之曰樊噲帝之故人也功多且又乃呂后弟呂嬃之夫有親且貴帝以忿怒故欲斬之則恐後悔寧囚而致上上自誅之未至軍為壇以節召樊噲噲受詔即反接載檻車傳詣長安而令絳侯勃代將將兵定燕反縣平行聞高帝崩平恐呂太后及呂嬃讒怒乃馳傳先去逢使者詔平與灌嬰屯於滎陽平受詔立復馳至宮哭甚哀因奏事喪前呂太后哀之曰君勞出休矣平畏讒之就因固請得宿衛中太后乃以為郎中令曰傅教孝惠是後呂嬃讒乃不得行樊噲至則赦復爵邑孝惠帝六年相國曹參卒以安國侯王陵為右丞相陳平為左丞相王陵者故沛人始為縣豪高祖微時兄事陵陵少文任氣好直言及高祖起沛入至咸陽陵亦自聚黨數千人居南陽不肯從沛公及漢王之還攻項籍陵乃以兵屬漢項羽取陵母置軍中陵使至則東鄉坐陵母欲以招陵陵母既私送使者泣曰為老妾語陵謹事漢王漢王長者也無以老妾故持二心妾以死送使者遂伏劍而死項王怒烹陵母陵卒從漢王定天下以善雍齒雍齒高帝之仇而陵本無意從高帝以故晚封為安國侯安國侯既為右丞相二歲孝惠帝崩高后欲立諸呂為王問王陵王陵曰不可問陳平陳平曰可呂太后怒乃詳遷陵為帝太傅實不用陵陵怒謝疾免杜門竟不朝請七年而卒陵之免丞相呂太后乃徙平為右丞相以辟陽侯審食其為左丞相左丞相不治常給事於中食其亦沛人漢王之敗彭城西楚取太上皇呂后為質食其以舍人侍呂后其後從破項籍為侯幸於呂太后及為相居中百官皆因決事呂嬃常以前陳平為高帝謀執樊噲數讒曰陳平為相非治事日飲醇酒戲婦女陳平聞日益甚呂太后聞之私獨喜面質呂嬃於陳平曰鄙語曰兒婦人口不可用顧君與我何如耳無畏呂嬃之讒也呂太后立諸呂為王陳平偽聽之及呂太后崩平與太尉勃合謀卒誅諸呂立孝文皇帝陳平本謀也審食其免相孝文帝立以為太尉勃親以兵誅呂氏功多陳平欲讓勃尊位乃謝病孝文帝初立怪平病問之平曰高祖時勃功不如臣平及誅諸呂臣功亦不如勃願以右丞相讓勃於是孝文帝乃以絳侯勃為右丞相位次第一平徙為左丞相位次第二賜平金千斤益封三千戶居頃之孝文皇帝既益明習國家事朝而問右丞相勃曰天下一歲決獄幾何勃謝曰不知問天下一歲錢穀出入幾何勃又謝不知汗出沾背愧不能對於是上亦問左丞相平平曰有主者上曰主者謂誰平曰陛下即問決獄責廷尉問錢穀責治粟內史上曰苟各有主者而君所主者何事也平謝曰主臣陛下不知其駑下使待罪宰相宰相者上佐天子理陰陽順四時下育萬物之宜外鎮撫四夷諸侯內親附百姓使卿大夫各得任其職焉孝文帝乃稱善右丞相大慚出而讓陳平曰君獨不素教我對陳平笑曰君居甚位不知其任邪且陛下即問長安中盜賊數君欲彊對邪於是絳侯自知其能不如平遠矣居頃之絳侯謝病請免相陳平專為一丞相孝文帝二年丞相陳平卒謚為獻侯子共侯買代侯二年卒子簡侯恢代侯二十三年卒子何代侯二十三年何坐略人妻棄市國除始陳平曰我多陰謀是道家之所禁吾世即廢亦已矣終不能復起以吾多陰禍也然其後曾孫陳掌以衛氏親貴戚願得續封陳氏然終不得太史公曰陳丞相平少時本好黃帝老子之術方其割肉俎上之時其意固已遠矣傾側擾攘楚魏之閒卒歸高帝常出奇計救紛糾之難振國家之患及呂后時事多故矣然平竟自脫定宗廟以榮名終稱賢相豈不善始善終哉非知謀孰能當此者乎
