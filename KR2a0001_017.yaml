body:
  text: 漢興以來諸侯王年表太史公曰殷以前尚矣周封五等公侯伯子男然封伯禽康叔於魯衛地各四百里親親之義褒有德也太公於齊兼五侯地尊勤勞也武王成康所封數百而同姓五十五地上不過百里下三十里以輔衛王室管蔡康叔曹鄭或過或損厲幽之後王室缺侯伯強國興焉天子微弗能正非德不純形勢弱也漢興序二等高祖末年非劉氏而王者若無功上所不置而侯者天下共誅之高祖子弟同姓為王者九國唯獨長沙異姓而功臣侯者百有餘人自鴈門太原以東至遼陽為燕代國常山以南大行左轉度河濟阿甄以東薄海為齊趙國自陳以西南至九疑東帶江淮穀泗薄會稽為梁楚淮南長沙國皆外接於胡越而內地北距山以東盡諸侯地大者或五六郡連城數十置百官宮觀僭於天子漢獨有三河東郡潁川南陽自江陵以西至蜀北自雲中至隴西與內史凡十五郡而公主列侯頗食邑其中何者天下初定骨肉同姓少故廣強庶孽以鎮撫四海用承衛天子也漢定百年之間親屬益疏諸侯或驕奢忕邪臣計謀為淫亂大者叛逆小者不軌于法以危其命殞身亡國天子觀於上古然後加惠使諸侯得推恩分子弟國邑故齊分為七趙分為六梁分為五淮南分三及天子支庶子為王王子支庶為侯百有餘焉吳楚時前後諸侯或以適削地是以燕代無北邊郡吳淮南長沙無南邊郡齊趙梁楚支郡名山陂海咸納於漢諸侯稍微大國不過十餘城小侯不過數十里上足以奉貢職下足以供養祭祀以蕃輔京師而漢郡八九十形錯諸侯間犬牙相臨秉其厄塞地利強本幹弱枝葉之勢尊卑明而萬事各得其所矣臣遷謹記高祖以來至太初諸侯譜其下益損之時令時世得覽形勢雖強要之以仁義為本公元前高祖元年楚齊荊淮南燕趙梁淮陽代長沙二都彭城都臨災都吳都壽春都薊都邯鄲都淮陽都陳十一月初王韓信元年都馬邑三二四初王信元年故相國十月乙丑初王英布元年初王張耳元年薨三五齊王信徙為楚王元年反廢二徙楚二後九月壬子初王盧綰元年王敖元年敖耳子初王彭越元年四降胸奴國除為郡二月乙未初王文王吳芮元年薨六正月丙午初王交元年交高祖弟正月甲子初王悼惠王肥元年肥高祖子正月丙午初王劉賈元年三二二二成王臣元年七二二二四三三三二八三三三五四四廢四三九四來朝四來朝四六來朝五初王隱王如意元年如意高祖子五來朝四十五來朝五來朝五來朝七來朝反誅六來朝二六來朝反誅復置代都中都五來朝十一六六六為英布所殺國除為郡十二月庚午厲王長元年長高祖子七三二月丙午初王恢元年恢高祖子三月丙寅初王友元年友高祖子正月丙子初王元年六十二七七更為吳國十月辛丑初王濞元年濞高祖兄仲子故沛侯二二月甲午初王靈王建元年建高祖子四死二二二七孝惠元年八八二三二淮陽王徙於趙名友元年是為幽王三為郡三八二九來朝九來朝三四三二四四哀王回元年三十十四五四三五五二四十一來朝十一來朝五六來朝五四來朝六六三五十二十二六來朝七六來朝五七七四六十三十三薨七八七六八八五七十四來朝初置魯國哀王襄元年八來朝九來朝八來朝七來朝初置常山國九來朝初置呂國復置淮陽國九六高后元年十五四月初王張偃元年偃高后外孫故趙王敖子二九十九八四月辛卯哀王不疑元年薨十四月辛卯呂王台元年薨四月辛卯初王懷王強元年強惠帝子十七二十六二三十十一十九七月癸巳初王義元年哀王弟義孝惠子故襄城侯立為帝十一十一月癸亥王呂嘉元年嘉肅王子二十一恭王右元年三十七三四來朝十一十二十一十二十二二三十二二來朝四十八四五十二十三十二十一五月丙辰初王朝元年朝惠帝子故軹侯十三三四十三三五十九五六十三十四來朝十三十二二十四四五無嗣十四四六二十六七初置琅邪國十四十五十四十三三十五嘉廢七月丙辰呂産元年産肅王弟故洨侯初王武元年武孝惠帝子故壺關侯十五五七二十一七八王澤元年故營陵侯索隱營陵縣名屬北海十五十六十五絶四徙王趙自殺王呂産元年呂産徙王梁二月丁巳王太元年惠帝子二十六六八二十二八九二十六十七十月辛丑初王呂通元年肅王子故東平侯九月誅國除初王呂祿元年呂后兄子胡陵侯誅國除五非子誅國除為郡二有罪誅為郡二三武誅國除十七七孝文元年二十三九廢為侯十薨初置城陽郡初置濟北三徙燕十七十八十月庚戌琅邪王澤徙燕元年是為敬王十月庚戌趙王遂元年幽王子分為河間都樂成初置太原都晉陽復置梁國十八為文帝八二夷王郢元年文王則元年二月乙卯景王章元年章悼惠王子故朱虛侯二月乙卯王興居元年興居悼惠王子故東牟侯國除為郡十八十九二薨二二月乙卯初王文王辟強元年辟強趙幽王子二月乙卯初王參元年參文帝子二月乙卯初王懷王勝元年勝文帝子二月乙卯初王武元年武文帝子九三二二二為郡十九來朝二十來朝康王嘉元年三二二二復置淮陽國二徙淮陽靖王著元年四三三共王喜元年二十二十一二四三三更為代王三代王武徙淮陽三年三太原王參更號為代王三年實居太原是為孝王二五四薨四二二十一二十二三五四四四四三六王戊元年五三二十二二十三王無道遷蜀死雍為郡四六五五五五四七二六四二十三五七來朝六六來朝六來朝六來朝五八三七來朝五二十四六來朝八七來朝七七七六九四八六來朝二十五七九八八八來朝八七十五九七二十六八十九九九九八來朝十一六十八徙淮南為郡屬齊二十七九十一十十來朝薨無後十來朝徙梁為郡十來朝九十二七十一來朝二十八城陽王喜徙淮南元年十十二來朝十一來朝十一淮陽王武徙梁年是為孝王十一十十三八來朝十二二十九二十一十三十二十二十二十一十四九十三三十三十二來朝十四十三薨十三十三十二十五十初置衡山十四薨無後復置城陽國復置濟北國分為濟南國分為災川都劇分為膠西都宛分為膠東都即墨三十一四徙城陽十三來朝十五哀王福元年薨無後國除為郡初置廬江國十四來朝十四十三十六十一四月丙寅王勃元年淮南厲王子故安陽侯四月丙寅孝王將閭元年齊悼惠王子故陽虛侯淮南王喜徙城陽十三年四月丙寅初王志元年齊悼惠王子故安都侯四月丙寅初王辟光元年齊悼惠王子故扐侯四月丙寅初王賢元年齊悼惠王子故武城侯四月丙寅初王卬元年齊悼惠王子故平昌侯四月丙寅初王雄渠元年齊悼惠王子故白石侯三十二四月丙寅王安元年淮南厲王子故阜陵侯十四十六四月丙寅王賜元年淮南厲王子故陽周侯十五十五十四後元年十二二二十四二二二二二三十三二十五十七二十六十六十五二十三三三十五三三三三三三十四三十六十八三十七十七薨十六三十四四四來朝十六四來朝四來朝四四四三十五四十七十九四十八來朝恭王登元年十七四十五五五十七五來朝五五五五三十六五十八來朝二十來朝五十九二十八五十六來朝六六十八來朝六六來朝六六來朝六三十七六十九二十一六二十三十九六十七七七十九七七七七七三十八七來朝二十二十二七二十一來朝四二十來朝七十八八八二十八八八八八三十九八二十一二十三八二十二五二十一來朝薨無後國除孝景元年十九九九二十一九九九九九四十九二十二二十四復置河間國初置廣川都信都九二十三初置臨江都江陵初置汝南國復置淮陽國六復置長沙國二二十來朝分楚復置魯國十十二十二十來朝十十十十四十一十二十三二十五來朝三月甲寅初王獻王德元年景帝子三月甲寅王彭祖元年景帝子初置中山都盧奴十二十四來朝三月甲寅初王閼于元年景帝子三月甲寅初王非元年景帝子三月甲寅初王餘元年景帝子七三月甲寅定王發元年景帝子三二十一反誅六月乙亥淮陽王徙魯元年是為恭王十一十一二十三十一徙災川十一反誅為郡十一反誅濟北王志徙災川十一年是為懿王十一反誅六月乙亥于王端元年景帝子十一反誅四十二反誅十一二十四二十六反誅為郡二來朝二來朝六月乙亥靖王勝元年景帝子十一二十五來朝二二徙魯為郡八二四四月己巳立太子文王禮元年元王子故平陸侯二來朝十二徙濟北廬江王賜徙衡山元年懿王壽元年二十四衡山王勃徙濟北十二年是為貞王十二二四月己巳初王元年是為孝武帝初置江都六月乙亥汝南王非為江都王元年是為易王十二二十五三三二十二徙衡山國除為郡二十六三薨無後國除為郡三徙江都九三五二三二二來朝二十五十三薨十三三二二十三來朝二十六薨廣川王彭祖徙趙四年是為敬肅王四四徙趙國除為信都郡三二十七十四六三來朝薨四三三二十六武王胡元年十四四三三十四王定國元年五五四二十八復置臨江國十一五來朝七十一月乙丑太子廢安王道元年五四四二十七二十五五四四月丁巳為太子四十五二六六五來朝二十九來朝十一月乙丑初王閔王榮元年景帝太子廢十二六來朝中元年二來朝六來朝五五二十八三十六來朝六來朝復置膠東國五十六三七七復置廣川國六三十二十三七二三七六六二十九來朝四十七來朝七四月乙巳初王康王寄元年景帝子六十七四八來朝八來朝四月乙巳惠王越元年景帝子七初置清河都清陽三十一來朝三十四八三四八七來朝七三十五十八八二七十八五來朝九九二八三月丁巳哀王乘元年景帝子三十二四坐侵廟壖垣為宮自殺國除為南郡十五來朝九四五九八八三十一六十九九三八十九來朝六十十三九來朝二復置常山國三十三十六十來朝五六來朝十九九三十二七二十十四來朝九二十七十一十一四十三四月丁巳初王憲王舜元年孝景子三十四分為濟川國分為濟東國分為山陽國分為濟陰國十七十一來朝六七十一十十三十三薨八二十一十一五十二十一八十二十二五十一四二三十五來朝薨五月丙戌初王明元年梁孝王子五月丙戌初王彭離元年梁孝王子五月丙戌初王定元年梁孝王子五月丙戌初王不識元年梁孝王子十八十二後元年八十二十一十一頃王延元年九二十二來朝十二六十一二十二九來朝十三來朝十三來朝六十二五三恭王買元年孝王子二二二二薨無後國除十九十三二九十三十二十二來朝二十來朝二十三十三七十二二十三十來朝十四十四七十三六四二三三三二十十四三十十四十三十三三十一二十四十四八來朝十三二十四十一十五十五八十四七五三四四四二十一十五孝武建元元年十一十五十四十四四十二二十五十五九十四二十五十二十六十六九十五八六四五五五二十二十六二十二來朝十六來朝十五十五五十三二十六十六十十五二十六來朝十三十七十七十十六九來朝七五六六六二十三十七三十三十七十六十六六十四二十七十七十一十六二十七十四十八十八十一十七來朝十八六七明殺中傅廢遷房陵七七二十四來朝十八來朝四十四十八十七十七七十五二十八十八十二十七來朝二十八十五十九十九十二十八十一九來朝七薨為郡八八二十五十九五十五十九十八十八八十六二十九十九十三十八二十九十六二十二十繆王元年十九十二薨無後國除為郡十平王襄元年九九薨無後國