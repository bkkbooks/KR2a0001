body:
  text: 曆書第四昔自在古曆建正作於孟春於時冰泮發蟄百草奮興秭鳺先滜物乃歲具生於東次順四時卒于冬分時雞三號卒明撫十二月節卒于丑日月成故明也明者孟也幽者幼也幽明者雌雄也雌雄代興而順至正之統也日歸于西起明於東月歸於東起明于西正不率天又不由人則凡事易壞而難成矣王者易姓受命必慎始初改正朔易服色推本天元順承厥意太史公曰神農以前尚矣蓋黃帝考定星曆建立五行起消息正閏餘於是有天地神祇物類之官是謂五官各司其序不相亂也民是以能有信神是以能有明德民神異業敬而不瀆故神降之嘉生民以物享災禍不生所求不匱少皞氏之衰也九黎亂德民神雜擾不可放物禍菑薦至莫盡其氣顓頊受之乃命南正重司天以屬神命火正黎司地以屬民使復舊常無相侵瀆其後三苗服九黎之德故二官咸廢所職而閏餘乖次孟陬殄滅攝提無紀曆數失序堯復遂重黎之後不忘舊者使復典之而立羲和之官明時正度則陰陽調風雨節茂氣至民無夭疫年耆禪舜申戒文祖云天之曆數在爾躬舜亦以命禹由是觀之王者所重也夏正以正月殷正以十二月周正以十一月蓋三王之正若循環窮則反本天下有道則不失紀序無道則正朔不行於諸侯幽厲之後周室微陪臣執政史不記時君不告朔故疇人子弟分散或在諸夏或在夷狄是以其禨祥廢而不統周襄王二十六年閏三月而春秋非之先王之正時也履端於始舉正於中歸邪於終履端於始序則不愆舉正於中民則不惑歸邪於終事則不悖其後戰國並爭在於彊國禽敵救急解紛而已豈遑念斯哉是時獨有鄒衍明於五德之傳而散消息之分以顯諸侯而亦因秦滅六國兵戎極煩又升至尊之日淺未暇遑也而亦頗推五勝而自以為獲水德之瑞更名河曰德水而正以十月色上黑然曆度閏餘未能睹其真也漢興高祖曰北畤待我而起亦自以為獲水德之瑞雖明習曆及張蒼等咸以為然是時天下初定方綱紀大基高后女主皆未遑故襲秦正朔服色至孝文時魯人公孫臣以終始五德上書言漢得土德宜更元改正朔易服色當有瑞瑞黃龍見事下丞相張蒼張蒼亦學律曆以為非是罷之其後黃龍見成紀張蒼自黜所欲論著不成而新垣平以望氣見頗言正曆服色事貴幸後作亂故孝文帝廢不復問至今上即位招致方士唐都分其天部而巴落下閎運算轉曆然後日辰之度與夏正同乃改元更官號封泰山因詔御史曰乃者有司言星度之未定也廣延宣問以理星度未能詹也蓋聞昔者黃帝合而不死名察度驗定清濁起五部建氣物分數然蓋尚矣書缺樂弛朕甚閔焉朕唯未能循明也紬績日分率應水德之勝今日順夏至黃鐘為宮林鐘為徵太蔟為商南呂為羽姑洗為角自是以後氣復正羽聲復清名復正變以至子日當冬至則陰陽離合之道行焉十一月甲子朔旦冬至已詹其更以七年為太初元年年名焉逢攝提格月名畢聚日得甲子夜半朔旦冬至曆術甲子篇太初元年歲名焉逢攝提格月名畢聚日得甲子夜半朔旦冬至正北十二無大餘無小餘無大餘無小餘焉逢攝提格太初元年十二大餘五十四小餘三百四十八大餘五小餘八端蒙單閼二年閏十三大餘四十八小餘六百九十六大餘十小餘十六游兆執徐三年十二大餘十二小餘六百三大餘十五小餘二十四彊梧大荒落四年十二大餘七小餘十一大餘二十一無小餘徒維敦牂天漢元年閏十三大餘一小餘三百五十九大餘二十六小餘八祝犂協洽二年十二大餘二十五小餘二百六十六大餘三十一小餘十六商橫涒灘三年十二大餘十九小餘六百一十四大餘三十六小餘二十四昭陽作鄂四年閏十三大餘十四小餘二十二大餘四十二無小餘橫艾淹茂太始元年十二大餘三十七小餘八百六十九大餘四十七小餘八尚章大淵獻二年閏十三大餘三十二小餘二百七十七大餘五十二小餘一十六焉逢困敦三年十二大餘五十六小餘一百八十四大餘五十七小餘二十四端蒙赤奮若四年十二大餘五十小餘五百三十二大餘三無小餘游兆攝提格征和元年閏十三大餘四十四小餘八百八十大餘八小餘八彊梧單閼二年十二大餘八小餘七百八十七大餘十三小餘十六徒維執徐三年十二大餘三小餘一百九十五大餘十八小餘二十四祝犂大芒落四年閏十三大餘五十七小餘五百四十三大餘二十四無小餘商橫敦牂後元元年十二大餘二十一小餘四百五十大餘二十九小餘八昭陽汁洽二年閏十三大餘十五小餘七百九十八大餘三十四小餘十六棋艾涒灘始元元年正西十二大餘三十九小餘七百五大餘三十九小餘二十四尚章作噩二年十二大餘三十四小餘一百一十三大餘四十五無小餘焉逢淹茂三年閏十三大餘二十八小餘四百六十一大餘五十小餘八端蒙大淵獻四年十二大餘五十二小餘三百六十八大餘五十五小餘十六游兆困敦五年十二大餘四十六小餘七百一十六無大餘小餘二十四彊梧赤奮若六年閏十三大餘四十一小餘一百二十四大餘六無小餘徒維攝提格元鳳元年十二大餘五小餘三十一大餘十一小餘八祝犂單閼二年十二大餘五十九小餘三百七十九大餘十六小餘十六商橫執徐三年閏十三大餘五十三小餘七百二十七大餘二十一小餘二十四昭陽大荒落四年十二大餘十七小餘六百三十四大餘二十七無小餘橫艾敦牂五年閏十三大餘十二小餘四十二大餘三十二小餘八尚章汁洽六年十二大餘三十五小餘八百八十九大餘三十七小餘十六焉逢涒灘元平元年十二大餘三十小餘二百九十七大餘四十二小餘二十四端蒙作噩本始元年閏十三大餘二十四小餘六百四十五大餘四十八無小餘游兆閹茂二