body:
  text: 楚世家第十楚之先祖出自帝顓頊高陽高陽者黃帝之孫昌意之子也高陽生稱稱生卷章卷章生重黎重黎為帝嚳高辛居火正甚有功能光融天下帝嚳命曰祝融共工氏作亂帝嚳使重黎誅之而不盡帝乃以庚寅日誅重黎而以其弟吳回為重黎後復居火正為祝融吳回生陸終陸終生子六人坼剖而產焉其長一曰昆吾二曰參胡三曰彭祖四曰會人五曰曹姓六曰季連羋姓楚其後也昆吾氏夏之時嘗為侯伯桀之時湯滅之彭祖氏殷之時嘗為侯伯殷之末世滅彭祖氏季連生附沮附沮生穴熊其後中微或在中國或在蠻夷弗能紀其世周文王之時季連之苗裔曰鬻熊鬻熊子事文王蚤卒其子曰熊麗熊麗生熊狂熊狂生熊繹熊繹當周成王之時舉文武勤勞之後嗣而封熊繹於楚蠻封以子男之田姓羋氏居丹陽楚子熊繹與魯公伯禽衛康叔子牟晉侯燮齊太公子呂伋俱事成王熊繹生熊艾熊艾生熊䵣熊䵣生熊勝熊勝以弟熊楊為後熊楊生熊渠熊渠生子三人當周夷王之時王室微諸侯或不朝相伐熊渠甚得江漢閒民和乃興兵伐庸楊粵至于鄂熊渠曰我蠻夷也不與中國之號謚乃立其長子康為句亶王中子紅為鄂王少子執疵為越章王皆在江上楚蠻之地及周厲王之時暴虐熊渠畏其伐楚亦去其王後為熊毋康毋康蚤死熊渠卒子熊摯紅立摯紅卒其弟弒而代立曰熊延熊延生熊勇熊勇六年而周人作亂攻厲王厲王出奔彘熊勇十年卒弟熊嚴為後熊嚴十年卒有子四人長子伯霜中子仲雪次子叔堪少子季徇熊嚴卒長子伯霜代立是為熊霜熊霜元年周宣王初立熊霜六年卒三弟爭立仲雪死叔堪亡避難於濮而少弟季徇立是為熊徇熊徇十六年鄭桓公初封於鄭二十二年熊徇卒子熊咢立熊咢九年卒子熊儀立是為若敖若敖二十年周幽王為犬戎所弒周東徙而秦襄公始列為諸侯二十七年若敖卒子熊坎立是為霄敖霄敖六年卒子熊眴立是為蚡冒蚡冒十三年晉始亂以曲沃之故蚡冒十七年卒蚡冒弟熊通弒蚡冒子而代立是為楚武王武王十七年晉之曲沃莊伯弒主國晉孝侯十九年鄭伯弟段作亂二十一年鄭侵天子之田二十三年衛弒其君桓公二十九年魯弒其君隱公三十一年宋太宰華督弒其君殤公三十五年楚伐隨隨曰我無罪楚曰我蠻夷也今諸侯皆為叛相侵或相殺我有敝甲欲以觀中國之政請王室尊吾號隨人為之周請尊楚王室不聽還報楚三十七年楚熊通怒曰吾先鬻熊文王之師也蚤終成王舉我先公乃以子男田令居楚蠻夷皆率服而王不加位我自尊耳乃自立為武王與隨人盟而去於是始開濮地而有之五十一年周召隨侯數以立楚為王楚怒以隨背己伐隨武王卒師中而兵罷子文王熊貲立始都郢文王二年伐申過鄧鄧人曰楚王易取鄧侯不許也六年伐蔡虜蔡哀侯以歸已而釋之楚彊陵江漢閒小國小國皆畏之十一年齊桓公始霸楚亦始大十二年伐鄧滅之十三年卒子熊囏立是為莊敖莊敖五年欲殺其弟熊惲惲奔隨與隨襲弒莊敖代立是為成王成王惲元年初即位布德施惠結舊好於諸侯使人獻天子天子賜胙曰鎮爾南方夷越之亂無侵中國於是楚地千里十六年齊桓公以兵侵楚至陘山楚成王使將軍屈完以兵禦之與桓公盟桓公數以周之賦不入王室楚許之乃去十八年成王以兵北伐許許君肉袒謝乃釋之二十二年伐黃二十六年滅英三十三年宋襄公欲為盟會召楚楚王怒曰召我我將好往襲辱之遂行至盂遂執辱宋公已而歸之三十四年鄭文公南朝楚楚成王北伐宋敗之泓射傷宋襄公襄公遂病創死三十五年晉公子重耳過楚成王以諸侯客禮饗而厚送之於秦三十九年魯僖公來請兵以伐齊楚使申侯將兵伐齊取穀置齊桓公子雍焉齊桓公七子皆奔楚楚盡以為上大夫滅夔夔不祀祝融鬻熊故也夏伐宋宋告急於晉晉救宋成王罷歸將軍子玉請戰成王曰重耳亡居外久卒得反國天之所開不可當子玉固請乃與之少師而去晉果敗子玉於城濮成王怒誅子玉四十六年初成王將以商臣為太子語令尹子上子上曰君之齒未也而又多內寵絀乃亂也楚國之舉常在少者且商臣蠭目而豺聲忍人也不可立也王不聽立之後又欲立子職而絀太子商臣商臣聞而未審也告其傅潘崇曰何以得其實崇曰饗王之寵姬江羋而勿敬也商臣從之江羋怒曰宜乎王之欲殺若而立職也商臣告潘崇曰信矣崇曰能事之乎曰不能能亡去乎曰不能能行大事乎曰能冬十月商臣以宮衛兵圍成王成王請食熊蹯而死不聽丁未成王自絞殺商臣代立是為穆王穆王立以其太子宮予潘崇使為太師掌國事穆王三年滅江四年滅六蓼六蓼皋陶之後八年伐陳十二年卒子莊王侶立莊王即位三年不出號令日夜為樂令國中曰有敢諫者死無赦伍舉入諫莊王左抱鄭姬右抱越女坐鍾鼓之閒伍舉曰願有進隱曰有鳥在於阜三年不蜚不鳴是何鳥也莊王曰三年不蜚蜚將沖天三年不鳴鳴將驚人舉退矣吾知之矣居數月淫益甚大夫蘇從乃入諫王曰若不聞令乎對曰殺身以明君臣之願也於是乃罷淫樂聽政所誅者數百人所進者數百人任伍舉蘇從以政國人大說是歲滅庸六年伐宋獲五百乘八年伐陸渾戎遂至洛觀兵於周郊周定王使王孫滿勞楚王楚王問鼎小大輕重對曰在德不在鼎莊王曰子無阻九鼎楚國折鉤之喙足以為九鼎王孫滿曰嗚呼君王其忘之乎昔虞夏之盛遠方皆至貢金九牧鑄鼎象物百物而為之備使民知神姦桀有亂德鼎遷於殷載祀六百殷紂暴虐鼎遷於周德之休明雖小必重其姦回昏亂雖大必輕昔成王定鼎于郟鄏卜世三十卜年七百天所命也周德雖衰天命未改鼎之輕重未可問也楚王乃歸九年相若敖氏人或讒之王恐誅反攻王王擊滅若敖氏之族十三年滅舒十六年伐陳殺夏徵舒徵舒弒其君故誅之也已破陳即縣之群臣皆賀申叔時使齊來不賀王問對曰鄙語曰牽牛徑人田田主取其牛徑者則不直矣取之牛不亦甚乎且王以陳之亂而率諸侯伐之以義伐之而貪其縣亦何以復令於天下莊王乃復國陳後十七年春楚莊王圍鄭三月克之入自皇門鄭伯肉袒牽羊以逆曰孤不天不能事君君用懷怒以及敝邑孤之罪也敢不惟命是聽賓之南海若以臣妾賜諸侯亦惟命是聽若君不忘厲宣桓武不絕其社稷使改事君孤之願也非所敢望也敢布腹心楚群臣曰王勿許莊王曰其君能下人必能信用其民庸可絕乎莊王自手旗左右麾軍引兵去三十里而舍遂許之平潘尪入盟子良出質夏六月晉救鄭與楚戰大敗晉師河上遂至衡雍而歸二十年圍宋以殺楚使也圍宋五月城中食盡易子而食析骨而炊宋華元出告以情莊王曰君子哉遂罷兵去二十三年莊王卒子共王審立共王十六年晉伐鄭鄭告急共王救鄭與晉兵戰鄢陵晉敗楚射中共王目共王召將軍子反子反嗜酒從者豎陽穀進酒醉王怒射殺子反遂罷兵歸三十一年共王卒子康王招立康王立十五年卒子員立是為郟敖康王寵弟公子圍子比子皙棄疾郟敖三年以其季父康王弟公子圍為令尹主兵事四年圍使鄭道聞王疾而還十二月己酉圍入問王疾絞而弒之遂殺其子莫及平夏使使赴於鄭伍舉問曰誰為後對曰寡大夫圍伍舉更曰共王之子圍為長子比奔晉而圍立是為靈王靈王三年六月楚使使告晉欲會諸侯諸侯皆會楚于申伍舉曰昔夏啟有鈞臺之饗商湯有景亳之命周武王有盟津之誓成王有岐陽之蒐康王有豐宮之朝穆王有塗山之會齊桓有召陵之師晉文有踐土之盟君其何用靈王曰用桓公時鄭子產在焉於是晉宋魯衛不往靈王已盟有驕色伍舉曰桀為有仍之會有緡叛之紂為黎山之會東夷叛之幽王為太室之盟戎翟叛之君其慎終七月楚以諸侯兵伐吳圍朱方八月克之囚慶封滅其族以封徇曰無效齊慶封弒其君而弱其孤以盟諸大夫封反曰莫如楚共王庶子圍弒其君兄之子員而代之立於是靈王使疾殺之七年就章華臺下令內亡人實之八年使公子棄疾將兵滅陳十年召蔡侯醉而殺之仗棄疾定蔡因為陳蔡公十一年伐徐以恐吳靈王次於乾谿以待之王曰齊晉魯衛其封皆受寶器我獨不今吾使使周求鼎以為分其予我乎析父對曰其予君王哉昔我先王熊繹辟在荊山蓽露藍蔞以處草莽跋涉山林以事天子唯是桃弧棘矢以共王事齊王舅也晉及魯衛王母弟也楚是以無分而彼皆有周今與四國服事君王將惟命是從豈敢愛鼎靈王曰昔我皇祖伯父昆吾舊許是宅今鄭人貪其田不我予今我求之其予我乎對曰周不愛鼎鄭安敢愛田靈王曰昔諸侯遠我而畏晉今吾大城陳蔡不羹賦皆千乘諸侯畏我乎對曰畏哉靈王喜曰析父善言古事焉十二年春楚靈王樂乾谿不能去也國人苦役初靈王會兵於申僇越大夫常壽過殺蔡大夫觀起起子從亡在吳乃勸吳王伐楚為閒越大夫常壽過而作亂為吳閒使矯公子棄疾命召公子比於晉至蔡與吳越兵欲襲蔡令公子比見棄疾與盟於鄧遂入殺靈王太子祿立子比為王公子子皙為令尹棄疾為司馬先除王宮觀從從師于乾谿令楚眾曰國有王矣先歸復爵邑田室後者遷之楚眾皆潰去靈王而歸靈王聞太子祿之死也自投車下而曰人之愛子亦如是乎侍者曰甚是王曰余殺人之子多矣能無及此乎右尹曰請待於郊以聽國人王曰眾怒不可犯曰且入大縣而乞師於諸侯王曰皆叛矣又曰且奔諸侯以聽大國之慮王曰大福不再祗取辱耳於是王乘舟將欲入鄢右尹度王不用其計懼俱死亦去王亡靈王於是獨傍偟山中野人莫敢入王王行遇其故鋗人謂曰為我求食我已不食三日矣鋗人曰新王下法有敢饟王從王者罪及三族且又無所得食王因枕其股而臥鋗人又以土自代逃去王覺而弗見遂飢弗能起芋尹申無宇之子申亥曰吾父再犯王命王弗誅恩孰大焉乃求王遇王飢於釐澤奉之以歸夏五月癸丑王死申亥家申亥以二女從死并葬之是時楚國雖已立比為王畏靈王復來又不聞靈王死故觀從謂初比曰不殺棄疾雖得國猶受禍王曰余不忍從曰人將忍王王不聽乃去棄疾歸國人每夜驚曰靈王入矣乙卯夜棄疾使船人從江上走呼曰靈王至矣國人愈驚又使曼成然告初王比及令尹子皙曰王至矣國人將殺君司馬將至矣君蚤自圖無取辱焉眾怒如水火不可救也初王及子皙遂自殺丙辰棄疾即位為王改名熊居是為平王平王以詐弒兩王而自立恐國人及諸侯叛之乃施惠百姓復陳蔡之地而立其後如故歸鄭之侵地存恤國中修政教吳以楚亂故獲五率以歸平王謂觀從恣爾所欲欲為卜尹王許之初共王有寵子五人無適立乃望祭群神請神決之使主社稷而陰與巴姬埋璧於室內召五公子齋而入康王跨之靈王肘加之子比子皙皆遠之平王幼抱其上而拜壓紐故康王以長立至其子失之圍為靈王及身而弒子比為王十餘日子皙不得立又俱誅四子皆絕無後唯獨棄疾後立為平王竟續楚祀如其神符初子比自晉歸韓宣子問叔向曰子比其濟乎對曰不就宣子曰同惡相求如市賈焉何為不就對曰無與同好誰與同惡取國有五難有寵無人一也有人無主二也有主無謀三也有謀而無民四也有民而無德五也子比在晉十三年矣晉楚之從不聞通者可謂無人矣族盡親叛可謂無主矣無釁而動可謂無謀矣為羈終世可謂無民矣亡無愛徵可謂無德矣王虐而不忌子比涉五難以弒君誰能濟之有楚國者其棄疾乎君陳蔡方城外屬焉苛慝不作盜賊伏隱私欲不違民無怨心先神命之國民信之羋姓有亂必季實立楚之常也子比之官則右尹也數其貴寵則庶子也以神所命則又遠之民無懷焉將何以立宣子曰齊桓晉文不亦是乎對曰齊桓衛姬之子也有寵於釐公有鮑叔牙賓須無隰朋以為輔有莒衛以為外主有高國以為內主從善如流施惠不倦有國不亦宜乎昔我文公狐季姬之子也有寵於獻公好學不倦生十七年有士五人有先大夫子餘子犯以為腹心有魏犨賈佗以為股肱有齊宋秦楚以為外主有欒郤狐先以為內主亡十九年守志彌篤惠懷棄民民從而與之故文公有國不亦宜乎子比無施於民無援於外去晉晉不送歸楚楚不迎何以有國子比果不終焉卒立者棄疾如叔向言也平王二年使費無忌如秦為太子建取婦婦好來未至無忌先歸說平王曰秦女好可自娶為太子更求平王聽之卒自娶秦女生熊珍更為太子娶是時伍奢為太子太傅無忌為少傅無忌無寵於太子常讒惡太子建建時年十五矣其母蔡女也無寵於王王稍益疏外建也六年使太子建居城父守邊無忌又日夜讒太子建於王曰自無忌入秦女太子怨亦不能無望於王王少自備焉且太子居城父擅兵外交諸侯且欲入矣平王召其傅伍奢責之伍奢知無忌讒乃曰王柰何以小臣疏骨肉無忌曰今不制後悔也於是王遂囚伍奢乃令司馬奮揚召太子建欲誅之太子聞之亡奔宋無忌曰伍奢有二子不殺者為楚國患盍以免其父召之必至於是王使使謂奢能致二子則生不能將死奢曰尚至胥不至王曰何也奢曰尚之為人廉死節慈孝而仁聞召而免父必至不顧其死胥之為人智而好謀勇而矜功知來必死必不來然為楚國憂者必此子於是王使人召之曰來吾免爾父伍尚謂伍胥曰聞父免而莫奔不孝也父戮莫報無謀也度能任事知也子其行矣我其歸死伍尚遂歸伍胥彎弓屬矢出見使者曰父有罪何以召其子為將射使者還走遂出奔吳伍奢聞之曰胥亡楚國危哉楚人遂殺伍奢及尚十年楚太子建母在居巢開吳吳使公子光伐楚遂敗陳蔡取太子建母而去楚恐城郢初吳之邊邑卑梁與楚邊邑鍾離小童爭桑兩家交怒相攻滅卑梁人卑梁大夫怒發邑兵攻鍾離楚王聞之怒發國兵滅卑梁吳王聞之大怒亦發兵使公子光因建母家攻楚遂滅鍾離居巢楚乃恐而城郢十三年平王卒將軍子常曰太子珍少且其母乃前太子建所當娶也欲立令尹子西子西平王之庶弟也有義子西曰國有常法更立則亂言之則致誅乃立太子珍是為昭王昭王元年楚眾不說費無忌以其讒亡太子建殺伍奢子父與郤宛宛之宗姓伯氏子嚭及子胥皆奔吳吳兵數侵楚楚人怨無忌甚楚令尹子常誅無忌以說眾眾乃喜四年吳三公子奔楚楚封之以扞吳五年吳伐取楚之六潛七年楚使子常伐吳吳大敗楚於豫章十年冬吳王闔閭伍子胥伯嚭與唐蔡俱伐楚楚大敗吳兵遂入郢辱平王之墓以伍子胥故也吳兵之來楚使子常以兵迎之夾漢水陣吳伐敗子常子常亡奔鄭楚兵走吳乘勝逐之五戰及郢己卯昭王出奔庚辰吳人入郢昭王亡也至雲夢雲夢不知其王也射傷王王走鄖鄖公之弟懷曰平王殺吾父今我殺其子不亦可乎鄖公止之然恐其弒昭王乃與王出奔隨吳王聞昭王往即進擊隨謂隨人曰周之子孫封於江漢之閒者楚盡滅之欲殺昭王王從臣子綦乃深匿王自以為王謂隨人曰以我予吳隨人卜予吳不吉乃謝吳王曰昭王亡不在隨吳請入自索之隨不聽吳亦罷去昭王之出郢也使申鮑胥請救於秦秦以車五百乘救楚楚亦收餘散兵與秦擊吳十一年六月敗吳於稷會吳王弟夫概見吳王兵傷敗乃亡歸自立為王闔閭聞之引兵去楚歸擊夫概夫概敗奔楚楚封之堂谿號為堂谿氏楚昭王滅唐九月歸入郢十二年吳復伐楚取番楚恐去郢北徙都鄀十六年孔子相魯二十年楚滅頓滅胡二十一年吳王闔閭伐越越王句踐射傷吳王遂死吳由此怨越而不西伐楚二十七年春吳伐陳楚昭王救之軍城父十月昭王病於軍中有赤雲如鳥夾日而蜚昭王問周太史太史曰是害於楚王然可移於將相將相聞是言乃請自以身禱於神昭王曰將相孤之股肱也今移禍庸去是身乎弗聽卜而河為祟大夫請禱河昭王曰自吾先王受封望不過江漢而河非所獲罪也止不許孔子在陳聞是言曰楚昭王通大道矣其不失國宜哉昭王病甚乃召諸公子大夫曰孤不佞再辱楚國之師今乃得以天壽終孤之幸也讓其弟公子申為王不可又讓次弟公子結亦不可乃又讓次弟公子閭五讓乃後許為王將戰庚寅昭王卒於軍中子閭曰王病甚舍其子讓群臣臣所以許王以廣王意也今君王卒臣豈敢忘君王之意乎乃與子西子綦謀伏師閉塗迎越女之子章立之是為惠王然後罷兵歸葬昭王惠王二年子西召故平王太子建之子勝於吳以為巢大夫號曰白公白公好兵而下士欲報仇六年白公請兵令尹子西伐鄭初白公父建亡在鄭鄭殺之白公亡走吳子西復召之故以此怨鄭欲伐之子西許而未為發兵八年晉伐鄭鄭告急楚楚使子西救鄭受賂而去白公勝怒乃遂與勇力死士石乞等襲殺令尹子西子綦於朝因劫惠王置之高府欲弒之惠王從者屈固負王亡走昭王夫人宮白公自文為王月餘會葉公來救楚楚惠王之徒與共攻白公殺之惠王乃復位是歲也滅陳而縣之十三年吳王夫差彊陵齊晉來伐楚十六年越滅吳四十二年楚滅蔡四十四年楚滅𣏌與秦平是時越已滅吳而不能正江淮北楚東侵廣地至泗上五十七年惠王卒子簡王中立簡王元年北伐滅莒八年魏文侯韓武子趙桓子始列為諸侯二十四年簡王卒子聲王當立聲王六年盜殺聲王子悼王熊疑立悼王二年三晉來伐楚至乘丘而還四年楚伐周鄭殺子陽九年伐韓取負黍十一年三晉伐楚敗我大梁榆關楚厚賂秦與之平二十一年悼王卒子肅王臧立肅王四年蜀伐楚取茲方於是楚為扞關以距之十年魏取我魯陽十一年肅王卒無子立其弟熊良夫是為宣王宣王六年周天子賀秦獻公秦始復彊而三晉益大魏惠王齊威王尤彊三十年秦封衛鞅於商南侵楚是年宣王卒子威王熊商立威王六年周顯王致文武胙於秦惠王七年齊孟嘗君父田嬰欺楚楚威王伐齊敗之於徐州而令齊必逐田嬰田嬰恐張丑偽謂楚王曰王所以戰勝於徐州者田盼子不用也盼子者有功於國而百姓為之用嬰子弗善而用申紀申紀者大臣不附百姓不為用故王勝之也今王逐嬰子嬰子逐盼子必用矣復搏其士卒以與王遇必不便於王矣楚王因弗逐也十一年威王卒子懷王熊槐立魏聞楚喪代楚取我陘山懷王元年張儀始相秦惠王四年秦惠王初稱王六年楚使柱國昭陽將兵而攻魏破之於襄陵得八邑又移兵而攻齊齊王患之陳軫適為秦使齊齊王曰為之柰何陳軫曰王勿憂請令罷之即往見昭陽軍中曰願聞楚國之法破軍殺將者何以貴之昭陽曰其官為上柱國封上爵執珪陳軫曰其有貴於此者乎昭陽曰令尹陳軫曰今君已為令尹矣此國冠之上臣請得譬之人有遺其舍人一卮酒者舍人相謂曰數人飲此不足以徧請遂畫地為蛇蛇先成者獨飲之一人曰吾蛇先成舉酒而起曰吾能為之足及其為之足而後成人奪之酒而飲之曰蛇固無足今為之足是非蛇也今君相楚而攻魏破軍殺將功莫大焉冠之上不可以加矣今又移兵而攻齊攻齊勝之官爵不加於此攻之不勝身死爵奪有毀於楚此為蛇為足之說也不若引兵而去以德齊此持滿之術也昭陽曰善引兵而去燕韓君初稱王秦使張儀與楚齊魏相會盟齧桑十一年蘇秦約從山東六國共攻秦楚懷王為從長至函谷關秦出兵擊六國六國兵皆引而歸齊獨後十二年齊湣王伐敗趙魏軍秦亦伐敗韓與齊爭長十六年秦欲伐齊而楚與齊從親秦惠王患之乃宣言張儀免相使張儀南見楚王謂楚王曰敝邑之王所甚說者無先大王雖儀之所甚願為門闌之廝者亦無先大王敝邑之王所甚憎者無先齊王雖儀之所甚憎者亦無先齊王而大王和之是以敝邑之王不得事王而令儀亦不得為門闌之廝也王為儀閉關而絕齊令使使者從儀西取故秦所分楚商於之地方六百里如是則齊弱矣是北弱齊西德於秦私商於以為富此一計而三利俱至也懷王大悅乃置相璽於張儀日與置酒宣言吾復得吾商於之地群臣皆賀而陳軫獨弔懷王曰何故陳軫對曰秦之所為重王者以王之有齊也今地未可得而齊交先絕是楚孤也夫秦又何重孤國哉必輕楚矣且先出地而後絕齊則秦計不為先絕齊而後責地則必見欺於張儀見欺於張儀則王必怨之怨之是西起秦患北絕齊交西起秦患北絕齊交則兩國之兵必至臣故弔楚王弗聽因使一將軍西受封地張儀至秦詳醉墜車稱病不出三月地不可得楚王曰儀以吾絕齊為尚薄邪乃使勇士宋遺北辱齊王齊王大怒折楚符而合於秦秦齊交合張儀乃起朝謂楚將軍曰子何不受地從某至某廣袤六里楚將軍曰臣之所以見命者六百里不聞六里即以歸報懷王懷王大怒興師將伐秦陳軫又曰伐秦非計也不如因賂之一名都與之伐齊是我亡於秦取償於齊也吾國尚可全今王已絕於齊而責欺於秦是吾合秦齊之交而來天下之兵也國必大傷矣楚王不聽遂絕和於秦發兵西攻秦秦亦發兵擊之十七年春與秦戰丹陽秦大敗我軍斬甲士八萬虜我大將軍屈匄裨將軍逢侯丑等七十餘人遂取漢中之郡楚懷王大怒乃悉國兵復襲秦戰於藍田大敗楚軍韓魏聞楚之困乃南襲楚至於鄧楚聞乃引兵歸十八年秦使使約復與楚親分漢中之半以和楚楚王曰願得張儀不願得地張儀聞之請之楚秦王曰楚且甘心於子柰何張儀曰臣善其左右靳尚靳尚又能得事於楚王幸姬鄭袖袖所言無不從者且儀以前使負楚以商於之約今秦楚大戰有惡臣非面自謝楚不解且大王在楚不宜敢取儀誠殺儀以便國臣之願也儀遂使楚至懷王不見因而囚張儀欲殺之儀私於靳尚靳尚為請懷王曰拘張儀秦王必怒天下見楚無秦必輕王矣又謂夫人鄭袖曰秦王甚愛張儀而王欲殺之今將以上庸之地六縣賂楚以美人聘楚王以宮中善歌者為之媵楚王重地秦女必貴而夫人必斥矣夫人不若言而出之鄭袖卒言張儀於王而出之儀出懷王因善遇儀儀因說楚王以叛從約而與秦合親約婚姻張儀已去屈原使從齊來諫王曰何不誅張儀懷王悔使人追儀弗及是歲秦惠王卒二十年齊湣王欲為從長惡楚之與秦合乃使使遺楚王書曰寡人患楚之不察於尊名也今秦惠王死武王立張儀走魏樗里疾公孫衍用而楚事秦夫樗里疾善乎韓而公孫衍善乎魏楚必事秦韓魏恐必因二人求合於秦則燕趙亦宜事秦四國爭事秦則楚為郡縣矣王何不與寡人并力收韓魏燕趙與為從而尊周室以案兵息民令於天下莫敢不樂聽則王名成矣王率諸侯並伐破秦必矣王取武關蜀漢之地私吳越之富而擅江海之利韓魏割上黨西薄函谷則楚之彊百萬也且王欺於張儀亡地漢中兵銼藍田天下莫不代王懷怒今乃欲先事秦願大王孰計之楚王業已欲和於秦見齊王書猶豫不決下其議群臣群臣或言和秦或曰聽齊昭雎曰王雖東取地於越不足以刷恥必且取地於秦而後足以刷恥於諸侯王不如深善齊韓以重樗里疾如是則王得韓齊之重以求地矣秦破韓宜陽而韓猶復事秦者以先王墓在平陽而秦之武遂去之七十里以故尤畏秦不然秦攻三川趙攻上黨楚攻河外韓必亡楚之救韓不能使韓不亡然存韓者楚也韓已得武遂於秦以河山為塞所報德莫如楚厚臣以為其事王必疾齊之所信於韓者以韓公子眜為齊相也韓已得武遂於秦王甚善之使之以齊韓重樗里疾疾得齊韓之重其主弗敢棄疾也今又益之以楚之重樗里子必言秦復與楚之侵地矣於是懷王許之竟不合秦而合齊以善韓二十四年倍齊而合秦秦昭王初立乃厚賂於楚楚往迎婦二十五年懷王入與秦昭王盟約於黃棘秦復與楚上庸二十六年齊韓魏為楚負其從親而合於秦三國共伐楚楚使太子入質於秦而請救秦乃遣客卿通將兵救楚三國引兵去二十七年秦大夫有私與楚太子鬭楚太子殺之而亡歸二十八年秦乃與齊韓魏共攻楚殺楚將唐眜取我重丘而去二十九年秦復攻楚大破楚楚軍死者二萬殺我將軍景缺懷王恐乃使太子為質於齊以求平三十年秦復伐楚取八城秦昭王遺楚王書曰始寡人與王約為弟兄盟于黃棘太子為質至驩也太子陵殺寡人之重臣不謝而亡去寡人誠不勝怒使兵侵君王之邊今聞君王乃令太子質於齊以求平寡人與楚接境壤界故為婚姻所從相親久矣而今秦楚不驩則無以令諸侯寡人願與君王會武關面相約結盟而去寡人之願也敢以聞下執事楚懷王見秦王書患之欲往恐見欺無往恐秦怒昭雎曰王毋行而發兵自守耳秦虎狼不可信有并諸侯之心懷王子子蘭勸王行曰柰何絕秦之驩心於是往會秦昭王昭王詐令一將軍伏兵武關號為秦王楚王至則閉武關遂與西至咸陽朝章臺如蕃臣不與亢禮楚懷王大怒悔不用昭子言秦因留楚王要以割巫黔中之郡楚王欲盟秦欲先得地楚王怒曰秦詐我而又彊要我以地不復許秦秦因留之楚大臣患之乃相與謀曰吾王在秦不得還要以割地而太子為質於齊齊秦合謀則楚無國矣乃欲立懷王子在國者昭雎曰王與太子俱困於諸侯而今又倍王命而立其庶子不宜乃詐赴於齊齊湣王謂其相曰不若留太子以求楚之淮北相曰不可郢中立王是吾抱空質而行不義於天下也或曰不然郢中立王因與其新王市曰予我下東國吾為王殺太子不然將與三國共立之然則東國必可得矣齊王卒用其相計而歸楚太子太子橫至立為王是為頃襄王乃告于秦曰賴社稷神靈國有王矣頃襄王橫元年秦要懷王不可得地楚立王以應秦秦昭王怒發兵出武關攻楚大敗楚軍斬首五萬取析十五城而去二年楚懷王亡逃歸秦覺之遮楚道懷王恐乃從閒道走趙以求歸趙主父在代其子惠王初立行王事恐不敢入楚王楚王欲走魏秦追至遂與秦使復之秦懷王遂發病頃襄王三年懷王卒于秦秦歸其喪于楚楚人皆憐之如悲親戚諸侯由是不直秦秦楚絕六年秦使白起伐韓於伊闕大勝斬首二十四萬秦乃遺楚王書曰楚倍秦秦且率諸侯伐楚爭一旦之命願王之飭士卒得一樂戰楚頃襄王患之乃謀復與秦平七年楚迎婦於秦秦楚復平十一年齊秦各自稱為帝月餘復歸帝為王十四年楚頃襄王與秦昭王好會于宛結和親十五年楚王與秦三晉燕共伐齊取淮北十六年與秦昭王好會於鄢其秋復與秦王會穰十八年楚人有好以弱弓微繳加歸鴈之上者頃襄王聞召而問之對曰小臣之好射鶀鴈羅鸗小矢之發也何足為大王道也且稱楚之大因大王之賢所弋非直此也昔者三王以弋道德五霸以弋戰國故秦魏燕趙者鶀鴈也齊魯韓衛者青首也騶費郯邳者羅鸗也外其餘則不足射者見鳥六雙以王何取王何不以聖人為弓以勇士為繳時張而射之此六雙者可得而囊載也其樂非特朝昔之樂也其獲非特鳧鴈之實也王朝張弓而射魏之大梁之南加其右臂而徑屬之於韓則中國之路絕而上蔡之郡壞矣還射圉之東解魏左肘而外擊定陶則魏之東外棄而大宋方與二郡者舉矣且魏斷二臂顛越矣膺擊郯國大梁可得而有也王綪繳蘭臺飲馬西河定魏大梁此一發之樂也若王之於弋誠好而不厭則出寶弓碆新繳射噣鳥於東海還蓋長城以為防朝射東莒夕發浿丘夜加即墨顧據午道則長城之東收而太山之北舉矣西結境於趙而北達於燕三國布翅則從不待約而可成也北遊目於燕之遼東而南登望於越之會稽此再發之樂也若夫泗上十二諸侯左縈而右拂之可一旦而盡也今秦破韓以為長憂得列城而不敢守也伐魏而無功擊趙而顧病則秦魏之勇力屈矣楚之故地漢中析酈可得而復有也王出寶弓碆新繳涉鄳塞而待秦之倦也山東河內可得而一也勞民休眾南面稱王矣故曰秦為大鳥負海內而處東面而立左臂據趙之西南右臂傅楚鄢郢膺擊韓魏垂頭中國處既形便勢有地利奮翼鼓翅方三千里則秦未可得獨招而夜射也欲以激怒襄王故對以此言襄王因召與語遂言曰夫先王為秦所欺而客死於外怨莫大焉今以匹夫有怨尚有報萬乘白公子胥是也今楚之地方五千里帶甲百萬猶足以踊躍中野也而坐受困臣竊為大王弗取也於是頃襄王遣使於諸侯復為從欲以伐秦秦聞之發兵來伐楚楚欲與齊韓連和伐秦因欲圖周周王赧使武公謂楚相昭子曰三國以兵割周郊地以便輸而南器以尊楚臣以為不然夫弒共主臣世君大國不親以眾脅寡小國不附大國不親小國不附不可以致名實名實不得不足以傷民夫有圖周之聲非所以為號也昭子曰乃圖周則無之雖然周何故不可圖也對曰軍不五不攻城不十不圍夫一周為二十晉公之所知也韓嘗以二十萬之眾辱於晉之城下銳士死中士傷而晉不拔公之無百韓以圖周此天下之所知也夫怨結於兩周以塞騶魯之心交絕於齊聲失天下其為事危矣夫危兩周以厚三川方城之外必為韓弱矣何以知其然也西周之地絕長補短不過百里名為天下共主裂其地不足以肥國得其眾不足以勁兵雖無攻之名為弒君然而好事之君喜攻之臣發號用兵未嘗不以周為終始是何也見祭器在焉欲器之至而忘弒君之亂今韓以器之在楚臣恐天下以器讎楚也臣請譬之夫虎肉臊其兵利身人猶攻之也若使澤中之麋蒙虎之皮人之攻之必萬於虎矣裂楚之地足以肥國詘楚之名足以尊主今子將以欲誅殘天下之共主居三代之傳器吞三翮六翼以高世主非貪而何周書曰欲起無先故器南則兵至矣於是楚計輟不行十九年秦伐楚楚軍敗割上庸漢北地予秦二十年秦將白起拔我西陵二十一年秦將白起遂拔我郢燒先王墓夷陵楚襄王兵散遂不復戰東北保於陳城二十二年秦復拔我巫黔中郡二十三年襄王乃收東地兵得十餘萬復西取秦所拔我江旁十五邑以為郡距秦二十七年使三萬人助三晉伐燕復與秦平而入太子為質於秦楚使左徒侍太子於秦三十六年頃襄王病太子亡歸秋頃襄王卒太子熊元代立是為考烈王考烈王以左徒為令尹封以吳號春申君考烈王元年納州于秦以平是時楚益弱六年秦圍邯鄲趙告急楚楚遣將軍景陽救趙七年至新中秦兵去十二年秦昭王卒楚王使春申君弔祠于秦十六年秦莊襄王卒秦王趙政立二十二年與諸侯共伐秦不利而去楚東徙都壽春命曰郢二十五年考烈王卒子幽王悍立李園殺春申君幽王三年秦魏伐楚秦相呂不韋卒九年秦滅韓十年幽王卒同母弟猶代立是為哀王哀王立二月餘哀王庶兄負芻之徒襲殺哀王而立負芻為王是歲秦虜趙王遷王負芻元年燕太子丹使荊軻刺秦王二年秦使將軍伐楚大破楚軍亡十餘城三年秦滅魏四年秦將王翦破我軍於蘄而殺將軍項燕五年秦將王翦蒙武遂破楚國虜楚王負芻滅楚名為郡云太史公曰楚靈王方會諸侯於申誅齊慶封作章華臺求周九鼎之時志小天下及餓死于申亥之家為天下笑操行之不得悲夫勢之於人也可不慎與棄疾以亂立嬖淫秦女甚乎哉幾再亡國
