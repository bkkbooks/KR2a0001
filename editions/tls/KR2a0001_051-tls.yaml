body:
  text: 荊燕世家第二十一荊王劉賈者諸劉不知其何屬初起時漢王元年還定三秦劉賈為將軍定塞地從東擊項籍漢四年漢王之敗成皋北渡河得張耳韓信軍軍脩武深溝高壘使劉賈將二萬人騎數百渡白馬津入楚地燒其積聚以破其業無以給項王軍食已而楚擊劉賈賈輒壁不肯與戰而與彭越相保漢五年漢王追項籍至固陵使劉賈南渡淮圍壽春還至使人閒招楚大司馬周殷周殷反楚佐劉賈舉九江迎武王黥布兵皆會垓下共擊項籍漢王因使劉賈將九江兵與太尉盧綰西南擊臨江王共尉共尉已死以臨江為南郡漢六年春會諸侯於陳廢楚王信囚之分其地為二國當是時也高祖子幼昆弟少又不賢欲王同姓以鎮天下乃詔曰將軍劉賈有功及擇子弟可以為王者群臣皆曰立劉賈為荊王王淮東五十二城高祖弟交為楚王王淮西三十六城因立子肥為齊王始王昆弟劉氏也高祖十一年秋淮南王黥布反東擊荊荊王賈與戰不勝走富陵為布軍所殺高祖自擊破布十二年立沛侯劉濞為吳王王故荊地燕王劉澤者諸劉遠屬也高帝三年澤為郎中高帝十一年澤以將軍擊陳豨得王黃為營陵侯高后時齊人田生游乏資以畫干營陵侯澤澤大說之用金二百斤為田生壽田生已得金即歸齊二年澤使人謂田生曰弗與矣田生如長安不見澤而假大宅令其子求事呂后所幸大謁者張子卿居數月田生子請張卿臨親脩具張卿許往田生盛帷帳共具譬如列侯張卿驚酒酣乃屏人說張卿曰臣觀諸侯王邸弟百餘皆高祖一切功臣今呂氏雅故本推轂高帝就天下功至大又親戚太后之重太后春秋長諸呂弱大后欲立呂產為王王代太后又重發之恐大臣不聽今卿最幸大臣所敬何不風大臣以聞太后太后必喜諸呂已王萬戶侯亦卿之有太后心欲之而鄉為內臣不急發恐禍及身矣張卿大然之乃風大臣語太后太后朝因問大臣大臣請立呂產為呂王太后賜張卿千斤金張卿以其半與田生田生弗受因說之曰呂產王也諸大臣未大服今營陵侯澤諸劉為大將軍獨此尚觖望今卿言太后列十餘縣王之彼得王喜去諸呂王益固矣張卿入言太后然之乃以營陵侯劉澤為琅邪王琅邪王乃與田生之國田生勸澤急行毋留出關太后果使人追止之已出即還及太后崩琅邪王澤乃曰帝少諸呂用事劉氏弧弱乃引兵與齊王合謀西欲誅諸呂至梁聞漢遣灌將軍屯滎陽澤還兵備西界遂跳驅至長安代王亦從代至諸將相與琅邪王共立代王為天子天子乃徒澤為燕王乃復以琅邪予齊復故地澤王燕二年薨謚為敬王傳子嘉為康王至孫定國與父康王姬姦生子男一人奪弟妻為姬與子女三人姦定國有所欲誅殺臣肥如令郢人郢人等告定國定國使謁者以他法劾捕格殺郢人以滅口至元朔元年郢人昆弟復上書具言定國陰事以此發覺詔下公卿皆議曰定國禽獸行亂人倫逆天當誅上許之定國自殺國除為郡太史公曰荊王王也由漢初定天下未集故劉賈雖屬疏然以策為王填江淮之閒劉澤之王權激呂氏然劉澤卒南面稱孤者三世事發相重豈不為偉乎
