body:
  text: 仲尼弟子列傳七孔子曰受業身通者七十有七人皆異能之士也德行顏淵閔子騫冉伯牛仲弓政事冉有季路言語宰我子貢文學子游子夏師也辟參也魯柴也愚由也喭回也屢空賜不受命而貨殖焉億則屢中孔子之所嚴事於周則老子於衛蘧伯玉於齊晏平仲於楚老萊子於鄭子產於魯孟公綽數稱臧文仲柳下惠銅鞮伯華介山子然孔子皆後之不並世顏回者魯人也字子淵少孔子三十歲顏淵問仁孔子曰克己復禮天下歸仁焉孔子曰賢哉回也一簞食一瓢飲在陋巷人不堪其憂回也不改其樂回也如愚退而省其私亦足以發回也不愚用之則行捨之則藏唯我與爾有是夫回年二十九髮盡白蚤死孔子哭之慟曰自吾有回門人益親魯哀公問弟子孰為好學孔子對曰有顏回者好學不遷怒不貳過不幸短命死矣今也則亡閔損字子騫少孔子十五歲孔子曰孝哉閔子騫人不閒於其父母昆弟之言不仕大夫不食汙君之祿如有復我者必在汶上矣冉耕字伯牛孔子以為有德行伯牛有惡疾孔子往問之自牖執其手曰命也夫斯人也而有斯疾命也夫冉雍字仲弓仲弓問政孔子曰出門如見大賓使民如承大祭在邦無怨在家無怨孔子以仲弓為有德行曰雍也可使南面仲弓父賤人孔子曰犁牛之子騂且角雖欲勿用山川其舍諸冉求字子有少孔子二十九歲為季氏宰季康子問孔子曰冉求仁乎曰千室之邑百乘之家求也可使治其賦仁則吾不知也復問子路仁乎孔子對曰如求求問曰聞斯行諸子曰行之子路問聞斯行諸子曰有父兄在如之何其聞斯行之子華怪之敢問問同而答異孔子曰求也退故進之由也兼人故退之仲由字子路卞人也少孔子九歲子路性鄙好勇力志伉直冠雄雞佩豭豚陵暴孔子孔子設禮稍誘子路子路後儒服委質因門人請為弟子子路問政孔子曰先之勞之請益曰無倦子路問君子尚勇乎孔子曰義之為上君子好勇而無義則亂小人好勇而無義則盜子路有聞未之能行唯恐有聞孔子曰片言可以折獄者其由也與由也好勇過我無所取材若由也不得其死然衣敝縕袍與衣狐貉者立而不恥者其由也與由也升堂矣未入於室也季康子問仲由仁乎孔子曰千乘之國可使治其賦不知其仁子路喜從游遇長沮桀溺荷蓧丈人子路為季氏宰季孫問曰子路可謂大臣與孔子曰可謂具臣矣子路為蒲大夫辭孔子孔子曰蒲多壯士又難治然吾語汝恭以敬可以執勇寬以正可以比眾恭正以靜可以報上初衛靈公有寵姬曰南子靈公太子蕢聵得過南子懼誅出奔及靈公卒而夫人欲立公子郢郢不肯曰亡人太子之子輒在於是衛立輒為君是為出公出公立十二年其父蕢聵居外不得入子路為衛大夫孔悝之邑宰蕢聵乃與孔悝作亂謀入孔悝家遂與其徒襲攻出公出公奔魯而蕢聵入立是為莊公方孔悝作亂子路在外聞之而馳往遇子羔出衛城門謂子路曰出公去矣而門已閉子可還矣毋空受其禍子路曰食其食者不避其難子羔卒去有使者入城城門開子路隨而入造蕢聵蕢聵與孔悝登臺子路曰君焉用孔悝請得而殺之蕢聵弗聽於是子路欲燔臺蕢聵懼乃下石乞壺黶攻子路擊斷子路之纓子路曰君子死而冠不免遂結纓而死孔子聞衛亂曰嗟乎由死矣已而果死故孔子曰自吾得由惡言不聞於耳是時子貢為魯使於齊宰予字子我利口辯辭既受業問三年之喪不已久乎君子三年不為禮禮必壞三年不為樂樂必崩舊穀既沒新穀既升鑽燧改火期可已矣子曰於汝安乎曰安汝安則為之君子居喪食旨不甘聞樂不樂故弗為也宰我出子曰予之不仁也子生三年然後免於父母之懷夫三年之喪天下之通義也宰予晝寢子曰朽木不可雕也糞土之牆不可圬也宰我問五帝之德子曰予非其人也宰我為臨菑大夫與田常作亂以夷其族孔子恥之端沐賜衛人字子貢少孔子三十一歲子貢利口巧辭孔子常黜其辯問曰汝與回也孰愈對曰賜也何敢望回回也聞一以知十賜也聞一以知二子貢既已受業問曰賜何人也孔子曰汝器也曰何器也曰瑚璉也陳子禽問子貢曰仲尼焉學子貢曰文武之道未墜於地在人賢者識其大者不賢者識其小者莫不有文武之道夫子焉不學而亦何常師之有又問曰孔子適是國必聞其政求之與抑與之與子貢曰夫子溫良恭儉讓以得之夫子之求之也其諸異乎人之求之也子貢問曰富而無驕貧而無諂何如孔子曰可也不如貧而樂道富而好禮田常欲作亂於齊憚高國鮑晏故移其兵欲以伐魯孔子聞之謂門弟子曰夫魯墳墓所處父母之國國危如此二三子何為莫出子路請出孔子止之子張子石請行孔子弗許子貢請行孔子許之遂行至齊說田常曰君之伐魯過矣夫魯難伐之國其城薄以卑其地狹以泄其君愚而不仁大臣偽而無用其士民又惡甲兵之事此不可與戰君不如伐吳夫吳城高以厚地廣以深甲堅以新士選以飽重器精兵盡在其中又使明大夫守之此易伐也田常忿然作色曰子之所難人之所易子之所易人之所難而以教常何也子貢曰臣聞之憂在內者攻彊憂在外者攻弱今君憂在內吾聞君三封而三不成者大臣有不聽者也今君破魯以廣齊戰勝以驕主破國以尊臣而君之功不與焉則交日疏於主是君上驕主心下恣群臣求以成大事難矣夫上驕則恣臣驕則爭是君上與主有卻下與大臣交爭也如此則君之立於齊危矣故曰不如伐吳伐吳不勝民人外死大臣內空是君上無彊臣之敵下無民人之過孤主制齊者唯君也田常曰善雖然吾兵業已加魯矣去而之吳大臣疑我柰何子貢曰君按兵無伐臣請往使吳王令之救魯而伐齊君因以兵迎之田常許之使子貢南見吳王說曰臣聞之王者不絕世霸者無彊敵千鈞之重加銖兩而移今以萬乘之齊而私千乘之魯與吳爭彊竊為王危之且夫救魯顯名也伐齊大利也以撫泗上諸侯誅暴齊以服彊晉利莫大焉名存亡魯實困彊齊智者不疑也吳王曰善雖然吾嘗與越戰棲之會稽越王苦身養士有報我心子待我伐越而聽子子貢曰越之勁不過魯吳之彊不過齊王置齊而伐越則齊已平魯矣且王方以存亡繼絕為名夫伐小越而畏彊齊非勇也夫勇者不避難仁者不窮約智者不失時王者不絕世以立其義今存越示諸侯以仁救魯伐齊威加晉國諸侯必相率而朝吳霸業成矣且王必惡越臣請東見越王令出兵以從此實空越名從諸侯以伐也吳王大說乃使子貢之越越王除道郊迎身御至舍而問曰此蠻夷之國大夫何以儼然辱而臨之子貢曰今者吾說吳王以救魯伐齊其志欲之而畏越曰待我伐越乃可如此破越必矣且夫無報人之志而令人疑之拙也有報人之志使人知之殆也事未發而先聞危也三者舉事之大患句踐頓首再拜曰孤嘗不料力乃與吳戰困於會稽痛入於骨髓日夜焦脣乾舌徒欲與吳王接踵而死孤之願也遂問子貢子貢曰吳王為人猛暴群臣不堪國家敝以數戰士卒弗忍百姓怨上大臣內變子胥以諫死太宰嚭用事順君之過以安其私是殘國之冶也今王誠發士卒佐之以徼其志重寶以說其心卑辭以尊其禮其伐齊必也彼戰不勝王之福矣戰勝必以兵臨晉臣請北見晉君令共攻之弱吳必矣其銳兵盡於齊重甲困於晉而王制其敝此滅吳必矣越王大說許諾送子貢金百鎰劍一良矛二子貢不受遂行報吳王曰臣敬以大王之言告越王越王大恐曰孤不幸少失先人內不自量抵罪於吳軍敗身辱棲于會稽國為虛莽賴大王之賜使得奉俎豆而修祭祀死不敢忘何謀之敢慮後五日越使大夫種頓首言於吳王曰東海役臣孤句踐使者臣種敢修下吏問於左右今竊聞大王將興大義誅彊救弱困暴齊而撫周室請悉起境內士卒三千人孤請自被堅執銳以先受矢石因越賤臣種奉先人藏器甲二十領鈇屈盧之矛步光之劍以賀軍吏吳王大說以告子貢曰越王欲身從寡人伐齊可乎子貢曰不可夫空人之國悉人之眾又從其君不義君受其幣許其師而辭其君吳王許諾乃謝越王於是吳王乃遂發九郡兵伐齊子貢因去之晉謂晉君曰臣聞之慮不先定不可以應卒兵不先辨不可以勝敵今夫齊與吳將戰彼戰而不勝越亂之必矣與齊戰而勝必以其兵臨晉晉君大恐曰為之柰何子貢曰修兵休卒以待之晉君許諾子貢去而之魯吳王果與齊人戰於艾陵大破齊師獲七將軍之兵而不歸果以兵臨晉與晉人相遇黃池之上吳晉爭彊晉人擊之大敗吳師越王聞之涉江襲吳去城七里而軍吳王聞之去晉而歸與越戰於五湖三戰不勝城門不守越遂圍王宮殺夫差而戮其相破吳三年東向而霸故子貢一出存魯亂齊破吳彊晉而霸越子貢一使使勢相破十年之中五國各有變子貢好廢舉與時轉貨貲喜揚人之美不能匿人之過常相魯衛家累千金卒終于齊言偃吳人字子游少孔子四十五歲子游既已受業為武城宰孔子過聞弦歌之聲孔子莞爾而笑曰割雞焉用牛刀子游曰昔者偃聞諸夫子曰君子學道則愛人小人學道則易使孔子曰二三子偃之言是也前言戲之耳孔子以為子游習於文學卜商字子夏少孔子四十四歲子夏問巧笑倩兮美目盻兮素以為絢兮何謂也子曰繪事後素曰禮後乎孔子曰商始可與言詩已矣子貢問師與商孰賢子曰師也過商也不及然則師愈與曰過猶不及子謂子夏曰汝為君子儒無為小人儒孔子既沒子夏居西河教授為魏文侯師其子死哭之失明顓孫師陳人字子張少孔子四十八歲子張問干祿孔子曰多聞闕疑慎言其餘則寡尤多見闕殆慎行其餘則寡悔言寡尤行寡悔祿在其中矣他日從在陳蔡閒困問行孔子曰言忠信行篤敬雖蠻貊之國行也言不忠信行不篤敬雖州里行乎哉立則見其參於前也在輿則見其倚於衡夫然後行子張書諸紳子張問士何如斯可謂之達矣孔子曰何哉爾所謂達者子張對曰在國必聞在家必聞孔子曰是聞也非達也夫達者質直而好義察言而觀色慮以下人在國及家必達夫聞也者色取仁而行違居之不疑在國及家必聞曾參南武城人字子輿少孔子四十六歲孔子以為能通孝道故授之業作孝經死於魯澹臺滅明武城人字子羽少孔子三十九歲狀貌甚惡欲事孔子孔子以為材薄既已受業退而修行行不由徑非公事不見卿大夫南游至江從弟子三百人設取予去就名施乎諸侯孔子聞之曰吾以言取人失之宰予以貌取人失之子羽宓不齊字子賤少孔子三十歲孔子謂子賤君子哉魯無君子斯焉取斯子賤為單父宰反命於孔子曰此國有賢不齊者五人教不齊所以治者孔子曰惜哉不齊所治者小所治者大則庶幾矣原憲字子思子思問恥孔子曰國有道穀國無道穀恥也子思曰克伐怨欲不行焉可以為仁乎孔子曰可以為難矣仁則吾弗知也孔子卒原憲遂亡在草澤中子貢相衛而結駟連騎排藜藿入窮閻過謝原憲憲攝敝衣冠見子貢子貢恥之曰夫子豈病乎原憲曰吾聞之無財者謂之貧學道而不能行者謂之病若憲貧也非病也子貢慚不懌而去終身恥其言之過也公冶長齊人字子長孔子曰長可妻也雖在累紲之中非其罪也以其子妻之南宮括字子容問孔子曰羿善射奡盪舟俱不得其死然禹稷躬稼而有天下孔子弗答容出孔子曰君子哉若人上德哉若人國有道不廢國無道免於刑戮三復白珪之玷以其兄之子妻之公皙哀字季次孔子曰天下無行多為家臣仕於都唯季次未嘗仕曾蒧字皙侍孔子孔子曰言爾志蒧曰春服既成冠者五六人童子六七人浴乎沂風乎舞雩詠而歸孔子喟爾歎曰吾與蒧也顏無繇字路路者顏回父父子嘗各異時事孔子顏回死顏路貧請孔子車以葬孔子曰材不材亦各言其子也鯉也死有棺而無椁吾不徒行以為之椁以吾從大夫之後不可以徒行商瞿魯人字子木少孔子二十九歲孔子傳易於瞿瞿傳楚人馯臂子弘弘傳江東人矯子庸疵疵傳燕人周子家豎豎傳淳于人光子乘羽羽傳齊人田子莊何何傳東武人王子中同同傳菑川人楊何何元朔中以治易為漢中大夫高柴字子羔少孔子三十歲子羔長不盈五尺受業孔子孔子以為愚子路使子羔為費郈宰孔子曰賊夫人之子子路曰有民人焉有社稷焉何必讀書然後為學孔子曰是故惡夫佞者漆彫開字子開孔子使開仕對曰吾斯之未能信孔子說公伯繚字子周周愬子路於季孫子服景伯以告孔子曰夫子固有惑志繚也吾力猶能肆諸市朝孔子曰道之將行命也道之將廢命也公伯繚其如命何司馬耕字子牛牛多言而躁問仁於孔子孔子曰仁者其言也訒曰其言也訒斯可謂之仁乎子曰為之難言之得無訒乎問君子子曰君子不憂不懼曰不憂不懼斯可謂之君子乎子曰內省不疚夫何憂何懼樊須字子遲少孔子三十六歲樊遲請學稼孔子曰吾不如老農請學圃曰吾不如老圃樊遲出孔子曰小人哉樊須也上好禮則民莫敢不敬上好義則民莫敢不服上好信則民莫敢不用情夫如是則四方之民襁負其子而至矣焉用稼樊遲問仁子曰愛人問智曰知人有若少孔子四十三歲有若曰禮之用和為貴先王之道斯為美小大由之有所不行知和而和不以禮節之亦不可行也信近於義言可復也恭近於禮遠恥辱也因不失其親亦可宗也孔子既沒弟子思慕有若狀似孔子弟子相與共立為師師之如夫子時也他日弟子進問曰昔夫子當行使弟子持雨具已而果雨弟子問曰夫子何以知之夫子曰詩不云乎月離于畢俾滂沱矣昨暮月不宿畢乎他日月宿畢竟不雨商瞿年長無子其母為取室孔子使之齊瞿母請之孔子曰無憂瞿年四十後當有五丈夫子已而果然敢問夫子何以知此有若默然無以應弟子起曰有子避之此非子之座也公西赤字子華少孔子四十二歲子華使於齊冉有為其母請粟孔子曰與之釜請益曰與之庾冉子與之粟五秉孔子曰赤之適齊也乘肥馬衣輕裘吾聞君子周急不繼富巫馬施字子旗少孔子三十歲陳司敗問孔子曰魯昭公知禮乎孔子曰知禮退而揖巫馬旗曰吾聞君子不黨君子亦黨乎魯君娶吳女為夫人命之為孟子孟子姓姬諱稱同姓故謂之孟子魯君而知禮孰不知禮施以告孔子孔子曰丘也幸苟有過人必知之臣不可言君親之惡為諱者禮也梁鱣字叔魚少孔子二十九歲顏幸字子柳少孔子四十六歲冉孺字子魯少孔子五十歲曹卹字子循少孔子五十歲伯虔字子析少孔子五十歲公孫龍字子石少孔子五十三歲自子石已右三十五人顯有年名及受業聞見于書傳其四十有二人無年及不見書傳者紀于左冉季字子產公祖句茲字子之秦祖字子南漆雕哆字子斂顏高字子驕漆雕徒父壤駟赤字子徒商澤石作蜀字子明任不齊字選公良孺字子正后處字子里秦冉字開公夏首字乘奚容箴字子皙公肩定字子中顏祖字襄鄡單字子家句井疆罕父黑字子索秦商字子丕申黨字周顏之僕字叔榮旂字子祈縣成字子祺左人郢字行燕伋字思鄭國字子徒秦非字子之施之常字子恆顏噲字子聲步叔乘字子車原亢籍樂欬字子聲廉絜字庸叔仲會字子期顏何字冉狄黑字皙邦巽字子斂孔忠公西輿如字子上公西葴字子上太史公曰學者多稱七十子之徒譽者或過其實毀者或損其真鈞之未覩厥容貌則論言弟子籍出孔氏古文近是余以弟子名姓文字悉取論語弟子問并次為篇疑者闕焉
