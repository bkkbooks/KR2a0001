body:
  text: 衛將軍驃騎列傳第五十一大將軍衛青者平陽人也其父鄭季為吏給事平陽侯家與侯妾衛媼通生青青同母兄衛長子而姊衛子夫自平陽公主家得幸天子故冒姓為衛氏字仲卿長子更字長君長君母號為衛媼媼長女衛孺次女少兒次女即子夫後子夫男弟步廣皆冒衛氏青為侯家人少時歸其父其父使牧羊先母之子皆奴畜之不以為兄弟數青嘗從入至甘泉居室有一鉗徒相青曰貴人也官至封侯青笑曰人奴之生得毋笞罵即足矣安得封侯事乎青壯為侯家騎從平陽主建元二年春青姊子夫得入宮幸上皇后堂邑大長公主女也無子妒大長公主聞衛子夫幸有身妒之乃使人捕青青時給建章未知名大長公主執囚青欲殺之其友騎郎公孫敖與壯士往篡取之以故得不死上聞乃召青為建章監侍中及同母昆弟貴賞賜數日閒累千金孺為太僕公孫賀妻少兒故與陳掌通上召貴掌公孫敖由此益貴子夫為夫人青為大中大夫元光五年青為車騎將軍擊匈奴出上谷太僕公孫賀為輕車將軍出雲中大中大夫公孫敖為騎將軍出代郡衛尉李廣為驍騎將軍出雁門軍各萬騎青至蘢城斬首虜數百騎將軍敖亡七千騎衛尉李廣為虜所得得脫歸皆當斬贖為庶人賀亦無功元朔元年春衛夫人有男立為皇后其秋青為車騎將軍出雁門三萬騎擊匈奴斬首虜數千人明年匈奴入殺遼西太守虜略漁陽二千餘人敗韓將軍軍漢令將軍李息擊之出代令車騎將軍青出雲中以西至高闕遂略河南地至于隴西捕首虜數千畜數十萬走白羊樓煩王遂以河南地為朔方郡以三千八百戶封青為長平侯青校尉蘇建有功以千一百戶封建為平陵侯使建築朔方城青校尉張次公有功封為岸頭侯天子曰匈奴逆天理亂人倫暴長虐老以盜竊為務行詐諸蠻夷造謀藉兵數為邊害故興師遣將以征厥罪詩不云乎薄伐玁狁至于太原出車彭彭城彼朔方今車騎將軍青度西河至高闕獲首虜二千三百級車輜畜產畢收為鹵已封為列侯遂西定河南地按榆谿舊塞絕梓領梁北河討蒲泥破符離斬輕銳之卒捕伏聽者三千七十一級執訊獲醜驅馬牛羊百有餘萬全甲兵而還益封青三千戶其明年匈奴入殺代郡太守友入略鴈門千餘人其明年匈奴大入代定襄上郡殺略漢數千人其明年元朔之五年春漢令車騎將軍青將三萬騎出高闕衛尉蘇建為游擊將軍左內史李沮為彊弩將軍太僕公孫賀為騎將軍代相李蔡為輕車將軍皆領屬車騎將軍俱出朔方大行李息岸頭侯張次公為將軍出右北平咸擊匈奴匈奴右賢王當衛青等兵以為漢兵不能至此飲醉漢兵夜至圍右賢王右賢王驚夜逃獨與其愛妾一人壯騎數百馳潰圍北去漢輕騎校尉郭成等逐數百里不及得右賢裨王十餘人眾男女萬五千餘人畜數千百萬於是引兵而還至塞天子使使者持大將軍印即軍中拜車騎將軍青為大將軍諸將皆以兵屬大將軍大將軍立號而歸天子曰大將軍青躬率戎士師大捷獲匈奴王十有餘人益封青六千戶而封青子伉為宜春侯青子不疑為陰安侯青子登為發干侯青固謝曰臣幸得待罪行閒賴陛下神靈軍大捷皆諸校尉力戰之功也陛下幸已益封臣青臣青子在襁緥中未有勤勞上幸列地封為三侯非臣待罪行閒所以勸士力戰之意也伉等三人何敢受封天子曰我非忘諸校尉功也今固且圖之乃詔御史曰護軍都尉公孫敖三從大將軍擊匈奴常護軍傅校獲王以千五百戶封敖為合騎侯都尉韓說從大將軍出窳渾至匈奴右賢王庭為麾下搏戰獲王以千三百戶封說為龍頟侯騎將軍公孫賀從大將軍獲王以千三百戶封賀為南窌侯輕車將軍李蔡再從大將軍獲王以千六百戶封蔡為樂安侯校尉李朔校尉趙不虞校尉公孫戎奴各三從大將軍獲王以千三百戶封朔為涉軹侯以千三百戶封不虞為隨成侯以千三百戶封戎奴為從平侯將軍李沮李息及校尉豆如意有功賜爵關內侯食邑各三百戶其秋匈奴入代殺都尉朱英其明年春大將軍青出定襄合騎侯敖為中將軍太僕賀為左將軍翕侯趙信為前將軍衛尉蘇建為右將軍郎中令李廣為後將軍右內史李沮為彊弩將軍咸屬大將軍斬首數千級而還月餘悉復出定襄擊匈奴斬首虜萬餘人右將軍建前將軍信并軍三千餘騎獨逢單于兵與戰一日餘漢兵且盡前將軍故胡人降為翕侯見急匈奴誘之遂將其餘騎可八百犇降單于右將軍蘇建盡亡其軍獨以身得亡去自歸大將軍大將軍問其罪正閎長史安議郎周霸等建當云何霸曰自大將軍出未嘗斬裨將今建棄軍可斬以明將軍之威閎安曰不然兵法小敵之堅大敵之禽也今建以數千當單于數萬力戰一日餘士盡不敢有二心自歸自歸而斬之是示後無反意也不當斬大將軍曰青幸得以肺腑待罪行閒不患無威而霸說我以明威甚失臣意且使臣職雖當斬將以臣之尊寵而不敢自擅專誅於境外而具歸天子天子自裁之於是以見為人臣不敢專權不亦可乎軍吏皆曰善遂囚建詣行在所入塞罷兵是歲也大將軍姊子霍去病年十八幸為天子侍中善騎射再從大將軍受詔與壯士為剽姚校尉與輕勇騎八百直棄大軍數百里赴利斬捕首虜過當於是天子曰剽姚校尉去病斬首虜二千二十八級及相國當戶斬單于大父行籍若侯產生捕季父羅姑比再冠軍以千六百戶封去病為冠軍侯上谷太守郝賢四從大將軍捕斬首虜二千餘人以千一百戶封賢為眾利侯是歲失兩將軍軍亡翕侯軍功不多故大將軍不益封右將軍建至天子不誅赦其罪贖為庶人大將軍既還賜千金是時王夫人方幸於上甯乘說大將軍曰將軍所以功未甚多身食萬戶三子皆為侯者徒以皇后故也今王夫人幸而宗族未富貴願將軍奉所賜千金為王夫人親壽大將軍乃以五百金為壽天子聞之問大將軍大將軍以實言上乃拜甯乘為東海都尉張騫從大將軍以嘗使大夏留匈奴中久導軍知善水草處軍得以無飢渴因前使絕國功封騫博望侯冠軍侯去病既侯三歲元狩二年春以冠軍侯去病為驃騎將軍將萬騎出隴西有功天子曰驃騎將軍率戎士踰烏盭討遬濮涉狐奴歷五王國輜重人眾懾慴者弗取冀獲單于子轉戰六日過焉支山千有餘里合短兵殺折蘭王斬盧胡王誅全甲執渾邪王子及相國都尉首虜八千餘級收休屠祭天金人益封去病二千戶其夏驃騎將軍與合騎侯敖俱出北地異道博望侯張騫郎中令李廣俱出右北平異道皆擊匈奴郎中令將四千騎先至博望侯將萬騎在後至匈奴左賢王將數萬騎圍郎中令郎中令與戰二日死者過半所殺亦過當博望侯至匈奴兵引去博望侯坐行留當斬贖為庶人而驃騎將軍出北地已遂深入與合騎侯失道不相得驃騎將軍踰居延至祁連山捕首虜甚多天子曰驃騎將軍踰居延遂過小月氏攻祁連山得酋涂王以眾降者二千五百人斬首虜三萬二百級獲五王五王母單于閼氏王子五十九人相國將軍當戶都尉六十三人師大率減什三益封去病五千戶賜校尉從至小月氏爵左庶長鷹擊司馬破奴再從驃騎將軍斬遬濮王捕稽沮王千騎將得王王母各一人王子以下四十一人捕虜三千三百三十人前行捕虜千四百人以千五百戶封破奴為從驃侯校尉句王高不識從驃騎將軍捕呼于屠王王子以下十一人捕虜千七百六十八人以千一百戶封不識為宜冠侯校尉僕多有功封為煇渠侯合騎侯敖坐行留不與驃騎會當斬贖為庶人諸宿將所將士馬兵亦不如驃騎驃騎所將常選然亦敢深入常與壯騎先其大軍軍亦有天幸未嘗困絕也然而諸宿將常坐留落不遇由此驃騎日以親貴比大將軍其秋單于怒渾邪王居西方數為漢所破亡數萬人以驃騎之兵也單于怒欲召誅渾邪王渾邪王與休屠王等謀欲降漢使人先要邊是時大行李息將城河上得渾邪王使即馳傳以聞天子聞之於是恐其以詐降而襲邊乃令驃騎將軍將兵往迎之驃騎既渡河與渾邪王眾相望渾邪王裨將見漢軍而多欲不降者頗遁去驃騎乃馳入與渾邪王相見斬其欲亡者八千人遂獨遣渾邪王乘傳先詣行在所盡將其眾渡河降者數萬號稱十萬既至長安天子所以賞賜者數十巨萬封渾邪王萬戶為漯陰侯封其裨王呼毒尼為下摩侯鷹庇為煇渠侯禽犁為河綦侯大當戶銅離為常樂侯於是天子嘉驃騎之功曰驃騎將軍去病率師攻匈奴西域王渾邪王及厥眾萌咸相犇率以軍糧接食并將控弦萬有餘人誅獟駻獲首虜八千餘級降異國之王三十二人戰士不離傷十萬之眾咸懷集服仍與之勞爰及河塞庶幾無患幸既永緩矣以千七百戶益封驃騎將軍減隴西北地上郡戍卒之半以寬天下之繇居頃之乃分徙降者邊五郡故塞外而皆在河南因其故俗為屬國其明年匈奴入右北平定襄殺略漢千餘人其明年天子與諸將議曰翕侯趙信為單于畫計常以為漢兵不能度幕輕留今大發士卒其勢必得所欲是歲元狩四年也元狩四年春上令大將軍青驃騎將軍去病將各五萬騎步兵轉者踵軍數十萬而敢力戰深入之士皆屬驃騎驃騎始為出定襄當單于捕虜言單于東乃更令驃騎出代郡令大將軍出定襄郎中令為前將軍太僕為左將軍主爵趙食其為右將軍平陽侯襄為後將軍皆屬大將軍兵即度幕人馬凡五萬騎與驃騎等咸擊匈奴單于趙信為單于謀曰漢兵既度幕人馬罷匈奴可坐收虜耳乃悉遠北其輜重皆以精兵待幕北而適值大將軍軍出塞千餘里見單于兵陳而待於是大將軍令武剛車自環為營而縱五千騎往當匈奴匈奴亦縱可萬騎會日且入大風起沙礫擊面兩軍不相見漢益縱左右翼繞單于單于視漢兵多而士馬尚彊戰而匈奴不利薄莫單于遂乘六驘壯騎可數百直冒漢圍西北馳去時已昏漢匈奴相紛挐殺傷大當漢軍左校捕虜言單于未昏而去漢軍因發輕騎夜追之大將軍軍因隨其後匈奴兵亦散走遲明行二百餘里不得單于頗捕斬首虜萬餘級遂至窴顏山趙信城得匈奴積粟食軍軍留一日而還悉燒其城餘粟以歸大將軍之與單于會也而前將軍廣右將軍食其軍別從東道或失道後擊單于大將軍引還過幕南乃得前將軍右將軍大將軍欲使使歸報令長史簿責前將軍廣廣自殺右將軍至下吏贖為庶人大將軍軍入塞凡斬捕首虜萬九千級是時匈奴眾失單于十餘日右谷蠡王聞之自立為單于單于後得其眾右王乃去單于之號驃騎將軍亦將五萬騎車重與大將軍軍等而無裨將悉以李敢等為大校當裨將出代右北平千餘里直左方兵所斬捕功已多大將軍軍既還天子曰驃騎將軍去病率師躬將所獲葷粥之士約輕齎絕大幕涉獲章渠以誅比車耆轉擊左大將斬獲旗鼓歷涉離侯濟弓閭獲屯頭王韓王等三人將軍相國當戶都尉八十三人封狼居胥山禪於姑衍登臨翰海執鹵獲醜七萬有四百四十三級師率減什三取食於敵逴行殊遠而糧不絕以五千八百戶益封驃騎將軍右北平太守路博德屬驃騎將軍會與城不失期從至檮余山斬首捕虜二千七百級以千六百戶封博德為符離侯北地都尉邢山從驃騎將軍獲王以千二百戶封山為義陽侯故歸義因淳王復陸支樓專王伊即靬皆從驃騎將軍有功以千三百戶封復陸支為壯侯以千八百戶封伊即靬為眾利侯從驃侯破奴昌武侯安稽從驃騎有功益封各三百戶校尉敢得旗鼓為關內侯食邑二百戶校尉自為爵大庶長軍吏卒為官賞賜甚多而大將軍不得益封軍吏卒皆無封侯者兩軍之出塞塞閱官及私馬凡十四萬匹而復入塞者不滿三萬匹乃益置大司馬位大將軍驃騎將軍皆為大司馬定令令驃騎將軍秩祿與大將軍等自是之後大將軍青日退而驃騎日益貴舉大將軍故人門下多去事驃騎輒得官爵唯任安不肯驃騎將軍為人少言不泄有氣敢任天子嘗欲教之孫吳兵法對曰顧方略何如耳不至學古兵法天子為治第令驃騎視之對曰匈奴未滅無以家為也由此上益重愛之然少而侍中貴不省士其從軍天子為遣太官齎數十乘既還重車餘棄粱肉而士有飢者其在塞外卒乏糧或不能自振而驃騎尚穿域蹋鞠事多此類大將軍為人仁善退讓以和柔自媚於上然天下未有稱也驃騎將軍自四年軍後三年元狩六年而卒天子悼之發屬國玄甲軍陳自長安至茂陵為冢象祁連山謚之并武與廣地曰景桓侯子嬗代侯嬗少字子侯上愛之幸其壯而將之居六歲元封元年嬗卒謚哀侯無子絕國除自驃騎將軍死後大將軍長子宜春侯伉坐法失侯後五歲伉弟二人陰安侯不疑及發干侯登皆坐酎金失侯失侯後二歲冠軍侯國除其後四年大將軍青卒謚為烈侯子伉代為長平侯自大將軍圍單于之後十四年而卒竟不復擊匈奴者以漢馬少而方南誅兩越東伐朝鮮擊羌西南夷以故久不伐胡大將軍以其得尚平陽長公主故長平侯伉代侯六歲坐法失侯左方兩大將軍及諸裨將名最大將軍青凡七出擊匈奴斬捕首虜五萬餘級一與單于戰收河南地遂置朔方郡再益封凡萬一千八百戶封三子為侯侯千三百戶并之萬五千七百戶其校尉裨將以從大將軍侯者九人其裨將及校尉已為將者十四人為裨將者曰李廣自有傳無傳者曰將軍公孫賀賀義渠人其先胡種賀父渾邪景帝時為平曲侯坐法失侯賀武帝為太子時舍人武帝立八歲以太僕為輕車將軍軍馬邑後四歲以輕車將軍出雲中後五歲以騎將軍從大將軍有功封為南窌侯後一歲以左將軍再從大將軍出定襄無功後四歲以坐酎金失侯後八歲以浮沮將軍出五原二千餘里無功後八歲以太僕為丞相封葛繹侯賀七為將軍出擊匈奴無大功而再侯為丞相坐子敬聲與陽石公主姦為巫蠱族滅無後將軍李息郁郅人事景帝至武帝立八歲為材官將軍軍馬邑後六歲為將軍出代後三歲為將軍從大將軍出朔方皆無功凡三為將軍其後常為大行將軍公孫敖義渠人以郎事武帝武帝立十二歲為騎將軍出代亡卒七千人當斬贖為庶人後五歲以校尉從大將軍有功封為合騎侯後一歲以中將軍從大將軍再出定襄無功後二歲以將軍出北地後驃騎期當斬贖為庶人後二歲以校尉從大將軍無功後十四歲以因杅將軍築受降城七歲復以因杅將軍再出擊匈奴至余吾亡士卒多下吏當斬詐死亡居民閒五六歲後發覺復繫坐妻為巫蠱族凡四為將軍出擊匈奴一侯將軍李沮雲中人事景帝武帝立十七歲以左內史為彊弩將軍後一歲復為彊弩將軍將軍李蔡成紀人也事孝文帝景帝武帝以輕車將軍從大將軍有功封為樂安侯已為丞相坐法死將軍張次公河東人以校尉從衛將軍青有功封為岸頭侯其後太后崩為將軍軍北軍後一歲為將軍從大將軍再為將軍坐法失侯次公父隆輕車武射也以善射景帝幸近之也將軍蘇建杜陵人以校尉從衛將軍青有功為平陵侯以將軍築朔方後四歲為游擊將軍從大將軍出朔方後一歲以右將軍再從大將軍出定襄亡翕侯失軍當斬贖為庶人其後為代郡太守卒冢在大猶鄉將軍趙信以匈奴相國降為翕侯武帝立十七歲為前將軍與單于戰敗降匈奴將軍張騫以使通大夏還為校尉從大將軍有功封為博望侯後三歲為將軍出右北平失期當斬贖為庶人其後使通烏孫為大行而卒冢在漢中將軍趙食其祋祤人也武帝立二十二歲以主爵為右將軍從大將軍出定襄迷失道當斬贖為庶人將軍曹襄以平陽侯為後將軍從大將軍出定襄襄曹參孫也將軍韓說弓高侯庶孫也以校尉從大將軍有功為龍頟侯坐酎金失侯元鼎六年以待詔為橫海將軍擊東越有功為按道侯以太初三年為游擊將軍屯於五原外列城為光祿勳掘蠱太子宮衛太子殺之將軍郭昌雲中人也以校尉從大將軍元封四年以太中大夫為拔胡將軍屯朔方還擊昆明毋功奪印將軍荀彘太原廣武人以御見侍中為校尉數從大將軍以元封三年為左將軍擊朝鮮毋功以捕樓船將軍坐法死最驃騎將軍去病凡六出擊匈奴其四出以將軍斬捕首虜十一萬餘級及渾邪王以眾降數萬遂開河西酒泉之地西方益少胡寇四益封凡萬五千一百戶其校吏有功為侯者凡六人而後為將軍二人將軍路博德平州人以右北平太守從驃騎將軍有功為符離侯驃騎死後博德以衛尉為伏波將軍伐破南越益封其後坐法失侯為彊弩都尉屯居延卒將軍趙破奴故九原人嘗亡入匈奴已而歸漢為驃騎將軍司馬出北地時有功封為從驃侯坐酎金失侯後一歲為匈河將軍攻胡至匈奴河水無功後二歲擊虜樓蘭王復封為浞野侯後六歲為浚稽將軍將二萬騎擊匈奴左賢王左賢王與戰兵八萬騎圍破奴破奴生為虜所得遂沒其軍居匈奴中十歲復與其太子安國亡入漢後坐巫蠱族自衛氏興大將軍青首封其後枝屬為五侯凡二十四歲而五侯盡奪衛氏無為侯者太史公曰蘇建語余曰吾嘗責大將軍至尊重而天下之賢大夫毋稱焉願將軍觀古名將所招選擇賢者勉之哉大將軍謝曰自魏其武安之厚賓客天子常切齒彼親附士大夫招賢絀不肖者人主之柄也人臣奉法遵職而已何與招士驃騎亦放此意其為將如此
