body:
  text: 孟嘗君列傳第十五孟嘗君名文姓田氏文之父曰靖郭君田嬰田嬰者齊威王少子而齊宣王庶弟也田嬰自威王時任職用事與成侯鄒忌及田忌將而救韓伐魏成侯與田忌爭寵成侯賣田忌田忌懼襲齊之邊邑不勝亡走會威王卒宣王立知成侯賣田忌乃復召田忌以為將宣王二年田忌與孫臏田嬰俱伐魏敗之馬陵虜魏太子申而殺魏將龐涓宣王七年田嬰使於韓魏韓魏服於齊嬰與韓昭侯魏惠王會齊宣王東阿南盟而去明年復與梁惠王會甄是歲梁惠王卒宣王九年田嬰相齊齊宣王與魏襄王會徐州而相王也楚威王聞之怒田嬰明年楚伐敗齊師於徐州而使人逐田嬰田嬰使張丑說楚威王威王乃止田嬰相齊十一年宣王卒湣王即位即位三年而封田嬰於薛初田嬰有子四十餘人其賤妾有子名文文以五月五日生嬰告其母曰勿舉也其母竊舉生之及長其母因兄弟而見其子文於田嬰田嬰怒其母曰吾令若去此子而敢生之何也文頓首因曰君所以不舉五月子者何故嬰曰五月子者長與戶齊將不利其父母文曰人生受命於天乎將受命於戶邪嬰默然文曰必受命於天君何憂焉必受命於戶則可高其戶耳誰能至者嬰曰子休矣久之文承閒問其父嬰曰子之子為何曰為孫孫之孫為何曰為玄孫玄孫之孫為何曰不能知也文曰君用事相齊至今三王矣齊不加廣而君私家富累萬金門下不見一賢者文聞將門必有將相門必有相今君後宮蹈綺縠而士不得裋褐僕妾餘粱肉而士不厭糟穅今君又尚厚積餘藏欲以遺所不知何人而忘公家之事日損文竊怪之於是嬰迺禮文使主家待賓客賓客日進名聲聞於諸侯諸侯皆使人請薛公田嬰以文為太子嬰許之嬰卒謚為靖郭君而文果代立於薛是為孟嘗君孟嘗君在薛招致諸侯賓客及亡人有罪者皆歸孟嘗君孟嘗君舍業厚遇之以故傾天下之士食客數千人無貴賤一與文等孟嘗君待客坐語而屏風後常有侍史主記君所與客語問親戚居處客去孟嘗君已使使存問獻遺其親戚孟嘗君曾待客夜食有一人蔽火光客怒以飯不等輟食辭去孟嘗君起自持其飯比之客慚自剄士以此多歸孟嘗君孟嘗君客無所擇皆善遇之人人各自以為孟嘗君親己秦昭王聞其賢乃先使涇陽君為質於齊以求見孟嘗君孟嘗君將入秦賓客莫欲其行諫不聽蘇代謂曰今旦代從外來見木禺人與土禺人相與語木禺人曰天雨子將敗矣土禺人曰我生於土敗則歸土今天雨流子而行未知所止息也今秦虎狼之國也而君欲往如有不得還君得無為土禺人所笑乎孟嘗君乃止齊湣王二十五年復卒使孟嘗君入秦昭王即以孟嘗君為秦相人或說秦昭王曰孟嘗君賢而又齊族也今相秦必先齊而後秦秦其危矣於是秦昭王乃止囚孟嘗君謀欲殺之孟嘗君使人抵昭王幸姬求解幸姬曰妾願得君狐白裘此時孟嘗君有一狐白裘直千金天下無雙入秦獻之昭王更無他裘孟嘗君患之徧問客莫能對最下坐有能為狗盜者曰臣能得狐白裘乃夜為狗以入秦宮臧中取所獻狐白裘至以獻秦王幸姬幸姬為言昭王昭王釋孟嘗君孟嘗君得出即馳去更封傳變名姓以出關夜半至函谷關秦昭王後悔出孟嘗君求之已去即使人馳傳逐之孟嘗君至關關法雞鳴而出客孟嘗君恐追至客之居下坐者有能為雞鳴而雞齊鳴遂發傳出出如食頃秦追果至關已後孟嘗君出乃還始孟嘗君列此二人於賓客賓客盡羞之及孟嘗君有秦難卒此二人拔之自是之後客皆服孟嘗君過趙趙平原君客之趙人聞孟嘗君賢出觀之皆笑曰始以薛公為魁然也今視之乃眇小丈夫耳孟嘗君聞之怒客與俱者下斫擊殺數百人遂滅一縣以去齊湣王不自得以其遣孟嘗君孟嘗君至則以為齊相任政孟嘗君怨秦將以齊為韓魏攻楚因與韓魏攻秦而借兵食於西周蘇代為西周謂曰君以齊為韓魏攻楚九年取宛葉以北以彊韓魏今復攻秦以益之韓魏南無楚憂西無秦患則齊危矣韓魏必輕齊畏秦臣為君危之君不如令敝邑深合於秦而君無攻又無借兵食君臨函谷而無攻令敝邑以君之情謂秦昭王曰薛公必不破秦以彊韓魏其攻秦也欲王之令楚王割東國以與齊而秦出楚懷王以為和君令敝邑以此惠秦秦得無破而以東國自免也秦必欲之楚王得出必德齊齊得東國益彊而薛世世無患矣秦不大弱而處三晉之西三晉必重齊薛公曰善因令韓魏賀秦使三國無攻而不借兵食於西周矣是時楚懷王入秦秦留之故欲必出之秦不果出楚懷王孟嘗君相齊其舍人魏子為孟嘗君收邑入三反而不致一入孟嘗君問之對曰有賢者竊假與之以故不致入孟嘗君怒而退魏子居數年人或毀孟嘗君於齊湣王曰孟嘗君將為亂及田甲劫湣王湣王意疑孟嘗君孟嘗君迺奔魏子所與粟賢者聞之乃上書言孟嘗君不作亂請以身為盟遂自剄宮門以明孟嘗君湣王乃驚而蹤跡驗問孟嘗君果無反謀乃復召孟嘗君孟嘗君因謝病歸老於薛湣王許之其後秦亡將呂禮相齊欲困蘇代代乃謂孟嘗君曰周最於齊至厚也而齊王逐之而聽親弗相呂禮者欲取秦也齊秦合則親弗與呂禮重矣有用齊秦必輕君君不如急北兵趨趙以和秦魏收周最以厚行且反齊王之信又禁天下之變齊無秦則天下集齊親弗必走則齊王孰與為其國也於是孟嘗君從其計而呂禮嫉害於孟嘗君孟嘗君懼乃遺秦相穰侯魏冉書曰吾聞秦欲以呂禮收齊齊天下之彊國也子必輕矣齊秦相取以臨三晉呂禮必并相矣是子通齊以重呂禮也若齊免於天下兵其讎子必深矣子不如勸秦王伐齊齊破吾請以所得封子齊破秦畏晉之彊秦必重子以取晉晉國敝於齊而畏秦晉必重子以取秦是子破齊以為功挾晉以為重是子破齊定封秦晉交重子若齊不破呂禮復用子必大窮於是穰侯言於秦昭王伐齊而呂禮亡後齊湣王滅宋益驕欲去孟嘗君孟嘗君恐迺如魏魏昭王以為相西合於秦趙與燕共伐破齊齊湣王亡在莒遂死焉齊襄王立而孟嘗君中立於諸侯無所屬齊襄王新立畏孟嘗君與連和復親薛公文卒謚為孟嘗君諸子爭立而齊魏共滅薛孟嘗絕嗣無後也初馮驩聞孟嘗君好客躡蹻而見之孟嘗君曰先生遠辱何以教文也馮驩曰聞君好士以貧身歸於君孟嘗君置傳舍十日孟嘗君問傳舍長曰客何所為答曰馮先生甚貧猶有一劍耳又蒯緱彈其劍而歌曰長鋏歸來乎食無魚孟嘗君遷之幸舍食有魚矣五日又問傳舍長答曰客復彈劍而歌長鋏歸來乎出無輿孟嘗君遷之代舍出入乘輿車矣五日孟嘗君復問傳舍長舍長答曰先生又嘗彈劍而歌曰長鋏歸來乎無以為家孟嘗君不悅居朞年馮驩無所言孟嘗君時相齊封萬戶於薛其食客三千人邑入不足奉客使人出錢於薛歲餘不入貸錢者多不能與其息客奉將不給孟嘗君憂之問左右何人可使收債於薛者傳舍長曰代舍客馮公形容狀貌甚辯長者無他伎能宜可令收債孟嘗君乃進馮驩而請之曰賓客不知文不肖幸臨文者三千餘人邑入不足以奉賓客故出息錢於薛薛歲不入民頗不與其息今客食恐不給願先生責之馮驩曰諾辭行至薛召取孟嘗君錢者皆會得息錢十萬迺多釀酒買肥牛召諸取錢者能與息者皆來不能與息者亦來皆持取錢之券書合之齊為會日殺牛置酒酒酣乃持券如前合之能與息者與為期貧不能與息者取其券而燒之曰孟嘗君所以貸錢者為民之無者以為本業也所以求息者為無以奉客也今富給者以要期貧窮者燔券書以捐之諸君彊飲食有君如此豈可負哉坐者皆起再拜孟嘗君聞馮驩燒券書怒而使使召驩驩至孟嘗君曰文食客三千人故貸錢於薛文奉邑少而民尚多不以時與其息客食恐不足故請先生收責之聞先生得錢即以多具牛酒而燒券書何馮驩曰然不多具牛酒即不能畢會無以知其有餘不足有餘者為要期不足者雖守而責之十年息愈多急即以逃亡自捐之若急終無以償上則為君好利不愛士民下則有離上抵負之名非所以厲士民彰君聲也焚無用虛債之券捐不可得之虛計令薛民親君而彰君之善聲也君有何疑焉孟嘗君乃拊手而謝之齊王惑於秦楚之毀以為孟嘗君名高其主而擅齊國之權遂廢孟嘗君諸客見孟嘗君廢皆去馮驩曰借臣車一乘可以入秦者必令君重於國而奉邑益廣可乎孟嘗君乃約車幣而遣之馮驩乃西說秦王曰天下之游士馮軾結靷西入秦者無不欲彊秦而弱齊馮軾結靷東入齊者無不欲彊齊而弱秦此雄雌之國也勢不兩立為雄雄者得天下矣秦王跽而問之曰何以使秦無為雌而可馮驩曰王亦知齊之廢孟嘗君乎秦王曰聞之馮驩曰使齊重於天下者孟嘗君也今齊王以毀廢之其心怨必背齊背齊入秦則齊國之情人事之誠盡委之秦齊地可得也豈直為雄也君急使使載幣陰迎孟嘗君不可失時也如有齊覺悟復用孟嘗君則雌雄之所在未可知也秦王大悅迺遣車十乘黃金百鎰以迎孟嘗君馮驩辭以先行至齊說齊王曰天下之游士馮軾結靷東入齊者無不欲彊齊而弱秦者馮軾結靷西入秦者無不欲彊秦而弱齊者夫秦齊雄雌之國秦彊則齊弱矣此勢不兩雄今臣竊聞秦遣使車十乘載黃金百鎰以迎孟嘗君孟嘗君不西則已西入相秦則天下歸之秦為雄而齊為雌雌則臨淄即墨危矣王何不先秦使之未到復孟嘗君而益與之邑以謝之孟嘗君必喜而受之秦雖彊國豈可以請人相而迎之哉折秦之謀而絕其霸彊之略齊王曰善乃使人至境侯秦使秦使車適入齊境使還馳告之王召孟嘗君而復其相位而與其故邑之地又益以千戶秦之使者聞孟嘗君復相齊還車而去矣自齊王毀廢孟嘗君諸客皆去後召而復之馮驩迎之未到孟嘗君太息歎曰文常好客遇客無所敢失食客三千有餘人先生所知也客見文一日廢皆背文而去莫顧文者今賴先生得復其位客亦有何面目復見文乎如復見文者必唾其面而大辱之馮驩結轡下拜孟嘗君下車接之曰先生為客謝乎馮驩曰非為客謝也為君之言失夫物有必至事有固然君知之乎孟嘗君曰愚不知所謂也曰生者必有死物之必至也富貴多士貧賤寡友事之固然也君獨不見夫趣市朝者乎明旦側肩爭門而入日暮之後過市朝者掉臂而不顧非好朝而惡暮所期物忘其中今君失位賓客皆去不足以怨士而徒絕賓客之路願君遇客如故孟嘗君再拜曰敬從命矣聞先生之言敢不奉教焉太史公曰吾嘗過薛其俗閭里率多暴桀子弟與鄒魯殊問其故曰孟嘗君招致天下任俠姦人入薛中蓋六萬餘家矣世之傳孟嘗君好客自喜名不虛矣
