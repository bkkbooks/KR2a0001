body:
  text: 天官書第五中宮天極星其一明者太一常居也旁三星三公或曰子屬後句四星末大星正妃餘三星後宮之屬也環之匡衛十二星藩臣皆曰紫宮前列直斗口三星隨北端兌若見若不曰陰德或曰天一紫宮左三星曰天槍右五星曰天棓後六星絕漢抵營室曰閣道北斗七星所謂旋璣玉衡以齊七政杓攜龍角衡殷南斗魁枕參首用昏建者杓杓自華以西南夜半建者衡衡殷中州河濟之閒平旦建者魁魁海岱以東北也斗為帝車運于中央臨制四鄉分陰陽建四時均五行移節度定諸紀皆繫於斗斗魁戴匡六星曰文昌宮一曰上將二曰次將三曰貴相四曰司命五曰司中六曰司祿在斗魁中貴人之牢魁下六星兩兩相比者名曰三能三能色齊君臣和不齊為乖戾輔星明近輔臣親彊斥小疏弱杓端有兩星一內為矛招搖一外為盾天鋒有句圜十五星屬杓曰賤人之牢其牢中星實則囚多虛則開出天一槍棓矛盾動搖角大兵起東宮蒼龍房心心為明堂大星天王前後星子屬不欲直直則天王失計房為府曰天駟其陰右驂旁有兩星曰衿北一星曰舝東北曲十二星曰旗旗中四星曰天市中六星曰市樓市中星眾者實其虛則秏房南眾星曰騎官左角李右角將大角者天王帝廷其兩旁各有三星鼎足句之曰攝提攝提者直斗杓所指以建時節故曰攝提格亢為疏廟主疾其南北兩大星曰南門氐為天根主疫尾為九子曰君臣斥絕不和箕為敖客曰口舌火犯守角則有戰房心王者惡之也南宮朱鳥權衡衡太微三光之廷匡衛十二星藩臣西將東相南四星執法中端門門左右掖門門內六星諸侯其內五星五帝坐後聚一十五星蔚然曰郎位傍一大星將位也月五星順入軌道司其出所守天子所誅也其逆入若不軌道以所犯命之中坐成形皆群下從謀也金火尤甚廷藩西有隋星五曰少微士大夫權軒轅軒轅黃龍體前大星女主象旁小星御者後宮屬月五星守犯者如衡占東井為水事其西曲星曰鉞鉞北北河南南河兩河天闕閒為關梁輿鬼鬼祠事中白者為質火守南北河兵起穀不登故德成衡觀成潢傷成鉞禍成井誅成質柳為鳥注主木草七星頸為員官主急事張素為廚主觴客翼為羽翮主遠客軫為車主風其旁有一小星曰長沙星星不欲明明與四星等若五星入軫中兵大起軫南眾星曰天庫樓庫有五車車星角若益眾及不具無處車馬西宮咸池曰天五潢五潢五帝車舍火入旱金兵水水中有三柱柱不具兵起奎曰封豕為溝瀆婁為聚眾胃為天倉其南眾星曰廥積昴曰髦頭胡星也為白衣會畢曰罕車為邊兵主弋獵其大星旁小星為附耳附耳搖動有讒亂臣在側昴畢閒為天街其陰陰國陽陽國參為白虎三星直者是為衡石下有三星兌曰罰為斬艾事其外四星左右肩股也小三星隅置曰觜觿為虎首主葆旅事其南有四星曰天廁廁下一星曰天矢矢黃則吉青白黑凶其西有句曲九星三處羅一曰天旗二曰天苑三曰九游其東有大星曰狼狼角變色多盜賊下有四星曰弧直狼狼比地有大星曰南極老人老人見治安不見兵起常以秋分時候之于南郊附耳入畢中兵起北宮玄武虛危危為蓋屋虛為哭泣之事其南有眾星曰羽林天軍軍西為壘或曰鉞旁有一大星為北落北落若微亡軍星動角益希及五星犯北落入軍軍起火金水尤甚火軍憂水水患木土軍吉危東六星兩兩相比曰司空營室為清廟曰離宮閣道漢中四星曰天駟旁一星曰王良王良策馬車騎滿野旁有八星絕漢曰天潢天潢旁江星江星動人涉水杵臼四星在危南匏瓜有青黑星守之魚鹽貴南斗為廟其北建星建星者旗也牽牛為犧牲其北河鼓河鼓大星上將左右左右將婺女其北織女織女天女孫也察日月之行以揆歲星順逆曰東方木主春日甲乙義失者罰出歲星歲星贏縮以其舍命國所在國不可伐可以罰人其趨舍而前曰贏退舍曰縮贏其國有兵不復縮其國有憂將亡國傾敗其所在五星皆從而聚於一舍其下之國可以義致天下以攝提格歲歲陰左行在寅歲星右輔居丑正月與斗牽牛晨出東方名曰監德色蒼蒼有光其失次有應見柳歲早水晚旱歲星出東行十二度百日而止反逆行逆行八度百日復東行歲行三十度十六分度之七率日行十二分度之一十二歲而周天出常東方以晨入於西方用昏單閼歲歲陰在卯星居子以二月與婺女虛危晨出曰降入大有光其失次有應見張其歲大水執徐歲歲陰在辰星居亥以三月與營室東壁晨出曰青章青青甚章其失次有應見軫歲早旱晚水大荒駱歲歲陰在巳星居戌以四月與奎婁晨出曰跰踵熊熊赤色有光其失次有應見亢敦牂歲歲陰在午星居酉以五月與胃昴畢晨出曰開明炎炎有光偃兵唯利公王不利治兵其失次有應見房歲早旱晚水叶洽歲歲陰在未星居申以六月與觜觿參晨出曰長列昭昭有光利行兵其失次有應見箕涒灘歲歲陰在申星居未以七月與東井輿鬼晨出曰大音昭昭白其失次有應見牽牛作鄂歲歲陰在酉星居午以八月與柳七星張晨出曰長王作作有芒國其昌熟穀其失次有應見危有旱而昌有女喪民疾閹茂歲歲陰在戌星居巳以九月與翼軫晨出曰天睢白色大明其失次有應見東壁歲水女喪大淵獻歲歲陰在亥星居辰以十月與角亢晨出曰大章蒼蒼然星若躍而陰出旦是謂正平起師旅其率必武其國有德將有四海其失次有應見婁困敦歲歲陰在子星居卯以十一月與氐房心晨出曰天泉玄色甚明江池其昌不利起兵其失次有應見昂赤奮若歲歲陰在丑星居寅以十二月與尾箕晨出曰天晧黫然黑色甚明其失次有應見參當居不居居之又左右搖未當去去之與他星會其國凶所居久國有德厚其角動乍小乍大若色數變人主有憂其失次舍以下進而東北三月生天棓長四丈末兌進而東南三月生彗星長二丈類彗退而西北三月生天欃長四丈末兌退而西南三月生天槍長數丈兩頭兌謹視其所見之國不可舉事用兵其出如浮如沈其國有土功如沈如浮其野亡色赤而有角其所居國昌迎角而戰者不勝星色赤黃而沈所居野大穰色青白而赤灰所居野有憂歲星入月其野有逐相與太白鬭其野有破軍歲星一曰攝提曰重華曰應星曰紀星營室為清廟歲星廟也察剛氣以處熒惑曰南方火主夏日丙丁禮失罰出熒惑熒惑失行是也出則有兵入則兵散以其舍命國熒惑為勃亂殘賊疾喪饑兵反道二舍以上居之三月有殃五月受兵七月半亡地九月太半亡地因與俱出入國絕祀居之殃還至雖大當小久而至當小反大其南為丈夫喪北為女子喪若角動繞環之及乍前乍後左右殃益大與他星鬭光相逮為害不相逮不害五星皆從而聚于一舍其下國可以禮致天下法出東行十六舍而止逆行二舍六旬復東行自所止數十舍十月而入西方伏行五月出東方其出西方曰反明主命者惡之東行急一日行一度半其行東西南北疾也兵各聚其下用戰順之勝逆之敗熒惑從太白軍憂離之軍卻出太白陰有分軍行其陽有偏將戰當其行太白逮之破軍殺將其入守犯太微軒轅營室主命惡之心為明堂熒惑廟也謹候此曆斗之會以定填星之位曰中央土主季夏日戊己黃帝主德女主象也歲填一宿其所居國吉未當居而居若已去而復還還居之其國得土不乃得女若當居而不居既已居之又西東去其國失土不乃失女不可舉事用兵其居久其國福厚易福薄其一名曰地侯主歲歲行十三度百十二分度之五日行二十八分度之一二十八歲周天其所居五星皆從而聚于一舍其下之國可以重致天下禮德義殺刑盡失而填星乃為之動搖贏為王不寧其縮有軍不復填星其色黃九芒音曰黃鍾宮其失次上二三宿曰贏有主命不成不乃大水失次下二三宿曰縮有后戚其歲不復不乃天裂若地動斗為文太室填星廟天子之星也木星與土合為內亂饑主勿用戰敗水則變謀而更事火為旱金為白衣會若水金在南曰牝牡年穀熟金在北歲偏無火與水合為焠與金合為鑠為喪皆不可舉事用兵大敗土為憂主孼卿大饑戰敗為北軍軍困舉事大敗土與水合穰而擁閼有覆軍其國不可舉事出亡地入得地金為疾為內兵亡地三星若合其宿地國外內有兵與喪改立公王四星合兵喪並起君子憂小人流五星合是為易行有德受慶改立大人掩有四方子孫蕃昌無德受殃若亡五星皆大其事亦大皆小事亦小蚤出者為贏贏者為客晚出者為縮縮者為主人必有天應見於杓星同舍為合相陵為鬭七寸以內必之矣五星色白圜為喪旱赤圜則中不平為兵青圜為憂水黑圜為疾多死黃圜則吉赤角犯我城黃角地之爭白角哭泣之聲青角有兵憂黑角則水意行窮兵之所終五星同色天下偃兵百姓寧昌春風秋雨冬寒夏暑動搖常以此填星出百二十日而逆西行西行百二十日反東行見三百三十日而入入三十日復出東方太歲在甲寅鎮星在東壁故在營室察日行以處位太白曰西方秋日庚辛主殺殺失者罰出太白太白失行以其舍命國其出行十八舍二百四十日而入入東方伏行十一舍百三十日其人西方伏行三舍十六日而出當出不出當入不入是謂失舍不有破軍必有國君之篡其紀上元以攝提格之歲與營室晨出東方至角而入與營室夕出西方至角而入與角晨出入畢與角夕出入畢與畢晨出入箕與畢夕出入箕與箕晨出入柳與箕夕出入柳與柳晨出入營室與柳夕出入營室凡出入東西各五為八歲二百二十日復與營室晨出東方其大率歲一周天其始出東方行遲率日半度一百二十日必逆行一二舍上極而反東行行日一度半一百二十日入其庳近日曰明星柔高遠日曰大囂剛其始出西方行疾率日一度半百二十日上極而行遲日半度百二十日旦入必逆行一二舍而入其庳近日曰大白柔高遠日曰大相剛出以辰戌入以丑未當出不出未當入而入天下偃兵兵在外入未當出而出當入而不入天下起兵有破國其當期出也其國昌其出東為東入東為北方出西為西入西為南方所居久其鄉利易其鄉凶出西至東正西國吉出東至西正東國吉其出不經天經天天下革政小以角動兵起始出大後小兵弱出小後大兵強出高用兵深吉淺凶庳淺吉深凶日方南金居其南日方北金居其北曰贏侯王不寧用兵進吉退凶日方南金居其北日方北金居其南曰縮侯王有憂用兵退吉進凶用兵象太白太白行疾疾行遲遲行角敢戰動搖躁躁圜以靜靜順角所指吉反之皆凶出則出兵入則入兵赤角有戰白角有喪黑圜角憂有水事青圜小角憂有木事黃圜和角有土事有年其已出三日而復有微入入三乃復盛出是謂耎其下國有軍敗將北其已入三日又復微出出三日而復盛入其下國有憂師有糧食兵革遺人用之卒雖眾將為人虜其出西失行外國敗其出東失行中國敗其色大圜黃滜可為好事其圜大赤兵盛不戰太白白比狼赤比心黃比參左肩蒼比參右肩黑比奎大星五星皆從太白而聚乎一舍其下之國可以兵從天下居實有得也居虛無得也行勝色色勝位有位勝無位有色勝無色行得盡勝之出而留桑榆閒疾其下國上而疾未盡其日過參天疾其對國上復下下復上有反將其入月將僇金木星合光其下戰不合兵雖起而不鬭合相毀野有破軍出西方昏而出陰陰兵彊暮食出小弱夜半出中弱雞鳴出大弱是謂陰陷於陽其在東方乘明而出陽陽兵之彊雞鳴出小弱夜半出中弱昏出大弱是謂陽陷於陰犬白伏也以出兵兵有殃其出卯南南勝北方出卯北北勝南方正在卯東國利出酉北北勝南方出酉南南勝北方正在酉西國勝其與列星相犯小戰五星大戰其相犯太白出其南南國敗出其北北國敗行疾武不行文色白五芒出蚤為月蝕晚為天夭及彗星將發其國出東為德舉事左之迎之吉出西為刑舉事右之背之吉反之皆凶太白光見景戰勝晝見而經天是謂爭明彊國弱小國彊女主昌亢為疏廟太白廟也太白大臣也其號上公其他名殷星太正營星觀星宮星明星大衰大澤終星大相天浩序星月緯大司馬位謹候此察日辰之會以治辰星之位曰北方水太陰之精主冬日壬癸刑失者罰出辰星以其宿命國是正四時仲春春分夕出郊奎婁胃東五舍為齊仲夏夏至夕出郊東井輿鬼柳東七舍為楚仲秋秋分夕出郊角亢氐房東四舍為漢仲冬冬至晨出郊東方與尾箕斗牽牛俱西為中國其出入常以辰戌丑未其蚤為月蝕晚為彗星及天夭其時宜效不效為失追兵在外不戰一時不出其時不和四時不出天下大饑其當效而出也色白為旱黃為五穀熟赤為兵黑為水出東方大而白有兵於外解常在東方其赤中國勝其西而赤外國利無兵於外而赤兵起其與太白俱出東方皆赤而角外國大敗中國勝其與太白俱出西方皆赤而角外國利五星分天之中積于東方中國利積于西方外國用兵者利五星皆從辰星而聚于一舍其所舍之國可以法致天下辰星不出太白為客其出太白為主出而與太白不相從野雖有軍不戰出東方太白出西方若出西方太白出東方為格野雖有兵不戰失其時而出為當寒反溫當溫反寒當出不出是謂擊卒兵大起其入太白中而上出破軍殺將客軍勝下出客亡地辰星來抵太白太白不去將死正旗上出破軍殺將客勝下出客亡地視旗所指以命破軍其繞環太白若與鬭大戰客勝兔過太白閒可椷劍小戰客勝兔居太白前軍罷出太白左小戰摩太白有數萬人戰主人吏死出太白右去三尺軍急約戰青角兵憂黑角水赤行窮兵之所終兔七命曰小正辰星天欃安周星細爽能星鉤星其色黃而小出而易處天下之文變而不善矣兔五色青圜憂白圜喪赤圜中不平黑圜吉赤角犯我城黃角地之爭白角號泣之聲其出東方行四舍四十八日其數二十日而反入于東方其出西方行四舍四十八日其數二十日而反入于西方其一候之營室角畢箕柳出房心閒地動辰星之色春青黃夏赤白秋青白而歲熟冬黃而不明即變其色其時不昌春不見大風秋則不實夏不見有六十日之旱月蝕秋不見有兵春則不生冬不見陰雨六十日有流邑夏則不長角亢氐兗州房心豫州尾箕幽州斗江湖牽牛婺女楊州虛危青州營室至東壁并州奎婁胃徐州昴畢冀州觜觿參益州東井輿鬼雍州柳七星張三河翼軫荊州七星為員官辰星廟蠻夷星也兩軍相當日暈暈等力鈞厚長大有勝薄短小無勝重抱大破無抱為和背為不和為分離相去直為自立立侯王破軍殺將負且戴有喜圍在中中勝在外外勝青外赤中以和相去赤外青中以惡相去氣暈先至而後去居軍勝先至先去前利後病後至後去前病後利後至先去前後皆病居軍不勝見而去其發疾雖勝無功見半日以上功大白虹屈短上下兌有者下大流血日暈制勝近期三十日遠期六十日其食食所不利復生生所利而食益盡為主位以其直及日所宿加以日時用命其國也月行中道安寧和平陰閒多水陰事外北三尺陰星北三尺太陰大水兵陽閒驕恣陽星多暴獄太陽大旱喪也角天門十月為四月十一月為五月十二月為六月水發近三尺遠五尺犯四輔輔臣誅行南北河以陰陽言旱水兵喪月蝕歲星其宿地饑若亡熒惑也亂填星也下犯上太白也彊國以戰敗辰星也女亂蝕大角主命者惡之心則為內賊亂也列星其宿地憂月食始日五月者六六月者五五月復六六月者一而五月者五凡百一十三月而復始故月蝕常也日蝕為不臧也甲乙四海之外日月不占丙丁江淮海岱也戊己中州河濟也庚辛華山以西壬癸恆山以北日蝕國君月蝕將相當之國皇星大而赤狀類南極所出其下起兵兵彊其衝不利昭明星大而白無角乍上乍下所出國起兵多變五殘星出正東東方之野其星狀類辰星去地可六丈大賊星出正南南方之野星去地可六丈大而赤數動有光司危星出正西西方之野星去地可六丈大而白類太白獄漢星出正北北方之野星去地可六丈大而赤數動察之中青此四野星所出出非其方其下有兵衝不利四填星所出四隅去地可四丈地維咸光亦出四隅去地可三丈若月始出所見下有亂亂者亡有德者昌燭星狀如太白其出也不行見則滅所燭者城邑亂如星非星如雲非雲命曰歸邪歸邪出必有歸國者星者金之散氣其本曰火星眾國吉少則凶漢者亦金之散氣其本曰水漢星多多水少則旱其大經也天鼓有音如雷非雷音在地而下及地其所往者兵發其下天狗狀如大奔星有聲其下止地類狗所墮及望之如火光炎炎衝天其下圜如數頃田處上兌者則有黃色千里破軍殺將格澤星者如炎火之狀黃白起地而上下大上兌其見也不種而穫不有土功必有大害蚩尤之旗類彗而後曲象旗見則王者征伐四方旬始出於北斗旁狀如雄雞其怒青黑象伏鼈枉矢類大流星蛇行而倉黑望之如有毛羽然長庚如一匹布著天此星見兵起星墜至地則石也河濟之閒時有墜星天精而見景星景星者德星也其狀無常常出於有道之國凡望雲氣仰而望之三四百里平望在桑榆上千餘二千里登高而望之下屬地者三千里雲氣有獸居上者勝自華以南氣下黑上赤嵩高三河之郊氣正赤恆山之北氣下黑上青勃碣海岱之閒氣皆黑江淮之閒氣皆白徒氣白土功氣黃車氣乍高乍下往往而聚騎氣卑而布卒氣摶前卑而後高者疾前方而後高者兌後兌而卑者卻其氣平者其行徐前高而後卑者不止而反氣相遇者卑勝高兌勝方氣來卑而循車通者不過三四日去之五六里見氣來高七八尺者不過五六日去之十餘里見氣來高丈餘二丈者不過三四十日去之五六十里見稍雲精白者其將悍其士怯其大根而前絕遠者當戰青白其前低者戰勝其前赤而仰者戰不勝陣雲如立垣杼雲類杼軸雲摶兩端兌杓雲如繩者居前亙天其半半天其蛪者類闕旗故鉤雲句曲諸此雲見以五色合占而澤摶密其見動人乃有占兵必起合鬭其直王朔所候決於日旁日旁雲氣人主象皆如其形以占故北夷之氣如群畜穹閭南夷之氣類舟船幡旗大水處敗軍場破國之虛下有積錢金寶之上皆有氣不可不察海旁蜄氣象樓臺廣野氣成宮闕然雲氣各象其山川人民所聚積故候息秏者入國邑視封疆田疇之正治城郭室屋門戶之潤澤次至車服畜產精華實息者吉虛秏者凶若煙非煙若雲非雲郁郁紛紛蕭索輪囷是謂卿雲卿雲喜氣也若霧非霧衣冠而不濡見則其域被甲而趨夫雷電蝦虹辟歷夜明者陽氣之動者也春夏則發秋冬則藏故候者無不司之天開縣物地動坼絕山崩及徙川塞谿垘水澹地長澤竭見象城郭門閭閨臬槀枯宮廟邸第人民所次謠俗車服觀民飲食五穀草木觀其所屬倉府廄庫四通之路六畜禽獸所產去就魚鼈鳥鼠觀其所處鬼哭若呼其人逢俉化言誠然凡候歲美惡謹候歲始歲始或冬至日產氣始萌臘明日人眾卒歲一會飲食發陽氣故曰初歲正月旦王者歲首立春日四時之始也四始者候之日而漢魏鮮集臘明正月旦決八風風從南方來大旱西南小旱西方有兵西北戎菽為小雨趣兵北方為中歲東北為上歲東方大水東南民有疾疫歲惡故八風各與其衝對課多者為勝多勝少久勝亟疾勝徐旦至食為麥食至日昳為稷昳至餔為黍餔至下餔為菽下餔至日入為麻欲終日有雲有風有日日當其時者深而多實無雲有風日當其時淺而多實有雲風無日當其時深而少實有日無雲不風當其時者稼有敗如食頃小敗熟五斗米頃大敗則風復起有雲其稼復起各以其時用雲色占種所宜其雨雪若寒歲惡是日光明聽都邑人民之聲聲宮則歲善吉商則有兵徵旱羽水角歲惡或從正月旦比數雨率日食一升至七升而極過之不占數至十二日日直其月占水旱為其環域千里內占則為天下候竟正月月所離列宿日風雲占其國然必察太歲所在在金穰水毀木饑火旱此其大經也正月上甲風從東方宜蠶風從西方若旦黃雲惡冬至短極縣土炭炭動鹿解角蘭根出泉水躍略以知日至要決晷景歲星所在五穀逢昌其對為衝歲乃有殃太史公曰自初生民以來世主曷嘗不曆日月星辰及至五家三代紹而明之內冠帶外夷狄分中國為十有二州仰則觀象於天俯則法類於地天則有日月地則有陰陽天有五星地有五行天則有列宿地則有州域三光者陰陽之精氣本在地而聖人統理之幽厲以往尚矣所見天變皆國殊窟穴家占物怪以合時應其文圖籍禨祥不法是以孔子論六經紀異而說不書至天道命不傳傳其人不待告告非其人雖言不著昔之傳天數者高辛之前重黎於唐虞羲和有夏昆吾殷商巫咸周室史佚萇弘於宋子韋鄭則裨竈在齊甘公楚唐眛趙尹皋魏石申夫天運三十歲一小變百年中變五百載大變三大變一紀三紀而大備此其大數也為國者必貴三五上下各千歲然后天人之際續備太史公推古天變未有可考于今者蓋略以春秋二百四十二年之閒月蝕三十六彗星三見宋襄公時星隕如雨天子微諸侯力政五伯代興更為主命自是之後眾暴寡大并小秦楚吳越夷狄也為彊伯田氏篡齊三家分晉並為戰國爭於攻取兵革更起城邑數屠因以饑饉疾疫焦苦臣主共憂患其察禨祥候星氣尤急近世十二諸侯七國相王言從衡者繼踵而皋唐甘石因時務論其書傳故其占驗淩雜米鹽二十八舍主十二州斗秉兼之所從來久矣秦之疆也候在太白占於狼弧吳楚之疆候在熒惑占於鳥衡燕齊之疆候在辰星占於虛危宋鄭之疆候在歲星占於房心晉之疆亦候在辰星占於參罰及秦并吞三晉燕代自河山以南者中國中國於四海內則在東南為陽陽則日歲星熒惑填星占於街南畢主之其西北則胡貉月氏諸衣旃裘引弓之民為陰陰則月太白辰星占於街北昴主之故中國山川東北流其維首在隴蜀尾沒于勃碣是以秦晉好用兵復占太白太白主中國而胡貉數侵掠獨占辰星辰星出入躁疾常主夷狄其大經也此更為客主人熒惑為孛外則理兵內則理政故曰雖有明天子必視熒惑所在諸侯更彊時菑異記無可錄者秦始皇之時十五年彗星四見久者八十日長或竟天其後秦遂以兵滅六王并中國外攘四夷死人如亂麻因以張楚並起三十年之閒兵相駘藉不可勝數自蚩尤以來未嘗若斯也項羽救鉅鹿枉矢西流山東遂合從諸侯西坑秦人誅屠咸陽漢之興五星聚于東井平城之圍月暈參畢七重諸呂作亂日蝕晝晦吳楚七國叛逆彗星數丈天狗過梁野及兵起遂伏尸流血其下元光元狩蚩尤之旗再見長則半天其後京師師四出誅夷狄者數十年而伐胡尤甚越之亡熒惑守斗朝鮮之拔星茀于河戍兵征大宛星茀招搖此其犖犖大者若至委曲小變不可勝道由是觀之未有不先形見而應隨之者也夫自漢之為天數者星則唐都氣則王朔占歲則魏鮮故甘石曆五星法唯獨熒惑有反逆行逆行所守及他星逆行日月薄蝕皆以為占余觀史記考行事百年之中五星無出而不反逆行反逆行嘗盛大而變色日月薄蝕行南北有時此其大度也故紫宮房心權衡咸池虛危列宿部星此天之五官坐位也為經不移徙大小有差闊狹有常水火金木填星此五星者天之五佐為緯見伏有時所過行贏縮有度日變脩德月變省刑星變結和凡天變過度乃占國君彊大有德者昌弱小飾詐者亡太上脩德其次脩政其次脩救其次脩禳正下無之夫常星之變希見而三光之占亟用日月暈適雲風此天之客氣其發見亦有大運然其與政事俯仰最近天人之符此五者天之感動為天數者必通三五終始古今深觀時變察其精粗則天官備矣蒼帝行德天門為之開赤帝行德天牢為之空黃帝行德天夭為之起風從西北來必以庚辛一秋中五至大赦三至小赦白帝行德以正月二十日二十一日月暈圍常大赦載謂有太陽也一曰白帝行德畢昴為之圍圍三暮德乃成不三暮及圍不合德不成二曰以辰圍不出其旬黑帝行德天關為之動天行德天子更立年不德風雨破石三能三衡者天廷也客星出天廷有奇令
