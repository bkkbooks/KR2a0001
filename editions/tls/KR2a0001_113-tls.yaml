body:
  text: 南越列傳第五十三南越王尉佗者真定人也姓趙氏秦時已并天下略定楊越置桂林南海象郡以謫徙民與越雜處十三歲佗秦時用為南海龍川令至二世時南海尉任囂病且死召龍川令趙佗語曰聞陳勝等作亂秦為無道天下苦之項羽劉季陳勝吳廣等州各共興軍聚眾虎爭天下中國擾亂未知所安豪傑畔秦相立南海僻遠吾恐盜兵侵地至此吾欲興兵絕新道自備待諸侯變會病甚且番禺負山險阻南海東西數千里頗有中國人相輔此亦一州之主也可以立國郡中長吏無足與言者故召公告之即被佗書行南海尉事囂死佗即移檄告橫浦陽山湟谿關曰盜兵且至急絕道聚兵自守因稍以法誅秦所置長吏以其黨為假守秦已破滅佗即擊并桂林象郡自立為南越武王高帝已定天下為中國勞苦故釋佗弗誅漢十一年遣陸賈因立佗為南越王與剖符通使和集百越毋為南邊患害與長沙接境高后時有司請禁南越關市鐵器佗曰高帝立我通使物今高后聽讒臣別異蠻夷隔絕器物此必長沙王計也欲倚中國擊滅南越而并王之自為功也於是佗乃自尊號為南越武帝發兵攻長沙邊邑敗數縣而去焉高后遣將軍隆慮侯竈往擊之會暑溼士卒大疫兵不能踰嶺歲餘高后崩即罷兵佗因此以兵威邊財物賂遺閩越西甌駱役屬焉東西萬餘里迺乘黃屋左纛稱制與中國侔及孝文帝元年初鎮撫天下使告諸侯四夷從代來即位意喻盛德焉乃為佗親冢在真定置守邑歲時奉祀召其從昆弟尊官厚賜寵之詔丞相陳平等舉可使南越者平言好畤陸賈先帝時習使南越迺召賈以為太中大夫往使因讓佗自立為帝曾無一介之使報者陸賈至南越王甚恐為書謝稱曰蠻夷大長老夫臣佗前日高后隔異南越竊疑長沙王讒臣又遙聞高后盡誅佗宗族掘燒先人冢以故自棄犯長沙邊境且南方卑溼蠻夷中閒其東閩越千人眾號稱王其西甌駱裸國亦稱王老臣妄竊帝號聊以自娛豈敢以聞天王哉乃頓首謝願長為藩臣奉貢職於是乃下令國中曰吾聞兩雄不俱立兩賢不並世皇帝賢天子也自今以後去帝制黃屋左纛陸賈還報孝文帝大說遂至孝景時稱臣使人朝請然南越其居國竊如故號名其使天子稱王朝命如諸侯至建元四年卒佗孫胡為南越王此時閩越王郢興兵擊南越邊邑胡使人上書曰兩越俱為藩臣毋得擅興兵相攻擊今閩越興兵侵臣臣不敢興兵唯天子詔之於是天子多南越義守職約為興師遣兩將軍往討閩越兵未踰嶺閩越王弟餘善殺郢以降於是罷兵天子使莊助往諭意南越王胡頓首曰天子乃為臣興兵討閩越死無以報德遣太子嬰齊入宿衛謂助曰國新被寇使者行矣胡方日夜裝入見天子助去後其大臣諫胡曰漢興兵誅郢亦行以驚動南越且先王昔言事天子期無失禮要之不可以說好語入見入見則不得復歸亡國之勢也於是胡稱病竟不入見後十餘歲胡實病甚太子嬰齊請歸胡薨謚為文王嬰齊代立即藏其先武帝璽嬰齊其入宿衛在長安時取邯鄲樛氏女生子興及即位上書請立樛氏女為后興為嗣漢數使使者風諭嬰齊嬰齊尚樂擅殺生自恣懼入見要用漢法比內諸侯固稱病遂不入見遣子次公入宿衛嬰齊薨謚為明王太子興代立其母為太后太后自未為嬰齊姬時嘗與霸陵人安國少季通及嬰齊薨後元鼎四年漢使安國少季往諭王王太后以入朝比內諸侯令辯士諫大夫終軍等宣其辭勇士魏臣等輔其缺衛尉路博德將兵屯桂陽待使者王年少太后中國人也嘗與安國少季通其使復私焉國人頗知之多不附太后太后恐亂起亦欲倚漢威數勸王及群臣求內屬即因使者上書請比內諸侯三歲一朝除邊關於是天子許之賜其丞相呂嘉銀印及內史中尉太傅印餘得自置除其故黥劓刑用漢法比內諸侯使者皆留填撫之王王太后飭治行裝重齎為入朝具其相呂嘉年長矣相三王宗族官仕為長吏者七十餘人男盡尚王女女盡嫁王子兄弟宗室及蒼梧秦王有連其居國中甚重越人信之多為耳目者得眾心愈於王王之上書數諫止王王弗聽有畔心數稱病不見漢使者使者皆注意嘉勢未能誅王王太后亦恐嘉等先事發乃置酒介漢使者權謀誅嘉等使者皆東鄉太后南鄉王北鄉相嘉大臣皆西鄉侍坐飲嘉弟為將將卒居宮外酒行太后謂嘉曰南越內屬國之利也而相君苦不便者何也以激怒使者使者狐疑相杖遂莫敢發嘉見耳目非是即起而出太后怒欲鏦嘉以矛王止太后嘉遂出分其弟兵就舍稱病不肯見王及使者乃陰與大臣作亂王素無意誅嘉嘉知之以故數月不發太后有淫行國人不附欲獨誅嘉等力又不能天子聞嘉不聽王王王太后弱孤不能制使者怯無決又以為王王太后已附漢獨呂嘉為亂不足以興兵欲使莊參以二千人往使參曰以好往數人足矣以武往二千人無足以為也辭不可天不罷參也郟壯士故濟北相韓千秋奮曰以區區之越又有王太后應獨相呂嘉為害願得勇士二百人必斬嘉以報於是天子遣千秋與王太后弟樛樂將二千人往入越境呂嘉等乃遂反下令國中曰王年少太后中國人也又與使者亂專欲內屬盡持先王寶器入獻天子以自媚多從人行至長安虜賣以為僮僕取自脫一時之利無顧趙氏社稷為萬世慮計之意乃與其弟將卒攻殺王太后及漢使者遣人告蒼梧秦王及其諸郡縣立明王長男越妻子術陽侯建德為王而韓千秋兵入破數小邑其後越直開道給食未至番禺四十里越以兵擊千秋等遂滅之使人函封漢使者節置塞上好為謾辭謝罪發兵守要害處於是天子曰韓千秋雖無成功亦軍鋒之冠封其子延年為成安侯樛樂其姊為王太后首願屬漢封其子廣德為龍亢侯乃下赦曰天子微諸侯力政譏臣不討賊今呂嘉建德等反自立晏如令罪人及江淮以南樓船十萬師往討之元鼎五年秋衛尉路博德為伏波將軍出桂陽下匯水主爵都尉楊僕為樓船將軍出豫章下橫浦故歸義越侯二人為戈船下厲將軍出零陵或下離水或抵蒼梧使馳義侯因巴蜀罪人發夜郎兵下牂柯江咸會番禺元鼎六年冬樓船將軍將精卒先陷尋陝破石門得越船粟因推而前挫越鋒以數萬人待伏波伏波將軍將罪人道遠會期後與樓船會乃有千餘人遂俱進樓船居前至番禺建德嘉皆城守樓船自擇便處居東南面伏波居西北面會暮樓船攻敗越人縱火燒城越素聞伏波名日暮不知其兵多少伏波乃為營遣使者招降者賜印復縱令相招樓船力攻燒敵反驅而入伏波營中犁旦城中皆降伏波呂嘉建德已夜與其屬數百人亡入海以船西去伏波又因問所得降者貴人以知呂嘉所之遣人追之以其故校尉司馬蘇弘得建德封為海常侯越郎都稽得嘉封為臨蔡侯蒼梧王趙光者越王同姓聞漢兵至及越揭陽令定自定屬漢越桂林監居翁諭甌駱屬漢皆得為侯戈船下厲將軍兵及馳義侯所發夜郎兵未下南越已平矣遂為九郡伏波將軍益封樓船將軍兵以陷堅為將梁侯自尉佗初王後五世九十三歲而國亡焉太史公曰尉佗之王本由任囂遭漢初定列為諸侯隆慮離溼疫佗得以益驕甌駱相攻南越動搖漢兵臨境嬰齊入朝其後亡國徵自樛女呂嘉小忠令佗無後樓船從欲怠傲失惑伏波困窮智慮愈殖因禍為福成敗之轉譬若糾墨
