body:
  text: 殷本紀殷契母曰簡狄有娀氏之女為帝嚳次妃三人行浴見玄鳥墮其卵簡狄取吞之因孕生契契長而佐禹治水有功帝舜乃命契曰百姓不親五品不訓汝為司徒而敬敷五教五教在寬封于商賜姓子氏契興於唐虞大禹之際功業著於百姓百姓以平契卒子昭明立昭明卒子相土立相土卒子昌若立昌若卒子曹圉立曹圉卒子冥立冥卒子振立振卒子微立微卒子報丁立報丁卒子報乙立報乙卒子報丙立報丙卒子主壬立主壬卒子主癸立主癸卒子天乙立是為成湯成湯自契至湯八遷湯始居亳從先王居作帝誥湯征諸侯葛伯不祀湯始伐之湯曰予有言人視水見形視民知治不伊尹曰明哉言能聽道乃進君國子民為善者皆在王官勉哉勉哉湯曰汝不能敬命予大罰殛之無有攸赦作湯征伊尹名阿衡阿衡欲奸湯而無由乃為有莘氏媵臣負鼎俎以滋味說湯致于王道或曰伊尹處士湯使人聘迎之五反然後肯往從湯言素王及九主之事湯舉任以國政伊尹去湯適夏既醜有夏復歸于亳入自北門遇女鳩女房作女鳩女房湯出見野張網四面祝曰自天下四方皆入吾網湯曰嘻盡之矣乃去其三面祝曰欲左左欲右右不用命乃入吾網諸侯聞之曰湯德至矣及禽獸當是時夏桀為虐政淫荒而諸侯昆吾氏為亂湯乃興師率諸侯伊尹從湯湯自把鉞以伐昆吾遂伐桀湯曰格女眾庶來女悉聽朕言匪台小子敢行舉亂有夏多罪予維聞女眾言夏氏有罪予畏上帝不敢不正今夏多罪天命殛之今女有眾女曰我君不恤我眾舍我嗇事而割政女其曰有罪其柰何夏王率止眾力率奪夏國有眾率怠不和曰是日何時喪予與女皆亡夏德若茲今朕必往爾尚及予一人致天之罰予其大理女女毋不信朕不食言女不從誓言予則帑僇女無有攸赦以告令師作湯誓於是湯曰吾甚武號曰武王桀敗於有娀之虛桀犇於鳴條夏師敗績湯遂伐三㚇俘厥寶玉義伯仲伯作典寶湯既勝夏欲遷其社不可作夏社伊尹報於是諸侯畢服湯乃踐天子位平定海內湯歸至于泰卷陶中𤳹作誥既絀夏命還亳作湯誥維三月王自至於東郊告諸侯群后毋不有功於民勤力迺事予乃大罰殛女毋予怨曰古禹皋陶久勞于外其有功乎民民乃有安東為江北為濟西為河南為淮四瀆已修萬民乃有居后稷降播農殖百穀三公咸有功于民故后有立昔蚩尤與其大夫作亂百姓帝乃弗予有狀先王言不可不勉曰不道毋之在國女毋我怨以令諸侯伊尹作咸有一德咎單作明居湯乃改正朔易服色上白朝會以晝湯崩太子太丁未立而卒於是迺立太丁之弟外丙是為帝外丙帝外丙即位三年崩立外丙之弟中壬是為帝中壬帝中壬即位四年崩伊尹迺立太丁之子太甲太甲成湯適長孫也是為帝太甲帝太甲元年伊尹作伊訓作肆命作徂后帝太甲既立三年不明暴虐不遵湯法亂德於是伊尹放之於桐宮三年伊尹攝行政當國以朝諸侯帝太甲居桐宮三年悔過自責反善於是伊尹迺迎帝太甲而授之政帝太甲修德諸侯咸歸殷百姓以寧伊尹嘉之迺作太甲訓三篇襃帝太甲稱太宗太宗崩子沃丁立帝沃丁之時伊尹卒既葬伊尹於亳咎單遂訓伊尹事作沃丁沃丁崩弟太庚立是為帝太庚帝太庚崩子帝小甲立帝小甲崩弟雍己立是為帝雍己殷道衰諸侯或不至帝雍己崩弟太戊立是為帝太戊帝太戊立伊陟為相亳有祥桑榖共生於朝一暮大拱帝太戊懼問伊陟伊陟曰臣聞妖不勝德帝之政其有闕與帝其修德太戊從之而祥桑枯死而去伊陟贊言于巫咸巫咸治王家有成作咸艾作太戊帝太戊贊伊陟于廟言弗臣伊陟讓作原命殷復興諸侯歸之故稱中宗中宗崩子帝中丁立帝中丁遷于隞河亶甲居相祖乙遷于邢帝中丁崩弟外壬立是為帝外壬仲丁書闕不具帝外壬崩弟河亶甲立是為帝河亶甲河亶甲時殷復衰河亶甲崩子帝祖乙立帝祖乙立殷復興巫賢任職祖乙崩子帝祖辛立帝祖辛崩弟沃甲立是為帝沃甲帝沃甲崩立沃甲兄祖辛之子祖丁是為帝祖丁帝祖丁崩立弟沃甲之子南庚是為帝南庚帝南庚崩立帝祖丁之子陽甲是為帝陽甲帝陽甲之時殷衰自中丁以來廢適而更立諸弟子弟子或爭相代立比九世亂於是諸侯莫朝帝陽甲崩弟盤庚立是為帝盤庚帝盤庚之時殷已都河北盤庚渡河南復居成湯之故居迺五遷無定處殷民咨胥皆怨不欲徙盤庚乃告諭諸侯大臣曰昔高后成湯與爾之先祖俱定天下法則可修舍而弗勉何以成德乃遂涉河南治亳行湯之政然後百姓由寧殷道復興諸侯來朝以其遵成湯之德也帝盤庚崩弟小辛立是為帝小辛帝小辛立殷復衰百姓思盤庚迺作盤庚三篇帝小辛崩弟小乙立是為帝小乙帝小乙崩子帝武丁立帝武丁即位思復興殷而未得其佐三年不言政事決定於冢宰以觀國風武丁夜夢得聖人名曰說以夢所見視群臣百吏皆非也於是迺使百工營求之野得說於傅險中是時說為胥靡築於傅險見於武丁武丁曰是也得而與之語果聖人舉以為相殷國大治故遂以傅險姓之號曰傅說帝武丁祭成湯明日有飛雉登鼎耳而呴武丁懼祖己曰王勿憂先修政事祖己乃訓王曰唯天監下典厥義降年有永有不永非天夭民中絕其命民有不若德不聽罪天既附命正厥德乃曰其柰何嗚呼王嗣敬民罔非天繼常祀毋禮于棄道武丁修政行德天下咸驩殷道復興帝武丁崩子帝祖庚立祖己嘉武丁之以祥雉為德立其廟為高宗遂作高宗肜日及訓帝祖庚崩弟祖甲立是為帝甲帝甲淫亂殷復衰帝甲崩子帝廩辛立帝廩辛崩弟庚丁立是為帝庚丁帝庚丁崩子帝武乙立殷復去亳徙河北帝武乙無道為偶人謂之天神與之博令人為行天神不勝乃僇辱之為革囊盛血卬而射之命曰射天武乙獵於河渭之閒暴雷武乙震死子帝太丁立帝太丁崩子帝乙立帝乙立殷益衰帝乙長子曰微子啟啟母賤不得嗣少子辛辛母正后辛為嗣帝乙崩子辛立是為帝辛天下謂之紂帝紂資辨捷疾聞見甚敏材力過人手格猛獸知足以距諫言足以飾非矜人臣以能高天下以聲以為皆出己之下好酒淫樂嬖於婦人愛妲己妲己之言是從於是使師涓作新淫聲北里之舞靡靡之樂厚賦稅以實鹿臺之錢而盈鉅橋之粟益收狗馬奇物充仞宮室益廣沙丘苑臺多取野獸蜚鳥置其中慢於鬼神大冣樂戲於沙丘以酒為池縣肉為林使男女倮相逐其閒為長夜之飲百姓怨望而諸侯有畔者於是紂乃重刑辟有炮格之法以西伯昌九侯鄂侯為三公九侯有好女入之紂九侯女不憙淫紂怒殺之而醢九侯鄂侯爭之彊辨之疾并脯鄂侯西伯昌聞之竊嘆崇侯虎知之以告紂紂囚西伯羑里西伯之臣閎夭之徒求美女奇物善馬以獻紂紂乃赦西伯西伯出而獻洛西之地以請除炮格之刑紂乃許之賜弓矢斧鉞使得征伐為西伯而用費中為政費中善諛好利殷人弗親紂又用惡來惡來善毀讒諸侯以此益疏西伯歸乃陰修德行善諸侯多叛紂而往歸西伯西伯滋大紂由是稍失權重王子比干諫弗聽商容賢者百姓愛之紂廢之及西伯伐飢國滅之紂之臣祖伊聞之而咎周恐奔告紂曰天既訖我殷命假人元龜無敢知吉非先王不相我後人維王淫虐用自絕故天弁我不有安食不虞知天性不迪率典今我民罔不欲喪曰天曷不降威大命胡不至今王其柰何紂曰我生不有命在天乎祖伊反曰紂不可諫矣西伯既卒周武王之東伐至盟津諸侯叛殷會周者八百諸侯皆曰紂可伐矣武王曰爾未知天命乃復歸紂愈淫亂不止微子數諫不聽乃與大師少師謀遂去比干曰為人臣者不得不以死爭迺強諫紂紂怒曰吾聞聖人心有七竅剖比干觀其心箕子懼乃詳狂為奴紂又囚之殷之大師少師乃持其祭樂器奔周周武王於是遂率諸侯伐紂紂亦發兵距之牧野甲子日紂兵敗紂走入登鹿臺衣其寶玉衣赴火而死周武王遂斬紂頭縣之大白旗殺妲己釋箕子之囚封比干之墓表商容之閭封紂子武庚祿父以續殷祀令修行盤庚之政殷民大說於是周武王為天子其後世貶帝號號為王而封殷後為諸侯屬周周武王崩武庚與管叔蔡叔作亂成王命周公誅之而立微子於宋以續殷後焉太史公曰余以頌次契之事自成湯以來采於書詩契為子姓其後分封以國為姓有殷氏來氏宋氏空桐氏稚氏北殷氏目夷氏孔子曰殷路車為善而色尚白
