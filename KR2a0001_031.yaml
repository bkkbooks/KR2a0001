body:
  text: 世家吳太伯世家第一吳太伯太伯弟仲雍皆周太王之子而王季歷之兄也季歷賢而有聖子昌太王欲立季歷以及昌於是太伯仲雍二人乃奔荊蠻文身斷髮示不可用以避季歷季歷果立是為王季而昌為文王太伯之奔荊蠻自號句吳荊蠻義之從而歸之千餘家立為吳太伯太伯卒無子弟仲雍立是為吳仲雍仲雍卒子季簡立季簡卒子叔達立叔達卒子周章立是時周武王克殷求太伯仲雍之後得周章周章已君吳因而封之乃封周章弟虞仲於周之北故夏虛是為虞仲列為諸侯周章卒子熊遂立熊遂卒子柯相立柯相卒子強鳩夷立強鳩夷卒子餘橋疑吾立餘橋疑吾卒子柯盧立柯盧卒子周繇立周繇卒子屈羽立屈羽卒子夷吾立夷吾卒子禽處立禽處卒子轉立轉卒子頗高立頗高卒子句卑立是時晉獻公滅周北虞公以開晉伐虢也句卑卒子去齊立去齊卒子壽夢立壽夢立而吳始益大稱王自太伯作吳五世而武王克殷封其後為二其一虞在中國其一吳在夷蠻十二世而晉滅中國之虞中國之虞滅二世而夷蠻之吳興大凡從太伯至壽夢十九世王壽夢二年楚之亡大夫申公巫臣怨楚將子反而奔晉自晉使吳教吳用兵乘車令其子為吳行人吳於是始通於中國吳伐楚十六年楚共王伐吳至衡山二十五年王壽夢卒壽夢有子四人長曰諸樊次曰餘祭次曰餘眛次曰季札季札賢而壽夢欲立之季札讓不可於是乃立長子諸樊攝行事當國王諸樊元年諸樊已除喪讓位季札季札謝曰曹宣公之卒也諸侯與曹人不義曹君將立子臧子臧去之以成曹君君子曰能守節矣君義嗣誰敢干君有國非吾節也札雖不材願附於子臧之義吳人固立季札季札棄其室而耕乃舍之秋吳伐楚楚敗我師四年晉平公初立十三年王諸樊卒有命授弟餘祭欲傳以次必致國於季札而止以稱先王壽夢之意且嘉季札之義兄弟皆欲致國令以漸至焉季札封於延陵故號曰延陵季子王餘祭三年齊相慶封有罪自齊來奔吳吳豫慶封朱方之縣以為奉邑以女妻之富於在齊四年吳使季札聘於魯請觀周樂為歌周南召南曰美哉始基之矣猶未也然勤而不怨歌邶鄘衛曰美哉淵乎憂而不困者也吾聞衛康叔武公之德如是是其衛風乎歌王曰美哉思而不懼其周之東乎歌鄭曰其細已甚民不堪也是其先亡乎歌齊曰美哉泱泱乎大風也哉表東海者其太公乎國未可量也歌豳曰善哉蕩蕩乎樂而不淫其周公之東乎歌秦曰此之謂夏聲夫能夏則大大之至也其周之舊乎歌魏曰美哉渢渢乎大而寬儉而易行以德輔此則盟主也歌唐曰思深哉其有陶唐氏之遺風乎不然何憂之遠也非令德之後誰能若是歌陳曰國無主其能久乎自鄶以下無譏焉歌小雅曰美哉思而不二怨而不言其周德之衰乎猶有先王之遺民也歌大雅曰廣哉熙熙乎曲而有直體其文王之德乎歌頌曰至矣哉直而不倨曲而不詘近而不逼遠而不攜遷而不淫復而不厭哀而不愁樂而不荒用而不匱廣而不宣施而不費取而不貪處而不砥行而不流五聲和八風平節有度守有序盛德之所同也見舞象簫南籥者曰美哉猶有感見舞大武曰美哉周之盛也其若此乎見舞韶護者曰聖人之弘也猶有慚德聖人之難也見舞大夏曰美哉勤而不德非禹其誰能及之見舞招簫曰德至矣哉大矣如天之無不燾也如地之無不載也雖甚盛德無以加矣觀止矣若有他樂吾不敢觀去魯遂使齊説晏平仲曰子速納邑與政無邑無政乃免於難齊國之政將有所歸未得所歸難未息也故晏子因陳桓子以納政與邑是以免於欒高之難去齊使於鄭見子産如舊交謂子産曰鄭之執政侈難將至矣政必及子子為政慎以禮不然鄭國將敗去鄭適衛説蘧瑗史狗史鰌公子荊公叔發公子朝曰衛多君子未有患也自衛如晉將舍於宿聞鍾聲曰異哉吾聞之辨而不德必加於戮夫子獲罪於君以在此懼猶不足而又可以畔乎夫子之在此猶燕之巢于幕也君在殯而可以樂乎遂去之文子聞之終身不聽琴瑟適晉説趙文子韓宣子魏獻子曰晉國其萃於三家乎將去謂叔向曰吾子勉之君侈而多良大夫皆富政將在三家吾子直必思自免於難季札之初使北過徐君徐君好季札劍口弗敢言季札心知之為使上國未獻還至徐徐君已死於是乃解其寶劍繫之徐君冢樹而去從者曰徐君已死尚誰豫乎季子曰不然始吾心已許之豈以死倍吾心哉七年楚公子圍弒其王夾敖而代立是為靈王十年楚靈王會諸侯而以伐吳之朱方以誅齊慶封吳亦攻楚取三邑而去十一年楚伐吳至雩婁十二年楚復來伐次於乾溪楚師敗走十七年王餘祭卒弟餘眛立王餘眛二年楚公子棄疾弒其君靈王代立焉四年王餘眛卒欲授弟季札季札讓逃去於是吳人曰先王有命兄卒弟代立必致季子季子今逃位則王餘眛後立今卒其子當代乃立王餘眛之子僚為王王僚二年公子光伐楚敗而亡王舟光懼襲楚復得王舟而還五年楚之亡臣伍子胥來奔公子光客之公子光者王諸樊之子也常以為吾父兄弟四人當傳至季子季子即不受國光父先立即不傳季子光當立陰納賢士欲以襲王僚八年吳使公子光伐楚敗楚師迎楚故太子建母於居巢以歸因北伐敗陳蔡之師九年公子光伐楚拔居巢鍾離初楚邊邑卑梁氏之處女與吳邊邑之女爭桑二女家怒相滅兩國邊邑長聞之怒而相攻滅吳之邊邑吳王怒故遂伐楚取兩都而去伍子胥之初奔吳説吳王僚以伐楚之利公子光曰胥之父兄為僇於楚欲自報其仇耳未見其利於是伍員知光有他志乃求勇士專諸見之光光喜乃客伍子胥子胥退而耕於野以待專諸之事十二年冬楚平王卒十三年春吳欲因楚喪而伐之使公子蓋餘燭庸以兵圍楚之六灊使季札於晉以觀諸侯之變楚發兵絶吳兵後吳兵不得還於是吳公子光曰此時不可失也告專諸曰不索何獲我真王嗣當立吾欲求之季子雖至不吾廢也專諸曰王僚可殺也母老子弱而兩公子將兵攻楚楚絶其路方今吳外困於楚而內空無骨鯁之臣是無奈我何光曰我身子之身也四月丙子光伏甲士於窟室而謁王僚飲王僚使兵陳於道自王宮至光之家門階戶席皆王僚之親也人夾持鈹公子光詳為足疾入于窟室使專諸置匕首於炙魚之中以進食手匕首刺王僚鈹交於胸遂弒王僚公子光竟代立為王是為吳王闔廬闔廬乃以專諸子為卿季子至曰苟先君無廢祀民人無廢主社稷有奉乃吾君也吾敢誰怨乎哀死事生以待天命非我生亂立者從之先人之道也復命哭僚墓復位而待吳公子燭庸蓋餘二人將兵遇圍於楚者聞公子光弒王僚自立乃以其兵降楚楚封之於舒王闔廬元年舉伍子胥為行人而與謀國事楚誅伯州犂其孫伯嚭亡奔吳吳以為大夫三年吳王闔廬與子胥伯嚭將兵伐楚拔舒殺吳亡將二公子光謀欲入郢將軍孫武曰民勞未可待之四年伐楚取六與灊五年伐越敗之六年楚使子常囊瓦伐吳迎而擊之大敗楚軍於豫章取楚之居巢而還九年吳王闔廬請伍子胥孫武曰始子之言郢未可入令果如何二子對曰楚將子常貪而唐蔡皆怨之王必欲大伐必得唐蔡乃可闔廬從之悉興師與唐蔡西伐楚至於漢水楚亦發兵拒吳夾水陳吳王闔廬弟夫概欲戰闔廬弗許夫概曰王已屬臣兵兵以利為上尚何待焉遂以其部五千人襲冒楚楚兵大敗走於是吳王遂縱兵追之比至郢五戰楚五敗楚昭王亡出郢奔鄖鄖公弟欲弒昭王昭王與鄖公奔隨而吳兵遂入郢子胥伯嚭鞭平王之尸以報父讎十年春越聞吳王之在郢國空乃伐吳吳使別兵擊越楚告急秦秦遣兵救楚擊吳吳師敗闔廬弟夫概見秦越交敗吳吳王留楚不去夫概亡歸吳而自立為吳王闔廬聞之乃引兵歸攻夫概夫概敗奔楚楚昭王乃得以九月復入郢而封夫概於堂溪為堂溪氏十一年吳王使太子夫差伐楚取番楚恐而去郢徙鄀十五年孔子相魯十九年夏吳伐越越王句踐迎擊之檇李越使死士挑戰三行造吳師呼自剄吳師觀之越因伐吳敗之姑蘇傷吳王闔廬指軍卻七里吳王病傷而死闔廬使立太子夫差謂曰爾而忘句踐殺汝父乎對曰不敢三年乃報越王夫差元年以大夫伯嚭為太宰習戰射常以報越為志二年吳王悉精兵以伐越敗之夫椒報姑蘇也越王句踐乃以甲兵五千人棲於會稽使大夫種因吳太宰嚭而行成請委國為臣妾吳王將許之伍子胥諫曰昔有過氏殺斟灌以伐斟尋滅夏后帝相帝相之妃后緡方娠逃於有仍而生少康少康為有仍牧正有過又欲殺少康少康奔有虞有虞思夏德於是妻之以二女而邑之於綸有田一成有衆一旅後遂收夏衆撫其官職使人誘之遂滅有過氏復禹之績祀夏配天不失舊物今吳不如有過之強而句踐大於少康今不因此而滅之又將寬之不亦難乎且句踐為人能辛苦今不滅後必悔之吳王不聽聽太宰嚭卒許越平與盟而罷兵去七年吳王夫差聞齊景公死而大臣爭寵新君弱乃興師北伐齊子胥諫曰越王句踐食不重味衣不重采弔死問疾且欲有所用其衆此人不死必為吳患今越在腹心疾而王不先而務齊不亦謬乎吳王不聽遂北伐齊敗齊師於艾陵至繒召魯哀公而徵百牢季康子使子貢以周禮説太宰嚭乃得止因留略地於齊魯之南九年為騶伐魯至與魯盟乃去十年因伐齊而歸十一年復北伐齊越王句踐率其衆以朝吳厚獻遺之吳王喜唯子胥懼曰是棄吳也諫曰越在腹心今得志於齊猶石田無所用且盤庚之誥有顛越勿遺商之以興吳王不聽使子胥於齊子胥屬其子於齊鮑氏還報吳王吳王聞之大怒賜子胥屬鏤之劍以死將死曰樹吾墓上以梓令可為器抉吾眼置之吳東門以觀越之滅吳也齊鮑氏弒齊悼公吳王聞之哭於軍門外三日乃從海上攻齊齊人敗吳吳王乃引兵歸十三年吳召魯衛之君會於橐皋十四年春吳王北會諸侯於黃池欲霸中國以全周室六月丙子越王句踐伐吳乙酉越五千人與吳戰丙戌虜吳太子友丁亥入吳吳人告敗於王夫差夫差惡其聞也或泄其語吳王怒斬七人於幕下七月辛丑吳王與晉定公爭長吳王曰於周室我為長晉定公曰於姬姓我為伯趙鞅怒將伐吳乃長晉定公吳王已盟與晉別欲伐宋太宰嚭曰可勝而不能居也乃引兵歸國國亡太子內空王居外久士皆罷敝於是乃使厚幣以與越平十五年齊田常殺簡公十八年越益強越王句踐率兵復伐敗吳師於笠澤楚滅陳二十年越王句踐復伐吳一二十一年遂圍吳二十三年十一月丁卯越敗吳越王句踐欲遷吳王夫差於甬東豫百家居之吳王曰孤老矣不能事君王也吾悔不用子胥之言自令陷此遂自剄死越王滅吳誅太宰嚭以為不忠而歸太史公曰孔子言太伯可謂至德矣三以天下讓民無得而稱焉余讀春秋古文乃知中國之虞與荊蠻句吳兄弟也延陵季子之仁心慕義無窮見微而知清濁嗚呼又何其閎覽博物君子也
