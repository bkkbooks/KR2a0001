元年秦尉錯來擊我襄韓釐王咎元年四圍殺主父與齊燕共滅中山四魯文公元年十七二十九佐趙滅中山二十一十三任鄙為漢中守二與秦戰我不利二五五十八三十田甲劫王相薛文走二十二十四白起擊伊闕斬首二十四萬三佐韓擊秦秦敗我兵伊闕三秦敗我伊闕斬首二十四萬虜將喜六六十九三十一二十三十五魏冉免相四四七七迎婦秦二十三十二二十四十六五五秦拔我宛城八八二十一三十三二十五十七魏入河東四百里六芒卯以詐見重六與秦武遂地方二百里九九二十二三十四二十六十八客卿錯擊魏至軹取城大小六十一七秦擊我取城大小六十一七十十二十三三十五二十七十九十月為帝十二月復為王任鄙卒八八十一秦拔我桂陽十一二十四三十六為東帝二月復為王二十八二十九秦拔我新垣曲陽之城九十二十二二十五三十七二十九二十一魏納安邑及河內十宋王死我溫十秦敗我兵夏山十三十三二十六三十八齊滅宋三十二十二蒙武擊齊十一十一十四與秦會中陽十四與秦會宛二十七三十九秦拔我列城九三十一二十三尉斯離與韓魏燕趙共擊齊破之十二與秦擊齊濟西與秦王會西周十二與秦擊齊濟西與秦王會西周十五取齊昔陽十五取齊淮北二十八與秦三晉擊齊燕獨入至臨災取其寶器四十五國共擊湣王王走莒三十二二十四與楚會穰十三秦拔我安城兵至大梁而還十三十六十六與秦王會穰二十九齊襄王法章元年三十三二十五十四大水衛懷君元年十四與秦會兩周間十七秦拔我兩城十七三十二三十四二十六魏冉復為丞相十五十五十八秦拔我石城十八三十一三三十五二十七擊趙斬首三萬地動壞城十六十六十九秦敗我軍斬首三萬十九秦擊我與秦漢北及上庸地三十二四三十六二十八十七十七二十與秦會黽池藺相如從二十秦拔鄢西陵三十三五殺燕騎劫三十七二十九白起擊楚拔郢更東至竟陵以為南郡十八十八二十一二十一秦拔我郢燒夷陵王亡走陳燕惠王元年六三十八三十白起封為武安君十九十九二十二二十二秦拔我巫黔中二七三十九三十一魏安釐王元年秦拔我兩城封弟公子無忌為信陵君二十二十三二十三秦所拔我江旁反秦三八四十三十二二秦拔我兩城軍大梁下韓來救與秦溫以和二十一暴鳶救魏為秦所敗走開封二十四二十四四九四十一三十三三秦拔我四城斬首四萬二十二二十五二十五五十四十二三十四白起擊魏華陽軍芒卯走得三晉將斬首十五萬四與秦南陽以和二十三二十六二十六六十一四十三三十五五擊燕韓桓惠王元年二十七二十七擊燕魯頃公元年七十二四十四三十六六二二十八藺相如攻齊至平邑二十八燕武成王元年十三四十五三十七七三秦擊我閼與城不拔二十九秦攻韓閼與趙奢將擊秦大敗之賜號曰馬服二十九二十四秦楚擊我剛壽四十六三十八八四三十三十三十五四十七三十九九秦拔我懷城五三十一三十一四十六四十八四十太子質於魏者死歸葬芷陽十六三十二三十二五十七四十九四十一十一秦拔我廩丘七三十三三十三六十八五十四十二宣太后薨安國君為太子十二八趙孝成王元年秦拔我三城平原君相三十四七齊田單拔中陽十九五十一四十三十三九秦拔我陘城汾旁二三十五八齊王建元年五十二四十四攻韓取南陽十四十秦擊我太行三三十六九二五十三四十五攻韓取十城十五十一四楚考烈王元年秦取我州黃歇為相十三五十四四十六王之南鄭十六十二五使廉頗拒秦於長平二十一四五十五四十七白起破趙長平殺卒四十五萬十七十三六使趙括代廉頗將白起破括四十五萬三十二五五十六四十八十八十四七四十三六五十七四十九十九十五八五十四七五十八五十王齕鄭安平圍邯鄲及齕還軍拔新中二十公子無忌救邯鄲秦兵解去十六九秦圍我邯鄲楚魏救我六春申君救趙燕孝王元年八五十九赧王卒五十一二十一韓魏楚救趙新中秦兵罷十七秦擊我陽城救趙新中十七救趙新中二九五十二取西周王稽棄市二十二十八十一八取魯魯君封於莒三十五十三二十三十九十二九燕王喜元年十一五十四二十四二十十三十徙於巨陽二十二五十五二十五衛元君元年二十一十四十一三十三五十六二十六二十二十五平原君卒十二柱國景伯死四伐趙趙破我軍殺栗腹十四秦孝文王元年二十七二十三十六十三五十五秦莊襄王楚元年蒙驁取成皋滎陽初置三川郡呂不韋相取東周二十八二十四秦拔我成皋滎陽十七十四楚滅魯頃公遷卞為家人絶祀六十六二蒙驁擊趙榆次新城狼孟得三十七城日蝕二十九二十五十八十五春申君徙封於吳七十七三王齮擊上黨初置太原郡魏公子無忌率五國卻我軍河外蒙驁解去三十無忌率五國兵敗秦軍河外二十六秦拔我上黨十九十六八十八始皇帝元年擊取晉陽作鄭國渠三十一二十七二十秦拔我晉陽十七九十九二三十二二十八二十一十八十二十三蒙驁擊韓取十三城王齮死三十三二十九秦拔我十三城趙悼襄王偃元年十九十一二十一四七月蝗蔽天下百姓納粟千石拜爵一級三十四信陵君死三十二太子從質秦歸二十十二趙拔我武遂方城二十二五蒙驁取魏酸棗二十城初置東郡魏景湣王元年秦拔我二十城三十一三趙相魏相會柯盟二十一十三劇辛死於趙二十三六五國共擊秦二秦拔我朝歌衛從濮陽徙野王三十二四二十二王東徙壽春命曰郢十四二十四七彗星見北方西方夏太后薨蒙驁死三秦拔我汲三十三五二十三十五二十五八嫪毐封長信侯四三十四六二十四十六二十六九彗星見竟天嫪毐為亂遷其舍人于蜀彗星復見五秦拔我垣蒲陽衍韓王安元年七二十五李園殺春申君十七二十七十相國呂不韋免齊趙來置酒太后入咸陽大索六二八入秦置酒楚幽王悼元年十八二十八入秦置酒十一呂不韋之河南王翦擊鄴閼與取九城七三九秦拔我閼與鄴取九城二十九二十九十二發四郡兵助魏擊楚呂不韋卒復嫪毐舍人遷蜀者八秦助我擊楚四趙王遷元年三秦魏擊我二十三十十三桓齮擊平陽殺趙扈輒斬首十萬因東擊趙王之河南彗星見九五二秦拔我平陽敗扈輒斬首十萬四二十一三十一十四桓齮定平陽武城宜安韓使非來我殺非韓王請為臣十六三秦拔我宜安五二十二三十二十五興軍至鄴軍至太原取狼孟十一七四秦拔我狼孟鄱吾軍鄴六二十三太子丹質於秦亡來歸三十三十六置麗邑發卒受韓南陽十二獻城秦八秦來受地五地大動七二十四三十四十七內史騰擊得韓王安盡取其地置潁川郡華陽太后薨十三九秦虜王安秦滅韓六八二十五三十五十八十四衛君角元年七九二十六三十六十九王翦拔趙虜王遷邯鄲帝太后薨十五八秦王翦虜王遷邯鄲公子嘉自立為代王十幽王卒弟郝立為哀王三月負芻殺哀王二十七三十七二十燕太子使荊軻刺王覺之王翦將擊燕魏王假元年代王嘉元年楚王負芻元年負芻哀王庶兄二十八太子丹使荊軻刺秦王秦伐我三十八二十一王賁擊楚二二二秦大破我取十城二十九秦拔我薊得太子丹王徙遼東三十九二十二王賁擊魏得其王假盡取其地三秦虜王假三三三十四十二十三王翦蒙武擊破楚軍殺其將項燕四四秦破我將項燕三十一四十一二十四王翦蒙武破楚虜其王負芻五五秦虜王負芻秦滅楚三十二四十二二十五王賁擊燕虜王喜又擊得代王嘉五月天下大酺六秦將王賁虜王嘉秦滅趙三十三秦虜王喜拔遼東秦滅燕四十三二十六王賁擊齊虜王建初并天下立為皇帝四十四秦虜王建秦滅齊二十七更命河為德水為金人十二命民曰黔首同天下書分為三十六郡二十八為阿房宮之衡山治馳道帝之琅邪道南郡入為太極廟賜戶三十爵一級二十九郡縣大索十日帝之琅邪道上黨入三十三十一更命臘曰嘉平賜黔首里六石米二羊以嘉平大索二十日三十二帝之碣石道上郡入三十三遣諸逋亡及賈人贅壻略取陸梁為桂林南海象郡以適戍西北取戎為三十四縣築長城河上蒙恬將三十萬三十四適治獄不直者築長城取南方越地覆獄故失三十五為直道道九原通甘泉三十六徙民於北河榆中耐徙三處拜爵一級石晝下東郡有文言地分三十七十月帝之會稽琅邪還至沙丘崩子胡亥立為二世皇帝殺蒙恬道九原入復行錢二世元年十月戊寅大赦罪人十一月為兔園十二月就阿房宮其九月郡縣皆反楚兵至戲章邯擊卻之出衛君角為庶人二將軍章邯長史司馬欣都尉董翳追楚兵至河誅丞相斯去疾將軍馮劫三趙高反二世自殺高立二世兄子嬰子嬰立剌殺高夷三族諸侯入秦嬰降為項羽所殺尋誅羽天下屬漢
