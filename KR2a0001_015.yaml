body:
  text: 六國年表太史公讀秦記至犬戎敗幽王周東徙洛邑秦襄公始封為諸侯作西畤用事上帝僭端見矣禮曰天子祭天地諸侯祭其域內名山大川今秦雜戎翟之俗先暴戾後仁義位在藩臣而臚於郊祀君子懼焉及文公踰隴攘夷狄尊陳寶營岐雍之間而穆公修政東竟至河則與齊桓晉文中國侯伯侔矣是後陪臣執政大夫世祿六卿擅晉權征伐會盟威重於諸侯及田常殺簡公而相齊國諸侯晏然弗討海內爭於戰功矣三國終之卒分晉田和亦滅齊而有之六國之盛自此始務在強兵并敵謀詐用而從衡短長之説起矯稱蜂出誓盟不信雖置質剖符猶不能約束也秦始小國僻遠諸夏賓之比於戎翟至獻公之後常雄諸侯論秦之德義不如魯衛之暴戾者量秦之兵不如三晉之強也然卒并天下非必險固便形藝利也蓋若天所助焉或曰東方物所始生西方物之成孰夫作事者必於東南收功實者常於西北故禹興於西羌湯起於亳周之王也以豐鎬伐殷秦之帝用雍州興漢之興自蜀漢秦既得意燒天下詩書諸侯史記尤甚為其有所刺譏也詩書所以復見者多藏人家而史記獨藏周室以故滅惜哉惜哉獨有秦記又不載日月其文略不具然戰國之權變亦有可頗采者何必上古秦取天下多暴然世異變成功大傳曰法後王何也以其近己而俗變相類議卑而易行也學者牽於所聞見秦在帝位日淺不察其終始因舉而笑之不敢道此與以耳食無異悲夫余於是因秦記踵春秋之後起周元王表六國時事訖二世凡二百七十年著諸所聞興壞之端後有君子以覽觀焉周秦魏獻子韓宣子趙簡子楚燕齊公元前元王元年厲共公元年衛出公輒後元年四十二楚惠王章十三年吳伐我燕獻公十七年齊平公驁五年二二蜀人來賂晉定公卒四十三十四越圍吳吳怨十八六三三晉出公錯元年四十四十五十九七越人始來四四四十五十六越滅吳二十八五五楚人來賂四十六十七蔡景侯卒二十一九晉知伯瑤來伐我六六義渠來賂綿諸乞援四十七十八蔡聲侯元年二十二十七七彗星見衛出公飲大夫不解襪公怒即攻公公奔宋四十八出公飲大夫不解襪公怒即攻公公奔宋十九王子英奔秦二十三十一八八四十九二十二十四十二定王元年九五十二十一二十五十三二十庶長將兵拔魏城彗星見五十一二十二魯哀公卒二十六十四三十一五十二二十三魯悼公元年三桓勝魯如小侯二十七十五四十二五十三二十四二十八十六五十三知伯伐鄭駟桓子如齊求救五十四知伯謂簡子欲廢太子襄子襄子怨知伯二十五燕孝公元年十七救鄭晉師去中行文子謂田常乃今知所以亡六十四晉人楚人來賂鄭聲公卒五十五二十六二十八七十五鄭哀公元年五十六二十七三十九八十六塹阿旁伐大荔補龐戲城五十七二十八四二十九十七五十八二十九五二十一十十八五十九三十六二十二十一十九六十三十一七二十三十二二十公將師與綿諸戰襄子元年未除服登夏屋誘代王以金斗殺代王封伯魯子周為代成君三十二蔡聲侯卒八二十四十三二十一晉哀公忌元年二三十三蔡元侯元年九二十五十四二十二衛悼公黔元年三三十四十齊宣公就匝元年十五二十三四與智伯分范中行地三十五十一二十六二十四魏桓子敗智伯于晉陽韓康子敗智伯于晉陽五襄子敗智伯晉陽與魏韓三分其地三十六十二三十七二十五晉大夫智開率其邑人來奔六三十七十三四十八二十六左庶長城南鄭七三十八十四五宋景公卒十九二十七衛敬公元年八三十九蔡侯齊元年十五六宋昭公元年二十二十八越人來迎女九四十燕成公元年七二十一二十九晉大夫智寬率其邑人來奔十四十一二八二十二三十十一四十二楚滅蔡三九二十三三十一十二四十三四十二十四三十二十三四十四滅杞杞夏之後五十一二十五三十三伐義渠虜其王十四四十五六十二二十六三十四日蝕晝晦星見十五四十六七十三二十七秦躁公元年十六四十七八十四二十八二南鄭反十七四十八九十五考王元年三十八四十九十十六二四十九五十十一十七三五二十五十一十二十八四六晉幽公柳元年服韓魏二十一五十二十三十九五七二十二五十三十四二十六八六月雨雪日月蝕二十三五十四十五二十一七九二十四五十五十六二十二八十二十五五十六燕湣公元年二十三九十一二十六五十七二二十四十十二衛昭公元年二十七楚簡王仲元年滅莒三二十五十一十三義渠伐秦侵至渭陽二十八二四二十六十二十四二十九三魯悼公卒五二十七十三秦懷公元年生靈公三十四魯元公元年六二十八十四二三十一五七二十九十五三三十二六八三十威烈王元年四庶長鼂殺懷公太子蚤死大臣立太子之子為靈公衛悼公亹元年三十三襄子卒七九三十一二秦靈公元年生獻公魏文侯斯元年韓武子元年趙桓子元年八十三十二三二二二鄭幽公元年韓殺之趙獻侯元年九十一三十三四三作上下畤三三鄭立幽公子為繻公元年二十十二三十四五四四四三十一十三三十五六五五魏誅晉幽公立其弟止五四十二十四三十六七六六晉烈公止元年魏城少梁六五十三十五三十七八七與魏戰少梁七七六十四十六三十八九八城塹河瀕初以君主妻河八復城少梁八七十五十七三十九十九九九八十六十八四十十一十補龐城籍姑靈公卒立其季父悼子是為簡公十十九十七十九四十一十二秦簡公元年十一衛慎公元年十一十中山武公初立十八二十四十二十三二與晉戰敗鄭下十二十二十一十九二十一四十三伐晉毀黃城圍陽狐十四三十三公子擊圍繁龐出其民十三十二二十二十二四十四伐魯莒及安陽十五四十四十四十三城平邑二十一二十三四十五伐魯取都十六五日蝕十五十五十四二十二二十四四十六十七六初令吏帶劍十六伐秦築臨晉元里十六十五二十三二十五四十七十八七塹洛城重泉初租禾十七擊守中山伐秦至鄭還築洛陰合陽韓景侯虔元年伐鄭取雍丘鄭城京趙烈侯籍元年魏使太子伐中山二十四簡王卒二十六四十八取魯郕十九八十八文侯受經子夏過段干木之閭常式二鄭敗韓于負黍二楚聲王當元年魯穆公元年二十七四十九與鄭會于西城伐衛取毌二十九十九三三二二十八五十二十一十二十卜相李克翟璜爭四四三二十九五十一田會以廩丘反二十二十一二十一五五四三十齊康公貸元年二十三九鼎震十二二十二初為侯六初為侯六初為侯五魏韓趙始列為諸侯三十一二宋悼公元年二十四十三二十三七七烈侯好音欲賜歌者田徐越侍以仁義乃止六盜殺聲王燕釐公元年三安王元年十四伐魏至陽狐二十四秦伐我至陽狐八八楚悼王類元年二四二十五二十五太子罃生九鄭圍陽翟九二三晉來伐我至乘丘三五三王子定奔晉秦惠公元年二十六虢山崩壅河韓烈侯元年趙武公元年三歸榆關于鄭四六四二二十七二鄭殺其相駟子陽二四敗鄭師圍鄭鄭人殺子陽五七五三日蝕二十八三三月盜殺韓相俠纍三五六八六四二十九四鄭相子陽之徒殺其君繻公四六七九七五伐綿諸三十五鄭康公元年五七八十宋休公元年八六三十一六救魯鄭負黍反六八九十一伐魯取最九七三十二伐鄭城酸棗七七九伐韓取負黍十十二十八三十三晉孝公傾元年八八十十一十三十一九伐韓宜陽取六邑三十四九秦伐宜陽取六邑九十一十二十四十二十與晉戰武城縣陝三十五齊伐取襄陵十十十二十三十五魯敗我平陸十三十一太子生三十六秦侵陰晉十一十一十三十四十六與晉衛會濁澤十四十二三十七十二十二十四十五十七十五十三蜀取我南鄭三十八十三十三十五十六十八十六秦出公元年魏武侯元年襲邯鄲敗焉韓文侯元年趙敬侯元年武公子朝作亂奔魏十六十七十九田常曾孫田和始列為諸侯遷康公海上食一城十七二庶長改迎靈公太子立為獻公誅出公二城安邑王垣二伐鄭取陽城伐宋到彭城執宋君二十七十八二十伐魯破之田和卒十八秦獻公元年三三三十八十九二十一田和子桓公午立十九二城櫟陽四四四魏敗我兔臺十九二十二十二二十三日蝕晝晦五五五二十二十一二十三二十一四孝公生六六六二十一二十二二十四二十二五七伐齊至桑丘七伐齊至桑丘鄭敗晉七伐齊至桑丘楚肅王臧元年二十三二十五伐燕取桑丘二十三六初縣蒲藍田善明氏八八八襲衛不克二二十四二十六康公卒田氏遂并齊而有之太公望之後絶祀二十四七九翟敗我澮伐齊至靈丘九伐齊至靈丘九伐齊至靈丘三二十五齊威王因元年自田常至威王威王始以齊強天下二十五八十晉靜公俱酒元年十十四蜀伐我茲方二十六二二十六九十一魏韓趙滅晉絶無後韓哀侯元年分晉國十一分晉國五魯共公元年二十七三三晉滅其君烈王元年十日蝕十二二滅鄭康公二十年滅無後十二六二十八四二十一縣櫟陽十三三趙成侯元年七二十九五三十二十四四二八三十敗齊林孤六魯伐入陽關晉伐到鱄陵四十三十五衛聲公元年敗趙北藺五三伐衛取都鄙七十三魏敗我藺九燕桓公元年七宋辟公元年五十四十六伐楚取魯陽六韓嚴殺其君四十魏取我魯陽二八六十五惠王元年莊侯元年五伐齊于甄魏敗我懷十一三九趙伐我甄七十六民大疫日蝕二敗韓馬陵二魏敗我馬陵六敗魏涿澤圍惠王楚宣王良夫元年四十宋剔成元年顯王元年十七櫟陽雨金四月至八月三齊伐我觀三七侵齊至長城二五十一伐魏取觀趙侵我長城二十八四四八三六十二三十九敗韓魏洛陰五與韓會宅陽城武都五九四七十三四二十六伐宋取儀臺六十五八十四五賀秦二十一章蟜與晉戰石門斬首六萬天子賀七七十一六九十五六二十二八八十二七十十六七二十三與魏戰少梁虜其太子九與秦戰少梁虜我太子九魏敗我于澮大雨三月十三魏敗我于澮八十一十七八秦孝公元年彗星見西方十取趙皮牢衛成侯元年十十四九燕文公元年十八九致胙于秦二天子致胙十一十一十五十二十九十三十二星晝墮有聲十二十六十一三二十十一四十三韓昭侯元年秦敗我西山十七十二四二十一鄒忌以鼓琴見威王十二五十四與趙會鄗二宋取我黃池魏取我朱十八趙孟如齊十三君尹黑迎女秦五二十二封鄒忌為成侯十三六十五魯衛宋鄭侯來三十九與燕會阿與齊宋會平陸十四六二十三與趙會平陸十四七與魏王會杜平十六與秦孝公會杜平侵宋黃池宋復取之四二十十五七二十四與魏會田於郊十五八與魏戰元里斬首七千取少梁十七與秦戰元里秦取我少梁五二十一魏圍我邯鄲十六八二十五十六九十八邯鄲降齊敗我桂陵六伐東周取陵觀廩丘二十二魏拔邯鄲十七九二十六敗魏桂陵十七十衛公孫鞅為大良造伐安邑降之十九諸侯圍我襄陵築長城塞固陽七二十三十八魯康公元年十二十七十八十一城商塞衛鞅圍固陽降之二十歸趙邯鄲八申不害相二十四魏歸邯鄲與魏盟漳水上十九十一二十八十九十二初聚小邑為三十一縣令為田開阡陌二十一與秦遇彤九二十五二十十二二十九二十十三初為縣有秩史二十二十韓姬弒其君悼公趙肅侯元年二十一十三三十二十一十四初為賦二十三十一昭侯如秦二二十二十四三十一二十二十五二十四十二三公子范襲邯鄲不勝死二十三十五三十