body:
  text: 河渠書第七夏書曰禹抑洪水十三年過家不入門陸行載車水行載舟泥行蹈毳山行即橋以別九州隨山浚川任土作貢通九道陂九澤度九山然河菑衍溢害中國也尤甚唯是為務故道河自積石歷龍門南到華陰東下砥柱及孟津雒汭至于大邳於是禹以為河所從來者高水湍悍難以行平地數為敗乃厮二渠以引其河北載之高地過降水至于大陸播為九河同為逆河入于勃海九川既疏九澤既灑諸夏艾安功施于三代自是之後滎陽下引河東南為鴻溝以通宋鄭陳蔡曹衛與濟汝淮泗會于楚西方則通渠漢水雲夢之野東方則通鴻溝江淮之閒於吳則通渠三江五湖於齊則通菑濟之閒於蜀蜀守冰鑿離碓辟沫水之害穿二江成都之中此渠皆可行舟有餘則用溉浸百姓饗其利至于所過往往引其水益用溉田疇之渠以萬億計然莫足數也西門豹引漳水溉鄴以富魏之河內而韓聞秦之好興事欲罷之毋令東伐乃使水工鄭國閒說秦令鑿涇水自中山西邸瓠口為渠並北山東注洛三百餘里欲以溉田中作而覺秦欲殺鄭國鄭國曰始臣為閒然渠成亦秦之利也秦以為然卒使就渠渠就用注填閼之水溉澤鹵之地四萬餘頃收皆畝一鐘於是關中為沃野無凶年秦以富彊卒并諸侯因命曰鄭國渠漢興三十九年孝文時河決酸棗東潰金隄於是東郡大興卒塞之其後四十有餘年今天子元光之中而河決於瓠子東南注巨野通於淮泗於是天子使汲黯鄭當時興人徒塞之輒復壞是時武安侯田蚡為丞相其奉邑食鄃鄃居河北河決而南則鄃無水菑邑收多蚡言於上曰江河之決皆天事未易以人力為彊塞塞之未必應天而望氣用數者亦以為然於是天子久之不事復塞也是時鄭當時為大農言曰異時關東漕粟從渭中上度六月而罷而漕水道九百餘里時有難處引渭穿渠起長安並南山下至河三百餘里徑易漕度可令三月罷而渠下民田萬餘頃又可得以溉田此損漕省卒而益肥關中之地得穀天子以為然令齊人水工徐伯表悉發卒數萬人穿漕渠三歲而通通以漕大便利其後漕稍多而渠下之民頗得以溉田矣其後河東守番係言漕從山東西歲百餘萬石更砥柱之限敗亡甚多而亦煩費穿渠引汾溉皮氏汾陰下引河溉汾陰蒲坂下度可得五千頃五千頃故盡河壖棄地民茭牧其中耳今溉田之度可得穀二百萬石以上穀從渭上與關中無異而砥柱之東可無復漕天子以為然發卒數萬人作渠田數歲河移徙渠不利則田者不能償種久之河東渠田廢豫越人令少府以為稍入其後人有上書欲通褒斜道及漕事下御史大夫張湯湯問其事因言抵蜀從故道故道多阪回遠今穿褒斜道少阪近四百里而褒水通沔斜水通渭皆可以行船漕漕從南陽上沔入褒褒之絶水至斜閒百餘里以車轉從斜下下渭如此漢中之穀可致山東從沔無限便於砥柱之漕且褒斜材木竹箭之饒擬於巴蜀天子以為然拜湯子卬為漢中守發數萬人作逶斜道五百餘里道果便近而水湍石不可漕其後莊熊羆言臨晉民願穿洛以溉重泉以東萬餘頃故鹵地誠得水可令畝十石於是為發卒萬餘人穿渠自徵引洛水至商顏山下岸善崩乃鑿井深者四十餘丈往往為井井下相通行水水穨以絶商顏東至山嶺十餘里閒井渠之生自此始穿渠得龍骨故名曰龍首渠作之十餘歲渠頗通猶未得其饒自河決瓠子後二十餘歲歲因以數不登而梁楚之地尤甚天子既封禪巡祭山川其明年旱乾封少雨天子乃使汲仁郭昌發卒數萬人塞瓠子決於是天子已用事萬里沙則還自臨決河沈白馬玉璧于河令群臣從官自將軍已下皆負薪填決河是時東郡燒草以故薪柴少而下淇園之竹以為楗天子既臨河決悼功之不成乃作歌曰瓠子決兮將奈何晧晧旰旰兮閭殫為河殫為河兮地不得寧功無已時兮吾山平吾山平兮巨野溢魚沸鬱兮柏冬日延道弛兮離常流蛟龍騁兮方遠遊歸舊川兮神哉沛不封禪兮安知外為我謂河伯兮何不仁泛濫不止兮愁吾人齧桑浮兮淮泗滿久不反兮水維緩一曰河湯湯兮激潺湲北渡污兮浚流難搴長茭兮沈美玉河伯許兮薪不屬薪不屬兮衛人罪燒蕭條兮噫乎何以禦水穨林竹兮楗石菑宣房塞兮萬福來於是卒塞瓠子築宮其上名曰宣房宮而道河北行二渠復禹舊迹而梁楚之地復寧無水災自是之後用事者爭言水利朔方西河河西酒泉皆引河及川谷以溉田而關中輔渠靈軹引堵水汝南九江引淮東海引巨定泰山下引汶水皆穿渠為溉田各萬餘頃他小渠披山通道者不可勝言然其著者在宣房太史公曰余南登廬山觀禹疏九江遂至于會稽太湟上姑蘇望五湖東窺洛汭大邳迎河行淮泗濟漯洛渠西瞻蜀之岷山及離碓北自龍門至于朔方曰甚哉水之為利害也余從負薪塞宣房悲瓠子之詩而作河渠書
