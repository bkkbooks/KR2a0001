body:
  text: 司馬相如列傳第五十七司馬相如者蜀郡成都人也字長卿少時好讀書學擊劍故其親名之曰犬子相如既學慕藺相如之為人更名相如以資為郎事孝景帝為武騎常侍非其好也會景帝不好辭賦是時梁孝王來朝從游說之士齊人鄒陽淮陰枚乘吳莊忌夫子之徒相如見而說之因病免客游梁梁孝王令與諸生同舍相如得與諸生游士居數歲乃著子虛之賦會梁孝王卒相如歸而家貧無以自業素與臨邛令王吉相善吉曰長卿久宦遊不遂而來過我於是相如往舍都亭臨邛令繆為恭敬日往朝相如相如初尚見之後稱病使從者謝吉吉愈益謹肅臨邛中多富人而卓王孫家僮八百人程鄭亦數百人二人乃相謂曰令有貴客為具召之并召令令既至卓氏客以百數至日中謁司馬長卿長卿謝病不能往臨邛令不敢嘗食自往迎相如相如不得已彊往一坐盡傾酒酣臨邛令前奏琴曰竊聞長卿好之願以自娛相如辭謝為鼓一再行是時卓王孫有女文君新寡好音故相如繆與令相重而以琴心挑之相如之臨邛從車騎雍容閒雅甚都及飲卓氏弄琴文君竊從戶窺之心悅而好之恐不得當也既罷相如乃使人重賜文君侍者通殷勤文君夜亡奔相如相如乃與馳歸成都家居徒四壁立卓王孫大怒曰女至不材我不忍殺不分一錢也人或謂王孫王孫終不聽文君久之不樂曰長卿第俱如臨邛從昆弟假貸猶足為生何至自苦如此相如與俱之臨邛盡賣其車騎買一酒舍酤酒而令文君當爐相如身自著犢鼻褌與保庸雜作滌器於市中卓王孫聞而恥之為杜門不出昆弟諸公更謂王孫曰有一男兩女所不足者非財也今文君已失身於司馬長卿長卿故倦游雖貧其人材足依也且又令客獨奈何相辱如此卓王孫不得已分豫文君僮百人錢百萬及其嫁時衣被財物文君乃與相如歸成都買田宅為富人居久之蜀人楊得意為狗監侍上上讀子虛賦而善之曰朕獨不得與此人同時哉得意曰臣邑人司馬相如自言為此賦上驚乃召問相如相如曰有是然此乃諸侯之事未足觀也請為天子游獵賦賦成奏之上許令尚書給筆札相如以子虛虛言也為楚稱烏有先生者烏有此事也為齊難無是公者無是人也明天子之義故空藉此三人為辭以推天子諸侯之苑囿其卒章歸之於節儉因以風諫奏之天子天子大說其辭曰楚使子虛使於齊齊王悉發境內之士備車騎之衆與使者出田田罷子虛過詫烏有先生而無是公在焉坐定烏有先生問曰今日田樂乎子虛曰樂獲多乎曰少然則何樂曰僕樂齊王之欲夸僕以車騎之衆而僕對以雲夢之事也曰可得聞乎子虛曰可王駕車千乘選徒萬騎田於海濱列卒滿澤罘罔彌山掩兔轔鹿射麋腳麟鶩於鹽浦割鮮染輪射中獲多矜而自功顧謂僕曰楚亦有平原廣澤游獵之地饒樂若此者乎楚王之獵何與寡人僕下車對曰臣楚國之鄙人也幸得宿衛十有餘年時從出游游於後園覽於有無然猶未能遍覩也又惡足以言其外澤者乎齊王曰雖然略以子之所聞見而言之僕對曰唯唯臣聞楚有七澤嘗見其一未覩其餘也臣之所見蓋特其小小者耳名曰雲夢雲夢者方九百里其中有山焉其山則盤紆岪鬱隆崇嵂崒岑巖參差日月蔽虧交錯糾紛上干青雲罷池陂陀下屬江河其土則丹青赭堊雌黃白附錫碧金銀衆色炫耀照爛龍鱗其石則赤玉玫瑰琳珉琨珸瑊𤨙玄厲碝石武夫其東則有蕙圃衡蘭芷若射干穹窮昌蒲江離麋蕪諸蔗猼且其南則有平原廣澤登降陀靡案衍壇曼緣以大江限以巫山其高燥則生葴䔮苞荔薛莎青薠其卑溼則生藏莨蒹葭東薔雕胡蓮藕菰蘆菴䕡軒芋衆物居之不可勝圖其西則有湧泉清池激水推移外發芙蓉菱華內隱巨石白沙其中則有神龜蛟鼉玳瑁鱉黿其北則有陰林巨樹楩楠豫章桂椒木蘭蘖離朱楊樝梨梬栗橘柚芬芳其上則有赤猿蠷蝚鵷雛孔鸞騰遠射干其下則有白虎玄豹蟃蜒貙犴兕象野犀窮奇獌狿於是乃使專諸之倫手格此獸楚王乃駕馴駁之駟乘雕玉之輿靡魚須之橈旃曳明月之珠旗建干將之雄戟左烏嗥之雕弓右夏服之徑箭陽子驂乘纖阿為御案節未舒即陵狡獸轔邛邛蹴距虛軼野馬而轊騊駼乘遺風而射游騏鯈眒淒浰靁動熛至星流霆擊弓不虛發中必決眥洞胸達腋絶乎心繫獲若雨獸掩草蔽地於是楚王乃弭節裴回翱翔容與覽乎陰林觀壯士之暴怒與猛獸之恐懼徼谻受詘殫睹衆物之變態於是鄭女曼姬被阿錫揄紵縞雜纖羅垂霧縠襞積褰皺紆徐委曲鬱橈溪谷衯衯裶裶揚袘恤削蜚纖垂髾扶與猗靡吸呷萃蔡下摩蘭蕙上拂羽蓋錯翡翠之威蕤繆繞玉綏縹乎忽忽若神仙之仿佛於是乃相與獠於蕙圃媻珊勃窣上金隄掩翡翠射鵕鸃微矰出孅繳施弋白鵠連駕鵝雙鶬下玄鶴加怠而後發游於清池浮文鷁揚桂枻張翠帷建羽蓋罔玳瑁釣紫貝摐金鼓吹鳴籟榜人歌聲流喝水蟲駭波鴻沸涌泉起奔揚會礧石相擊硠硠礚礚若靁霆之聲聞乎數百里之外將息獠者擊靈鼓起烽燧車案行騎就隊纚乎淫淫班乎裔裔於是楚王乃登陽雲之臺泊乎無為淡乎自持勺藥之和具而後御之不若大王終日馳騁而不下輿脟割輪淬自以為娛臣竊觀之齊殆不如於是王默然無以應僕也烏有先生曰是何言之過也足下不遠千里來況齊國王悉發境內之士而備車騎之衆以出田乃欲勠力致獲以娛左右也何名為夸哉問楚地之有無者願聞大國之風烈先生之餘論也今足下不稱楚王之德厚而盛推雲夢以為高奢言淫樂而顯侈靡竊為足下不取也必若所言固非楚國之美也有而言之是章君之惡無而言之是害足下之信章君之惡而傷私義二者無一可而先生行之必且輕於齊而纍於楚矣且齊東渚巨海南有琅邪觀乎成山射乎之罘浮勃澥游孟諸邪與肅慎為鄰右以湯谷為界秋田乎青丘傍偟乎海外吞若雲夢者八九其於胸中曾不蒂芥若乃俶儻瑰偉異方殊類珍怪鳥獸萬端鱗萃充仞其中者不可勝記禹不能名契不能計然在諸侯之位不敢言游戲之樂苑囿之大先生又見客是以王辭而不復何為無用應哉無是公聽然而笑曰楚則失矣齊亦未為得也夫使諸侯納貢者非為財幣所以述職也封疆畫界者非為守禦所以禁淫也今齊列為東藩而外私肅慎損國踰限越海而田其於義故未可也且二君之論不務明君臣之義而正諸侯之禮徒事爭游獵之樂苑囿之大欲以奢侈相勝荒淫相越此不可以揚名發譽而適足以貶君自損也且夫齊楚之事又焉足道邪君未睹夫巨麗也獨不聞天子之上林乎左蒼梧右西極丹水更其南紫淵徑其北終始霸滻出入涇渭酆鄗潦潏紆餘委蛇經營乎其內蕩蕩兮八川分流相背而異態東西南北馳騖往來出乎椒丘之闕行乎淵淤之浦徑乎桂林之中過乎泱莽之野汩乎渾流順阿而下赴隘陝之口觸穹石激堆崎沸乎暴怒洶涌滂沸湢測泌瀄橫流逆折轉騰潎洌澎濞沆瀣穹隆雲撓蜿灗膠戾踰波趨浥蒞蒞下瀨批壧衝壅奔揚滯沛臨坻注壑瀺灂霣墜湛湛隱隱砰磅訇瓂潏潏淈淈湁潗鼎沸馳波跳沫汩潝漂疾悠遠長懷寂漻無聲肆乎永歸然後灝溔潢漾安翔徐徊翯乎滈滈東注大湖衍溢陂池於是乎蛟龍赤螭䱎䲛螹離鰅鱅鰬魠禺禺鱋魶揵鰭擢尾振鱗奮翼潛處于深巖魚鱉歡聲萬物衆夥明月珠子玓瓅江靡蜀石黃碝水玉磊砢磷磷爛爛采色澔旰叢積乎其中鴻鵠鷫鴇鴚鵝鸀鳿鵁𪂴䴋目煩鶩鷛𪆂𪇅鴜鵁鸕群浮乎其上泛淫泛濫隨風淡淡與波搖蕩掩薄草渚唼喋菁藻咀嚼蓤藕於是乎崇山巃嵷崔巍嵯峨深林巨木嶄巖嵾嵯九嵕巀嶭南山峨峨巖陀甗錡嶊崣崛崎振溪通谷蹇産溝瀆谽呀豁閜阜陵別島崴磈嵔瘣丘虛崛𡾋隱轔鬱𡾋登降施靡陂池貏豸沇溶淫鬻散渙夷陸亭皋千里靡不被築掩以緑蕙被以江離糅以蘪蕪雜以流夷敷結縷欑戾莎揭車衡蘭槀本射干茈薑蘘荷葴橙若蓀鮮枝黃礫蔣芧青薠布濩閎澤延曼太原麗靡廣衍應風披靡吐芳揚烈郁郁斐斐衆香發越肸蠁布寫䁆曖苾勃於是乎周覽泛觀瞋盼軋沕芒芒恍忽視之無端察之無崖日出東沼入於西陂其南則隆冬生長踊水躍波獸則𤛑旄獏犛沈牛麈麋赤首圜題窮奇象犀其北則盛夏含凍裂地涉冰揭河獸則麒麟角𧤗騊駼橐駝蛩蛩驒騱駃騠驢騾於是乎離宮別館彌山跨谷高廊四注重坐曲閣華榱璧璫輦道纚屬步櫩周流長途中宿夷嵕築堂纍臺增成巖穾洞房俯杳眇而無見仰攀橑而捫天奔星更於閨闥宛虹拖於楯軒青虯蚴蟉於東箱象輿婉蟬於西清靈圉燕於閒觀偓佺之倫暴於南榮醴泉涌於清室通川過乎中庭槃石裖崖嶔巖倚傾嵯峨磼礏刻削崢嶸玫瑰碧琳珊瑚叢生珉玉旁唐璸斒文鱗赤瑕駁犖雜臿其閒垂綏琬琰和氏出焉於是乎盧橘夏孰黃甘橙楱枇杷橪柿椁奈厚朴梬棗楊梅櫻桃蒲陶隱夫鬱棣榙椽荔枝羅乎後宮列乎北園貤丘陵下平原揚翠葉杌紫莖發紅華秀朱榮煌煌扈扈照曜巨野沙棠櫟櫧華泛枰櫨留落胥餘仁頻并閭欃檀木蘭豫章女貞長千仞大連抱夸條直暢實葉葰茂攢立叢倚連卷纍佹崔錯癹骫坑衡閭砢垂條扶於落英幡纚紛容蕭蔘旖旎從風瀏蒞卉吸蓋象金石之聲管籥之音柴池茈虒旋環後宮雜遝纍輯被山緣谷循阪下隰視之無端究之無窮於是玄猿素雌蜼玃飛鸓蛭蜩蠷蝚螹胡豰蛫棲息乎其閒長嘯哀鳴翩幡互經夭蟜枝格偃蹇杪顛於是乎隃絶梁騰殊榛捷垂條踔稀閒牢落陸離爛曼遠遷若此輩者數千百處嬉游往來宮宿館舍庖廚不徙後宮不移百官備具於是乎背秋涉冬天子校獵乘鏤象六玉虯拖霓旌靡雲旗前皮軒後道游孫叔奉轡衛公驂乘扈從橫行出乎四校之中鼓嚴簿縱獠者江河為阹泰山為櫓車騎靁起隱天動地先後陸離離散別追淫淫裔裔緣陵流澤雲布雨施生貔豹搏豺狼手熊羆足野羊蒙鶡蘇褲白虎被豳文跨野馬陵三嵕之危下磧歷之坻徑陖赴險越壑厲水推蜚廉弄解豸格瑕蛤鋌猛氏罥騕裊射封豕箭不苟害解脰陷腦弓不虛發應聲而倒於是乎乘輿彌節裴回翱翔往來睨部曲之進退覽將率之變態然後浸潭促節倏敻遠去流離輕禽蹴履狡獸轊白鹿捷狡兔軼赤電遺光耀追怪物出宇宙彎繁弱滿白羽射游梟櫟蜚虡擇肉後發先中命處弦矢分藝殪仆然後揚節而上浮陵驚風歷駭飆乘虛無與神俱轔玄鶴亂昆雞遒孔鸞促鵔鸃拂鷖鳥捎鳳皇捷鴛雛掩焦明道盡塗殫回車而還招搖乎襄羊降集乎北紘率乎直指暗乎反鄉蹶石關歷封巒過䧴鵲望露寒下棠梨息宜春西馳宣曲濯鷁牛首登龍臺掩細柳觀士大夫之勤略鈞獠者之所得獲徒車之所轔轢乘騎之所蹂若人民之所蹈𨈁與其窮極倦谻驚憚懾伏不被創刃而死者他他籍籍填坑滿谷掩平彌澤於是乎游戲懈怠置酒乎昊天之臺張樂乎轇輵之宇撞千石之鐘立萬石之巨建翠華之旗樹靈鼉之鼓奏陶唐氏之舞聽葛天氏之歌千人唱萬人和山陵為之震動川谷為之蕩波巴俞宋蔡淮南于遮文成顛歌族舉遞奏金鼓迭起鏗鎗鐺䶀洞心駭耳荊吳鄭衛之聲韶濩武象之樂陰淫案衍之音鄢郢繽紛激楚結風俳優侏儒狄鞮之倡所以娛耳目而樂心意者麗靡爛漫於前靡曼美色於後若夫青琴宓妃之徒絶殊離俗姣冶嫺都靚莊刻飭便嬛綽約柔橈嬛嬛嫵媚㚩嫋抴獨繭之褕袘眇閻易以戌削媥姺徶與世殊服芬香漚鬱酷烈淑郁晧齒粲爛宜笑的皪長眉連娟微睇綿藐色授魂與心愈於側於是酒中樂酣天子芒然而思似若有亡曰嗟乎此泰奢侈朕以覽聽餘閒無事棄日順天道以殺伐時休息於此恐後世靡麗遂往而不反非所以為繼嗣創業垂統也於是乃解酒罷獵而命有司曰地可以墾辟悉為農郊以贍萌隸隤牆填塹使山澤之民得至焉實陂池而勿禁虛宮觀而勿仞發倉廩以振貧窮補不足恤鰥寡存孤獨出德號省刑罰改制度易服色更正朔與天下為始於是歷吉日以齊戒襲朝衣乘法駕建華旗鳴玉鸞游乎六藝之囿騖乎仁義之塗覽觀春秋之林射貍首兼騶虞戈玄鶴建干戚載雲罕掩群雅悲伐檀樂樂胥修容乎禮園翱翔乎書圃述易道放怪獸登明堂坐清廟恣群臣奏得失四海之內靡不受獲於斯之時天下大說嚮風而聽隨流而化喟然興道而遷義刑錯而不用德隆乎三皇功羡於五帝若此故獵乃可喜也若夫終日暴露馳騁勞神苦形罷車馬之用抏士卒之精費府庫之財而無德厚之恩務在獨樂不顧衆庶忘國家之政而貪雉兔之獲則仁者不由也從此觀之齊楚之事豈不哀哉地方不過千里而囿居九百是草木不得墾辟而民無所食也夫以諸侯之細而樂萬乘之所侈僕恐百姓之被其尤也於是二子愀然改容超若自失逡巡避席曰鄙人固陋不知忌諱乃今日見教謹聞命矣賦奏天子以為郎無是公言天子上林廣大山谷水泉萬物及子虛言楚雲夢所有甚衆侈靡過其實且非義理所尚故刪取其要歸正道而論之相如為郎數歲會唐蒙使略通夜郎西僰中發巴蜀吏卒千人郡又多為發轉漕萬餘人用興法誅其渠帥巴蜀民大驚恐上聞之乃使相如責唐蒙因喻告巴蜀民以非上意檄曰告巴蜀太守蠻夷自擅不討之日久矣時侵犯邊境勞士大夫陛下即位存撫天下輯安中國然後興師出兵北征胸奴單于怖駭交臂受事詘膝請和康居西域重譯請朝稽首來享移師東指閩越相誅右弔番禺太子入朝南夷之君西僰之長常效貢職不敢怠墮延頸舉踵喁喁然皆爭歸義欲為臣妾道里遼遠山川阻深不能自致夫不順者已誅而為善者未賞故遣中郎將往賓之發巴蜀士民各五百人以奉幣帛衛使者不然靡有兵革之事戰鬭之患今聞其乃發軍興制驚懼子弟憂患長老郡又擅為轉粟運輸皆非陛下之意也當行者或亡逃自賊殺亦非人臣之節也夫邊郡之士聞烽舉燧燔皆攝弓而馳荷兵而走流汗相屬唯恐居後觸白刃冒流矢義不反顧計不旋踵人懷怒心如報私讎彼豈樂死惡生非編列之民而與巴蜀異主哉計深慮遠急國家之難而樂盡人臣之道也故有剖符之封析圭而爵位為通侯居列東第終則遺顯號於後世傳土地於子孫行事甚忠敬居位甚安佚名聲施於無窮功烈著而不滅是以賢人君子肝腦塗中原膏液潤野草而不辭也今奉幣役至南夷即自賊殺或亡逃抵誅身死無名諡為至愚恥及父母為天下笑人之度量相越豈不遠哉然此非獨行者之罪也父兄之教不先子弟之率不謹也寡廉鮮恥而俗不長厚也其被刑戮不亦宜乎陛下患使者有司之若彼悼不肖愚民之如此故遣信使曉喻百姓以發卒之事因數之以不忠死亡之罪讓三老孝弟以不教誨之過方今田時重煩百姓已親見近縣恐遠所溪谷山澤之民不遍聞檄到亟下縣道使咸知陛下之意唯毋忽也相如還報唐蒙已略通夜郎因通西南夷道發巴蜀廣漢卒作者數萬人治道二歲道不成士卒多物故費以巨萬計蜀民及漢用事者多言其不便是時邛筰之君長聞南夷與漢通得賞賜多多欲願為內臣妾請吏比南夷天子問相如相如曰邛筰冉駹者近蜀道亦易通秦時嘗通為郡縣至漢興而罷今誠復通為置郡縣愈於南夷天子以為然乃拜相如為中郎將建節往使副使王然于壺充國呂越人馳四乘之傳因巴蜀吏幣物以賂西夷至蜀蜀太守以下郊迎縣令負弩矢先驅蜀人以為寵於是卓王孫臨邛諸公皆因門下獻牛酒以交歡卓王孫喟然而歎自以得使女尚司馬長卿晚而厚分與其女財與男等同司馬長卿便略定西夷邛筰冉駹斯榆之君皆請為內臣除邊關關益斥西至沫若水南至牂柯為徼通零關道橋孫水以通邛都還報天子天子大說相如使時蜀長老多言通西南夷不為用唯大臣亦以為然相如欲諫業已建之不敢乃著書籍以蜀父老為辭而己詰難之以風天子且因宣其使指令百姓知天子之意其辭曰漢興七十有八載德茂存乎六世威武紛紜湛恩汪濊群生澍濡洋溢乎方外於是乃命使西征隨流而攘風之所被罔不披靡因朝冉從駹定筰存邛略斯榆舉苞滿結軼還轅東鄉將報至于蜀都耆老大夫薦紳先生之徒二十有七人儼然造焉辭畢因進曰蓋聞天子之於夷狄也其義羈縻勿絶而已今罷三郡之士通夜郎之塗三年於茲而功不竟士卒勞倦萬民不贍今又接以西夷百姓力屈恐不能卒業此亦使者之纍也竊為左右患之且夫邛筰西僰之與中國並也歷年茲多不可記已仁者不以德來彊者不以力并意者其殆不可乎今割齊民以附夷狄弊所恃以事無用鄙人固陋不識所謂使者曰烏謂此邪必若所云則是蜀不變服而巴不化俗也余尚惡聞若說然斯事體大固非觀者之所覯也余之行急其詳不可得聞已請為大夫粗陳其略蓋世必有非常之人然後有非常之事有非常之事然後有非常之功非常者固常人之所異也故曰非常之原黎民懼焉及臻厥成天下晏如也昔者鴻水浡出泛濫衍溢民人登降移徙崎䧢而不安夏后氏戚之乃堙鴻水決江疏河漉沈贍菑東歸之於海而天下永寧當斯之勤豈唯民哉心煩於慮而身親其勞躬胝無胈膚不生毛故休烈顯乎無窮聲稱浹乎于茲且夫賢君之踐位也豈特委瑣握𪘏拘文牽俗循誦習傳當世取說云爾哉必將崇論閎議創業垂統為萬世規故馳騖乎兼容并包而勤思乎參天二地且詩不云乎普天之下莫非王土率土之濱莫非王臣是以六合之內八方之外浸潯衍溢懷生之物有不浸潤於澤者賢君恥之今封疆之內冠帶之倫咸獲嘉祉靡有闕遺矣而夷狄殊俗之國遼絶異黨之地舟輿不通人迹罕至政教未加流風猶微內之則犯義侵禮於邊境外之則邪行橫作放弒其上君臣易位尊卑失序父兄不辜幼孤為奴係纍號泣內嚮而怨曰蓋聞中國有至仁焉德洋而恩普物靡不得其所今獨曷為遺己舉踵思慕若枯旱之望雨盩夫為之垂涕況乎上聖又惡能已故北出師以討彊胡南馳使以誚徑越四面風德二方之君鱗集仰流願得受號者以億計故乃關沫若徼牂柯鏤零山梁孫原創道德之塗垂仁義之統將博恩廣施遠撫長駕使疏逖不閉阻深暗昧得耀乎光明以偃甲兵於此而息誅伐於彼遐邇一體中外提福不亦康乎夫拯民於沈溺奉至尊之休德反衰世之陵遲繼周氏之絶業斯乃天子之急務也百姓雖勞又惡可以已哉且夫王事固未有不始於憂勤而終於佚樂者也然則受命之符合在於此矣方將增泰山之封加梁父之事鳴和鸞揚樂頌上咸五下登三觀者未睹指聽者未聞音猶鷦明已翔乎寥廓而羅者猶視乎藪澤悲夫於是諸大夫芒然喪其所懷來而失厥所以進喟然並稱曰允哉漢德此鄙人之所願聞也百姓雖怠請以身先之敞罔靡徙因遷延而辭避其後人有上書言相如使時受金失官居歲餘復召為郎相如口吃而善著書常有消渴疾與卓氏婚饒於財其進仕宦未嘗肯與公卿國家之事稱病閒居不慕官爵常從上至長楊獵是時天子方好自擊熊彘馳逐野獸相如上疏諫之其辭曰臣聞物有同類而殊能者故力稱烏獲捷言慶忌勇期賁育臣之愚竊以為人誠有之獸亦宜然今陛下好陵阻險射猛獸卒然遇軼材之獸駭不存之地犯屬車之清塵輿不及還轅人不暇施巧雖有烏獲逢蒙之伎力不得用枯木朽株盡為害矣是胡越起於轂下而羌夷接軫也豈不殆哉雖萬全無患然本非天子之所宜近也且夫清道而後行中路而後馳猶時有銜橛之變而況涉乎蓬蒿馳乎丘墳前有利獸之樂而內無存變之意其為禍也不亦難矣夫輕萬乘之重不以為安而樂出於萬有一危之塗以為娛臣竊為陛下不取也蓋明者遠見於未萌而智者避危於無形禍固多藏於隱微而發於人之所忽者也故鄙諺曰家纍千金坐不垂堂此言雖小可以喻大臣願陛下之留意幸察上善之還過宜春宮相如奏賦以哀二世行失也其辭曰登陂阤之長阪兮坌入曾宮之嵯峨臨曲江之隑州兮望南山之參差巖巖深山之谾谾兮通谷𧯆兮谽谺汩淢嗡習以永逝兮注平皋之廣衍觀衆樹之塕薆兮覽竹木之榛榛東馳土山兮北揭石瀨彌節容與兮歷弔二世持身不謹兮亡國失藝信讒不寤兮宗廟滅絶嗚呼哀哉操行之不得兮墳墓蕪穢而不修兮魂無歸而不食敻邈絶而不齊兮彌久遠而愈佅精罔閬而飛揚兮拾九天而永逝嗚呼哀哉相如拜為孝文園令天子既美子虛之事相如見上好仙道因曰上林之事未足美也尚有靡者臣嘗為大人賦未就請具而奏之相如以為列仙之傳居山澤閒形容甚臞此非帝王之仙意也乃遂就大人賦其辭曰世有大人兮在于中州宅彌萬里兮曾不足以少留悲世俗之迫隘兮朅輕舉而遠遊垂絳幡之素霓兮載雲氣而上浮建格澤之長竿兮總光耀之采旄垂旬始以為幓兮抴彗星而為髾掉指嬌以偃蹇兮又旖旎招搖攬欃槍以為旌兮靡屈虹而為綢紅杳渺以眩湣兮猋風涌而雲浮駕應龍象輿之蠖略逶麗兮驂赤螭青虯之蚴蟉蜿蜒低卬夭蟜据以驕驁兮詘折隆窮蠼以連卷沛艾赳螑仡以佁擬兮放散畔岸驤以孱顏跮踱輵轄容以委麗兮綢繆偃蹇怵㚟以梁倚糾蓼叫奡踏以艐路兮蔑蒙踊躍騰而狂趡蒞颯卉翕熛至電過兮煥然霧除霍然雲消邪絶少陽而登太陰兮與真人乎相求互折窈窕以右轉兮橫厲飛泉以正東悉徵靈圉而選之兮部乘衆神於瑤光使五帝先導兮反太一而從陵陽左玄冥而右含靁兮前陸離而後潏湟廝征伯僑而役羡門兮屬岐伯使尚方祝融驚而蹕御兮清氛氣而後行屯余車其萬乘兮綷雲蓋而樹華旗使句芒其將行兮吾欲往乎南嬉歷唐堯於崇山兮過虞舜於九疑紛湛湛其差錯兮雜遝膠葛以方馳騷擾衝蓯其相紛拿兮滂濞泱軋灑以林離鑽羅列聚叢以蘢茸兮衍曼流爛壇以陸離徑入靁室之砰磷鬱律兮洞出鬼谷之崛礨嵬䃶遍覽八絃而觀四荒兮朅渡九江而越五河經營炎火而浮弱水兮杭絶浮渚而涉流沙奄息總極泛濫水嬉兮使靈媧鼓瑟而舞馮夷時若薆薆將混濁兮召屏翳誅風伯而刑雨師西望崑崙之軋沕洸忽兮直徑馳乎三危排閶闔而入帝宮兮載玉女而與之歸舒閬風而搖集兮亢烏騰而一止低回陰山翔以紆曲兮吾乃今目睹西王母皬然白首載勝而穴處兮亦幸有三足烏為之使必長生若此而不死兮雖濟萬世不足以喜回車朅來兮絶道不周會食幽都呼吸沆瀣兮餐朝霞噍咀芝英兮嘰瓊華嬐侵潯而高縱兮紛鴻涌而上厲貫列缺之倒景兮涉豐隆之滂沛馳游道而修降兮騖遺霧而遠逝迫區中之隘陝兮舒節出乎北垠遺屯騎於玄闕兮軼先驅於寒門下崢嶸而無地兮上寥廓而無天視眩眠而無見兮聽惝恍而無聞乘虛無而上假兮超無友而獨存相如既奏大人之頌天子大說飄飄有凌雲之氣似游天地之閒意相如既病免家居茂陵天子曰司馬相如病甚可往從悉取其書若不然後失之矣使所忠往而相如已死家無書問其妻對曰長卿固未嘗有書也時時著書人又取去即空居長卿未死時為一卷書曰有使者來求書奏之無他書其遺札書言封禪事奏所忠忠奏其書天子異之其書曰伊上古之初肇自昊穹兮生民歷撰列辟以迄于秦率邇者踵武逖聽者風聲紛綸葳蕤堙滅而不稱者不可勝數也續昭夏崇號諡略可道者七十有二君罔若淑而不昌疇逆天而能存軒轅之前遐哉邈乎其詳不可得聞也五三六經載籍之傳維見可觀也書曰元首明哉股肱良哉因斯以談君莫盛於唐堯臣莫賢於后稷后稷創業於唐公劉發迹於西戎文王改制爰周郅隆大行越成而後陵夷衰微千載無聲豈不善始善終哉然無異端慎所由於前謹遺教於後耳故軌迹夷易易遵也湛恩濛涌易豐也憲度著明易則也垂統理順易繼也是以業隆於繈褓而崇冠于二后揆厥所元終都攸卒未有殊尤絶迹可考于今者也然猶躡梁父登泰山建顯號施尊名大漢之德逢涌原泉沕潏漫衍旁魄四塞雲敷霧散上暢九垓下沂八埏懷生之類霑濡浸潤協氣橫流武節飄逝邇陝游原迥闊泳沫首惡湮沒暗昧昭晢昆蟲凱澤回首面內然後囿騶虞之珍群徼麋鹿之怪獸䆃一莖六穗於庖犧雙觡共抵之獸獲周餘珍收龜于岐招翠黃乘龍於沼鬼神接靈圉賓於閒館奇物譎詭俶儻窮變欽哉符瑞臻茲猶以為薄不敢道封禪蓋周躍魚隕杭休之以燎微夫斯之為符也以登介丘不亦恧乎進讓之道其何爽與於是大司馬進曰陛下仁育群生義征不憓諸夏樂貢百蠻執贄德侔往初功無與二休烈浹洽符瑞衆變期應紹至不特創見意者泰山梁父設壇場望幸蓋號以況榮上帝垂恩儲祉將以薦成陛下謙讓而弗發也挈三神之歡缺王道之儀群臣恧焉或謂且天為質暗珍符固不可辭若然辭之是泰山靡記而梁父靡幾也亦各並時而榮咸濟世而屈說者尚何稱於後而云七十二君乎夫修德以錫符奉符以行事不為進越故聖王弗替而修禮地祇謁款天神勒功中獄以彰至尊舒盛德發號榮受厚福以浸黎民也皇皇哉斯事天下之壯觀王者之丕業不可貶也願陛下全之而後因雜薦紳先生之略術使獲耀日月之末光絶炎以展采錯事猶兼正列其義校飭厥文作春秋一藝將襲舊六為七攄之無窮俾萬世得激清流揚微波蜚英聲騰茂實前聖之所以永保鴻名而常為稱首者用此宜命掌故悉奏其義而覽焉於是天子沛然改容曰愈乎朕其試哉乃遷思回慮總公卿之議詢封禪之事詩大澤之博廣符瑞之富乃作頌曰自我天覆雲之油油甘露時雨厥壤可游滋液滲漉何生不育嘉穀六穗我穡曷蓄非唯雨之又潤澤之非唯濡之泛敷濩之萬物熙熙懷而慕思名山顯位望君之來君乎君乎侯不邁哉般般之獸樂我君囿白質黑章其儀可喜旻旻睦睦君子之能蓋聞其聲今觀其來厥塗靡蹤天瑞之徵茲亦於舜虞氏以興濯濯之麟游彼靈畤孟冬十月君俎郊祀馳我君輿帝以享祉三代之前蓋未嘗有宛宛黃龍興德而升采色炫耀熿炳輝煌正陽顯見覺寤黎蒸於傳載之云受命所乘厥之有章不必諄諄依類託寓諭以封巒披藝觀之天人之際已交上下相發允答聖王之德兢兢翼翼也故曰興必慮衰安必思危是以湯武至尊嚴不失肅祗舜在假典顧省厥遺此之謂也司馬相如既卒五歲天子始祭后土八年而遂先禮中嶽封于太山至梁父禪肅然相如他所著若遺平陵侯書與五公子相難草木書篇不采采其尤著公卿者云太史公曰春秋推見至隱易本隱之以顯大雅言王公大人而德逮黎庶小雅譏小己之得失其流及上所以言雖外殊其合德一也相如雖多虛辭濫說然其要歸引之節儉此與詩之風諫何異楊雄以為靡麗之賦勸百風一猶馳騁鄭衛之聲曲終而奏雅不已虧乎余采其語可論者著于篇
