body:
  text: 韓長孺列傳第四十八御史大夫韓安國者梁成安人也後徙睢陽嘗受韓子雜家說於騶田生所事梁孝王為中大夫吳楚反時孝王使安國及張羽為將扞吳兵於東界張羽力戰安國持重以故吳不能過梁吳楚已破安國張羽名由此顯梁孝王景帝母弟竇太后愛之令得自請置相二千石出入游戲僭於天子天子聞之心弗善也太后知帝不善乃怒梁使者弗見案責王所為韓安國為梁使見大長公主而泣曰何梁王為人子之孝為人臣之忠而太后曾弗省也夫前日吳楚齊趙七國反時自關以東皆合西鄉惟梁最親為艱難梁王念太后帝在中而諸侯擾亂一言泣數行下跪送臣等六人將兵擊卻吳楚吳楚以故兵不敢西而卒破亡梁王之力也今太后以小節苛禮責望梁王梁王父兄皆帝王所見者大故出稱蹕入言警車旗皆帝所賜也即欲以侘鄙縣驅馳國中以夸諸侯令天下盡知太后帝愛之也今梁使來輒案責之梁王恐日夜涕泣思慕不知所為何梁王之為子孝為臣忠而太后弗恤也大長公主具以告太后太后喜曰為言之帝言之帝心乃解而免冠謝太后曰兄弟不能相教乃為太后遺憂悉見梁使厚賜之其後梁王益親歡太后長公主更賜安國可直千餘金名由此顯結於漢其後安國坐法抵罪蒙獄吏田甲辱安國安國曰死灰獨不復然乎田甲曰然即溺之居無何梁內史缺漢使使者拜安國為梁內史起徒中為二千石田甲亡走安國曰甲不就官我滅而宗甲因肉袒謝安國笑曰可溺矣公等足與治乎卒善遇之梁內史之缺也孝王新得齊人公孫詭說之欲請以為內史竇太后聞乃詔王以安國為內史公孫詭羊勝說孝王求為帝太子及益地事恐漢大臣不聽乃陰使人刺漢用事謀臣及殺故吳相袁盎景帝遂聞詭勝等計畫乃遣使捕詭勝必得漢使十輩至梁相以下舉國大索月餘不得內史安國聞詭勝匿孝王所安國入見王而泣曰主辱臣死大王無良臣故事紛紛至此今詭勝不得請辭賜死王曰何至此安國泣數行下曰大王自度於皇帝孰與太上皇之與高皇帝及皇帝之與臨江王親孝王曰弗如也安國曰夫太上臨江親父子之閒然而高帝曰提三尺劍取天下者朕也故太上皇終不得制事居于櫟陽臨江王適長太子也以一言過廢王臨江用宮垣事卒自殺中尉府何者治天下終不以私亂公語曰雖有親父安知其不為虎雖有親兄安知其不為狼今大王列在諸侯悅一邪臣浮說犯上禁橈明法天子以太后故不忍致法於王太后日夜涕泣幸大王自改而大王終不覺寤有如太后宮車即晏駕大王尚誰攀乎語未卒孝王泣數行下謝安國曰吾今出詭勝詭勝自殺漢使還報梁事皆得釋安國之力也於是景帝太后益重安國孝王卒共王即位安國坐法失官居家建元中武安侯田蚡為漢太尉親貴用事安國以五百金物遺蚡蚡言安國太后天子亦素聞其賢即召以為北地都尉遷為大司農閩越東越相攻安國及大行王恢將未至越越殺其王降漢兵亦罷建元六年武安侯為丞相安國為御史大夫胸奴來請和親天子下議大行王恢燕人也數為邊吏習知胡事議曰漢與胸奴和親率不過數歲即復倍約不如勿許興兵擊之安國曰千里而戰兵不獲利今胸奴負戎馬之足懷禽獸之心遷徙鳥舉難得而制也得其地不足以為廣有其衆不足以為彊自上古不屬為人漢數千里爭利則人馬罷虜以全制其敝且彊弩之極矢不能穿魯縞衝風之末力不能漂鴻毛非初不徑末力衰也擊之不便不如和親群臣議者多附安國於是上許和親其明年則元光元年雁門馬邑豪聶翁一因大行王恢言上曰胸奴初和親親信邊可誘以利陰使聶翁一為閒亡入胸奴謂單于曰吾能斬馬邑令丞吏以城降財物可盡得單于愛信之以為然許聶翁一聶翁一乃還詐斬死罪囚縣其頭馬邑城示單于使者為信曰馬邑長吏已死可急來於是單于穿塞將十餘萬騎入武州塞當是時漢伏兵車騎材官三十餘萬匿馬邑旁谷中衛尉李廣為驍騎將軍太僕公孫賀為輕車將軍大行王恢為將屯將軍太中大夫李息為材官將軍御史大夫韓安國為護軍將軍諸將皆屬護軍約單于入馬邑而漢兵縱發王恢李息李廣別從代主擊其輜重於是單于入漢長城武州塞未至馬邑百餘里行掠鹵徒見畜牧於野不見一人單于怪之攻烽燧得武州尉史欲刺問尉史尉史曰漢兵數十萬伏馬邑下單于顧謂左右曰幾為漢所賣乃引兵還出塞曰吾得尉史乃天也命尉史為天王塞下傳言單于已引去漢兵追至塞度弗及即罷王恢等兵三萬聞單于不與漢合度往擊輜重必與單于精兵戰漢兵勢必敗則以便宜罷兵皆無功天子怒王恢不出擊單于輜重擅引兵罷也恢曰始約虜入馬邑城兵與單于接而臣擊其輜重可得利今單于聞不至而還臣以三萬人衆不敵禔取辱耳臣固知還而斬然得完陛下士三萬人於是下恢廷尉廷尉當恢逗橈當斬恢私行千金丞相蚡蚡不敢言上而言於太后曰王恢首造馬邑事今不成而誅恢是為胸奴報仇也上朝太后太后以丞相言告上上曰首為馬邑事者恢也故發天下兵數十萬從其言為此且縱單于不可得恢所部擊其輜重猶頗可得以慰士大夫心今不誅恢無以謝天下於是恢聞之乃自殺安國為人多大略智足以當世取合而出於忠厚焉貪嗜於財所推舉皆廉士賢於已者也於梁舉壺遂臧固郅他皆天下名士士亦以此稱慕之唯天子以為國器安國為御史大夫四歲餘丞相田蚡死安國行丞相事奉引墮車蹇天子議置相欲用安國使使視之蹇甚乃更以平棘侯薛澤為丞相安國病免數月蹇愈上復以安國為中尉歲餘徙為衛尉車騎將軍衛青擊胸奴出上谷破胡蘢城將軍李廣為胸奴所得復失之公孫敖大亡卒皆當斬贖為庶人明年胸奴大入邊殺遼西太守及入鴈門所殺略數千人車騎將軍衛青擊之出鴈門衛尉安國為材官將軍屯於漁陽安國捕生虜言胸奴遠去即上書言方田作時請且罷軍屯罷軍屯月餘胸奴大入上谷漁陽安國壁乃有七百餘人出與戰不勝復入壁胸奴虜略千餘人及畜産而去天子聞之怒使使責讓安國徙安國益東屯右北平是時胸奴虜言當入東方安國始為御史大夫及護軍後稍斥疏下遷而新幸壯將軍衛青等有功益貴安國既疏遠默默也將屯又為胸奴所欺失亡多甚自愧幸得罷歸乃益東徙屯意忽忽不樂數月病歐血死安國以元朔二年中卒太史公曰余與壺遂定律曆觀韓長孺之義壺遂之深中隱厚世之言梁多長者不虛哉壺遂官至詹事天子方倚以為漢相會遂卒不然壺遂之內廉行修斯鞠躬君子也
