body:
  text: 伍子胥列傳第六伍子胥者楚人也名員員父曰伍奢員兄曰伍尚其先曰伍舉以宜諫事楚莊王有顯故其後世有名於楚楚平王有太子名曰建使伍奢為太傅費無忌為少傅無忌不忠於太子建平王使無忌為太子取婦於秦秦女好無忌馳歸報平王曰秦女絶美王可自取而更為太子取婦平王遂自取秦女而絶愛幸之生子軫更為太子取婦無忌既以秦女自媚於平王因去太子而事平王恐一旦平王卒而太子立殺己乃因讒太子建建母蔡女也無寵於平王平王稍益疏建使建守城父備邊兵頃之無忌又日夜言太子短於王曰太子以秦女之故不能無怨望願王少自備也自太子居城父將兵外交諸侯且欲入為亂矣平王乃召其太傅伍奢考問之伍奢知無忌讒太子於平王因曰王獨奈何以讒賊小臣疏骨肉之親乎無忌曰王今不制其事成矣王且見禽於是平王怒囚伍奢而使城父司馬奮揚往殺太子行未至奮揚使人先告太子太子急去不然將誅太子建亡奔宋無忌言於平王曰伍奢有二子皆賢不誅且為楚憂可以其父質而召之不然且為楚患王使使謂伍奢曰能致汝二子則生不能則死伍奢曰尚為人仁呼必來員為人剛戾忍詬能成大事彼見來之并禽其勢必不來王不聽使人召二子曰來吾生汝父不來今殺奢也伍尚欲往員曰楚之召我兄弟非欲以生我父也恐有脫者後生患故以父為質詐召二子二子到則父子俱死何益父之死往而令讎不得報耳不如奔他國借力以雪父之恥俱滅無為也伍尚曰我知往終不能全父命然恨父召我以求生而不往後不能雪恥終為天下笑耳謂員可去矣汝能報殺父之讎我將歸死尚既就執使者捕伍胥伍胥貫弓執矢嚮使者使者不敢進伍胥遂亡聞太子建之在宋往從之奢聞子胥之亡也曰楚國君臣且苦兵矣伍尚至楚楚并殺奢與尚也伍胥既至宋宋有華氏之亂乃與太子建俱奔於鄭鄭人甚善之太子建又適晉晉頃公曰太子既善鄭鄭信太子太子能為我內應而我攻其外滅鄭必矣滅鄭而封太子太子乃還鄭事未會會自私欲殺其從者從者知其謀乃告之於鄭鄭定公與子産誅殺太子建建有子名勝伍胥懼乃與勝俱奔吳到昭關昭關欲執之伍胥遂與勝獨身步走幾不得脫追者在後至江江上有一漁父乘船知伍胥之急乃渡伍胥伍胥既渡解其劍曰此劍直百金以與父父曰楚國之法得伍胥者賜粟五萬石爵執圭豈徒百金劍邪不受伍胥未至吳而疾止中道乞食至於吳吳王僚方用事公子光為將伍胥乃因公子光以求見吳王久之楚平王以其邊邑鍾離與吳邊邑卑梁氏俱蠶兩女子爭桑相攻乃大怒至於兩國舉兵相伐吳使公子光伐楚拔其鍾離居巢而歸伍子胥説吳王僚曰楚可破也願復遣公子光公子光謂吳王曰彼伍胥父兄為戮於楚而勸王伐楚者欲以自報其讎耳伐楚未可破也伍胥知公子光有內志欲殺王而自立未可説以外事乃進專諸於公子光退而與太子建之子勝耕於野五年而楚平王卒初平王所奪太子建秦女生子軫及平王卒軫竟立為後是為昭王吳王僚因楚喪使二公子將兵往襲楚楚發兵絶吳兵之後不得歸吳國內空而公子光乃令專諸襲刺吳王僚而自立是為吳王闔廬闔廬既立得志乃召伍員以為行人而與謀國事楚誅其大臣郤宛伯州犁伯州犁之孫伯嚭亡奔吳吳亦以嚭為大夫前王僚所遣二公子將兵伐楚者道絶不得歸後聞闔廬弒王僚自立遂以其兵降楚楚封之於舒闔廬立三年乃興師與伍胥伯嚭伐楚拔舒遂禽故吳反二將軍因欲至郢將軍孫武曰民勞未可且待之乃歸四年吳伐楚取六與灊五年伐越敗之六年楚昭王使公子囊瓦將兵伐吳吳使伍員迎擊大破楚軍於豫章取楚之居巢九年吳王闔廬謂子胥孫武曰始子言郢未可入今果何如二子對曰楚將囊瓦貪而唐蔡皆怨之王必欲大伐之必先得唐蔡乃可闔廬聽之悉興師與唐蔡伐楚與楚夾漢水而陳吳王之弟夫概將兵請從王不聽遂以其屬五千人擊楚將子常子常敗走奔鄭於是吳乘勝而前五戰遂至郢己卯楚昭王出奔庚辰吳王入郢昭王出亡入雲夢盜擊王王走鄖鄖公弟懷曰平王殺我父我殺其子不亦可乎鄖公恐其弟殺王與王奔隨吳兵圍隨謂隨人曰周之子孫在漢川者楚盡滅之隨人欲殺王王子綦匿王己自為王以當之隨人卜與王於吳不吉乃謝吳不與王始伍員與申包胥為交員之亡也謂包胥曰我必覆楚包胥曰我必存之及吳兵入郢伍子胥求昭王既不得乃掘楚平王墓出其尸鞭之三百然後已申包胥亡於山中使人謂子胥曰子之報讎其以甚乎吾聞之人衆者勝天天定亦能破人今子故平王之臣親北面而事之今至於僇死人此豈其無天道之極乎伍子胥曰為我謝申包胥曰吾日莫途遠吾故倒行而逆施之於是申包胥走秦告急求救於秦秦不許包胥立於秦廷晝夜哭七日七夜不絶其聲秦哀公憐之曰楚雖無道有臣若是可無存乎乃遣車五百乘救楚擊吳六月敗吳兵於稷會吳王久留楚求昭王而闔廬弟夫概乃亡歸自立為王闔廬聞之乃釋楚而歸擊其弟夫概夫概敗走遂奔楚楚昭王見吳有內亂乃復入郢封夫概於堂溪為堂溪氏楚復與吳戰敗吳吳王乃歸後二歲闔廬使太子夫差將兵伐楚取番楚懼吳復大來乃去郢徙於鄀當是時吳以伍子胥孫武之謀西破強楚北威齊晉南服越人其後四年孔子相魯後五年伐越越王句踐迎擊敗吳於姑蘇傷闔廬指軍卻闔廬病創將死謂太子夫差曰爾忘句踐殺爾父乎夫差對曰不敢忘是夕闔廬死夫差既立為王以伯嚭為太宰習戰射二年後伐越敗越於夫湫越王句踐乃以餘兵五千人棲於會稽之上使大夫種厚幣遺吳太宰嚭以請和求委國為臣妾吳王將許之伍子胥諫曰越王為人能辛苦今王不滅後必悔之吳王不聽用太宰嚭計與越平其後五年而吳王聞齊景公死而大臣爭寵新君弱乃興師北伐齊伍子胥諫曰句踐食不重味弔死問疾且欲有所用之也此人不死必為吳患今吳之有越猶人之有腹心疾也而王不先越而乃務齊不亦謬乎吳王不聽伐齊大敗齊師於艾陵遂威鄒魯之君以歸益疏子胥之謀其後四年吳王將北伐齊越王句踐用子貢之謀乃率其衆以助吳而重寶以獻遺太宰嚭太宰嚭既數受越賂其愛信越殊甚日夜為言於吳王吳王信用嚭之計伍子胥諫曰夫越腹心之病今信其浮辭詐偽而貪齊破齊譬猶石田無所用之且盤庚之誥曰有顛越不恭劓殄滅之俾無遺育無使易種于茲邑此商之所以興願王釋齊而先越若不然後將悔之無及而吳王不聽使子胥於齊子胥臨行謂其子曰吾數諫王王不用吾今見吳之亡矣汝與吳俱亡無益也乃屬其子於齊鮑牧而還報吳吳太宰嚭既與子胥有隙因讒曰子胥為人剛暴少恩猜賊其怨望恐為深禍也前日王欲伐齊子胥以為不可王卒伐之而有大功子胥恥其計謀不用乃反怨望而今王又復伐齊子胥專愎強諫沮毀用事徒幸吳之敗以自勝其計謀耳今王自行悉國中武力以伐齊而子胥諫不用因輟謝詳病不行王不可不備此起禍不難且嚭使人微伺之其使於齊也乃屬其子於齊之鮑氏夫為人臣內不得意外倚諸侯自以為先王之謀臣今不見用常鞅鞅怨望願王早圖之吳王曰微子之言吾亦疑之乃使使賜伍子胥屬鏤之劍曰子以此死伍子胥仰天歎曰嗟乎讒臣嚭為亂矣王乃反誅我我令若父霸自若未立時諸公子爭立我以死爭之於先王幾不得立若既得立欲分吳國豫我我顧不敢望也然今若聽諛臣言以殺長者乃告其舍人曰必樹吾墓上以梓今可以為器而抉吾眼縣吳東門之上以觀越寇之入滅吳也乃自剄死吳王聞之大怒乃取子胥尸盛以鴟夷革浮之江中吳人憐之為立祠於江上因命曰胥山吳王既誅伍子胥遂伐齊齊鮑氏殺其君悼公而立陽生吳王欲討其賊不勝而去其後二年吳王召魯衛之君會之橐皋其明年因北大會諸侯於黃池以令周室越王句踐襲殺吳太子破吳兵吳王聞之乃歸使使厚幣與越平後九年越王句踐遂滅吳殺王夫差而誅太宰嚭以不忠於其君而外受重賂與己比周也伍子胥初所與俱亡故楚太子建之子勝者在於吳吳王夫差之時楚惠王欲召勝歸楚葉公諫曰勝好勇而陰求死士殆有私乎惠王不聽遂召勝使居楚之邊邑鄢號為白公白公歸楚三年而吳誅子胥白公勝既歸楚怨鄭之殺其父乃陰養死士求報鄭歸楚五年請伐鄭楚令尹子西許之兵未發而晉伐鄭鄭請救於楚楚使子西往救與盟而還白公勝怒曰非鄭之仇乃子西也勝自礪劍人問曰何以為勝曰欲以殺子西子西聞之笑曰勝如卵耳何能為也其後四歲白公勝與石乞襲殺楚令尹子西司馬子綦於朝石乞曰不殺王不可乃劫王如高府石乞從者屈固負楚惠王亡走昭夫人之宮葉公聞白公為亂率其國人攻白公白公之徒敗亡走山中自殺而虜石乞而問白公尸處不言將亨石乞曰事成為卿不成而亨固其職也終不肯告其尸處遂亨石乞而求惠王復立之太史公曰怨毒之於人甚矣哉王者尚不能行之於臣下況同列乎向令伍子胥從奢俱死何異螻蟻棄小義雪大恥名垂於後世悲夫方子胥窘於江上道乞食志豈嘗須臾忘郢邪故隱忍就功名非烈丈夫孰能致此哉白公如不自立為君者其功謀亦不可勝道者哉
