body:
  text: 高祖功臣侯者年表太史公曰古者人臣功有五品以德立宗廟定社稷曰勳以言曰勞用力曰功明其等曰伐積日曰閲封爵之誓曰使河如帶泰山若厲國以永寧爰及苗裔始未嘗不欲固其根本而枝葉稍陵夷衰微也余讀高祖侯功臣察其首封所以失之者曰異哉所聞書曰協和萬國遷于夏商或數千歲蓋周封八百幽厲之後見於春秋尚書有唐虞之侯伯歷三代千有餘載自全以蕃衛天子豈非篤於仁義奉上法哉漢興功臣受封者百有餘人天下初定故大城名都散亡戶口可得而數者十二三是以大侯不過萬家小者五六百戶後數世民咸歸鄉里戶益息蕭曹絳灌之屬或至四萬小侯自倍富厚如之子孫驕溢忘其先淫嬖至太初百年之得間見侯五餘皆坐法隕命亡國耗矣罔亦少密焉然皆身無兢兢於當世之禁云居今之世志古之道所以自鏡也未必盡同帝王者各殊禮而異務要以成功為統紀豈可緄乎觀所以得尊寵及所以廢辱亦當世得失之林也何必舊聞於是謹其終始表其文頗有所不盡本末著其明疑者闕之後有君子欲推而列之得以覽焉二前三年侯間反國除國名侯功高祖十二孝惠七高后八孝文二十三孝景十六建元至元封六年三十六太初元年盡後元二年十八侯第平陽以中涓從起沛至霸上侯以將軍入漢以左丞相出征齊魏以右丞相為平陽侯萬六百戶七六年十二月甲申懿侯曹參元年五其二年為相國二六年十月靖侯窋元年八十九四後四年簡侯奇元年三十三四年夷侯時元年十十六元光五年恭侯襄元年元鼎三年今侯宗元年二信武以中涓從起宛朐入漢以騎都尉定三秦擊項羽別定江陵侯五千三百戶以車騎將軍攻黥布陳豨七六年十二月甲申肅侯靳歙元年七五三六年夷侯亭元年十八後三年侯亭坐事國人過律奪侯國除十一清陽以中涓從起豐至霸上為騎郎將入漢以將軍擊項羽功侯三千一百戶七六年十二月甲申定侯王吸元年七八七元年哀侯強元年十六八年孝侯伉元年四十二五年哀侯不害元年七元光二年侯不害薨無後國除十四汝陰以令史從降沛為太僕常奉車為滕公竟定天下入漢中全孝惠魯元侯六千九百戶常為太僕七六年十二月甲申文侯夏侯嬰元年七八八七九年夷侯竈元年八十六年恭侯賜元年十六七元光二年侯頗元年十九元鼎二年侯頗坐尚公主與父御婢姦罪自殺國除八陽陵以舍人從起橫陽至霸上為騎將入漢定三秦屬淮陰定齊為齊丞相侯二千六百戶七六年十二月甲申景侯傅寬元年五二六年頃侯靖元年八十四九十五年恭侯則元年三十三前四年侯偃元年十八元狩元年偃坐與淮南王謀反國除十廣嚴以中涓從起沛至霸上為連敖入漢以騎將定燕趙得將軍侯二千二百戶七六年十二月甲申壯侯召歐元年七八十九二年戴侯勝元年十三十一年恭侯嘉元年至後七年嘉薨無後國除二十八廣平以舍人從起豐至霸上為郎中入漢以將軍擊項羽鍾離眛功侯四千五百戶七六年十二月甲申敬侯薛歐元年七八元年靖侯山元年十八五後三年侯澤元年八中二年有罪絶平棘五中五年復封節侯澤元年十五其十年為丞相三元朔四年侯穰元年元狩元年穰受淮南王財物稱臣在赦前詔問謾罪國除十五博陽以舍人從起碭以刺客將入漢以都尉擊項羽滎陽絶甬道擊殺追卒功侯七六年十二月甲申壯侯陳濞元年七八十八五後三年侯始元年四前五年侯始有罪國除塞二中五年復封始後元年始有罪國除十九曲逆以故楚都尉漢王二年初從修武為都尉遷為護軍中尉出六奇計定天下侯五千戶七六年十二月甲申獻侯陳平元年七其五年為左丞相八其元年徙為右丞相後專為丞相相孝文二年二二三年恭侯買元年十九五年簡侯悝元年四十二五年侯何元年十元光五年侯何坐略人妻棄市國除四十七堂邑以自定東陽為將屬項梁為楚柱國四歲項羽死屬漢定豫章浙江都浙自立為王壯息侯千八百戶復相楚元王十一年七六年十二月甲申安侯陳嬰元年七四四五年恭侯祿元年二二十一三年夷侯午元年十六十一元光六年季須元年十三元鼎元年侯須坐母長公主卒未除服姦兄弟爭財當死自殺國除八十六周呂以呂后兄初起以客從入漢為侯還定三秦將兵先入碭漢王之解彭城往從之復發兵佐高祖定天下功侯三六年正月丙戌令武侯呂澤元年四九年子台封酈侯元年七建成以呂后兄初起以客從擊三秦漢王入漢而釋之還豐沛奉衛呂宣王太上皇天下已平封釋之為建成侯七六年正月丙戌康侯釋之元年二五三年侯則元年有罪胡陵七元年五月丙寅封則弟大中大夫呂祿元年七年祿為趙王國除追尊康侯為昭王祿以趙王謀為不善大臣誅祿遂滅呂留以廄將從起下邳以韓申徒下韓國言上張旗志秦王恐降解上與項羽之郤為漢王請漢中地常計謀平天下侯萬戶七六年正月丙午文成侯張良元年七二六三年不疑元年四五年侯不疑坐與門大夫謀殺故楚內史當死贖為城旦國除六十二射陽兵初起與諸侯共擊秦為楚左令尹漢王與項羽有郤於鴻門項伯纏解難以破羽纏嘗有功封射陽侯七六年正月丙午侯項纏元年賜姓劉氏二三年侯纏卒嗣子睢有罪國除酇以客初起從入漢為丞相備守蜀及關中給軍食佐上定諸侯為法令立宗廟侯八千戶七六年正月丙午文終侯蕭何元年元年為丞相九年為相國二五三年哀侯祿元年一七二年懿侯同元年同祿弟築陽十九元年同有罪封何小子延元年一後四年煬侯遺元年三後五年侯則元年一有罪武陽七前二年封煬侯弟幽侯嘉元年八中二年侯勝元年十元朔二年侯勝坐不敬絶三元狩三年封何曾孫恭侯慶元年酇三元狩六年侯壽成元年十元封四年壽成為太常犧牲不如令國除一曲周以將軍從起岐攻長社以南別定漢中及蜀定三秦擊項羽侯四千八百戶七六年正月丙午景侯酈商元年七八二十三元年侯寄元年九有罪繆七中三年封商他子靖侯堅元年九元光四年康侯遂元年五元朔三年侯宗元年十一元鼎二年侯終根元年二十八後元二年侯終根坐咒詛誅國除六絳以中涓從起沛至霸上為侯定三秦食邑為將軍入漢定隴西擊項羽守嶢關定泗水東海八千一百戶七六年正月丙午武侯周勃元年七八其四年為太尉十一元年為右丞相三年免復為丞相六十二年侯勝之元年條六後二年封勃子亞夫元年十三其三年為太尉七年為丞相有罪國除平曲三後元年封勃子恭侯堅元年十六元朔五年侯建德元年十二元鼎五年侯建德坐酎金國除四舞陽以舍人起沛從至霸上為侯入漢定三秦為將軍擊項籍再益封從破燕執韓信侯五千戶七六年正月丙午武侯樊噲元年其七年為將軍相國三月六一七年侯伉元年呂須子八坐呂氏誅族二十三元年封樊噲子荒侯市人元年六七年侯它廣元年六中六年侯它廣非市人子國除五潁陰以中涓從起碭至霸上為昌文君入漢定三秦食邑以車騎將軍屬淮陰定齊淮南及下邑殺項籍侯五千戶七六年正月丙午懿侯灌嬰元年七八四其一為太尉三為丞相十九五年平侯何元年九七中三年侯強元年六有罪絶九元光二年封嬰孫賢為臨汝侯侯賢元年元朔五年侯賢行賕罪國除九汾陰初起以職志擊破秦入漢出關以內史堅守敖倉以御史大夫定諸侯比清陽侯二千八百戶七六年正月丙午悼侯周昌元年三建平四四年哀侯開方元年八四前五年侯意元年十三有罪絶安陽八中二年封昌孫左車建元元年有罪國除十六梁鄒兵初起以謁者從擊破秦入漢以將軍擊定諸侯功比博陽侯二千八百戶七六年正月丙午孝侯武儒元年四三五年侯最元年八二十三十六六元光元年頃侯嬰齊元年三元光四年侯山柎元年二十元鼎五年侯山柎坐酎金國除二十成兵初起以舍人從擊秦為都尉入漢定三秦出關以將軍定諸侯功比厭次侯二千八百戶七六年正月丙午敬侯董泄元年七元年康侯赤元年八二十三六有罪絶節氏五中五年復封康侯赤元年三建元四年恭侯罷軍元年五元光三年侯朝元年十二元狩三年侯朝為濟南太守與成陽王女通不敬國除二十五蓼以執盾前元年從起碭以左司馬入漢為將軍三以都尉擊項羽屬韓信功侯七六年正月丙午侯孔藂元年七八八十五九年侯臧元年十六十四元朔三年侯臧坐為太常南陵橋壞衣冠車不得度國除三十費以舍人前元年從起碭以左司馬入漢用都尉屬韓信擊項羽有功為將軍定會稽浙江湖陽侯七六年正月丙午圉侯陳賀元年七八二十三元年共侯常元年一二年侯偃元年中二年有罪絶八中六年封賀子侯最元年巢四後三年最薨無後國除陽夏以特將將卒五百人前元年從起宛朐至霸上為侯以遊擊將軍別定代已破臧荼封豨為陽夏侯五六年正月丙午侯陳豨元年十年八月豨以趙相國將兵守代漢使召豨豨反以其兵與王黃等略代自立為王漢殺豨靈丘隆慮以卒從起碭以連敖入漢以長鈹都尉擊項羽有功侯七六年正月丁未哀侯周灶元年七八十七六後二年侯通元年七中元年侯通有罪國除三十四陽都以趙將從起鄴至霸上為樓煩將入漢定三秦別降翟王屬悼武王殺龍且彭城為大司馬破羽軍葉拜為將軍忠臣侯七千八百戶七六年正月戊申敬侯丁復元年七五三六年躁侯寧元年九十四十年侯安成元年一二年侯安成有罪國除十七新陽以漢五年用左令尹初從功比堂邑侯千戶七六年正月壬子胡侯呂清元年三四四年頃侯臣元年八六二七年懷侯義元年十五九年惠侯它元年四五五年恭侯善元年七中三年侯談元年二十八元鼎五年侯談坐酎金國除八十一東武以戶衛起薛屬悼武王破秦軍杠里楊熊軍曲遇入漢為越將軍定三秦以都尉堅守敖倉為將軍破籍軍功侯二千戶七六年正月戊午貞侯郭蒙元年七五三六年侯它元年二十三五六年侯它棄市國除四十一汁方以趙將前三年從定諸侯侯二千五百戶功比平定侯齒故沛豪有力與上有郤故晚從七六年三月戊子肅侯雍齒元年二五三年荒侯巨元年八二十三二十三年侯野元年四中六年終侯桓元年二十八元鼎五年終侯桓坐酎金國除五十七棘蒲以將軍前元年率將二千五百人起薛別救東阿至霸上二歲十月入漢擊齊歷下軍田既功侯七六年三月丙申剛侯陳武元年七八十六後元年侯武薨嗣子奇反不得置後國除十三都昌以舍人前元年從起沛以騎隊率先降翟王虜章邯功侯七六年三月庚子莊侯朱軫元年七八元年剛侯率元年七十六八年夷侯詘元年二元年恭侯偃元年五三年侯辟強元年中元年辟強薨無後國除二十三武強以舍人從至霸上以騎將入漢還擊項羽屬丞相寧功侯用將軍擊黥布侯七六年三月庚子莊侯莊不識元年七六二七年簡侯嬰元年十七六後二年侯青翟元年十六二十五元鼎二年侯青翟坐為丞相與長史朱買臣等逮御史大夫湯不直國除三十三貰以越戶將從破秦入漢定三秦以都尉擊項羽千六百戶功比臺侯二六年三月庚子齊侯呂元年五八年恭侯方山元年七八二元年煬侯赤元年十二十二年康侯遺元年十六十六元朔五年侯倩元年八元鼎元年侯倩坐殺人棄市國除三十六海陽以越隊將從破秦入漢定三秦以都尉擊頨羽侯千八百戶七六年三月庚子齊信侯搖毋餘元年二五三年哀侯招攘元年四四五年康侯建元年二十三三四年哀侯省元年十中六年侯省薨無後國除三十七南安以河南將軍