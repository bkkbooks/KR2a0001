body:
  text: 表三代世表太史公曰五帝三代之記尚矣自殷以前諸侯不可得而譜周以來乃頗可著孔子因史文次春秋紀元年正時日月蓋其詳哉至於序尚書則略無年月或頗有然多闕不可録故疑則傳疑蓋其慎也余讀諜記黃帝以來皆有年數稽其曆譜諜終始五德之傳古文咸不同乖異夫子之弗論次其年月豈虛哉於是以五帝繫諜尚書集世紀黃帝以來訖共和為世表帝王世國號顓頊屬嚳屬堯屬舜屬夏屬殷屬周屬黃帝號有熊黃帝生昌意黃帝生玄囂黃帝生玄囂黃帝生昌意黃帝生昌意黃帝生玄囂黃帝生玄囂帝顓頊黃帝孫起黃帝至顓頊三世號高陽昌意生顓頊為高陽氏玄囂生蟜極玄囂生蟜極昌意生顓頊顓頊生窮蟬昌意生顓頊玄囂生蟜極蟜極生高辛玄囂生蟜極蟜極生高辛帝嚳黃帝曾孫起黃帝至帝嚳四世號高辛蟜極生高辛為帝嚳蟜極生高辛高辛生放勛窮蟬生敬康敬康生句望高辛生卨高辛生后稷為周祖帝堯起黃帝至嚳子五世號唐放勛為堯句望生蟜牛蟜牛生瞽叟卨為殷祖后稷生不窋帝舜黃帝玄孫之玄孫號虞瞽叟生重華是為帝舜顓頊生鯀鯀生文命卨生昭明不窋生鞠帝禹黃帝耳孫號夏文命是為禹昭明生相土鞠生公劉帝啓伐有扈作甘誓相土生昌若公劉生慶節帝太康昌若生曹圉曹圉生冥慶節生皇僕皇僕生差弗帝仲康太康弟冥生振差弗生毀渝毀渝生公非帝相振生微微生報丁公非生高圉高圉生亞圉帝少康報丁生報乙報乙生報丙亞圉生公祖類帝豫報丙生主壬主壬生主癸公祖類生太王亶父帝槐主癸生天乙是為殷湯亶父生季歷季歷生文王昌益易卦帝芒文王昌生武王發帝泄帝不降帝扃不降弟帝廑帝孔甲不降子好鬼神淫亂不好德二龍去帝皋帝發帝履癸是為桀從禹至桀十七世從黃帝至桀二十世殷湯代夏氏從黃帝至湯十七世帝外丙湯太子太丁蚤卒故立次弟外丙帝仲壬外丙弟帝太甲故太子太丁子淫伊尹放之桐宮三年悔過自責伊尹乃迎之復位帝沃丁伊尹卒帝太庚沃丁弟帝小甲太庚弟殷道衰諸侯或不至帝雍己小甲弟帝太戊雍己弟以桑穀生稱中宗帝中丁帝外壬中丁弟帝河亶甲外壬弟帝祖乙帝祖辛帝沃甲祖辛弟帝祖丁祖辛子帝南庚沃甲子帝陽甲祖丁子帝盤庚陽甲弟徙河南帝小辛盤庚弟帝小乙小辛弟帝武丁雉升鼎耳雊得傅説稱高宗帝祖庚帝甲祖庚弟淫帝廩辛帝庚丁廩辛弟殷徙河北帝武乙慢神震死帝太丁帝乙殷益衰帝辛是為紂弒從湯至紂二十九世從黃帝至紂四十六世周武王代殷從黃帝至武王十九世魯齊晉秦楚宋衛陳蔡曹燕成王誦周公旦武王弟初封太公尚文王武王師初封唐叔虞武王子初封惡來助紂父飛廉有力熊繹繹父鬻熊事文王初封微子啓紂庶兄初封康叔武王弟初封胡公滿舜之後初封叔度武王弟初封叔振鐸武王弟初封尸召公奭周同姓初封康王釗刑錯四十餘年魯公伯禽丁公呂伋晉侯燮女防熊乂微仲啓弟康伯申公蔡仲九世至惠侯昭王瑕南巡不返不赴諱之考公乙公武侯旁皋熊黮宋公孝伯相公蔡伯太伯穆王滿作甫刑荒服不至煬公考公弟癸公成侯大几熊勝丁公嗣伯孝公宮侯仲君恭王伊扈幽公哀公厲侯大駱熊煬湣公丁公弟疌伯慎公厲侯宮伯懿王堅周道衰詩人作刺魏公胡公靖侯非子熊渠煬公湣公弟靖伯幽公武侯孝伯孝王方懿王弟厲公獻公弒胡公秦侯熊無康厲公貞伯釐公夷伯夷王燮懿王子獻公厲公弟武公公伯熊鷙紅釐公頃侯厲王胡以惡聞過亂出奔遂死于彘真公秦仲熊延紅弟釐侯共和二伯行政武公真公弟熊勇張夫子問褚先生曰詩言契后稷皆無父而生今案諸傳記咸言有父父皆黃帝子也得無與詩謬乎褚先生曰不然詩言契生於卵后稷人迹者欲見其有天命精誠之意耳鬼神不能自成須人而生奈何無父而生乎一言有父一言無父信以傳信疑以傳疑故兩言之堯知契稷皆賢人天之所生故封之契七十里後十餘世至湯王天下堯知后稷子孫之後王也故益封之百里其後世且千歲至文王而有天下詩傳曰湯之先為契無父而生契母與姊妹浴於玄丘水有燕銜卵墮之契母得故含之誤吞之即生契契生而賢堯立為司徒姓之曰子氏子者茲茲益大也詩人美而頌之曰殷社芒芒天命玄鳥降而生商商者質殷號也文王之先為后稷后稷亦無父而生后稷母為薑嫄出見大人迹而履踐之知於身則生后稷薑嫄以為無父賤而棄之道中牛羊避不踐也抱之山中山者養之又捐之大澤鳥覆席食之薑嫄怪之於是知其天子乃取長之堯知其賢才立以為大農姓之曰姬氏姬者本也詩人美而頌之曰厥初生民深修益成而道后稷之始也孔子曰昔者堯命契為子氏為有湯也命后稷為姬氏為有文王也大王命季歷明天瑞也太伯之吳遂生源也天命難言非聖人莫能見舜禹契后稷皆黃帝子孫也黃帝策天命而治天下德澤深後世故其子孫皆復立為天子是天之報有德也人不知以為泛從布衣匹夫起耳夫布衣匹夫安能無故而起王天下乎其有天命然黃帝後世何王天下之久遠邪曰傳云天下之君王為萬夫之黔首請贖民之命者帝有福萬世黃帝是也五政明則修禮義因天時舉兵征伐而利者王有福千世蜀王黃帝後世也至今在漢西南五千里常來朝降輸獻於漢非以其先之有德澤流後世邪行道德豈可以忽乎哉人君王者舉而觀之漢大將軍霍子孟名光者亦黃帝後世也此可為博聞遠見者言固難為淺聞者説也何以言之古諸侯以國為姓霍者國名也武王封弟叔處於霍後世晉獻公滅霍公後世為庶民往來居平陽平陽在河東河東晉地分為衛國以詩言之亦可為周世周起后稷后稷無父而生以三代世傳言之后稷有父名高辛高辛黃帝曾孫黃帝終始傳曰漢興百有餘年有人不短不長出白燕之鄉持天下之政時有嬰兒主卻行車霍將軍者本居平陽白燕臣為郎時與方士考功會旗亭下為臣言豈不偉哉
