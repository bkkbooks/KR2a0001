body:
  text: 惠景閒侯者年表太史公讀列封至便侯曰有以也夫長沙王者著令甲稱其忠焉昔高祖定天下功臣非同姓疆土而王者八國至孝惠時唯獨長沙全禪五世以無嗣絶竟無過為藩守職信矣故其澤流枝庶毋功而侯者數人及孝惠訖孝景閒五十載追修高祖時遺功臣及從代來吳楚之勞諸侯子弟若肺腑外國歸義封者九十有餘咸表始終當世仁義成功之著者也國名侯功孝惠七高后八孝文二十三孝景十六建元至元封六年三十六太初已後便長沙王子侯二千戶七元年九月頃侯吳淺元年八二十二一後七年恭侯信元年五十一前六年侯廣志元年二十八元鼎五年侯千秋坐酎金國除軑長沙相侯七百戶六二年四月庚子侯利倉元年二六三年侯豨元年十五八十六年侯彭祖元年十六三十元封元年侯秩為東海太守行過不請擅發卒兵為衛當斬會赦國除平都以齊將高祖三年降定齊侯千戶三五年六月乙亥孝侯劉到元年八二二十一三年侯成元年十四後二年侯成有罪國除右孝惠時三扶柳高后姊長姁子侯七元年四月庚寅侯呂平元年八年侯平坐呂氏事誅國除郊呂后兄悼武王身佐高祖定天下呂氏佐高祖治天下天下大安封武王少子産為郊侯五元年四月辛卯侯呂産元年六年七月壬辰産為呂王國除八年九月産以呂王為漢相謀為不善大臣誅産遂滅諸呂南宮以父越人為高祖騎將從軍以大中大夫侯七元年四月丙寅侯張買元年八年侯買坐呂氏事誅國除梧以軍匠從起郟入漢後為少府作長樂未央宮築長安城先就功侯五百戶六元年四月乙酉齊侯陽成延元年二七年敬侯去疾元年二十三九七中三年靖侯偃元年八元光三年侯戎奴元年十四元狩五年侯戎奴坐謀殺季父棄市國除平定以卒從高祖起留以家車吏入漢以梟騎都尉擊項籍得樓煩將功用齊丞相侯一云項涓八元年四月乙酉敬侯齊受元年一四二年齊侯市人元年十八六年恭侯應元年十六七元光二年康侯延居元年十八元鼎二年侯昌元年二元鼎四年侯昌有罪國除博成以悼武王郎中兵初起從高祖起豐攻雍丘擊項籍力戰奉衛悼武王出滎陽功侯三元年四月乙酉敬侯馮無擇元年四四年侯代元年八年侯代坐呂氏事誅國除沛呂后兄康侯少子侯奉呂宣王寢園七元年四月乙酉侯呂種元年一為不其侯八年侯種坐呂氏事誅國除襄成孝惠子侯一元年四月辛卯侯義元年二年侯義為常山王國除軹孝惠子侯三元年四月辛卯侯朝元年四年侯朝為常山王國除壺關孝惠子侯四元年四月辛卯侯武元年五年侯武為淮陽王國除沅陵長沙嗣成王子侯八元年十一月壬申頃侯吳陽元年十七六後二年頃侯福元年十一四中五年哀侯周元年後三年侯周薨無後國除上邳楚元王子侯七二年五月丙申侯劉郢客元年一二年侯郢客為楚王國除朱虛齊悼惠王子侯七二年五月丙申侯劉章元年一二年侯章為城陽王國除昌平孝惠子侯三四年二月癸未侯太元年七年太為呂王國除贅其呂后昆弟子用淮陽丞相侯四四年四月丙申侯呂勝元年八年侯勝坐呂氏事誅國除中邑以執矛從高祖入漢以中尉破曹咎用呂相侯六百戶五四年四月丙申貞侯朱通元年十七六後二年侯悼元年十五後三年侯悼有罪國除樂平以隊卒從高祖起沛屬皇欣以郎擊陳餘用衛尉侯六百戶二四年四月丙申簡侯衛無擇元年三六年恭侯勝元年二十三十五一後三年侯侈元年五建元六年侯侈坐以買田宅不法又請求吏罪國除山都高祖五年為郎中柱下令以衛將軍擊陳豨用梁相侯五四年四月丙申貞侯王恬開元年三二十四年惠侯中黃元年三十三四年敬侯觸龍元年二十二元狩五年侯當元年八元封元年侯當坐與奴闌入上林苑國除松茲兵初起以舍人從起沛以郎中入漢還得雍王邯家屬功用常山丞相侯五四年四月丙申夷侯徐厲元年六十七七年康侯悼元年十二四中六年侯偃元年五建元六年侯偃有罪國除成陶以卒從高祖起單父為呂氏舍人度呂后淮之功用河南守侯五百戶五四年四月丙申夷侯周信元年十一十二年孝侯勃元年三十五年侯勃有罪國除俞以連敖從高祖破秦入漢以都尉定諸侯功比朝陽侯嬰死子它襲功用太中大夫侯四四年四月丙申侯呂它元年八年侯它坐呂氏事誅國除滕以舍人郎中十二歲以都尉屯田霸上用楚相侯四四年四月丙申侯呂更始元年八年侯更始坐呂氏事誅國除醴陵以卒從漢王二年初起櫟陽以卒吏擊項籍為河內都尉用長沙相侯六百戶五四年四月丙申侯越元年三四年侯越有罪國除呂成呂后昆弟子侯四四年四月丙申侯呂忿元年八年侯忿坐呂氏事誅國除東牟齊悼惠王子侯三六年四月丁酉侯劉興居元年一二年侯興居為濟北王國除錘呂肅王子侯二六年四月丁酉侯呂通元年八年侯通為燕王坐呂氏事國除信都以張敖魯元太后子侯一八年四月丁酉侯張侈元年元年侯侈有罪國除樂昌以張敖魯元太后子侯一八年四月丁酉侯張受元年元年侯受有罪國除祝茲呂后昆弟子侯八年四月丁酉侯呂榮元年坐呂氏事誅國除建陵以大謁者侯宦者多奇計八年四月丁酉侯張澤元年九月奪侯國除東平以燕王呂通弟侯八年五月丙辰侯呂莊元年坐呂氏事誅國除右高后時三十一陽信高祖十二年為郎以典客奪趙王呂祿印關殿門拒呂産等入共尊立孝文侯二千戶十四元年三月辛丑侯劉揭元年九十五年侯中意元年五六年侯中意有罪國除軹高祖十年為郎從軍十七歲為太中大夫迎孝文代用車騎將軍迎太后侯萬戶薄太后弟十元年四月乙巳侯薄昭元年十三十一年易侯戎奴元年十六一建元二年侯梁元年壯武以家吏從高祖起山東以都尉從守滎陽食邑以代中尉勸代王入驂乘至代邸王卒為帝功侯千四百戶二十三元年四月辛亥侯宋昌元年十一中四年侯昌奪侯國除清都以齊哀王舅父侯五元年四月辛未侯駟鈞元年前六年鈞有罪國除周陽以淮南厲王舅父侯五元年四月辛未侯趙兼元年前六年兼有罪國除樊以睢陽令從高祖初起阿以韓家子還定北地用常山相侯千二百戶十四元年六月丙寅侯蔡兼元年九十五年康侯客元年九七中三年恭侯平元年十三元朔二年侯辟方元年十四元鼎四年侯辟方有罪國除管齊悼惠王子侯二四年五月甲寅恭侯劉罷軍元年十八六年侯戎奴元年二三年侯戎奴反國除瓜丘齊悼惠王子十一四年五月甲寅侯劉寧國元年九十五年侯偃元年二三年侯偃反國除營齊悼惠王子侯十四年五月甲寅平侯劉信都元年十十四年侯廣元年二三年侯廣反國除楊虛齊悼惠王子侯十二四年五月甲寅恭侯劉將廬元年十六年侯將廬為齊王有罪國除朸齊悼惠王子侯十二四年五月甲寅侯劉辟光元年十六年侯辟光為濟南王國除安都齊悼惠王子侯十二四年五月甲寅侯劉志元年十六年侯志為濟北王國除平昌齊悼惠王子侯十二四年五月甲寅侯劉卬元年十六年侯卬為膠西王國除武城齊悼惠王子侯十二四年五月甲寅侯劉賢元年十六年侯賢為菑川王國除白石齊悼惠王子侯十二四年五月甲寅侯劉雄渠元年十六年侯雄渠為膠東王國除波陵以陽陵君侯五七年三月甲寅康侯魏駟元年十二年康侯魏駟薨無後國除南𨜓以信平君侯一七年三月丙寅侯起元年孝文時坐後父故奪爵級關內侯阜陵以淮南厲王子侯八八年五月丙午侯劉安元年十六年安為淮南王國除安陽以淮南厲王子侯八八年五月丙午侯勃元年十六年侯勃為衡山王國除陽周以淮南厲王子侯八八年五月丙午侯劉賜元年十六年侯賜為廬江王國除東城以淮南厲王子侯七八年五月丙午哀侯劉良元年十五年侯良薨無後國除犁以齊相召平子侯千四百一十戶十一十年四月癸丑頃侯召奴元年三後五年侯澤元年十六十六元朔五年侯延元年十九元封六年侯延坐不出持馬斬國除瓶以北地都尉孫卬胸奴入北地力戰死事子侯十十四年三月丁巳侯孫單元年二前三年侯單謀反國除弓高以胸奴相國降故韓王信孽子侯千二百三十七戶八十六年六月丙子莊侯韓頽當元年十六前元年侯則元年十六元朔五年侯則薨無後國除襄成以胸奴相國降侯故韓王信太子之子侯千四百三十二戶七十六年六月丙子哀侯韓嬰元年一後七年侯澤之元年十六十五元朔四年侯澤之坐詐病不從不敬國除故安孝文元年舉淮陽守從高祖入漢功侯食邑五百戶用丞相侯一千七百一十二戶五後三年四月丁巳節侯申屠嘉元年二十四前三年恭侯蔑元年十九元狩二年清安侯臾元年五元鼎元年臾坐為九江太守有罪國除章武以孝文后弟侯萬一千八百六十九戶一後七年六月乙卯景侯竇廣國元年六十前七年恭侯完元年八元光三年侯常坐元年十元狩元年侯常坐謀殺人未殺罪國除南皮以孝文后兄竇長君子侯六千四百六十戶一後七年六月乙卯侯竇彭祖元年十六五建元六年夷侯良元年五元光五年侯桑林元年十八元鼎五年侯桑林坐酎金罪國除右孝文時二十九平陸楚元王子侯三千二百六十七戶二元年四月乙巳侯劉禮元年三年侯禮為楚王國除休楚元王子侯二元年四月乙巳侯富元年三年侯富以兄子戎為楚王反富與家屬至長安北闕自歸不能相教上印綬詔復王後以平陸侯為楚王更封富為紅侯沈猶楚元王子侯千三百八十戶十六元年四月乙巳夷侯劉穢元年四建元五年侯受元年十八元狩五年侯受坐故為宗正聽謁不具宗室不敬國除紅楚元王子侯千七百五十戶四三年四月乙巳莊侯富元年一云禮侯一前七年悼侯澄元年九中元年敬侯發元年十五元朔四年侯章元年一元朔五年侯章薨無後國除宛朐楚元王子侯二元年四月乙巳侯劉藝元年三年侯藝反國除魏其以大將軍屯滎陽扞吳楚七國侯三千三百五十戶十四三年六月乙巳侯竇嬰元年九建元元年為丞相二歲免元光四年侯嬰坐爭灌夫事上書稱為先帝詔矯制害棄市國除棘樂楚元王子侯戶千二百一十三十四三年八月壬子敬侯劉調元年一建元二年恭侯應元年十一元朔元年侯慶元年十六元鼎五年侯慶坐酎金國除俞以將軍吳楚反時擊齊有功布故彭越舍人越反時布使齊還已梟越布祭哭之當亨出忠言高祖舍之黥布反布為都尉侯戶千八百六六年四月丁卯侯欒布元年中五年侯布薨十元狩六年侯賁坐為太常廟犧牲不如令有罪國除建陵以將軍擊吳楚功用中尉侯戶一千三百一十十一六年四月丁卯敬侯衛綰元年十元光五年侯信元年十八元鼎五年侯信坐酎金國除建平以將軍擊吳楚功用江都相侯戶三千一百五十十一六年四月丁卯哀侯程嘉元年七元光二年節侯橫元年一元光三年侯回元年一元光四年侯回薨無後國除平曲以將軍擊吳楚功用隴西太守侯戶三千二百二十五六年四月己巳侯公孫昆邪元年中四年侯昆邪有罪國除太僕賀父江陽以將軍擊吳楚功用趙相侯戶二千五百四十一四六年四月壬申康侯蘇嘉元年七中三年懿侯盧元年二建元三年侯明元年十六元朔六年侯雕元年十一元鼎五年侯雕坐酎金國除遽以趙相建德王遂反建德不聽死事子侯戶千九百七十六中二年四月乙巳侯橫元年後二年侯橫有罪國除新市以趙內史王慎王遂反慎不聽死事子侯戶一千十四五中二年四月乙巳侯王康元年三後元年殤侯始昌元年九元光四年殤侯始昌為人所殺國除商陵以楚太傅趙夷吾王戊反不聽死事子侯千四十五戶八中二年四月乙巳侯趙周元年二十九元鼎五年侯周坐為丞相知列侯酎金輕下廷尉自殺國除山陽以楚相張尚王戊反尚不聽死事子侯戶千一百一十四八中二年四月乙巳侯張當居元年十六元朔五年侯當居坐為太常程博士弟子故不以實罪國除安陵以胸奴王降侯戶一千五百十七七中三年十一月庚子侯子軍元年五建元六年侯子軍薨無後國除垣以胸奴王降侯三中三年十二月丁丑侯賜元年六年賜死不得及嗣遒以胸奴王降侯戶五千五百六十九中三年十二月丁丑侯隆彊元年不得隆彊嗣大逆無道國除後元年四月甲辰侯則坐使巫齊少君祠祝詛大逆無道國除容成以胸奴王降侯七百戶七中三年十二月丁丑侯唯徐盧元年十四建元元年康侯綽元年二十二元朔三年侯光元年十八後二年三月壬辰侯光坐祠祝詛國除易以胸奴王降侯六中三年十二月丁丑侯僕黥元年後二年侯僕黥薨無嗣范陽以胸奴王降侯戶千一百九十七七中三年十二月丁丑端侯代元年七元光二年懷侯德元年二元光四年侯德薨無後國除翕以胸奴王降侯七中三年十二月丁丑侯邯鄲元年九元光四年侯邯鄲坐行來不請長信不敬國除亞谷以胸奴東胡王降故燕王盧綰子侯千五百戶二中五年四月丁巳簡侯它父元年三後元年安侯種元年十一建元元年康侯偏元年二十五元光六年侯賀元年十五征和二年七月辛巳侯賀坐太子事國除隆慮以長公主嫖子侯戶四千一百二十六五中五年五月丁丑侯蟜元年二十四元鼎元年侯蟜坐母長公主薨未除服姦禽獸行當死自殺國除乘氏以梁孝王子侯中五年五月丁卯侯買元年中六年侯買嗣為梁王國除桓邑以梁孝王子侯一中五年五月丁卯侯明元年中六年為濟川王國除蓋以孝景后兄侯戶二千八百九十五中五年五月甲戌靖侯王信元年二十元狩三年侯偃元年八元鼎五年侯偃坐酎金國除塞以御史大夫前將兵擊吳楚功侯戶千四十六三後元年八月侯直不疑元年三建元四年侯相如元年十二元朔四年侯堅元年十三元鼎五年堅坐酎金國除武安以孝景后同母弟侯戶八千二百一十四一後三年三月侯田蚡元年九元光四年侯梧元年五元朔三年侯梧坐衣襜褕入宮廷中不敬國除周陽以孝景后同母弟侯戶六千二十六一後三年三月懿侯田勝元年十一元光六年侯彭祖元年八元狩二年侯彭祖坐當歸與章侯宅不與罪國除右孝景時三十
