body:
  text: 秦楚之際月表太史公讀秦楚之際曰初作難發於陳涉虐戾滅秦自項氏撥亂誅暴平定海內卒踐帝祚成於漢家五年之閒號令三嬗自生民以來未始有受命若斯之亟也昔虞夏之興積善累功數十年德洽百姓攝行政事考之于天然後在位湯武之王乃由契后稷脩仁行義十餘世不期而會孟津八百諸侯猶以為未可其後乃放弒秦起襄公章於文繆獻孝之後稍以蠶食六國百有餘載至始皇乃能并冠帶之倫以德若彼用力如此蓋一統若斯之難也秦既稱帝患兵革不休以有諸侯也於是無尺土之封墮壞名城銷鋒鏑鉏豪桀維萬世之安然王跡之興起於閭巷合從討伐軼於三代鄉秦之禁適足以資賢者為驅除難耳故憤發其所為天下雄安在無土不王此乃傳之所謂大聖乎豈非天哉豈非天哉非大聖孰能當此受命而帝者乎十八秦楚項趙齊漢燕魏韓公元前二世元年七月楚隱王陳涉起兵入秦八月二葛嬰為涉徇九江立襄彊為楚王武臣始至邯鄲自立為趙王始九月楚兵至戲三周文兵至戲敗而葛嬰聞涉王即殺彊項梁號武信君二齊王田儋始儋狄人諸田宗彊從弟榮榮弟橫沛公初起韓廣為趙略地至薊自立為燕王始魏王咎始咎在陳不得歸國二年十月四誅葛嬰二三二儋之起殺狄令自王二擊胡陵方與破秦監軍二二十一月五周文死三四李良殺武臣張耳陳餘走三三殺泗水守拔薛西周市東略地豐沛閒三三齊趙共立周市市不肯曰必立魏咎云十二月六陳涉死四四四雍齒叛沛公以豐降魏沛公還攻豐不能下四四咎自陳歸立端月楚王景駒始秦嘉立之五涉將召平矯拜項梁為楚柱國急西擊秦趙王歇始張耳陳餘立之五讓景駒以擅自王不請我五沛公聞景駒王在留往從與擊秦軍碭西五五章邯已破涉圍咎臨濟二月二嘉為上將軍六梁渡江陳嬰黥布皆屬二六景駒使公孫慶讓齊誅慶六攻下碭收得兵六千與故凡九千人六六三月三七三七七攻拔下邑遂擊豐豐不拔聞項梁兵眾往請擊豐七七四月四八梁擊殺景駒秦嘉遂入薛兵十餘萬眾四八八沛公如薛見項梁梁益沛公卒五千擊豐拔之雍齒奔魏八八臨濟急周市如齊楚請救五月九五九九九九六月楚懷王始都盱台故懷王孫梁立之十梁求楚懷王孫得之民閒立為楚王六十儋救臨濟章邯殺田儋榮走東阿十沛公如薛共立楚懷王十十咎自殺臨濟降秦韓王成始七月二陳嬰為柱國十一天大雨三月不見星七齊立田假為王秦急圍東阿十一沛公與項羽北救東阿破秦軍濮陽東屠城陽十一咎弟豹走東阿二八月三十二救東阿破秦軍乘勝至定陶項梁有驕色八楚救榮得解歸逐田假立儋子市為齊王始十二沛公與項羽西略地斬三川守李由於雍丘十二三九月四徙都彭城十三章邯破殺項梁於定陶項羽恐還軍彭城九二田假走楚楚趨齊救趙田榮以假故不肯謂楚殺假乃出兵項羽怒田榮十三沛公聞項梁死還軍從懷王軍於碭十三魏豹自立為魏王都平陽始四後九月五拜宋義為上將軍懷王封項羽於魯為次將屬宋義北救趙十秦軍圍歇鉅鹿陳餘出收兵三十四懷王封沛公為武安侯將碭郡兵西約先至咸陽王之十四二五三年十月六二十一章邯破邯鄲徙其民於河內四齊將田都叛榮往助項羽救趙十五攻破東郡尉及王離軍於成武南十五使將臧荼救趙三六十一月七拜籍上將軍三羽矯殺宋義將其兵渡河救鉅鹿十二五十六十六四七十二月八四大破秦軍鉅鹿下諸侯將皆屬項羽十三楚救至秦圍解六故齊王建孫田安下濟北從項羽救趙十七至栗得皇訢武蒲軍與秦軍戰破之十七五豹救趙八端月九五虜秦將王離十四張耳怒陳餘棄將印去七十八十八六九二月十六攻破章邯章邯軍卻十五八十九得彭越軍昌邑襲陳留用酈食其策軍得積粟十九七十三月十一七十六九二十攻開封破秦將楊熊熊走滎陽秦斬熊以徇二十八十一四月十二八楚急攻章邯章邯恐使長史欣歸秦請兵趙高讓之十七十二十一攻潁陽略韓地北絕河津二十一九十二五月二年一月九趙高欲誅欣欣恐亡走告章邯謀叛秦十一二十二二十二十十三六月二十章邯與楚約降未定項羽許而擊之十九十二二十三攻南陽守齮破之陽城郭東二十三十一十四七月三十一項羽與章邯期殷虛章邯等已降與盟以邯為雍王二十十三二十四降下南陽封其守齮二十四十二十五申陽下河南降楚八月趙高殺二世四十二以秦降都尉翳長史欣為上將將秦降軍二十一趙王歇留國陳餘亡居南皮十四二十五攻武關破之二十五十三十六九月子嬰為王五十三二十二十五二十六攻下嶢及藍田以留侯策不戰皆降二十六十四十七十月六十四項羽將諸侯兵四十餘萬行略地西至於河南二十三張耳從楚西入秦十六二十七漢元年秦王子嬰降沛公入破咸陽平秦還軍霸上待諸侯約二十七十五從項羽略地遂入關十八十一月七十五羽詐阬殺秦降卒二十萬人於新安二十四十七二十八沛公出令三章秦民大悅二十八十六十九十二月八分楚為四十六至關中誅秦王子嬰屠燒咸陽分天下立諸侯二十五分趙為代國十八項羽怨榮分齊為三國二十九與項羽有郄見之戲下講解羽倍約分關中為四國二十九臧荼從入分燕為二國十七分魏為殷國二十分韓為河南國九義帝元年諸侯尊懷王為義帝十七項籍自立為西楚霸王分為衡山分為臨江分為九江二十六更名為常山分為代十九更名為臨菑分為濟北分為膠東正月分關中為漢分關中為雍分關中為塞分關中為翟三十燕分為遼東十八更為西魏分為殷二十一韓分為河南二徙都江南郴西楚主伯項籍始為天下主命立十八王王吳芮始故番君王共敖始故楚柱國王英布始故楚將王張耳始故楚將二十七王趙歇始故趙王王田都始故齊將王田安始故齊將二十王田市始故齊王二月漢王始故沛公王章邯始故秦將王司馬欣始故秦將王董翳始故秦將王臧荼始故燕將三十一王韓廣始故燕王十九王魏豹始故魏王王司馬卬始故趙將二十二王韓成始故韓將王申陽始故楚將三二都彭城二都邾二都江陵二都六二都襄國二十八都代二都臨菑二都博陽二十一都即墨三月都南鄭二都廢丘二都櫟陽二都高奴二都薊三十二都無終二十都平陽二都朝歌二十三都陽翟二都洛陽四三諸侯罷戲下兵皆之國三三三三二十九三三二十二四月三三三三三十三二十一三二十四三五四四四四四三十四田榮擊都都降楚四二十三五月四四四四三十四二十二四二十五四六五五五五五三十一齊王田榮始故齊相五二十四田榮擊殺市六月五五五五三十五二十三五二十六五七六六六六六三十二二六田榮擊殺安屬齊七月六六六六三十六二十四六二十七項羽誅成六八七七七七七三十三三屬齊八月七邯守廢丘漢圍之七欣降漢國除七翳降漢國除七三十七臧荼擊廣無終滅之二十五七韓王鄭昌始項羽立之七九八八八八八三十四四九月八屬漢為渭南河上郡屬漢為上郡八屬燕二十六八二八十項羽滅義帝九九九九九耳降漢三十五歇復王趙五十月王至陝九九二十七九三九十十十十三十六六十一月十漢拔我隴西十二十八十韓王信始漢立之屬漢為河南郡十一十一十一十一歇以陳餘為代王故成安君三十七七十二月十一十一二十九十一二十二十二十二十二二三十八八項籍擊榮走平原平原民殺之正月十二漢拔我北地十二三十十二三二年一月二年一月十三二年一月三三十九項籍立故齊王田假為齊王二月二年一月二年一月三十一十三四二二十四二四四十二田榮弟橫反城陽擊假走楚楚殺假三月王擊殷二二三十二降漢十四降漢卬廢五三項羽以兵三萬破漢兵五十六萬三十五三五四十一齊王田廣始廣榮子橫立之四月王伐楚至彭城壞走三三三十三從漢伐楚為河內郡屬漢六從漢伐楚四四十六四六四十二二五月王走滎陽四四三十四豹歸叛漢七五五十七五七四十三三六月王入關立太子復如滎陽五漢殺邯廢丘五三十五八六六十八六八四十四四七月屬漢為隴西北地中地郡六三十六九七七十九七九四十五五八月七三十七十八八二十八十四十六六九月八三十八漢將信虜豹十一九九二十一九十一四十七七後九月九屬漢為河東上黨郡十二十十二十二十十二漢將韓信斬陳餘四十八漢滅歇八三年十月十二年一月十一十一二十三十一屬漢為太原郡屬漢為郡九十一月十一二十二十二二十四十二布身降漢地屬項籍十十二月十二三三年一月三年一月二十五十一正月三年一月四二二二十六十二二月二五三三二十七十三三月三六四四二十八十四四月楚圍王滎陽四七五五二十九十五五月五八六六三十十六六月六九七七三十一王敖薨十七七月王出滎陽七十八八臨江王驩始敖子十八八月周苛樅公殺魏豹八十一九九二十九九月九十二十十三二十四年十月十三年一月十一漢將韓信破殺龍且十一四趙王張耳始漢立之二十一漢將韓信擊殺廣十一月十一二十二十二五二屬漢為郡十二月十二三四年一月四年一月六三正月四年一月四二二七四齊王韓信始漢立之二月立信王齊二五三漢御史周苛入楚死三八五二三月周苛入楚三六四四九六三四月王出滎陽豹死四七五五十七四五月五八六六十一八五六月六九七七十二淮南王英布始漢立之九六七月立布為淮南王七十八八十三二十七八月八十一九九十四三十一八九月太公呂后歸自楚九十二十十十五四十二九五年十月十四年一月十一十一十六五二年一月十十一月十一二十二誅籍十二十七漢虜驩六二十一十二月十二三齊王韓信徙楚王十三徙王長沙屬漢為南郡七淮南國三趙國十二徙王楚屬漢為四郡正月殺項籍天下平諸侯臣屬漢五年一月燕國復置梁國四韓王信徙王代都馬邑分臨江為長沙國二屬淮南國八四二月甲午王更號即皇帝位於定陶二梁王彭越始五衡山王吳芮為為長沙王三九五三月三二六二四十六四月四三七三五十一七五月五四八四六十二八六月帝入關六五九五七二年一月九耳薨謚景王七月七六十六薨謚文王八二趙王張敖始耳子八月帝自將誅燕八七十一長沙成王臣始芮子九王得故項羽將鍾離昧斬之以聞三二九月九反漢虜荼八十二二十四三後九月燕王盧綰始漢太尉九五年一月三
