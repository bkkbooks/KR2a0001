body:
  text: 樂書第二太史公曰余每讀虞書至於君臣相敕維是幾安而股肱不良萬事墮壞未嘗不流涕也成王作頌推己懲艾悲彼家難可不謂戰戰恐懼善守善終哉君子不為約則修德滿則棄禮佚能思初安能惟始沐浴膏澤而歌詠勤苦非大德誰能如斯傳曰治定功成禮樂乃興海內人道益深其德益至所樂者益異滿而不損則溢盈而不持則傾凡作樂者所以節樂君子以謙退為禮以損減為樂樂其如此也以為州異國殊情習不同故博采風俗協比聲律以補短移化助流政教天子躬於明堂臨觀而萬民咸蕩滌邪穢斟酌飽滿以飾厥性故云雅頌之音理而民正嘄噭之聲興而士奮鄭衛之曲動而心淫及其調和諧合鳥獸盡感而況懷五常含好惡自然之勢也治道虧缺而鄭音興起封君世辟名顯鄰州爭以相高自仲尼不能與齊優遂容於魯雖退正樂以誘世作五章以刺時猶莫之化陵遲以至六國流沔沈佚遂往不返卒於喪身滅宗并國於秦秦二世尤以為娛丞相李斯進諫曰放棄詩書極意聲色祖伊所以懼也輕積細過恣心長夜紂所以亡也趙高曰五帝三王樂各殊名示不相襲上自朝廷下至人民得以接歡喜合殷勤非此和說不通解澤不流亦各一世之化度時之樂何必華山之騄耳而后行遠乎二世然之高祖過沛詩三侯之章令小兒歌之高祖崩令沛得以四時歌儛宗廟孝惠孝文孝景無所增更於樂府習常肄舊而已至今上即位作十九章令侍中李延年次序其聲拜為協律都尉通一經之士不能獨知其辭皆集會五經家相與共講習讀之乃能通知其意多爾雅之文漢家常以正月上辛祠太一甘泉以昏時夜祠到明而終常有流星經於祠壇上使僮男僮女七十人俱歌春歌青陽夏歌朱明秋歌西皞冬歌玄冥世多有故不論又嘗得神馬渥洼水中復次以為太一之歌歌曲曰太一貢兮天馬下霑赤汗兮沫流赭騁容與兮跇萬里今安匹兮龍為友後伐大宛得千里馬馬名蒲梢次作以為歌歌詩曰天馬來兮從西極經萬里兮歸有德承靈威兮降外國涉流沙兮四夷服中尉汲黯進曰凡王者作樂上以承祖宗下以化兆民今陛下得馬詩以為歌協於宗廟先帝百姓豈能知其音邪上默然不說丞相公孫弘曰黯誹謗聖制當族凡音之起由人心生也人心之動物使之然也感於物而動故形於聲聲相應故生變變成方謂之音比音而樂之及干戚羽旄謂之樂也樂者音之所由生也其本在人心感於物也是故其哀心感者其聲噍以殺其樂心感者其聲嘽以緩其喜心感者其聲發以散其怒心感者其聲麤以厲其敬心感者其聲直以廉其愛心感者其聲和以柔六者非性也感於物而后動是故先王慎所以感之故禮以導其志樂以和其聲政以壹其行刑以防其姦禮樂刑政其極一也所以同民心而出治道也凡音者生人心者也情動於中故形於聲聲成文謂之音是故治世之音安以樂其正和亂世之音怨以怒其正乖亡國之音哀以思其民困聲音之道與正通矣宮為君商為臣角為民徵為事羽為物五者不亂則無惉懘之音矣宮亂則荒其君驕商亂則搥其臣壞角亂則憂其民怨徵亂則哀其事勤羽亂則危其財匱五者皆亂迭相陵謂之慢如此則國之滅亡無日矣鄭衛之音亂世之音也比於慢矣桑閒濮上之音亡國之音也其政散其民流誣上行私而不可止凡音者生於人心者也樂者通於倫理者也是故知聲而不知音者禽獸是也知音而不知樂者眾庶是也唯君子為能知樂是故審聲以知音審音以知樂審樂以知政而治道備矣是故不知聲者不可與言音不知音者不可與言樂知樂則幾於禮矣禮樂皆得謂之有德德者得也是故樂之隆非極音也食饗之禮非極味也清廟之瑟朱弦而疏越一倡而三歎有遺音者矣大饗之禮尚玄酒而俎腥魚大羹不和有遺味者矣是故先王之制禮樂也非以極口腹耳目之欲也將以教民平好惡而反人道之正也人生而靜天之性也感於物而動性之頌也物至知知然后好惡形焉好惡無節於內知誘於外不能反己天理滅矣夫物之感人無窮而人之好惡無節則是物至而人化物也人化物也者滅天理而窮人欲者也於是有悖逆詐偽之心有淫佚作亂之事是故彊者脅弱眾者暴寡知者詐愚勇者苦怯疾病不養老幼孤寡不得其所此大亂之道也是故先王制禮樂人為之節衰麻哭泣所以節喪紀也鐘鼓干戚所以和安樂也婚姻冠笄所以別男女也射鄉食饗所以正交接也禮節民心樂和民聲政以行之刑以防之禮樂刑政四達而不悖則王道備矣樂者為同禮者為異同則相親異則相敬樂勝則流禮勝則離合情飾貌者禮樂之事也禮義立則貴賤等矣樂文同則上下和矣好惡著則賢不肖別矣刑禁暴爵舉賢則政均矣仁以愛之義以正之如此則民治行矣樂由中出禮自外作樂由中出故靜禮自外作故文大樂必易大禮必簡樂至則無怨禮至則不爭揖讓而治天下者禮樂之謂也暴民不作諸侯賓服兵革不試五刑不用百姓無患天子不怒如此則樂達矣合父子之親明長幼之序以敬四海之內天子如此則禮行矣大樂與天地同和大禮與天地同節和故百物不失節故祀天祭地明則有禮樂幽則有鬼神如此則四海之內合敬同愛矣禮者殊事合敬者也樂者異文合愛者也禮樂之情同故明王以相沿也故事與時並名與功偕故鐘鼓管磬羽籥干戚樂之器也詘信俯仰級兆舒疾樂之文也簠簋俎豆制度文章禮之器也升降上下周旋裼襲禮之文也故知禮樂之情者能作識禮樂之文者能術作者之謂聖術者之謂明明聖者術作之謂也樂者天地之和也禮者天地之序也和故百物皆化序故群物皆別樂由天作禮以地制過制則亂過作則暴明於天地然後能興禮樂也論倫無患樂之情也欣喜驩愛樂之官也中正無邪禮之質也莊敬恭順禮之制也若夫禮樂之施於金石越於聲音用於宗廟社稷事于山川鬼神則此所以與民同也王者功成作樂治定制禮其功大者其樂備其治辨者其禮具干戚之舞非備樂也亨孰而祀非達禮也五帝殊時不相沿樂三王異世不相襲禮樂極則憂禮粗則偏矣及夫敦樂而無憂禮備而不偏者其唯大聖乎天高地下萬物散殊而禮制行也流而不息合同而化而樂興也春作夏長仁也秋斂冬藏義也仁近於樂義近於禮樂者敦和率神而從天禮者辨宜居鬼而從地故聖人作樂以應天作禮以配地禮樂明備天地官矣天尊地卑君臣定矣高卑已陳貴賤位矣動靜有常大小殊矣方以類聚物以群分則性命不同矣在天成象在地成形如此則禮者天地之別也地氣上隮天氣下降陰陽相摩天地相蕩鼓之以靁霆奮之以風雨動之以四時煖之以日月而百化興焉如此則樂者天地之和也化不時則不生男女無別則亂登此天地之情也及夫禮樂之極乎天而蟠乎地行乎陰陽而通乎鬼神窮高極遠而測深厚樂著太始而禮居成物著不息者天也著不動者地也一動一靜者天地之閒也故聖人曰禮云樂云昔者舜作五弦之琴以歌南風夔始作樂以賞諸侯故天子之為樂也以賞諸侯之有德者也德盛而教尊五穀時孰然后賞之以樂故其治民勞者其舞行級遠其治民佚者其舞行級短故觀其舞而知其德聞其謚而知其行大章章之也咸池備也韶繼也夏大也殷周之樂盡也天地之道寒暑不時則疾風雨不節則饑教者民之寒暑也教不時則傷世事者民之風雨也事不節則無功然則先王之為樂也以法治也善則行象德矣夫豢豕為酒非以為禍也而獄訟益煩則酒之流生禍也是故先王因為酒禮一獻之禮賓主百拜終日飲酒而不得醉焉此先王之所以備酒禍也故酒食者所以合歡也樂者所以象德也禮者所以閉淫也是故先王有大事必有禮以哀之有大福必有禮以樂之哀樂之分皆以禮終樂也者施也禮也者報也樂樂其所自生而禮反其所自始樂章德禮報情反始也所謂大路者天子之輿也龍旂九旒天子之旌也青黑緣者天子之葆龜也從之以牛羊之群則所以贈諸侯也樂也者情之不可變者也禮也者理之不可易者也樂統同禮別異禮樂之說貫乎人情矣窮本知變樂之情也著誠去偽禮之經也禮樂順天地之誠達神明之德降興上下之神而凝是精粗之體領父子君臣之節是故大人舉禮樂則天地將為昭焉天地欣合陰陽相得煦嫗覆育萬物然后草木茂區萌達羽翮奮角觡生蟄蟲昭穌羽者嫗伏毛者孕鬻胎生者不殰而卵生者不殈則樂之道歸焉耳樂者非謂黃鍾大呂弦歌干揚也樂之末節也故童者舞之布筵席陳樽俎列籩豆以升降為禮者禮之末節也故有司掌之樂師辯乎聲詩故北面而弦宗祝辯乎宗廟之禮故後尸商祝辯乎喪禮故後主人是故德成而上蓺成而下行成而先事成而後是故先王有上有下有先有後然后可以有制於天下也樂者聖人之所樂也而可以善民心其感人深其風移俗易故先王著其教焉夫人有血氣心知之性而無哀樂喜怒之常應感起物而動然后心術形焉是故志微焦衰之音作而民思憂嘽緩慢易繁文簡節之音作而民康樂粗厲猛起奮末廣賁之音作而民剛毅廉直經正莊誠之音作而民肅敬寬裕肉好順成和動之音作而民慈愛流辟邪散狄成滌濫之音作而民淫亂是故先王本之情性稽之度數制之禮義合生氣之和道五常之行使之陽而不散陰而不密剛氣不怒柔氣不懾四暢交於中而發作於外皆安其位而不相奪也然后立之學等廣其節奏省其文采以繩德厚也類小大之稱比終始之序以象事行使親疏貴賤長幼男女之理皆形見於樂故曰樂觀其深矣土敝則草木不長水煩則魚鱉不大氣衰則生物不育世亂則禮廢而樂淫是故其聲哀而不莊樂而不安慢易以犯節流湎以忘本廣則容姦狹則思欲感滌蕩之氣而滅平和之德是以君子賤之也凡姦聲感人而逆氣應之逆氣成象而淫樂興焉正聲感人而順氣應之順氣成象而和樂興焉倡和有應回邪曲直各歸其分而萬物之理以類相動也是故君子反情以和其志比類以成其行姦聲亂色不留聰明淫樂廢禮不接於心術惰慢邪辟之氣不設於身體使耳目鼻口心知百體皆由順正以行其義然后發以聲音文以琴瑟動以干戚飾以羽旄從以簫管奮至德之光動四氣之和以著萬物之理是故清明象天廣大象地終始象四時周旋象風雨五色成文而不亂八風從律而不姦百度得數而有常小大相成終始相生倡和清濁代相為經故樂行而倫清耳目聰明血氣和平移風易俗天下皆寧故曰樂者樂也君子樂得其道小人樂得其欲以道制欲則樂而不亂以欲忘道則惑而不樂是故君子反情以和其志廣樂以成其教樂行而民鄉方可以觀德矣德者性之端也樂者德之華也金石絲竹樂之器也詩言其志也歌詠其聲也舞動其容也三者本乎心然后樂氣從之是故情深而文明氣盛而化神和順積中而英華發外唯樂不可以為偽樂者心之動也聲者樂之象也文采節奏聲之飾也君子動其本樂其象然后治其飾是故先鼓以警戒三步以見方再始以著往復亂以飭歸奮疾而不拔極幽而不隱獨樂其志不厭其道備舉其道不私其欲是以情見而義立樂終而德尊君子以好善小人以息過故曰生民之道樂為大焉君子曰禮樂不可以斯須去身致樂以治心則易直子諒之心油然生矣易直子諒之心生則樂樂則安安則久久則天天則神天則不言而信神則不怒而威致樂以治心者也致禮以治躬者也治躬則莊敬莊敬則嚴威心中斯須不和不樂而鄙詐之心入之矣外貌斯須不莊不敬而慢易之心入之矣故樂也者動於內者也禮也者動於外者也樂極和禮極順內和而外順則民瞻其顏色而弗與爭也望其容貌而民不生易慢焉德煇動乎內而民莫不承聽理發乎外而民莫不承順故曰知禮樂之道舉而錯之天下無難矣樂也者動於內者也禮也者動於外者也故禮主其謙樂主其盈禮謙而進以進為文樂盈而反以反為文禮謙而不進則銷樂盈而不反則放故禮有報而樂有反禮得其報則樂樂得其反則安禮之報樂之反其義一也夫樂者樂也人情之所不能免也樂必發諸聲音形於動靜人道也聲音動靜性術之變盡於此矣故人不能無樂樂不能無形形而不為道不能無亂先王惡其亂故制雅頌之聲以道之使其聲足以樂而不流使其文足以綸而不息使其曲直繁省廉肉節奏足以感動人之善心而已矣不使放心邪氣得接焉是先王立樂之方也是故樂在宗廟之中君臣上下同聽之則莫不和敬在族長鄉里之中長幼同聽之則莫不和順在閨門之內父子兄弟同聽之則莫不和親故樂者審一以定和比物以飾節節奏合以成文所以合和父子君臣附親萬民也是先王立樂之方也故聽其雅頌之聲志意得廣焉執其干戚習其俯仰詘信容貌得莊焉行其綴兆要其節奏行列得正焉進退得齊焉故樂者天地之齊中和之紀人情之所不能免也夫樂者先王之所以飾喜也軍旅鈇鉞者先王之所以飾怒也故先王之喜怒皆得其齊矣喜則天下和之怒則暴亂者畏之先王之道禮樂可謂盛矣魏文侯問於子夏曰吾端冕而聽古樂則唯恐臥聽鄭衛之音則不知倦敢問古樂之如彼何也新樂之如此何也子夏答曰今夫古樂進旅而退旅和正以廣弦匏笙簧合守拊鼓始奏以文止亂以武治亂以相訊疾以雅君子於是語於是道古修身及家平均天下此古樂之發也今夫新樂進俯退俯姦聲以淫溺而不止及優侏儒獶雜子女不知父子樂終不可以語不可以道古此新樂之發也今君之所問者樂也所好者音也夫樂之與音相近而不同文侯曰敢問如何子夏答曰夫古者天地順而四時當民有德而五穀昌疾疢不作而無祅祥此之謂大當然后聖人作為父子君臣以為之紀綱紀綱既正天下大定天下大定然后正六律和五聲弦歌詩頌此之謂德音德音之謂樂詩曰莫其德音其德克明克明克類克長克君王此大邦克順克俾俾於文王其德靡悔既受帝祉施于孫子此之謂也今君之所好者其溺音與文侯曰敢問溺音者何從出也子夏答曰鄭音好濫淫志宋音燕女溺志衛音趣數煩志齊音驁辟驕志四者皆淫於色而害於德是以祭祀不用也詩曰肅雍和鳴先祖是聽夫肅肅敬也雍雍和也夫敬以和何事不行為人君者謹其所好惡而已矣君好之則臣為之上行之則民從之詩曰誘民孔易此之謂也然后聖人作為鞉鼓椌楬壎篪此六者德音之音也然后鐘磬竽瑟以和之干戚旄狄以舞之此所以祭先王之廟也所以獻醻酳酢也所以官序貴賤各得其宜也此所以示後世有尊卑長幼序也鐘聲鏗鏗以立號號以立橫橫以立武君子聽鐘聲則思武臣石聲硜硜以立別別以致死君子聽磬聲則思死封疆之臣絲聲哀哀以立廉廉以立志君子聽琴瑟之聲則思志義之臣竹聲濫濫以立會會以聚眾君子聽竽笙簫管之聲則思畜聚之臣鼓鼙之聲讙讙以立動動以進眾君子聽鼓鼙之聲則思將帥之臣君子之聽音非聽其鏗鎗而已也彼亦有所合之也賓牟賈侍坐於孔子孔子與之言及樂曰夫武之備戒之已久何也答曰病不得其眾也永歎之淫液之何也答曰恐不逮事也發揚蹈厲之已蚤何也答曰及時事也武坐致右憲左何也答曰非武坐也聲淫及商何也答曰非武音也子曰若非武音則何音也答曰有司失其傳也如非有司失其傳則武王之志荒矣子曰唯丘之聞諸萇弘亦若吾子之言是也賓牟賈起免席而請曰夫武之備戒之已久則既聞命矣敢問遲之遲而又久何也子曰居吾語汝夫樂者象成者也總干而山立武王之事也發揚蹈厲太公之志也武亂皆坐周召之治也且夫武始而北出再成而滅商三成而南四成而南國是疆五成而分陝周公左召公右六成復綴以崇天子夾振之而四伐盛威於中國也分夾而進事蚤濟也久立於綴以待諸侯之至也且夫女獨未聞牧野之語乎武王克殷反商未及下車而封黃帝之後於薊封帝堯之後於祝封帝舜之後於陳下車而封夏后氏之後於𣏌封殷之後於宋封王子比干之墓釋箕子之囚使之行商容而復其位庶民弛政庶士倍祿濟河而西馬散華山之陽而弗復乘牛散桃林之野而不復服車甲弢而藏之府庫而弗復用倒載干戈苞之以虎皮將率之士使為諸侯名之曰建櫜然后天下知武王之不復用兵也散軍而郊射左射貍首右射騶虞而貫革之射息也裨冕搢笏而虎賁之士稅劍也祀乎明堂而民知孝朝覲然后諸侯知所以臣耕藉然后諸侯知所以敬五者天下之大教也食三老五更於太學天子袒而割牲執醬而饋執爵而酳冕而總干所以教諸侯之悌也若此則周道四達禮樂交通則夫武之遲久不亦宜乎子貢見師乙而問焉曰賜聞聲歌各有宜也如賜者宜何歌也師乙曰乙賤工也何足以問所宜請誦其所聞而吾子自執焉寬而靜柔而正者宜歌頌廣大而靜疏達而信者宜歌大雅恭儉而好禮者宜歌小雅正直清廉而謙者宜歌風肆直而慈愛者宜歌商溫良而能斷者宜歌齊夫歌者直己而陳德動己而天地應焉四時和焉星辰理焉萬物育焉故商者五帝之遺聲也商人志之故謂之商齊者三代之遺聲也齊人志之故謂之齊明乎商之詩者臨事而屢斷明乎齊之詩者見利而讓也臨事而屢斷勇也見利而讓義也有勇有義非歌孰能保此故歌者上如抗下如隊曲如折止如槀木居中矩句中鉤累累乎殷如貫珠故歌之為言也長言之也說之故言之言之不足故長言之長言之不足故嗟歎之嗟歎之不足故不知手之舞之足之蹈之子貢問樂凡音由於人心天之與人有以相通如景之象形響之應聲故為善者天報之以福為惡者天與之以殃其自然者也故舜彈五弦之琴歌南風之詩而天治紂為朝歌北鄙之音身死國亡舜之道何弘也紂之道何隘也夫南風之詩者生長之音也舜樂好之樂與天地同意得萬國之驩心故天下治也夫朝歌者不時也北者敗也鄙者陋也紂樂好之與萬國殊心諸侯不附百姓不親天下畔之故身死國亡而衛靈公之時將之晉至於濮水之上舍夜半時聞鼓琴聲問左右皆對曰不聞乃召師涓曰吾聞鼓琴音問左右皆不聞其狀似鬼神為我聽而寫之師涓曰諾因端坐援琴聽而寫之明日曰臣得之矣然未習也請宿習之靈公曰可因復宿明日報曰習矣即去之晉見晉平公平公置酒於施惠之臺酒酣靈公曰今者來聞新聲請奏之平公曰可即令師涓坐師曠旁授琴鼓之未終師曠撫而止之曰此亡國之聲也不可遂平公曰何道出師曠曰師延所作也與紂為靡靡之樂武王伐紂師延東走自投濮水之中故聞此聲必於濮水之上先聞此聲者國削平公曰寡人所好者音也願遂聞之師涓鼓而終之平公曰音無此最悲乎師曠曰有平公曰可得聞乎師曠曰君德義薄不可以聽之平公曰寡人所好者音也願聞之師曠不得已援琴而鼓之一奏之有玄鶴二八集乎廊門再奏之延頸而鳴舒翼而舞平公大喜起而為師曠壽反坐問曰音無此最悲乎師曠曰有昔者黃帝以大合鬼神今君德義薄不足以聽之聽之將敗平公曰寡人老矣所好者音也願遂聞之師曠不得已援琴而鼓之一奏之有白雲從西北起再奏之大風至而雨隨之飛廊瓦左右皆奔走平公恐懼伏於廊屋之閒晉國大旱赤地三年聽者或吉或凶夫樂不可妄興也太史公曰夫上古明王舉樂者非以娛心自樂快意恣欲將欲為治也正教者皆始於音音正而行正故音樂者所以動盪血脈通流精神而和正心也故宮動脾而和正聖商動肺而和正義角動肝而和正仁徵動心而和正禮羽動腎而和正智故樂所以內輔正心而外異貴賤也上以事宗廟下以變化黎庶也琴長八尺一寸正度也弦大者為宮而居中央君也商張右傍其餘大小相次不失其次序則君臣之位正矣故聞宮音使人溫舒而廣大聞商音使人方正而好義聞角音使人惻隱而愛人聞徵音使人樂善而好施聞羽音使人整齊而好禮夫禮由外入樂自內出故君子不可須臾離禮須臾離禮則暴慢之行窮外不可須臾離樂須臾離樂則姦邪之行窮內故樂音者君子之所養義也夫古者天子諸侯聽鐘磬未嘗離於庭卿大夫聽琴瑟之音未嘗離於前所以養行義而防淫佚也夫淫佚生於無禮故聖王使人耳聞雅頌之音目視威儀之禮足行恭敬之容口言仁義之道故君子終日言而邪辟無由入也
