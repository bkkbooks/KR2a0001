body:
  text: 佞幸列傳六十五諺曰力田不如逢年善仕不如遇合固無虛言非獨女以色媚而士宦亦有之昔以色幸者多矣至漢興高祖至暴抗也然籍孺以佞幸孝惠時有閎孺此兩人非有材能徒以婉佞貴幸與上臥起公卿皆因關說故孝惠時郎侍中皆冠鵕鸃貝帶傅脂粉化閎籍之屬也兩人徙家安陵孝文時中寵臣士人則鄧通宦者則趙同北宮伯子北宮伯子以愛人長者而趙同以星氣幸常為文帝參乘鄧通無伎能鄧通蜀郡南安人也以濯船為黃頭郎孝文帝夢欲上天不能有一黃頭郎從後推之上天顧見其衣裻帶後穿覺而之漸臺以夢中陰目求推者郎即見鄧通其衣後穿夢中所見也召問其名姓姓鄧氏名通文帝說焉尊幸之日異通亦愿謹不好外交雖賜洗沐不欲出於是文帝賞賜通巨萬以十數官至上大夫文帝時時如鄧通家遊戲然鄧通無他能不能有所薦士獨自謹其身以媚上而已上使善相者相通曰當貧餓死文帝曰能富通者在我也何謂貧乎於是賜鄧通蜀嚴道銅山得自鑄錢鄧氏錢布天下其富如此文帝嘗病癰鄧通常為帝唶吮之文帝不樂從容問通曰天下誰最愛我者乎通曰宜莫如太子太子入問病文帝使唶癰唶癰而色難之已而聞鄧通常為帝唶吮之心慚由此怨通矣及文帝崩景帝立鄧通免家居居無何人有告鄧通盜出徼外鑄錢下吏驗問頗有之遂竟案盡沒入鄧通家尚負責數巨萬長公主賜鄧通吏輒隨沒入之一簪不得著身於是長公主乃令假衣食竟不得名一錢寄死人家孝景帝時中無寵臣然獨郎中令周文仁仁寵最過庸乃不甚篤令天子中寵臣士人則韓王孫嫣宦者則李延年嫣者弓高侯孼孫也今上為膠東王時嫣與上學書相愛及上為太子愈益親嫣嫣善騎射善佞上即位欲事伐匈奴而嫣先習胡兵以故益尊貴官至上大夫賞賜擬於鄧通時嫣常與上臥起江都王入朝有詔得從入獵上林中天子車駕蹕道未行而先使嫣乘副車從數十百騎騖馳視獸江都王望見以為天子辟從者伏謁道傍嫣驅不見既過江都王怒為皇太后泣曰請得歸國入宿衛比韓嫣太后由此嗛嫣嫣待上出入永巷不禁以姦聞皇太后皇太后怒使使賜嫣死上為謝終不能得嫣遂死而案道侯韓說其弟也亦佞幸李延年中山人也父母及身兄弟及女皆故倡也延年坐法腐給事狗中而平陽公主言延年女弟善舞上見心說之及入永巷而召貴延年延年善歌為變新聲而上方興天地祠欲造樂詩歌弦之延年善承意弦次初詩其女弟亦幸有子男延年佩二千石印號協聲律與上臥起甚貴幸埒如韓嫣也久之寖與中人亂出入驕恣及其女弟李夫人卒後愛弛則禽誅延年昆弟也自是之後內寵嬖臣大底外戚之家然不足數也衛青霍去病亦以外戚貴幸然頗用材能自進太史公曰甚哉愛憎之時彌子瑕之行足以觀後人佞幸矣雖百世可知也
