body:
  text: 太史公曰農工商交易之路通而龜貝金錢刀布之幣興焉所從來久遠自高辛氏之前尚矣靡得而記云故書道唐虞之際詩述殷周之世安寧則長庠序先本絀末以禮義防于利事變多故而亦反是是以物盛則衰時極而轉一質一文終始之變也禹貢九州各因其土地所宜人民所多少而納職焉湯武承斃易變使民不倦各兢兢所以為治而稍陵遲衰微齊桓公用管仲之謀通輕重之權徼山海之業以朝諸侯用區區之齊顯成霸名魏用李克盡地力為強君自是之後天下爭於戰國貴詐力而賤仁義先富有而後推讓故庶人之富者或纍巨萬而貧者或不厭糟粳有國強者或并群小以臣諸侯而弱國或絶祀而滅世以至於秦卒并海內虞夏之幣金為三品或黃或白或赤或錢或布或刀或龜貝及至秦中一國之幣為三二等黃金以溢名為上幣銅錢識曰半兩重如其文為下幣而珠玉龜貝銀錫之屬為器飾寶藏不為幣然各隨時而輕重無常於是外攘夷狄內興功業海內之士力耕不足糧餉女子紡績不足衣服古者嘗竭天下之資財以奉其上猶自以為不足也無異故云事勢之流相激使然曷足怪焉
