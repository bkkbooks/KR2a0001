body:
  text: 齊悼惠王世家第二十二齊悼惠王劉肥者高祖長庶男也其母外婦也曰曹氏高祖六年立肥為齊王食七十城諸民能齊言者皆豫齊王齊王孝惠帝兄也孝惠帝二年齊王入朝惠帝與齊王燕飲亢禮如家人呂太后怒且誅齊王齊王懼不得脫乃用其內史勳計獻城陽郡以為魯元公主湯沐邑呂太后喜乃得辭就國悼惠王即位十二年以惠帝六年卒子襄立是為哀王哀王元年孝惠帝崩呂太后稱制天下事皆決於高后二年高后立其兄子酈侯呂台為呂王割齊之濟南郡為呂王奉邑哀王三年其弟章入宿衛於漢呂太后封為朱虛侯以呂祿女妻之後四年封章弟興居為東牟侯皆宿衛長安中哀王八年高后割齊琅邪郡立營陵侯劉澤為琅邪王其明年趙王友入朝幽死于邸三趙王皆廢高后立諸呂為三王擅權用事朱虛侯年二十有氣力忿劉氏不得職嘗入侍高后燕飲高后令朱虛劉章為酒吏章自請曰臣將種也請得以軍法行酒高后曰可酒酣章進飲歌舞已而曰請為太后言耕田歌高后兒子畜之笑曰顧而父知田耳若生而為王子安知田乎章曰臣知之太后曰試為我言田章曰深耕穊種立苗欲疏非其種者鉏而去之呂后默然頃之諸呂有一人醉亡酒章追拔劍斬之而還報曰有亡酒一人臣謹行法斬之太后左右皆大驚業已許其軍法無以罪也因罷自是之後諸呂憚朱虛侯雖大臣皆依朱虛侯劉氏為益彊其明年高后崩趙王呂祿為上將軍呂王産為相國皆居長安中聚兵以威大臣欲為亂朱虛侯章以呂祿女為婦知其謀乃使人陰出告其兄齊王欲令發兵西朱虛侯東牟侯為內應以誅諸呂因立齊王為帝齊王既聞此計乃與其舅父駟鈞郎中令祝午中尉魏勃陰謀發兵齊相召平聞之乃發卒衛王宮魏勃紿召平曰王欲發兵非有漢虎符驗也而相君圍王固善勃請為君將兵衛衛王召平信之乃使魏勃將兵圍王宮勃既將兵使圍相府召平曰嗟乎道家之言當斷不斷反受其亂乃是也遂自殺於是齊王以駟鈞為相魏勃為將軍祝午為內史悉發國中兵使祝午東詐琅邪王曰呂氏作亂齊王發兵欲西誅之齊王自以兒子年少不習兵革之事願舉國委大王大王自高帝將也習戰事齊王不敢離兵使臣請大王幸之臨菑見齊王計事并將齊兵以西平關中之亂琅邪王信之以為然乃馳見齊王齊王與魏勃等因留琅邪王而使祝午盡發琅邪國而并將其兵琅邪王劉澤既見欺不得反國乃說齊王曰齊悼惠王高皇帝長子推本言之而大王高皇帝適長孫也當立今諸大臣狐疑未有所定而澤於劉氏最為長年大臣固待澤決計今大王留臣無為也不如使我入關計事齊王以為然乃益具車送琅邪王琅邪王既行齊遂舉兵西攻呂國之濟南於是齊哀王遺諸侯王書曰高帝平定天下王諸子弟悼惠王於齊悼惠王薨惠帝使留侯張良立臣為齊王惠帝崩高后用事春秋高聽諸呂擅廢高帝所立又殺三趙王滅梁燕趙以王諸呂分齊國為四忠臣進諫上惑亂不聽今高后崩皇帝春秋富未能治天下固恃大臣諸侯今諸呂又擅自尊官聚兵嚴威劫列侯忠臣矯制以令天下宗廟所以危今寡人率兵入誅不當為王者漢聞齊發兵而西相國呂産乃遣大將軍灌嬰東擊之灌嬰至滎陽乃謀曰諸呂將兵居關中欲危劉氏而自立我今破齊還報是益呂氏資也乃留兵屯滎陽使使喻齊王及諸侯與連和以待呂氏之變而共誅之齊王聞之乃西取其故濟南郡亦屯兵於齊西界以待約呂祿呂産欲作亂關中朱虛侯與太尉勃丞相平等誅之朱虛侯首先斬呂産於是太尉勃等乃得盡誅諸呂而琅邪王亦從齊至長安大臣議欲立齊王而琅邪王及大臣曰齊王母家駟鈞惡戾虎而冠者也方以呂氏故幾亂天下今又立齊王是欲復為呂氏也代王母家薄氏君子長者且代王又親高帝子於今見在且最為長以子則順以善人則大臣安於是大臣乃謀迎立代王而遣朱虛侯以誅呂氏事告齊王令罷兵灌嬰在滎陽聞魏勃本教齊王反既誅呂氏罷齊兵使使召責問魏勃勃曰失火之家豈暇先言大人而後救火乎因退立股戰而栗恐不能言者終無他語灌將軍熟視笑曰人謂魏勃勇妄庸人耳何能為乎乃罷魏勃魏勃父以善鼓琴見秦皇帝及魏勃少時欲求見齊相曹參家貧無以自通乃常獨早夜掃齊相舍人門外相舍人怪之以為物而伺之得勃勃曰願見相君無因故為子掃欲以求見於是舍人見勃曹參因以為舍人一為參御言事參以為賢言之齊悼惠王悼惠王召見則拜為內史始悼惠王得自置二千石及悼惠王卒而哀王立勃用事重於齊相王既罷兵歸而代王來立是為孝文帝孝文帝元年盡以高后時所割齊之城陽琅邪濟南郡復與齊而徙琅邪王王燕益封朱虛侯東牟侯各二千戶是歲齊哀王卒太子則立是為文王齊文王元年漢以齊之城陽郡立朱虛侯為城陽王以齊濟北郡立東牟侯為濟北王二年濟北王反漢誅殺之地入于漢後二年孝文帝盡封齊悼惠王子罷軍等七人皆為列侯齊文王立十四年卒無子國除地入于漢後一歲孝文帝以所封悼惠王子分齊為王齊孝王將閭以悼惠王子楊虛侯為齊王故齊別郡盡以王悼惠王子子志為濟北王子辟光為濟南王子賢為菑川王子卬為膠西王子雄渠為膠東王與城陽齊凡七王齊孝王十一年吳王濞楚王戊反興兵西告諸侯曰將誅漢賊臣鼂錯以安宗廟膠西膠東菑川濟南皆擅發兵應吳楚欲與齊齊孝王狐疑城守不聽三國兵共圍齊齊王使路中大夫告於天子天子復令路中大夫還告齊王善堅守吾兵今破吳楚矣路中大夫至三國兵圍臨菑數重無從入三國將劫與路中大夫盟曰若反言漢已破矣齊趣下三國不且見屠路中大夫既許之至城下望見齊王曰漢已發兵百萬使太尉周亞夫擊破吳楚方引兵救齊齊必堅守無下三國將誅路中大夫齊初圍急陰與三國通謀約未定會聞路中大夫從漢來喜及其大臣乃復勸王毋下三國居無何漢將欒布平陽侯等兵至齊擊破三國兵解齊圍已而復聞齊初與三國有謀將欲移兵伐齊齊孝王懼乃飲藥自殺景帝聞之以為齊首善以迫劫有謀非其罪也乃立孝王太子壽為齊王是為懿王續齊後而膠西膠東濟南菑川王咸誅滅地入于漢徙濟北王王菑川齊懿王立二十二年卒子次景立是為厲王齊厲王其母曰紀太后太后取其弟紀氏女為厲王后王不愛紀氏女太后欲其家重寵令其長女紀翁主入王宮正其後宮毋令得近王欲令愛紀氏女王因與其姊翁主姦齊有宦者徐甲入事漢皇太后皇太后有愛女曰修成君修成君非劉氏太后憐之修成君有女名娥太后欲嫁之於諸侯宦者甲乃請使齊必令王上書請娥皇太后喜使甲之齊是時齊人主父偃知甲之使齊以取后事亦因謂甲即事成幸言偃女願得充王後宮甲既至齊風以此事紀太后大怒曰王有后後宮具備且甲齊貧人急乃為宦者入事漢無補益乃欲亂吾王家且主父偃何為者乃欲以女充後宮徐甲大窮還報皇太后曰王已願尚娥然有一害恐如燕王燕王者與其子昆弟姦新坐以死亡國故以燕感太后太后曰無復言嫁女齊事事浸潯聞於天子主父偃由此亦與齊有卻主父偃方幸於天子用事因言齊臨菑十萬戶市租千金人衆殷富巨於長安此非天子親弟愛子不得王此今齊王於親屬益疏乃從容言呂太后時齊欲反吳楚時孝王幾為亂今聞齊王與其姊亂於是天子乃拜主父偃為齊相且正其事主父偃既至齊乃急治王後宮宦者為王通於姊翁主所者令其辭證皆引王王年少懼大罪為吏所執誅乃飲藥自殺絶無後是時趙王懼主父偃一出廢齊恐其漸疏骨肉乃上書言偃受金及輕重之短天子亦既囚偃公孫弘言齊王以憂死毋後國入漢非誅偃無以塞天下之望遂誅偃齊厲王立五年死毋後國入于漢齊悼惠王後尚有二國城陽及菑川菑川地比齊天子憐齊為悼惠王冢園在郡割臨菑東環悼惠王冢園邑盡以豫菑川以奉悼惠王祭祀城陽景王章齊悼惠王子以朱虛侯與大臣共誅諸呂而章身首先斬相國呂王産於未央宮孝文帝既立益封章二千戶賜金千斤孝文二年以齊之城陽郡立章為城陽王立二年卒子喜立是為共王共王八年徙王淮南四年復還王城陽凡三十三年卒子延立是為頃王頃王二十六年子義立是為敬王敬王九年卒子武立是為惠王惠王十一年卒子順立是為荒王荒王四十六年卒子恢立是為戴王戴王八年卒子景立至建始三年十五歲卒濟北王興居齊悼惠王子以東牟侯助大臣誅諸呂功少及文帝從代來興居曰請與太僕嬰入清宮廢少帝共與大臣尊立孝文帝孝文帝二年以齊之濟北郡立興居為濟北王與城陽王俱立立二年反始大臣誅呂氏時朱虛侯功尤大許盡以趙地王朱虛侯盡以梁地王東牟侯及孝文帝立聞朱虛東牟之初欲立齊王故絀其功及二年王諸子乃割齊二郡以王章興居章興居自以失職奪功章死而興居聞胸奴大入漢漢多發兵使丞相灌嬰擊之文帝親幸太原以為天子自擊胡遂發兵反於濟北天子聞之罷丞相及行兵皆歸長安使棘蒲侯柴將軍擊破虜濟北王王自殺地入于漢為郡後十三年文帝十六年復以齊悼惠王子安都侯志為濟北王十一年吳楚反時志堅守不與諸侯合謀吳楚已平徙志王菑川濟南王辟光齊悼惠王子以勒侯孝文十六年為濟南王十一年與吳楚反漢擊破殺辟光以濟南為郡地入于漢菑川王賢齊悼惠王子以武城侯文帝十六年為菑川王十一年與吳楚反漢擊破殺賢天子因徙濟北王志王菑川志亦齊悼惠王子以安都侯王濟北菑川王反毋後乃徙濟北王王菑川凡立三十五年卒諡為懿王子建代立是為靖王二十年卒子遺代立是為頃王三十六年卒子終古立是為思王二十八年卒子尚立是為孝王五年卒子橫立至建始三年十一歲卒膠西王卬齊悼惠王子以昌平侯文帝十六年為膠西王十一年與吳楚反漢擊破殺卬地入于漢為膠西郡膠東王雄渠齊悼惠王子以白石侯文帝十六年為膠東王十一年與吳楚反漢擊破殺雄渠地入于漢為膠東郡太史公曰諸侯大國無過齊悼惠王以海內初定子弟少激秦之無尺土封故大封同姓以填萬民之心及後分裂固其理也
