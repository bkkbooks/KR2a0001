body:
  text: 周本紀周后稷名棄其母有邰氏女曰姜原姜原為帝嚳元妃姜原出野見巨人跡心欣然說欲踐之踐之而身動如孕者居期而生子以為不祥棄之隘巷馬牛過者皆辟不踐徙置之林中適會山林多人遷之而棄渠中冰上飛鳥以其翼覆薦之姜原以為神遂收養長之初欲棄之因名曰棄棄為兒時屹如巨人之志其游戲好種樹麻菽麻菽美及為成人遂好耕農相地之宜宜穀者稼穡焉民皆法則之帝堯聞之舉棄為農師天下得其利有功帝舜曰棄黎民始飢爾后稷播時百穀封棄於邰號曰后稷別姓姬氏后稷之興在陶唐虞夏之際皆有令德后稷卒子不窋立不窋末年夏后氏政衰去稷不務不窋以失其官而奔戎狄之閒不窋卒子鞠立鞠卒子公劉立公劉雖在戎狄之閒復修后稷之業務耕種行地宜自漆沮度渭取材用行者有資居者有畜積民賴其慶百姓懷之多徙而保歸焉周道之興自此始故詩人歌樂思其德公劉卒子慶節立國於豳慶節卒子皇僕立皇僕卒子差弗立差弗卒子毀隃立毀隃卒子公非立公非卒子高圉立高圉卒子亞圉立亞圉卒子公叔祖類立公叔祖類卒子古公亶父立古公亶父復修后稷公劉之業積德行義國人皆戴之薰育戎狄攻之欲得財物豫之已復攻欲得地與民民皆怒欲戰古公曰有民立君將以利之今戎狄所為攻戰以吾地與民民之在我與其在彼何異民欲以我故戰殺人父子而君之豫不忍為乃與私屬遂去豳度漆沮踰梁山止於岐下豳人舉國扶老攜弱盡復歸古公於岐下及他旁國聞古公仁亦多歸之於是古公乃貶戎狄之俗而營築城郭室屋而邑別居之作五官有司民皆歌樂之頌其德古公有長子曰太伯次曰虞仲太姜生少子季歷季歷娶太任皆賢婦人生昌有聖瑞古公曰我世當有興者其在昌乎長子太伯虞仲知古公欲立季歷以傳昌乃二人亡知荊蠻文身斷髮以讓季歷古公卒季歷立是為公季公季修古公遺道篤於行義諸侯順之公季卒子昌立是為西伯西伯曰文王遵后稷公劉之業則古公公季之法篤仁敬老慈少禮下賢者日中不暇食以待士士以此多歸之伯夷叔齊在孤竹聞西伯善養老盍往歸之太顛閎夭散宜生鬻子辛甲大夫之徒皆往歸之崇侯虎譖西伯於殷紂曰西伯積善纍德諸侯皆嚮之將不利於帝帝紂乃囚西伯於羑里閎夭之徒患之乃求有莘氏美女驪戎之文馬有熊九駟他奇怪物因殷嬖臣費仲而獻之紂紂大說曰此一物足以釋西伯況其多乎乃赦西伯賜之弓矢斧鉞使西伯得征伐曰譖西伯者崇侯虎也西伯乃獻洛西之地以請紂去炮格之刑紂許之西伯陰行善諸侯皆來決平於是虞芮之人有獄不能決乃如周入界耕者皆讓畔民俗皆讓長虞芮之人未見西伯皆慚相謂曰吾所爭周人所恥何往為祇取辱耳遂還俱讓而去諸侯聞之曰西伯蓋受命之君明年伐犬戎明年伐密須明年敗耆國殷之祖伊聞之懼以告帝紂紂曰不有天命乎是何能為明年伐邘明年伐崇侯虎而作豐邑自岐下而徙都豐明年西伯崩太子發立是為武王西伯蓋即位五十年其囚羑里蓋益易之八卦為六十四卦詩人道西伯蓋受命之年稱王而斷虞芮之訟後十年而崩諡為文王改法度制正朔矣追尊古公為太王公季為王季蓋王瑞自太王興武王即位太公望為師周公旦為輔召公畢公之徒左右王師修文王緒業九年武王上祭于畢東觀兵至于盟津為文王木主載以車中軍武王自稱太子發言奉文王以伐不敢自專乃告司馬司徒司空諸節齊栗信哉豫無知以先祖有德臣小子受先功畢立賞罰以定其功遂興師師尚父號曰總爾衆庶與爾舟楫後至者斬武王渡河中流白魚躍入王舟中武王俯取以祭既渡有火自上復于下至于王屋流為烏其色赤其聲魄云是時諸侯不期而會盟津者八百諸侯諸侯皆曰紂可伐矣武王曰女未知天命未可也乃還師歸居二年聞紂昏亂暴虐滋甚殺王子比干囚箕子太師疵少師彊抱其樂器而奔周於是武王遍告諸侯曰殷有重罪不可以不畢伐乃遵文王遂率戎車三百乘虎賁三千人甲士四萬五千人以東伐紂十一年十二月戊午師畢渡盟津諸侯咸會曰孳孳無怠武王乃作太誓告于衆庶今殷王紂乃用其婦人之言自絶于天毀壞其三正離逖其王父母弟乃斷棄其先祖之樂乃為淫聲用變亂正聲怡說婦人故今豫發維共行天罰勉哉夫子不可再不可三二月甲子昧爽武王朝至于商郊牧野乃誓武王左杖黃鉞右秉白旄以麾曰遠矣西土之人武王曰嗟我有國冢君司徒司馬司空亞旅師氏千夫長百夫長及庸蜀羌髳微纑彭濮人稱爾戈比爾干立爾矛豫其誓王曰古人有言牝雞無晨牝雞之晨惟家之索今殷王紂維婦人言是用自棄其先祖肆祀不答昏棄其家國遺其王父母弟不用乃維四方之多罪逋逃是崇是長是信是使俾暴虐于百姓以姦軌于商國今豫發維共行天之罰今日之事不過六步七步乃止齊焉夫子勉哉不過於四伐五伐六伐七伐乃止齊焉勉哉夫子尚桓桓如虎如羆如豺如離于商郊不禦克奔以役西土勉哉夫子爾所不勉其于爾身有戮誓已諸侯兵會者車四千乘陳師牧野帝紂聞武王來亦發兵七十萬人距武王武王使師尚父與百夫致師以大卒馳帝紂師紂師雖衆皆無戰之心心欲武王亟入紂師皆倒兵以戰以開武王武王馳之紂兵皆崩畔紂紂走反入登于鹿臺之上蒙衣其殊玉自燔于火而死武王持大白旗以麾諸侯諸侯畢拜武王武王乃揖諸侯諸侯畢從武王至商國商國百姓咸待於郊於是武王使群臣告語商百姓曰上天降休商人皆再拜稽首武王亦答拜遂入至紂死所武王自射之三發而后下車以輕劍擊之以黃鉞斬紂頭縣大白之旗已而至紂之嬖妾二女二女皆經自殺武王又射三發擊以劍斬以玄鉞縣其頭小白之旗武王已乃出復軍其明日除道修社及商紂宮及期百夫荷罕旗以先驅武王弟叔振鐸奉陳常車周公旦把大鉞畢公把小鉞以夾武王散宜生太顛閎夭皆執劍以衛武王既入立于社南大卒之左左右畢從毛叔鄭奉明水衛康叔封布茲召公奭贊采師尚父牽牲尹佚策祝曰殷之末孫季紂殄廢先王明德侮蔑神祇不祀昏暴商邑百姓其章顯聞于天皇上帝於是武王再拜稽首曰膺更大命革殷受天明命武王又再拜稽首乃出封商紂子祿父殷之餘民武王為殷初定未集乃使其弟管叔鮮蔡叔度相祿父治殷已而命召公釋箕子之囚命畢公釋百姓之囚表商容之閭命南宮括散鹿臺之財發巨橋之粟以振貧弱萌隸命南宮括史佚展九鼎保玉命閎夭封比干之墓命宗祝享祠于軍乃罷兵西歸行狩記政事作武成封諸侯班賜宗彝作分殷之器物武王追思先聖王乃褒封神農之後於焦黃帝之後於祝帝堯之後於薊帝舜之後於陳大禹之後於𣏌於是封功臣謀士而師尚父為首封封尚父於營丘曰齊封弟周公旦於曲阜曰魯封召公奭於燕封弟叔鮮於管弟叔度於蔡餘各以次受封武王徵九牧之君登豳之阜以望商邑武王至于周自夜不寐周公旦即王所曰曷為不寐王曰告女維天不饗殷自發未生於今六十年麋鹿在牧蜚鴻滿野天不享殷乃今有成維天建殷其登名民三百六十夫不顯亦不賓滅以至今我未定天保何暇寐王曰定天保依天室悉求夫惡貶從殷王受日夜勞來定我西土我維顯服及德方明自洛汭延于伊汭居易毋固其有夏之居我南望三塗北望嶽鄙顧詹有河粵詹雒伊毋遠天室營周居于雒邑而後去縱馬於華山之陽放牛於桃林之虛偃干戈振兵釋旅示天下不復用也武王已克殷後二年問箕子殷所以亡箕子不忍言殷惡以存亡國宜告武王亦醜故問以天道武王病天下未集群公懼穆卜周公乃祓齊自為質欲代武王武王有瘳後而崩太子誦代立是為成王成王少周初定天下周公恐諸侯畔周公乃攝行政當國管叔蔡叔群弟疑周公與武庚作亂畔周周公奉成王命伐誅武庚管叔放蔡叔以微子開代殷後國於宋頗收殷餘民以封武王少弟封為衛康叔晉唐叔得嘉穀獻之成王成王以歸周公于兵所周公受禾東土魯天子之命初管蔡畔周周公討之三年而畢定故初作大誥次作微子之命次歸禾次嘉禾次康誥酒誥梓材其事在周公之篇周公行政七年成王長周公反政成王北面就群臣之位成王在豐使召公復營洛邑如武王之意周公復卜申視卒營築居九鼎焉曰此天下之中四方入貢道里均作召誥洛誥成王既遷殷遺民周公以王命告作多士無佚召公為保周公為師東伐淮夷殘奄遷其君薄姑成王自奄歸在宗周作多方既絀殷命襲淮夷歸在豐作周官興正禮樂度制於是改而民和睦頌聲興成王既伐東夷息慎來賀王賜榮伯作賄息慎之命成王將崩懼太子釗之不任乃命召公畢公率諸侯以相太子而立之成王既崩二公率諸侯以太子釗見於先王廟申告以文王武王之所以為王業之不易務在節儉毋多欲以篤信臨之作顧命太子釗遂立是為康王康王即位遍告諸侯宣告以文武之業以申之作康誥故成康之際天下安寧刑錯四十餘年不用康王命作策畢公分居里成周郊作畢命康王卒子昭王瑕立昭王之時王道微缺昭王南巡狩不返卒於江上其卒不赴告諱之也立昭王子滿是為穆王穆王即位春秋已五十矣王道衰微穆王閔文武之道缺乃命伯臩申誡太僕國之政作臩命復寧穆王將征犬戎祭公謀父諫曰不可先王耀德不觀兵夫兵戢而時動動則威觀則玩玩則無震是故周文公之頌曰載戢干戈載櫜弓矢我求懿德肆于時夏允王保之先王之於民也茂正其德而厚其性阜其財求而利其器用明利害之鄉以文修之使之務利而辟害懷德而畏威故能保世以滋大昔我先王世后稷以服事虞夏及夏之衰也棄稷不務我先王不窋用失其官而自竄於戎狄之閒不敢怠業時序其德遵修其緒修其訓典朝夕恪勤守以敦篤奉以忠信奕世載德不忝前人至于文王武王昭前之光明而加之以慈和事神保民無不欣喜商王帝辛大惡于民庶民不忍欣載武王以致戎于商牧是故先王非務武也勤恤民隱而除其害也夫先王之制邦內甸服邦外侯服侯衛賓服夷蠻要服戎翟荒服甸服者祭侯服者祀賓服者享要服者貢荒服者王日祭月祀時享歲貢終王先王之順祀也有不祭則修意有不祀則修言有不享則修文有不貢則修名有不王則修德序成而有不至則修刑於是有刑不祭伐不祀征不享讓不貢告不王於是有刑罰之辟有攻伐之兵有征討之備有威讓之命有文告之辭布令陳辭而有不至則增修於德無勤民於遠是以近無不聽遠無不服今自大畢伯士之終也犬戎氏以其職來王天子曰豫必以不享征之且觀之兵無乃廢先王之訓而王幾頓乎吾聞犬戎樹敦率舊德而守終純固其有以禦我矣王遂征之得四白狼四白鹿以歸自是荒服者不至諸侯有不睦者甫侯言於王作修刑辟王曰吁來有國有土告汝祥刑在今爾安百姓何擇非其人何敬非其刑何居非其宜與兩造具備師聽五辭五辭簡信正於五刑五刑不簡正於五罰五罰不服正於五過五過之疵官獄內獄閲實其罪惟鈞其過五刑之疑有赦五罰之疑有赦其審克之簡信有衆惟訊有稽無簡不疑共嚴天威黥辟疑赦其罰百率閲實其罪劓辟疑赦其罰倍灑閲實其罪臏辟疑赦其罰倍差閲實其罪宮辟疑赦其罰五百率閲實其罪大辟疑赦其罰千率閲實其罪墨罰之屬千劓罰之屬千臏罰之屬五百宮罰之屬三百大辟之罰其屬二百五刑之屬三千命曰甫刑穆王立五十五年崩子共王繄扈立共王游於涇上密康公從有三女奔之其母曰必致之王夫獸三為群人三為衆女三為粲王田不取群公行不下衆王御不參一族夫粲美之物也衆以美物歸女而何德以堪之王猶不堪況爾之小醜乎小醜備物終必亡康公不獻一年共王滅密共王崩子懿王囏立懿王之時王室遂衰詩人作刺懿王崩共王弟辟方立是為孝王孝王崩諸侯復立懿王太子燮是為夷王夷王崩子厲王胡立厲王即位三十年好利近榮夷公大夫芮良夫諫厲王曰王室其將卑乎夫榮公好專利而不知大難夫利百物之所生也天地之所載也而有專之其害多矣天地百物皆將取焉何可專也所怒甚多而不備大難以是教王王其能久乎夫王人者將導利而布之上下者也使神人百物無不得極猶日怵惕懼怨之來也故頌曰思文后稷克配彼天立我蒸民莫匪爾極大雅曰陳錫載周是不布利而懼難乎故能載周以至于今今王學專利其可乎匹夫專利猶謂之盜王而行之其歸鮮矣榮公若用周必敗也厲王不聽卒以榮公為卿士用事王行暴虐侈傲國人謗王召公諫曰民不堪命矣王怒得衛巫使監謗者以告則殺之其謗鮮矣諸侯不朝三十四年王益嚴國人莫敢言道路以目厲王喜告召公曰吾能弭謗矣乃不敢言召公曰是鄣之也防民之口甚於防水水壅而潰傷人必多民亦如之是故為水者決之使導為民者宣之使言故天子聽政使公卿至於列士獻詩瞽獻曲史獻書師針瞍賦矇誦百工諫庶人傳語近臣盡規親戚補察瞽史教誨耆艾修之而后王斟酌焉是以事行而不悖民之有口也猶土之有山川也財用於是乎出猶其有原隰衍沃也衣食於是乎生口之宣言也善敗於是乎興行善而備敗所以産財用衣食者也夫民慮之於心而宣之於口成而行之若壅其口其與能幾何王不聽於是國莫敢出言三年乃相與畔襲厲王厲王出奔於彘厲王太子靜匿召公之家國人聞之乃圍之召公曰昔吾驟諫王王不從以及此難也今殺王太子王其以我為讎而懟怒乎夫事君者險而不讎懟怨而不怒況事王乎乃以其子代王太子太子竟得脫召公周公二相行政號曰共和共和十四年厲王死于彘太子靜長於召公家二相乃共立之為王是為宣王宣王即位二相輔之修政法文武成康之遺風諸侯復宗周十二年魯武公來朝宣王不修籍於千畝虢文公諫曰不可王弗聽三十九年戰于千畝王師敗績于姜氏之戎宣王既亡南國之師乃料民於太原仲山甫諫曰民不可料也宣王不聽卒料民四十六年宣王崩子幽王宮湦立幽王二年西周三川皆震伯陽甫曰周將亡矣夫天地之氣不失其序若過其序民亂之也陽伏而不能出陰迫而不能蒸於是有地震今三川實震是陽失其所而填陰也陽失而在陰原必塞原塞國必亡夫水土演而民用也土無所演民乏財用不亡何待昔伊洛竭而夏亡河竭而商亡今周德若二代之季矣其川原又塞塞必竭夫國必依山川山崩川竭亡國之徵也川竭必山崩若國亡不過十年數之紀也天之所棄不過其紀是歲也三川竭岐山崩三年幽王嬖愛褒似褒姒生子伯服幽王欲廢太子太子母申侯女而為后後幽王得褒姒愛之欲廢申后并去太子宜臼以褒姒為后以伯服為太子周太史伯陽讀史記曰周亡矣昔自夏后氏之衰也有二神龍止於夏帝庭而言曰余褒之二君夏帝卜殺之與去之與止之莫吉卜請其漦而藏之乃吉於是布幣而策告之龍亡而漦在櫝而去之夏亡傳此器殷殷亡又傳此器周比三代莫敢發之至厲王之末發而觀之漦流于庭不可除厲王使婦人裸而譟之漦化為玄黿以入王後宮後宮之童妾既齔而遭之既笄而孕無夫而生子懼而棄之宣王之時童女謠曰檿弧箕服實亡周國於是宣王聞之有夫婦賣是器者宣王使執而戮之逃於道而見鄉者後宮童妾所棄妖子出於路者聞其夜啼哀而收之夫婦遂亡奔於褒褒人有罪請入童妾所棄女子者於王以贖罪棄女子出於褒是為褒姒當幽王三年王之後宮見而愛之生子伯服竟廢申后及太子以褒姒為后伯服為太子太史伯陽曰禍成矣無可奈何褒姒不好笑幽王欲其笑萬方故不笑幽王為熢燧大鼓有寇至則舉熢火諸侯悉至至而無寇褒姒乃大笑幽王說之為數舉熢火其後不信諸侯益亦不至幽王以虢石父為卿用事國人皆怨石父為人佞巧善諛好利王用之又廢申后去太子也申侯怒與繒西夷犬戎攻幽王幽王舉熢火徵兵兵莫至遂殺幽王驪山下虜褒姒盡取周賂而去於是諸侯乃即申侯而共立故幽王太子宜臼是為平王以奉周祀平王立東遷于雒邑辟戎寇平王之時周室衰微諸侯彊并弱齊楚秦晉始大政由方伯四十九年魯隱公即位五十一年平王崩太子泄父蚤死立其子林是為桓王桓王平王孫也桓王三年鄭莊公朝桓王不禮五年鄭怨與魯易許田許田天子之用事太山田也八年魯殺隱公立桓公十三年伐鄭鄭射傷桓王桓王去歸二十三年桓王崩子莊王他立莊王四年周公黑肩欲殺莊王而立王子克辛伯告王王殺周公王子克奔燕十五年莊王崩子釐王胡齊立釐王三年齊桓公始霸五年釐王崩子惠王閬立惠王二年初莊王嬖姬姚生子穨穨有寵及惠王即位奪其大臣園以為囿故大夫邊伯等五人作亂謀召燕衛師伐惠王惠王奔溫已居鄭之櫟立釐王弟穨為王樂及遍舞鄭虢君怒四年鄭與虢君伐殺王穨復入惠王惠王十年賜齊桓公為伯二十五年惠王崩子襄王鄭立襄王母蚤死後母曰惠后惠后生叔帶有寵於惠王襄王畏之三年叔帶與戎翟謀伐襄王襄王欲誅叔帶叔帶奔齊齊桓公使管仲平戎于周使隰朋平戎于晉王以上卿禮管仲管仲辭曰臣賤有司也有天子之二守國高在若節春秋來承王命何以禮焉陪臣敢辭王曰舅氏余嘉乃勳毋逆朕命管仲卒受下卿之禮而還九年齊桓公卒十二年叔帶復歸于周十三年鄭伐滑王使游孫伯服請滑鄭人囚之鄭文公怨惠王之入不與厲公爵又怨襄王之與衛滑故囚伯服王怒將以翟伐鄭富辰諫曰凡我周之東徙晉鄭焉依子穨之亂又鄭之由定今以小怨棄之王不聽十五年王降翟師以伐鄭王德翟人將以其女為后富辰諫曰平桓莊惠皆受鄭勞王棄親親翟不可從王不聽十六年王絀翟后翟人來誅殺談伯富辰曰吾數諫不從如是不出王以我為懟乎乃以其屬死之初惠后欲立王子帶故以黨開翟人翟人遂入周襄王出奔鄭鄭居王于泛子帶立為王取襄王所絀翟后與居溫十七年襄王告急于晉晉文公納王而誅叔帶襄王乃賜晉文公圭鬯弓矢為伯以河內地與晉二十年晉文公召襄王襄王會之河陽踐土諸侯畢朝書諱曰天王狩于河陽二十四年晉文公卒三十一年秦穆公卒三十二年襄王崩子頃王壬臣立頃王六年崩子匡王班立匡王六年崩弟瑜立是為定王定王元年楚莊王伐陸渾之戎次洛使人問九鼎王使王孫滿應設以辭楚兵乃去十年楚莊王圍鄭鄭伯降已而復之十六年楚莊王卒二十一年定王崩子簡王夷立簡王十三年晉殺其君厲公迎子周於周立為悼公十四年簡王崩子靈王泄心立靈王二十四年齊崔杼弒其君莊公二十七年靈王崩子景王貴立景王十八年后太子聖而蚤卒二十年景王愛子朝欲立之會崩子丐之黨與爭立國人立長子猛為王子朝攻殺猛猛為悼王晉人攻子朝而立丐是為敬王敬王元年晉人入敬王子朝自立敬王不得入居澤四年晉率諸侯入敬王于周子朝為臣諸侯城周十六年子朝之徒復作亂敬王奔于晉十七年晉定公遂入敬王于周三十九年齊田常殺其君簡公四十一年楚滅陳孔子卒四十二年敬王崩子元王仁立元王八年崩子定王介立定王十六年三晉滅智伯分有其地二十八年定王崩長子去疾立是為哀王哀王立三月弟叔襲殺哀王而自立是為思王思王立五月少弟嵬攻殺思王而自立是為考王此三王皆定王之子考王十五年崩子威烈王午立考王封其弟于河南是為桓公以續周公之官職桓公卒子威公代立威公卒子惠公代立乃封其少子於鞏以奉王號東周惠公威烈王二十三年九鼎震命韓魏趙為諸侯二十四年崩子安王驕立是歲盜殺楚聲王安王立二十六年崩子烈王喜立烈王二年周太史儋見秦獻公曰始周與秦國合而別別五百載復合合十七歲而霸王者出焉十年烈王崩弟扁立是為顯王顯王五年賀秦獻公獻公稱伯九年致文武胙於秦孝公二十五年秦會諸侯於周二十六年周致伯於秦孝公三十三年賀秦惠王三十五年致文武胙於秦惠王四十四年秦惠王稱王其後諸侯皆為王四十八年顯王崩子慎靚王定立慎靚王立六年崩子赧王延立王赧時東西周分治王赧徙都西周西周武公之共太子死有五庶子毋適立司馬翦謂楚王曰不如以地資公子咎為請太子左成曰不可周不聽是公之知困而交疏於周也不如請周君孰欲立以微告翦翦請令楚資之以地果立公子咎為太子八年秦攻宜陽楚救之而楚以周為秦故將伐之蘇代為周說楚王曰何以周為秦之禍也言周之為秦甚於楚者欲令周入秦也故謂周秦也周知其不可解必入於秦此為秦取周之精者也為王計者周於秦因善之不於秦亦言善之以疏之於秦周絶於秦必入於郢矣秦借道兩周之閒將以伐韓周恐借之畏於韓不借畏於秦史厭謂周君曰何不令人謂韓公叔曰秦之敢絶周而伐韓者信東周也公何不與周地發質使之楚秦必疑楚不信周是韓不伐也又謂秦曰韓彊與周地將以疑周於秦也周不敢不受秦必無辭而令周不受是受地於韓而聽於秦秦召西周君西周君惡往故令人謂韓王曰秦召西周君將以使攻王之南陽也王何不出兵於南陽周君將以為辭於秦周君不入秦秦必不敢踰河而攻南陽矣東周與西周戰韓救西周或為東周說韓王曰西周故天子之國多名器重寶王案兵毋出可以德東周而西周之寶必可以盡矣王赧謂成君楚圍雍氏韓徵甲與粟於東周東周君恐召蘇代而告之代曰君何患於是臣能使韓毋徵甲與粟於周又能為君得高都周君曰子苟能請以國聽子代見韓相國曰楚圍雍氏期三月也今五月不能拔是楚病也今相國乃徵甲與粟於周是告楚病也韓相國曰善使者已行矣代曰何不與周高都韓相國大怒曰吾毋徵甲與粟於周亦已多矣何故與周高都也代曰與周高都是周折而入於韓也秦聞之必大怒忿周即不通周使是以斃高都得完周也曷為不與相國曰善果與周高都三十四年蘇厲謂周君曰秦破韓魏撲師武北取趙藺離石者皆白起也是善用兵又有天命今又將兵出塞攻梁梁破則周危矣曰君何不令人說白起乎楚有養由基者善射者也去柳葉百步而射之百發而百中之左右觀者數千人皆曰善射有一夫立其旁曰善可教射矣養由基怒釋弓扼劍曰客安能教我射乎客曰非吾能教子支左詘右也夫去柳葉百步而射之百發而百中之不以善息少焉氣衰力倦弓撥矢鉤一發不中者百發盡息今破韓魏撲師武北取趙藺離石者公之功多矣今又將兵出塞過兩周倍韓攻梁一舉不得前功盡棄公不如稱病而無出四十二年秦破華陽約馬犯謂周君曰請令梁城周乃謂梁王曰周王病若死則犯必死矣犯請以九鼎自入於王王受九鼎而圖犯梁王曰善遂與之卒言戍周因謂秦王曰梁非戍周也將伐周也王試出兵境以觀之秦果出兵又謂梁王曰周王病甚矣犯請後可而復之今王使卒之周諸侯皆生心後舉事且不信不若令卒為周城以匿事端梁王曰善遂使城周四十五年周君之秦客謂周最曰公不若譽秦王之孝因以應為太后養地秦王必喜是公有秦交交善周君必以為公功交惡勸周君入秦者必有罪矣秦攻周而周聚謂秦王曰為王計者不攻周攻周實不足以利聲畏天下天下以聲畏秦必東合於齊兵斃於周合天下於齊則秦不王矣天下欲斃秦勸王攻周秦與天下斃則令不行矣五十八年三晉距秦周令其相國之秦以秦之輕也還其行客謂相國曰秦之輕重未可知也秦欲知三國之情公不如急見秦王曰請為王聽東方之變秦王必重公重公是秦重周周以取秦也齊重則固有周聚以收齊是周常不失重國之交也秦信周發兵攻三晉五十九年秦取韓陽城負黍西周恐倍秦與諸侯約從將天下鋭師出伊闕攻秦令秦無得通陽城秦昭王怒使將軍摎攻西周西周君奔秦頓首受罪盡獻其邑三十六口三萬秦受其獻歸其君於周周君王赧卒周民遂東亡秦取九鼎寶器而遷西周公於憚狐後七歲秦莊襄王滅東周東西周皆入于秦周既不祀太史公曰學者皆稱周伐紂居洛邑綜其實不然武王營之成王使召公卜居居九鼎焉而周復都豐鎬至犬戎敗幽王周乃東徙于洛邑所謂周公葬於畢畢在鎬東南杜中秦滅周漢興九十有餘載天子將封泰山東巡狩至河南求周苗裔封其後嘉三十里地號曰周子南君比列侯以奉其先祭祀
