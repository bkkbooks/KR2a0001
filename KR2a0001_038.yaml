body:
  text: 宋微子世家第八微子開者殷帝乙之首子而帝紂之庶兄也紂既立不明淫亂於政微子數諫紂不聽及祖伊以周西伯昌之修德滅𨸔國懼禍至以告紂紂曰我生不有命在天乎是何能為於是微子度紂終不可諫欲死之及去未能自決乃問於太師少師曰殷不有治政不治四方我祖遂陳於上紂沈湎於酒婦人是用亂敗湯德於下殷既小大好草竊姦宄卿士師師非度皆有罪辜乃無維獲小民乃並興相為敵讎今殷其典喪若涉水無津涯殷遂喪越至于今曰太師少師我其發出往吾家保于喪今女無故告豫顛躋如之何其太師若曰王子天篤下災亡殷國乃毋畏畏不用老長今殷民乃陋淫神祇之祀今誠得治國國治身死不恨為死終不得治不如去遂亡箕子者紂親戚也紂始為象箸箕子歎曰彼為象箸必為玉杯為杯則必思遠方珍怪之物而御之矣輿馬宮室之漸自此始不可振也紂為淫泆箕子諫不聽人或曰可以去矣箕子曰為人臣諫不聽而去是彰君之惡而自説於民吾不忍為也乃被髮詳狂而為奴遂隱而鼓琴以自悲故傳之曰箕子操王子比干者亦紂之親戚也見箕子諫不聽而為奴則曰君有過而不以死爭則百姓何辜乃直言諫紂紂怒曰吾聞聖人之心有七𡫀信有諸乎乃遂殺王子比干刳視其心微子曰父子有骨肉而臣主以義屬故父有過子三諫不聽則隨而號之人臣三諫不聽則其義可以去矣於是太師少師乃勸微子去遂行周武王代紂克殷微子乃持其祭器造於軍門肉袒面縛左牽羊右把茅膝行而前以告於是武王乃釋微子復其位如故武王封紂子武庚祿父以續殷祀使管叔蔡叔傅相之武王既克殷訪問箕子武王曰於乎維天陰定下民相和其居我不知其帝倫所序箕子對曰在昔鯀堙鴻水汩陳其五行帝乃震怒不從鴻範九等常倫所斁鯀則殛死禹乃嗣興天乃錫禹鴻範九等常倫所序初一曰五行二曰五事三曰八政四曰五紀五曰皇極六曰三德七曰稽疑八曰庶徵九曰嚮用五福畏用六極五行一曰水二曰火三曰木四曰金五曰土水曰潤下火曰炎上木曰曲直金曰從革土曰稼穡潤下作鹹炎上作苦曲直作酸從革作辛稼穡作甘五事一曰貌二曰言三曰視四曰聽五曰思貌曰恭言曰從視曰明聽曰聰思曰睿恭作肅從作治明作智聰作謀睿作聖八政一曰食二曰貨三曰祀四曰司空五曰司徒六曰司寇七曰賓八曰師五紀一曰歲二曰月三曰日四曰星辰五曰曆數皇極皇建其有極斂時五福用傅錫其庶民維時其庶民于女極錫女保極凡厥庶民毋有淫朋人毋有比德維皇作極凡厥庶民有猷有為有守女則念之不協于極不離于咎皇則受之而安而色曰豫所好德女則錫之福時人斯其維皇之極毋侮鰥寡而畏高明人之有能有為使羞其行而國其昌凡厥正人既富方穀女不能使有好于而家時人斯其辜于其毋好女雖錫之福其作女用咎毋偏毋頗遵王之義毋有作好遵王之道毋有作惡遵王之路毋偏毋黨王道蕩蕩毋黨毋偏王道平平毋反毋側王道正直會其有極歸其有極曰王極之傅言是夷是訓于帝其順凡厥庶民極之傅言是順是行以近天子之光曰天子作民父母以為天下王三德一曰正直二曰剛克三曰柔克平康正直強不友剛克內友柔克沈漸剛克高明柔克維辟作福維辟作威維辟玉食臣無有作福作威玉食臣有作福作威玉食其害于而家凶于而國人用側頗辟民用僭忒稽疑擇建立卜筮人乃命卜筮曰雨曰濟曰涕曰霧曰克曰貞曰悔凡七卜五占之用二衍貣立時人為卜筮三人占則從二人之言女則有大疑謀及女心謀及卿士謀及庶人謀及卜筮女則從龜從筮從卿士從庶民從是之謂大同而身其康強而子孫其逢吉女則從龜從筮從卿士逆庶民逆吉卿士從龜從筮從女則逆庶民逆吉庶民從龜從筮從女則逆卿士逆吉女則從龜從筮逆卿士逆庶民逆作內吉作外凶龜筮共違于人用靜吉用作凶庶徵曰雨曰陽曰奧曰寒曰風曰時五者來備各以其序庶草繁廡一極備凶一極亡凶曰休徵曰肅時雨若曰治時暘若曰知時奧若曰謀時寒若曰聖時風若曰咎徵曰狂常雨若曰僭常暘若曰舒常奧若曰急常寒若曰霧常風若王眚維歲卿士維月師尹維日歲月日時毋易百穀用成治用明畯民用章家用平康日月歲時既易百穀用不成治用昏不明畯民用微家用不寧庶民維星星有好風星有好雨日月之行有冬有夏月之從星則以風雨五福一曰壽二曰富三曰康寧四曰攸好德五曰考終命六極一曰凶短折二曰疾三曰憂四曰貧五曰惡六曰弱於是武王乃封箕子於朝鮮而不臣也其後箕子朝周過故殷虛感宮室毀壞生禾黍箕子傷之欲哭則不可欲泣為其近婦人乃作麥秀之詩以歌詠之其詩曰麥秀漸漸兮禾黍油油彼狡僮兮不與我好兮所謂狡童者紂也殷民聞之皆為流涕武王崩成王少周公旦代行政當國管蔡疑之乃與武庚作亂欲襲成王周公周公既承成王命誅武庚殺管叔放蔡叔乃命微子開代殷後奉其先祀作微子之命以申之國于宋微子故能仁賢乃代武庚故殷之餘民甚戴愛之微子開卒立其弟衍是為微仲微仲卒子宋公稽立宋公稽卒子丁公申立丁公申卒子湣公共立湣公共卒弟煬公熙立煬公即位湣公子鮒祀弒煬公而自立曰我當立是為厲公厲公卒子釐公舉立釐公十七年周厲王出奔彘二十八年釐公卒子惠公覵立惠公四年周宣王即位三十年惠公卒子哀公立哀公元年卒子戴公立戴公二十九年周幽王為犬戎所殺秦始列為諸侯三十四年戴公卒子武公司空立武公生女為魯惠公夫人生魯桓公十八年武公卒子宣公力立宣公有太子與夷十九年宣公病讓其弟和曰父死子繼兄死弟及天下通義也我其立和和亦三讓而受之宣公卒弟和立是為穆公穆公九年病召大司馬孔父謂曰先君宣公舍太子與夷而立我我不敢忘我死必立與夷也孔父曰群臣皆願立公子馮穆公曰毋立馮吾不可以負宣公於是穆公使馮出居于鄭八月庚辰穆公卒兄宣公子與夷立是為殤公君子聞之曰宋宣公可謂知人矣立其弟以成義然卒其子復享之殤公元年衛公子州吁弒其君完自立欲得諸侯使告於宋曰馮在鄭必為亂可與我伐之宋許之與伐鄭至東門而還二年鄭伐宋以報東門之役其後諸侯數來侵伐九年大司馬孔父嘉妻好出道遇太宰華督督説目而觀之督利孔父妻乃使人宣言國中曰殤公即位十年耳而十一戰民苦不堪皆孔父為之我且殺孔父以寧民是歲魯弒其君隱公十年華督攻殺孔父取其妻殤公怒遂弒殤公而迎穆公子馮於鄭而立之是為莊公莊公元年華督為相九年執鄭之祭仲要以立突為鄭君祭仲許竟立突十九年莊公卒子湣公捷立湣公七年齊桓公即位九年宋水魯使臧文仲往弔水湣公自罪曰寡人以不能事鬼神政不修故水臧文仲善此言此言乃公子子魚教湣公也十年夏宋伐魯戰於乘丘魯生虜宋南宮萬宋人請萬萬歸宋十一年秋湣公與南宮萬獵因博爭行湣公怒辱之曰始吾敬若今若魯虜也萬有力病此言遂以局殺湣公于蒙澤大夫仇牧聞之以兵造公門萬搏牧牧齒著門闔死因殺太宰華督乃更立公子遊為君諸公子奔蕭公子禦説奔亳萬弟南宮牛將兵圍亳冬蕭及宋之諸公子共擊殺南宮牛弒宋新君遊而立湣公弟禦説是為桓公宋萬奔陳宋人請以賂陳陳人使婦人飲之醇酒以革裹之歸宋宋人醢萬也桓公二人諸侯伐宋至郊而去三年齊桓公始霸二十三年迎衛公子燬於齊立之是為衛文公文公女弟為桓公夫人秦穆公即位三十年桓公病太子茲甫讓其庶兄目夷為嗣桓公義太子意竟不聽三十一年春桓公卒太子茲甫立是為襄公以其庶兄目夷為相未葬而齊桓公會諸侯于葵丘襄公往會襄公七年宋地霣星如雨與雨偕下六鶂退蜚風疾也八年齊桓公卒宋欲為盟會十二年春宋襄公為鹿上之盟以求諸侯於楚楚人許之公子目夷諫曰小國爭盟禍也不聽秋諸侯會宋公盟于盂目夷曰禍其在此乎君欲已甚何以堪之於是楚執宋襄公以伐宋冬會于亳以釋宋公子魚曰禍猶未也十三年夏宋伐鄭子魚曰禍在此矣秋楚伐宋以救鄭襄公將戰子魚諫曰天之棄商久矣不可冬十一月襄公與楚成王戰于泓楚人未濟目夷曰彼衆我寡及其未濟擊之公不聽已濟未陳又曰可擊公曰待其已陳陳成宋人擊之宋師大敗襄公傷股國人皆怨公公曰君子不困人於厄不鼓不成列子魚曰兵以勝為功何常言與必如公言即奴事之耳又何戰為楚成王已救鄭鄭享之去而取鄭二姬以歸叔瞻曰成王無禮其不沒乎為禮卒於無別有以知其不遂霸也是年晉公子重耳過宋襄公以傷於楚欲得晉援厚禮重耳以馬二十乘十四年夏襄公病傷於泓而竟卒子成公王臣立成公元年晉文公即位三年倍楚盟親晉以有德於文公也四年楚成王伐宋宋告急於晉五年晉文公救宋楚兵去九年晉文公卒十一年楚太子商臣弒其父成王代立十六年秦穆公卒十七年成公卒成公弟禦殺太子及大司馬公孫固而自立為君宋人共殺君禦而立成公少子杵臼是為昭公昭公四年宋敗長翟緣斯於長丘七年楚莊王即位九年昭公無道國人不附昭公弟鮑革賢而下士先襄公夫人欲通於公子鮑不可乃助之施於國因大夫華元為右師昭公出獵夫人王姬使衛伯攻殺昭公杵臼弟鮑革立是為文公文公元年晉率諸侯伐宋責以弒君聞文公定立乃去二年昭公子因文公母弟須與武繆戴莊桓之族為亂文公盡誅之出武繆之族四年春楚命鄭伐宋宋使華元將鄭敗宋囚華元華元之將戰殺羊以食士其御羊羹不及故怨馳入鄭軍故宋師敗得囚華元宋以兵車百乘文馬四百匹贖華元未盡入華元亡歸宋十四人楚莊王圍鄭鄭伯降楚楚復釋之十六年楚使過宋宋有前仇執楚使九月楚莊王圍宋十七年楚以圍宋五月不解宋城中急無食華元乃夜私見楚將子反子反告莊王王問城中何如曰析骨而炊易子而食莊王曰誠哉言我軍亦有二日糧以信故遂罷兵去二十二年文公卒子共公瑕立始厚葬君子譏華元不臣矣共公十年華元善楚將子重又善晉將欒書兩盟晉楚十三年共公卒華元為右師魚石為左師司馬唐山攻殺太子肥欲殺華元華元奔晉魚石止之至河乃還誅唐山乃立共公少子成是為平公平公三年楚共王拔宋之彭城以封宋左師魚石四年諸侯共誅魚石而歸彭城於宋三十五年楚公子圍弒其君自立為靈王四十四年平公卒子元公佐立元公三年楚公子棄疾弒靈王自立為平王八年宋火十年元公毋信詐殺諸公子大夫華向氏作亂楚平王太子建來奔見諸華氏相攻亂建去如鄭十五年元公為魯昭公避季氏居外為之求入魯行道卒子景公頭曼立景公十六年魯陽虎來奔已復去二十五年孔子過宋宋司馬桓魋惡之欲殺孔子孔子微服去三十年曹倍宋又倍晉宋伐曹晉不救遂滅曹有之三十六年齊田常弒簡公三十七年楚惠王滅陳熒惑守心心宋之分野也景公憂之司星子韋曰可移於相景公曰相吾之股肱曰可移於民景公曰君者待民曰可移於歲景公曰歲飢民困吾誰為君子韋曰天高聽卑君有君人之言三熒惑宜有動於是候之果徙三度六十四年景公卒宋公子特攻殺太子而自立是為昭公昭公者元公之曾庶孫也昭公父公孫糾糾父公子褍秦褍秦即元公少子也景公殺昭公父糾故昭公怨殺太子而自立昭公四十七年卒子悼公購由立悼公八年卒子休公田立休公田二十三年卒子辟公辟兵立辟公三年卒子剔成立剔成四十一年剔成弟偃攻襲剔成剔成敗奔齊偃自立為宋君君偃十一年自立為王東敗齊取五城南敗楚取地三百里西敗魏軍乃與齊魏為敵國盛血以韋囊縣而射之命曰射天淫於酒婦人群臣諫者輒射之於是諸侯皆曰桀宋宋其復為紂所為不可不誅告齊伐宋王偃立四十七年齊湣王與魏楚伐宋殺王偃遂滅宋而三分其地太史公曰孔子稱微子去之箕子為之奴比干諫而死殷有三仁焉春秋譏宋之亂自宣公廢太子而立弟國以不寧者十世襄公之時修行仁義欲為盟主其大夫正考父美之故追道契湯高宗殷所以興作商頌襄公既敗於泓而君子或以為多傷中國闕禮義褒之也宋襄之有禮讓也
