body:
  text: 項羽本紀項籍者下相人也字羽初起時年二十四其季父項梁梁父即楚將項燕為秦將王翦所戮者也項氏世世為楚將封於項故姓項氏項籍少時學書不成去學劍又不成項梁怒之籍曰書足以記名姓而已劍一人敵不足學學萬人敵於是項梁乃教籍兵法籍大喜略知其意又不肯竟學項梁嘗有櫟陽逮乃請蘄獄掾曹咎書抵櫟陽獄掾司馬欣以故事得已項梁殺人與籍避仇於吳中吳中賢士大夫皆出項梁下每吳中有大繇役及喪項梁常為主辦陰以兵法部勒賓客及子弟以是知其能秦始皇帝游會稽渡浙江梁與籍俱觀籍曰彼可取而代也梁掩其口曰毋妄言族矣梁以此奇籍籍長八尺餘力能扛鼎才氣過人雖吳中子弟皆已憚籍矣秦二世元年七月陳涉等起大澤中其九月會稽守通謂梁曰江西皆反此亦天亡秦之時也吾聞先即制人後則為人所制吾欲發兵使公及桓楚將是時桓楚亡在澤中梁曰桓楚亡人莫知其處獨籍知之耳梁乃出誡籍持劍居外待梁復入與守坐曰請召籍使受命召桓楚守曰諾梁召籍入須臾梁眴籍曰可行矣於是籍遂拔劍斬守頭項梁持守頭佩其印綬門下大驚擾亂籍所擊殺數十百人一府中皆懾伏莫敢起梁乃召故所知豪吏諭以所為起大事遂舉吳中兵使人收下縣得精兵八千人梁部署吳中豪傑為校尉候司馬有一人不得用自言於梁梁曰前時某喪使公主某事不能辦以此不任用公衆乃皆伏於是梁為會稽守籍為裨將徇下縣廣陵人召平於是為陳王徇廣陵未能下聞陳王敗走秦兵又且至乃渡江矯陳王命拜梁為楚王上柱國曰江東已定急引兵西擊秦項梁乃以八千人渡江而西聞陳嬰已下東陽使使欲與連和俱西陳嬰者故東陽令史居縣中素信謹稱為長者東陽少年殺其令相聚數千人欲置長無適用乃請陳嬰嬰謝不能遂彊立嬰為長縣中從者得二萬人少年欲立嬰便為王異軍蒼頭特起陳嬰母謂嬰曰自我為汝家婦未嘗聞汝先古之有貴者今暴得大名不祥不如有所屬事成猶得封侯事敗易以亡非世所指名也嬰乃不敢為王謂其軍吏曰項氏世世將家有名於楚今欲舉大事將非其人不可我倚名族亡秦必矣於是衆從其言以兵屬項梁項梁渡淮黥布蒲將軍亦以兵屬焉凡六七萬人軍下邳當是時秦嘉已立景駒為楚王軍彭城東欲距項梁項梁謂軍吏曰陳王先首事戰不利未聞所在今秦嘉倍陳王而立景駒逆無道乃進兵擊秦嘉秦嘉軍敗走追之至胡陵嘉還戰一日嘉死軍降景駒走死梁地項梁已并秦嘉軍軍胡陵將引軍而西章邯軍至栗項梁使別將朱雞石餘樊君與戰餘樊君死朱雞石軍敗亡走胡陵項梁乃引兵入薛誅雞石項梁前使項羽別攻襄城襄城堅守不下已拔皆坑之還報項梁項梁聞陳王定死召諸別將會薛計事此時沛公亦起沛往焉居鄛人范增年七十素居家好奇計往說項梁曰陳勝敗固當夫秦滅六國楚最無罪自懷王入秦不反楚人憐之至今故楚南公曰楚雖三戶亡秦必楚也今陳勝首事不立楚後而自立其勢不長今君起江東楚蜂午之將皆爭附君者以君世世楚將為能復立楚之後也於是項梁然其言乃求楚懷王孫心民閒為人牧羊立以為楚懷王從民所望也陳嬰為楚上柱國封五縣與懷王都盱台項梁自號為武信君居數月引兵攻亢父與齊田榮司馬龍且軍救東阿大破秦軍於東阿田榮即引兵歸逐其王假假亡走楚假相田角亡走趙角弟田閒故齊將居趙不敢歸田榮立田儋子巿為齊王項梁已破東阿下軍遂追秦軍數使使趣齊兵欲與俱西田榮曰楚殺田假趙殺田角田閒乃發兵項梁曰田假為與國之王窮來從我不忍殺之趙亦不殺田角田閒以市於齊齊遂不肯發兵助楚項梁使沛公及項羽別攻城陽屠之西破秦軍濮陽東秦兵收入濮陽沛公項羽乃攻定陶定陶未下去西略地至雍丘大破秦軍斬李由還攻外黃外黃未下項梁起東阿西比至定陶再破秦軍項羽等又斬李由益輕秦有驕色宋義乃諫項梁曰戰勝而將驕卒惰者敗今卒少惰矣秦兵日益臣為君畏之項梁弗聽乃使宋義使於齊道遇齊使者高陵君顯曰公將見武信君乎曰然曰臣論武信君軍必敗公徐行即免死疾行則及禍秦果悉起兵益章邯擊楚軍大破之定陶項梁死沛公項羽去外黃攻陳留陳留堅守不能下沛公項羽相與謀曰今項梁軍破士卒恐乃與呂臣軍俱引兵而東呂臣軍彭城東項羽軍彭城西沛公軍碭章邯已破項梁軍則以為楚地兵不足憂乃渡河擊趙大破之當此時趙歇為王陳餘為將張耳為相皆走入巨鹿城章邯令王離涉閒圍巨鹿章邯軍其南築甬道而輸之粟陳餘為將將卒數萬人而軍巨鹿之北此所謂河北之軍也楚兵已破於定陶懷王恐從盱台之彭城并項羽呂臣軍自將之以呂臣為司徒以其父呂青為令尹以沛公為碭郡長封為武安侯將碭郡兵初宋義所遇齊使者高陵君顯在楚軍見楚王曰宋義論武信君之軍必敗居數日軍果敗兵未戰而先見敗徵此可謂知兵矣王召宋義與計事而大說之因置以為上將軍項羽為魯公為次將范增為末將救趙諸別將皆屬宋義號為卿子冠軍行至安陽留四十六日不進項羽曰吾聞秦軍圍趙王巨鹿疾引兵渡河楚擊其外趙應其內破秦軍必矣宋義曰不然夫搏牛之虻不可以破蟣蝨今秦攻趙戰勝則兵罷我承其敝不勝則我引兵鼓行而西必舉秦矣故不如先鬭秦趙夫被堅執鋭義不如公坐而運策公不如義因下令軍中曰猛如虎很如羊貪如狼彊不可使者皆斬之乃遣其子宋襄相齊身送之至無鹽飲酒高會天寒大雨士卒凍飢項羽曰將戮力而攻秦久留不行今歲饑民貧士卒食芋菽軍無見糧乃飲酒高會不引兵渡河因趙食與趙并力攻秦乃曰承其敝夫以秦之彊攻新造之趙其勢必舉趙趙舉而秦彊何敝之承且國兵新破王坐不安席掃境內而專屬於將軍國家安危在此一舉今不恤士卒而徇其私非社稷之臣項羽晨朝上將軍宋義即其帳中斬宋義頭出令軍中曰宋義與齊謀反楚楚王陰令羽誅之當是時諸將皆懾服莫敢枝梧皆曰首立楚者將軍家也今將軍誅亂乃相與共立羽為假上將軍使人追宋義子及之齊殺之使桓楚報命於懷王懷王因使項羽為上將軍當陽君蒲將軍皆屬項羽項羽已殺卿子冠軍威震楚國名聞諸侯乃遣當陽君蒲將軍將卒二萬渡可救巨鹿戰少利陳餘復請兵項羽乃悉引兵渡河皆沈船破釜甑燒廬舍持三日糧以示士卒必死無一還心於是至則圍王離與秦軍遇九戰絶其甬道大破之殺蘇角虜王離涉閒不降楚自燒殺當是時楚兵冠諸侯諸侯軍救巨鹿下者十餘壁莫敢縱兵及楚擊秦諸將皆從壁上觀楚戰士無不一以當十楚兵呼聲動天諸侯軍無不人人惴恐於是已破秦軍項羽召見諸侯將入轅門無不膝行而前莫敢仰視項羽由是始為諸侯上將軍諸侯皆屬焉章邯軍棘原項羽軍漳南相持未戰秦軍數卻二世使人讓章邯章邯恐使長史欣請事至咸陽留司馬門三日趙高不見有不信之心長史欣恐還走其軍不敢出故道趙高果使人追之不及欣至軍報曰趙高用事於中下無可為者今戰能勝高必疾妒吾功戰不能勝不免於死願將軍孰計之陳餘亦遺章邯書曰白起為秦將南征鄢郢北坑馬服攻城略地不可勝計而竟賜死蒙恬為秦將北逐戎人開榆中地數千里竟斬陽周何者功多秦不能盡封因以法誅之今將軍為秦將三歲矣所亡失以十萬數而諸侯並起滋益多彼趙高素諛日久今事急亦恐二世誅之故欲以法誅將軍以塞責使人更代將軍以脫其禍夫將軍居外久多內卻有功亦誅無功亦誅且天之亡秦無愚智皆知之今將軍內不能直諫外為亡國將孤特獨立而欲常存豈不哀哉將軍何不還兵與諸侯為從約共攻秦分王其地南面稱孤此孰與身伏鈇質妻子為僇乎章邯狐疑陰使候始成使項羽欲約約未成項羽使蒲將軍日夜引兵度三戶軍漳南與秦戰再破之項羽悉引兵擊秦軍汙水上大破之章邯使人見項羽欲約項羽召軍吏謀曰糧少欲聽其約軍吏皆曰善項羽乃與期洹水南殷虛上已盟章邯見項羽而流涕為言趙高項羽乃立章邯為雍王置楚軍中使長史欣為上將軍將秦軍為前行到新安諸侯吏卒異時故繇使屯戍過秦中秦中吏卒遇之多無狀及秦軍降諸侯諸侯吏卒乘勝多奴虜使之輕折辱秦吏卒秦吏卒多竊言曰章將軍等詐吾屬降諸侯今能入關破秦大善即不能諸侯虜吾屬而東秦必盡誅吾父母妻子諸將微聞其計以告項羽項羽乃召黥布蒲將軍計曰秦吏卒尚衆其心不服至關中不聽事必危不如擊殺之而獨與章邯長史欣都尉翳入秦於是楚軍夜擊坑秦卒二十餘萬人新安城南行略定秦地函谷關有兵守關不得入又聞沛公已破咸陽項羽大怒使當陽君等擊關項羽遂入至于戲西沛公軍霸上未得與項羽相見沛公左司馬曹無傷使人言於項羽曰沛公欲王關中使子嬰為相珍寶盡有之項羽大怒曰旦日饗士卒為擊破沛公軍當是時項羽兵四十萬在新豐鴻門沛公兵十萬在霸上范增說項羽曰沛公居山東時貪於財貨好美姬今入關財物無所取婦女無所幸此其志不在小吾令人望其氣皆為龍虎成五采此天子氣也急擊勿失楚左尹項伯者項羽季父也素善留侯張良張良是時從沛公項伯乃夜馳之沛公軍私見張良具告以事欲呼張良與俱去曰毋從俱死也張良曰臣為韓王送沛公沛公今事有急亡去不義不可不語良乃入具告沛公沛公大驚曰為之奈何張良曰誰為大王為此計者曰鯫生說我曰距關毋內諸侯秦地可盡王也故聽之良曰料大王士卒足以當項王乎沛公默然曰固不如也且為之奈何張良曰請往謂項伯言沛公不敢背項王也沛公曰君安與項伯有故張良曰秦時與臣游項伯殺人臣活之今事有急故幸來告良沛公曰孰與君少長良曰長於臣沛公曰君為我呼入吾得兄事之張良出要項伯項伯即入見沛公沛公奉卮酒為壽約為婚姻曰吾入關秋豪不敢有所近籍吏民封府庫而待將軍所以遣將守關者備他盜之出入與非常也日夜望將軍至豈敢反乎願伯具言臣之不敢倍德也項伯許諾謂沛公曰旦日不可不蚤自來謝項王沛公曰諾於是項伯復夜去至軍中具以沛公言報項王因言曰沛公不先破關中公豈敢入乎今人有大功而擊之不義也不如因善遇之項王許諾沛公旦日從百餘騎來見項王至鴻門謝曰臣與將軍戮力而攻秦將軍戰河北臣戰河南然不自意能先入關破秦得復見將軍於此今者有小人之言令將軍與臣有卻項王曰此沛公左司馬曹無傷言之不然籍何以至此項王即日因留沛公與飲項王項伯東嚮坐亞父南嚮坐亞父者范增也沛公北嚮坐張良西嚮侍范增數目項王舉所佩玉玦以示之者三項王默然不應范增起出召項莊謂曰君王為人不忍若入前為壽壽畢請以劍舞因擊沛公於坐殺之不者若屬皆且為所虜莊則入為壽壽畢曰君王與沛公飲軍中無以為樂請以劍舞項王曰諾項莊拔劍起舞項伯亦拔劍起舞常以身翼蔽沛公莊不得擊於是張良至軍門見樊噲樊噲曰今日之事何如良曰甚急今者項莊拔劍舞其意常在沛公也噲曰此迫矣臣請入與之同命噲即帶劍擁盾入軍門交戟之衛士欲止不內樊噲側其盾以撞衛士仆地噲遂入披帷西嚮立瞋目視項王頭髮上指目眥盡裂項王按劍而跽曰客何為者張良曰沛公之參乘樊噲者也項王曰壯士賜之卮酒則與斗卮酒噲拜謝起立而飲之項王曰賜之彘肩則與一生彘肩樊噲覆其盾於地加彘肩上拔劍切而啖之項王曰壯士能復飲乎樊噲曰臣死且不避卮酒安足辭夫秦王有虎狼之心殺人如不能舉刑人如恐不勝天下皆叛之懷王與諸將約曰先破秦入咸陽者王之今沛公先破秦入咸陽豪毛不敢所近封閉宮室還車霸上以待大王來故遣將守關者備他盜出入與非常也勞苦而功高如此未有封侯之賞而聽細說欲誅有功之人此亡秦之續耳竊為大王不取也項王未有以應曰坐樊噲從良坐坐須臾沛公起如廁因招樊噲出沛公已出項王使都尉陳平召沛公沛公曰今者出未辭也為之奈何樊噲曰大行不顧細謹大禮不辭小讓如今人方為刀俎我為魚肉何辭為於是遂去乃令張良留謝良問曰大王來何操曰我持白璧一雙欲獻項王玉斗一雙欲與亞父會其怒不敢獻公為我獻之張良曰謹諾當是時項王軍在鴻門下沛公軍在霸上相去四十里沛公則置車騎脫身獨騎與樊噲夏侯嬰靳彊紀信等四人持劍盾步走從酈山下道芷陽閒行沛公謂張良曰從此道至吾軍不過二十里耳度我至軍中公乃入沛公已去閒至軍中張良入謝曰沛公不勝杯杓不能辭謹使臣良奉白璧一雙再拜獻大王足下玉斗一雙再拜奉大將軍足下項王曰沛公安在良曰聞大王有意督過之脫身獨去已至軍矣項王則受璧置之坐上亞父受玉斗置之地拔劍撞而破之曰唉豎子不足與謀奪項王天下者必沛公也吾屬今為之虜矣沛公至軍立誅殺曹無傷居數日項羽引兵西屠咸陽殺秦降王子嬰燒秦宮室火三月不滅收其貨寶婦女而東人或說項王曰關中阻山河四塞地肥饒可都以霸項王見秦宮室皆以燒殘破又心懷思欲東歸曰富貴不歸故鄉如衣繡夜行誰知之者說者曰人言楚人沐猴而冠耳果然項王聞之烹說者項王使人致命懷王懷王曰如約乃尊懷王為義帝項王欲自王先王諸將相謂曰天下初發難時假立諸侯後以伐秦然身被堅執鋭首事暴露於野三年滅秦定天下者皆將相諸君與籍之力也義帝雖無功故當分其地而王之諸將皆曰善乃分天下立諸將為侯王項王范增疑沛公之有天下業已講解又惡負約恐諸侯叛之乃陰謀曰巴蜀道險秦之遷人皆居蜀乃曰巴蜀亦關中地也故立沛公為漢王王巴蜀漢中都南鄭而三分關中王秦降將以距塞漢王項王乃立章邯為雍王王咸陽以西都廢丘長史欣者故為櫟陽獄掾嘗有德於項梁都尉董翳者本勸章邯降楚故立司馬欣為塞王王咸陽以東至河都櫟陽立董翳為翟王王上郡都高奴徙魏王豹為西魏王王河東都平陽瑕丘申陽者張耳嬖臣也先下河南迎楚河上故立申陽為河南王都雒陽韓王成因故都都陽翟趙將司馬卬定河內數有功故立卬為殷王王河內都朝歌徙趙王歇為代王趙相張耳素賢又從入關故立耳為常山王王趙地都襄國當陽君黥布為楚將常冠軍故立布為九江王都六鄱君吳芮率百越佐諸侯又從入關故立芮為衡山王都邾義帝柱國共敖將兵擊南郡功多因立敖為臨江王都江陵徙燕王韓廣為遼東王燕將臧荼從楚救趙因從入關故立荼為燕王都薊徙齊王田巿為膠東王齊將田都從共救趙因從入關故立都為齊王都臨菑故秦所滅齊王建孫田安項羽方渡河救趙田安下濟北數城引其兵降項羽故立安為濟北王都博陽田榮者數負項梁又不肯將兵從楚擊秦以故不封成安君陳餘棄將印去不從入關然素聞其賢有功於趙聞其在南皮故因環封三縣番君將梅鋗功多故封十萬戶侯項王自立為西楚霸王王九郡都彭城漢之元年四月諸侯罷戲下各就國項王出之國使人徙義帝曰古之帝者地方千里必居上游乃使使徙義帝長沙郴縣趣義帝行其群臣稍稍背叛之乃陰令衡山臨江王擊殺之江中韓王成無軍功項王不使之國與俱至彭城廢以為侯已又殺之臧荼之國因逐韓廣之遼東廣弗德荼擊殺廣無終并王其地田榮聞項羽徙齊王巿膠東而立齊將田都為齊王乃大怒不肯遣齊王之膠東因以齊反迎擊田都田都走楚齊王巿畏項王乃亡之膠東就國田榮怒追擊殺之即墨榮因自立為齊王而西擊殺濟北王田安并王三齊榮與彭越將軍印令反梁地陳餘陰使張同夏說說齊王田榮曰項羽為天下宰不平今盡王故王於醜地而王其群臣諸將善地逐其故主趙王乃北居代餘以為不可聞大王起兵且不聽不義願大王資餘兵請以擊常山以復趙王請以國為扞蔽齊王許之因遣兵之趙陳餘悉發三縣兵與齊并力擊常山大破之張耳走歸漢陳餘迎故趙王歇於代反之趙趙王因立陳餘為代王是時漢還定三秦項羽聞漢王皆已并關中且東齊趙叛之大怒乃以故吳令鄭昌為韓王以距漢令蕭公角等擊彭越彭越敗蕭公角等漢使張良徇韓乃遺項王書曰漢王失職欲得關中如約即止不敢東又以齊梁反書遺項王曰齊欲與趙并滅楚楚以此故無西意而北擊齊徵兵九江王布布稱疾不往使將將數千人行項王由此怨布也漢之二年冬項羽遂北至城陽田榮亦將兵會戰田榮不勝走至平原平原民殺之遂北燒夷齊城郭室屋皆坑田榮降卒係虜其老弱婦女徇齊至北海多所殘滅齊人相聚而叛之於是田榮弟田橫收齊亡卒得數萬人反城陽項王因留連戰未能下春漢王部五諸侯兵凡五十六萬人東伐楚項王聞之即令諸將擊齊而自以精兵三萬人南從魯出胡陵四月漢皆已入彭城收其貨寶美人日置酒高會項王乃西從蕭晨擊漢軍而東至彭城日中大破漢軍漢軍皆走相隨入穀泗水殺漢卒十餘萬人漢卒皆南走山楚又追擊至靈壁東睢水上漢軍卻為楚所擠多殺漢卒十餘萬人皆入睢水睢水為之不流圍漢王三匝於是大風從西北而起折木發屋揚沙石窈冥晝晦逢迎楚軍楚軍大亂壞散而漢王乃得與數十騎遁去欲過沛收家室而西楚亦使人追之沛取漢王家家皆亡不與漢王相見漢王道逢得孝惠魯元乃載行楚騎追漢王漢王急推墮孝惠魯元車下滕公常下收載之如是者三曰雖急不可以驅奈何棄之於是遂得脫求太公呂后不相遇審食其從太公呂后閒行求漢王反遇楚軍楚軍遂與歸報項王項王常置軍中是時呂后兄周呂侯為漢將兵居下邑漢王閒往從之稍稍收其士卒至滎陽諸敗軍皆會蕭何亦發關中老弱未傅悉詣滎陽復大振楚起於彭城常乘勝逐北與漢戰滎陽南京索閒漢敗楚楚以故不能過滎陽而西項王之救彭城追漢王至滎陽田橫亦得收齊立田榮子廣為齊王漢王之敗彭城諸侯皆復與楚而背漢漢軍滎陽築甬道屬之河以取敖倉粟漢之三年項王數侵奪漢甬道漢王食乏恐請和割滎陽以西為漢項王欲聽之歷陽侯范增曰漢易與耳今釋弗取後必悔之項王乃與范增急圍滎陽漢王患之乃用陳平計閒項王項王使者來為太牢具舉欲進之見使者詳驚愕曰吾以為亞父使者乃反項王使者更持去以惡食食項王使者使者歸報項王項王乃疑范增與漢有私稍奪之權范增大怒曰天下事大定矣君王自為之願賜骸骨歸卒伍項王許之行未至彭城疽發背而死漢將紀信說漢王曰事已急矣請為王誑楚為王王可以閒出於是漢王夜出女子滎陽東門被甲二千人楚兵四面擊之紀信乘黃屋車傅左纛曰城中食盡漢王降楚軍皆呼萬歲漢王亦與數十騎從城西門出走成皋項王見紀信問漢王安在信曰漢王已出矣項王燒殺紀信漢王使御史大夫周苛樅公魏豹守榮陽周苛樅公謀曰反國之王難與守城乃共殺魏豹楚下滎陽城生得周苛項王謂周苛曰為我將我以公為上將軍封三萬戶周苛罵曰若不趣降漢漢今虜若若非漢敵也項王怒烹周苛并殺樅公漢王之出滎陽南走宛葉得九江王布行收兵復入保成皋漢之四年項王進兵圍成皋漢王逃獨與滕公出成皋北門渡河走修武從張耳韓信軍諸將稍稍得出成皋從漢王楚遂拔成皋欲西漢使兵距之鞏令其不得西是時彭越渡河擊楚東阿殺楚將軍薛公項王乃自東擊彭越漢王得淮陰侯兵欲渡河南鄭忠說漢王乃止壁河內使劉賈將兵佐彭越燒楚積聚項王東擊破之走彭越漢王則引兵渡河復取成皋軍廣武就敖倉食項王已定東海來西與漢俱臨廣武而軍相守數月當此時彭越數反梁地絶楚糧食項王患之為高俎置太公其上告漢王曰今不急下吾烹太公漢王曰吾與項羽俱北面受命懷王曰約為兄弟吾翁即若翁必欲烹而翁則幸分我一杯羹項王怒欲殺之項伯曰天下事未可知且為天下者不顧家雖殺之無益祇益禍耳項王從之楚漢久相持未決丁壯苦軍旅老弱罷轉漕項王謂漢王曰天下胸胸數歲者徒以吾兩人耳願與漢王挑戰決雌雄毋徒苦天下之民父子為也漢王笑謝曰吾寧鬭智不能鬭力項王令壯士出挑戰漢有善騎射者樓煩楚挑戰三合樓煩輒射殺之項王大怒乃自被甲持戟挑戰樓煩欲射之項王瞋目叱之樓煩目不敢視手不敢發遂走還入壁不敢復出漢王使人閒問之乃項王也漢王大驚於是項王乃即漢王相與臨廣武閒而語漢王數之項王怒欲一戰漢王不聽項王伏弩射中漢王漢王傷走入成皋項王聞淮陰侯已舉河北破齊趙且欲擊楚乃使龍且往擊之淮陰侯與戰騎將灌嬰擊之大破楚軍殺龍且韓信因自立為齊王項王聞龍且軍破則恐使盱台人武涉往說淮陰侯淮陰侯弗聽是時彭越復反下梁地絶楚糧項王乃謂海春侯大司馬曹咎等曰謹守成皋則漢欲挑戰慎勿與戰毋令得東而已我十五日必誅彭越定梁地復從將軍乃東行擊陳留外黃外黃不下數日已降項王怒悉令男子年十五已上詣城東欲坑之外黃令舍人兒年十三往說項王曰彭越彊劫外黃外黃恐故且降待大王大王至又皆坑之百姓豈有歸心從此以東梁地十餘城皆恐莫肯下矣項王然其言乃赦外黃當坑者東至睢陽聞之皆爭下項王漢果數挑楚軍戰楚軍不出使人辱之五六日大司馬怒渡兵汜水士卒半渡漢擊之大破楚軍盡得楚國貨賂大司馬咎長史翳塞王欣皆自剄汜水上大司馬咎者故蘄獄掾長史欣亦故櫟陽獄吏兩人嘗有德於項梁是以項王信任之當是時項王在睢陽聞海春侯軍敗則引兵還漢軍方圍鍾離眛於滎陽東項王至漢軍畏楚盡走險阻是時漢兵盛食多項王兵罷食絶漢遣陸賈說項王請太公項王弗聽漢王復使侯公往說項王項王乃與漢約中分天下割鴻溝以西者為漢鴻溝而東者為楚項王許之即歸漢王父母妻子軍皆呼萬歲漢王乃封侯公為平國君匿弗肯復見曰此天下辨士所居傾國故號為平國君項王已約乃引兵解而東歸漢欲西歸張良陳平說曰漢有天下太半而諸侯皆附之楚兵罷食盡此天亡楚之時也不如因其機而遂取之今釋弗擊此所謂也養虎自遺患漢王聽之漢五年漢王乃追項王至陽夏南止軍與淮陰侯韓信建成侯彭越期會而擊楚軍至固陵而信越之兵不會楚擊漢軍大破之漢王復入壁深塹而自守謂張子房曰諸侯不從約為之奈何對曰楚兵且破信越未有分地其不至固宜君王能與共分天下今可立致也即不能事未可知也君王能自陳以東傅海盡與韓信睢陽以北至穀城以與彭越使各自為戰則楚易敗也漢王曰善於是乃發使者告韓信彭越曰并力擊楚楚破自陳以東傅海與齊王睢陽以北至穀城與彭相國使者至韓信彭越皆報曰請今進兵韓信乃從齊往劉賈軍從壽春並行屠城父至垓下大司馬周殷叛楚以舒屠六舉九江兵隨劉賈彭越皆會垓下詣項王項王軍壁垓下兵少食盡漢軍及諸侯兵圍之數重夜聞漢軍四面皆楚歌項王乃大驚曰漢皆已得楚乎是何楚人之多也項王則夜起飲帳中有美人名虞常幸從駿馬名騅常騎之於是項王乃悲歌慷慨自為詩曰力拔山兮氣蓋世時不利兮騅不逝騅不逝兮可奈何虞兮虞兮奈若何歌數闋美人和之項王泣數行下左右皆泣莫能仰視於是項王乃上馬騎麾下壯士騎從者八百餘人直夜潰圍南出馳走平明漢軍乃覺之令騎將灌嬰以五千騎追之項王渡淮騎能屬者百餘人耳項王至陰陵迷失道問一田父田父紿曰左左乃陷大澤中以故漢追及之項王乃復引兵而東至東城乃有二十八騎漢騎追者數千人項王自度不得脫謂其騎曰吾起兵至今八歲矣身七十餘戰所當者破所擊者服未嘗敗北遂霸有天下然今卒困於此此天之亡我非戰之罪也今日固決死願為諸君快戰必三勝之為諸君潰圍斬將刈旗令諸君知天亡我非戰之罪也乃分其騎以為四隊四嚮漢軍圍之數重項王謂其騎曰吾為公取彼一將令四面騎馳下期山東為三處於是項王大呼馳下漢軍皆披靡遂斬漢一將是時赤泉侯為騎將追項王項王瞋目而叱之赤泉侯人馬俱驚辟易數里與其騎會為三處漢軍不知項王所在乃分軍為三復圍之項王乃馳復斬漢一都尉殺數十百人復聚其騎亡其兩騎耳乃謂其騎曰何如騎皆伏曰如大王言於是項王乃欲東渡烏江烏江亭長檥船待謂項王曰江東雖小地方千里衆數十萬人亦足王也願大王急渡今獨臣有船漢軍至無以渡項王笑曰天之亡我我何渡為且籍與江東子弟八千人渡江而西今無一人還縱江東父兄憐而王我我何面目見之縱彼不言籍獨不愧於心乎乃謂亭長曰吾知公長者吾騎此馬五歲所當無敵嘗一日行千里不忍殺之以賜公乃令騎皆下馬步行持短兵接戰獨籍所殺漢軍數百人項王身亦被十餘創顧見漢騎司馬呂馬童曰若非吾故人乎馬童面之指王翳曰此項王也項王乃曰吾聞漢購我頭千金邑萬戶吾為若德乃自刎而死王翳取其頭餘騎相蹂踐爭項王相殺者數十人最其後郎中騎楊嘉騎司馬呂馬童郎中呂勝楊武各得其一體五人共會其體皆是故分其地為五封呂馬童為中水侯封王翳為杜衍侯封楊喜為赤泉侯封楊武為吳防侯封呂勝為涅陽侯項王已死楚地皆降漢獨魯不下漢乃引天下兵欲屠之為其守禮義為主死節乃持項王頭視魯魯父兄乃降始楚懷王初封項籍為魯公及其死魯最後下故以魯公禮葬項王穀城漢王為發哀泣之而去諸項氏枝屬漢王皆不誅乃封項伯為射陽侯桃侯平皋侯玄武侯皆項氏賜姓劉太史公曰吾聞之周生曰舜目蓋重瞳子又聞項羽亦重瞳子羽豈其苗裔邪何興之暴也夫秦失其政陳涉首難豪傑蜂起相與並爭不可勝數然羽非有尺寸乘藝起隴畝之中三年遂將五諸侯滅秦分裂天下而封王侯政由羽出號為霸王位雖不終近古以來未嘗有也及羽背關懷楚放逐義帝而自立怨王侯叛己難矣自矜功伐奮其私智而不師古謂霸王之業欲以力征經營天下五年卒亡其國身死東城尚不覺寤而不自責過矣乃引天亡我非用兵之罪也豈不謬哉
