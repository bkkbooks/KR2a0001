body:
  text: 蒙恬列傳第二十八蒙恬者其先齊人也恬大父蒙驁自齊事秦昭王官至上卿秦莊襄王元年蒙驁為秦將伐韓取成皋滎陽作置三川郡二年蒙驁攻趙取三十七城始皇三年蒙驁攻韓取十三城五年蒙驁攻魏取二十城作置東郡始皇七年蒙驁卒驁子曰武武子曰恬恬嘗書獄典文學始皇二十三年蒙武為秦裨將軍與王翦攻楚大破之殺項燕二十四年蒙武攻楚虜楚王蒙恬弟毅始皇二十六年蒙恬因家世得為秦將攻齊大破之拜為內史秦已并天下乃使蒙恬將三十萬衆北逐戎狄收河南築長城因地形用制險塞起臨洮至遼東延袤萬餘里於是渡河據陽山逶蛇而北暴師於外十餘年居上郡是時蒙恬威振胸奴始皇甚尊寵蒙氏信任賢之而親近蒙毅位至上卿出則參乘入則御前恬任外事而毅常為內謀名為忠信故雖諸將相莫敢與之爭焉趙高者諸趙疏遠屬也趙高昆弟數人皆生隱宮其母被刑僇世世卑賤秦王聞高強力通於獄法舉以為中車府令高即私事公子胡亥喻之決獄高有大罪秦王令蒙毅法治之毅不敢阿法當高罪死除其宦籍帝以高之敦於事也赦之復其官爵始皇欲遊天下道九原直抵甘泉乃使蒙恬通道自九原抵甘泉山堙谷千八百里道未就始皇三十七年冬行出遊會稽並海上北走琅邪道病使蒙毅還禱山川未反始皇至沙丘崩祕之群臣莫知是時丞相李斯公子胡亥中車府令趙高常從高雅得幸於胡亥欲立之又怨蒙毅法治之而不為己也因有賊心乃與丞相李斯公子胡亥陰謀立胡亥為太子太子已立遣使者以罪賜公子扶蘇蒙恬死扶蘇已死蒙恬疑而復請之使者以蒙恬屬吏更置胡亥以李斯舍人為護軍使者還報胡亥已聞扶蘇死即欲釋蒙恬趙高恐蒙氏復貴而用事怨之毅還至趙高因為胡亥忠計欲以滅蒙氏乃言曰臣聞先帝欲舉賢立太子久矣而毅諫曰不可若知賢而俞弗立則是不忠而惑主也以臣愚意不若誅之胡亥聽而繫蒙毅於代前已囚蒙恬於陽周喪至咸陽已葬太子立為二世皇帝而趙高親近日夜毀惡蒙氏求其罪過舉劾之子嬰進諫曰臣聞故趙王遷殺其良李牧而用顏聚燕王喜陰用荊軻之謀而倍秦之約齊王建殺其故世忠臣而用后勝之議此三君者皆各以變古者失其國而殃及其身今蒙氏秦之大臣謀士也而主欲一旦棄去之臣竊以為不可臣聞輕慮者不可以治國獨智者不可以存君誅殺忠臣而立無節行之人是內使群臣不相信而外使鬭士之意離也臣竊以為不可胡亥不聽而遣御史曲宮乘傳之代令蒙毅曰先主欲立太子而卿難之今丞相以卿為不忠罪及其宗朕不忍乃賜卿死亦甚幸矣卿其圖之毅對曰以臣不能得先主之意則臣少宦順幸沒世可謂知意矣以臣不知太子之能則太子獨從周旋天下去諸公子絶遠臣無所疑矣夫先主之舉用太子數年之積也臣乃何言之敢諫何慮之敢謀非敢飾辭以避死也為羞纍先主之名願大夫為慮焉使臣得死情實且夫順成全者道之所貴也刑殺者道之所卒也昔者秦穆公殺三良而死罪百里奚而非其罪也故立號曰繆昭襄王殺武安君白起楚平王殺伍奢吳王夫差殺伍子胥此四君者皆為大失而天下非之以其君為不明以是籍於諸侯故曰用道治者不殺無罪而罰不加於無辜唯大夫留心使者知胡亥之意不聽蒙毅之言遂殺之二世又遣使者之陽周令蒙恬曰君之過多矣而卿弟毅有大罪法及內史恬曰自吾先人及至子孫積功信於秦三世矣今臣將兵三十餘萬身雖囚繫其勢足以倍畔然自知必死而守義者不敢辱先人之教以不忘先主也昔周成王初立未離襁褓周公旦負王以朝卒定天下及成王有病甚殆公旦自揃其爪以沈於河曰王未有識是旦執事有罪殃旦受其不祥乃書而藏之記府可謂信矣及王能治國有賊臣言周公旦欲為亂久矣王若不備必有大事王乃大怒周公旦走而奔於楚成王觀於記府得周公旦沈書乃流涕曰孰謂周公旦欲為亂乎殺言之者而反周公旦故周書曰必參而伍之今恬之宗世無二心而事卒如此是必孽臣逆亂內陵之道也夫成王失而復振則卒昌桀殺關龍逢紂殺王子比干而不悔身死則國亡臣故曰過可振而諫可覺也察於參伍上聖之法也凡臣之言非以求免於咎也將以諫而死願陛下為萬民思從道也使者曰臣受詔行法於將軍不敢以將軍言聞於上也蒙恬喟然太息曰我何罪於天無過而死乎良久徐曰恬罪固當死矣起臨洮屬之遼東城塹萬餘里此其中不能無絶地脈哉此乃恬之罪也乃吞藥自殺太史公曰吾適北邊自直道歸行觀蒙恬所為秦築長城亭障塹山堙谷通直道固輕百姓力矣夫秦之初滅諸侯天下之心未定痍傷者未瘳而恬為名將不以此時強諫振百姓之急養老存孤務修衆庶之和而阿意興功此其兄弟遇誅不亦宜乎何乃罪地脈哉
