body:
  text: 孟子荀卿列傳第十四太史公曰余讀孟子書至梁惠王問何以利吾國未嘗不廢書而歎也曰嗟乎利誠亂之始也夫子罕言利者常防其原也故曰放於利而行多怨自天子至於庶人好利之獘何以異哉孟軻騶人也受業子思之門人道既通游事齊宣王宣王不能用適梁梁惠王不果所言則見以為迂遠而闊於事情當是之時秦用商君富國彊兵楚魏用吳起戰勝弱敵齊威王宣王用孫子田忌之徒而諸侯東面朝齊天下方務於合從連衡以攻伐為賢而孟軻乃述唐虞三代之德是以所如者不合退而與萬章之徒序詩書述仲尼之意作孟子七篇其後有騶子之屬齊有三騶子其前騶忌以鼓琴干威王因及國政封為成侯而受相印先孟子其次騶衍後孟子騶衍睹有國者益淫侈不能尚德若大雅整之於身施及黎庶矣乃深觀陰陽消息而作怪迂之變終始大聖之篇十餘萬言其語閎大不經必先驗小物推而大之至於無垠先序今以上至黃帝學者所共術大並世盛衰因載其禨祥度制推而遠之至天地未生窈冥不可考而原也先列中國名山大川通谷禽獸水土所殖物類所珍因而推之及海外人之所不能睹稱引天地剖判以來五德轉移治各有宜而符應若茲以為儒者所謂中國者於天下乃八十一分居其一分耳中國名曰赤縣神州赤縣神州內自有九州禹之序九州是也不得為州數中國外如赤縣神州者九乃所謂九州也於是有裨海環之人民禽獸莫能相通者如一區中者乃為一州如此者九乃有大瀛海環其外天地之際焉其術皆此類也然要其歸必止乎仁義節儉君臣上下六親之施始也濫耳王公大人初見其術懼然顧化其後不能行之是以騶子重於齊適梁惠王效迎執賓主之禮適趙平原君側行撇席如燕昭王擁彗先驅請列弟子之座而受業築碣石宮身親往師之作主運其游諸侯見尊禮如此豈與仲尼菜色陳蔡孟軻困於齊梁同乎哉故武王以仁義伐紂而王伯夷餓不食周粟衛靈公問陳而孔子不答梁惠王謀欲攻趙孟軻稱大王去邠此豈有意阿世俗苟合而已哉持方枘欲內圜鑿其能入乎或曰伊尹負鼎而勉湯以王百里奚飯牛車下而繆公用霸作先合然後引之大道騶衍其言雖不軌儻亦有牛鼎之意乎自騶衍與齊之稷下先生如淳于髡慎到環淵接子田駢騶奭之徒各著書言治亂之事以干世主豈可勝道哉淳于髡齊人也博聞彊記學無所主其諫說慕晏嬰之為人也然而承意觀色為務客有見髡於梁惠王惠王屏左右獨坐而再見之終無言也惠王怪之以讓客曰子之稱淳于先生管晏不及及見寡人寡人未有得也豈寡人不足為言邪何故哉客以謂髡髡曰固也吾前見王王志在驅逐後復見王王志在音聲吾是以默然客具以報王王大駭曰嗟乎淳于先生誠聖人也前淳于先生之來人有獻善馬者寡人未及視會先生至後先生之來人有獻謳者未及試亦會先生來寡人雖屏人然私心在彼有之後淳于髡見壹語連三日三夜無倦惠王欲以卿相位待之髡因謝去於是送以安車駕駟束帛加璧黃金百鎰終身不仕慎到趙人田駢接子齊人環淵楚人皆學黃老道德之術因發明序其指意故慎到著十二論環淵著上下篇而田駢接子皆有所論焉騶奭者齊諸騶子亦頗采騶衍之術以紀文於是齊王嘉之自如淳于髡以下皆命曰列大夫為開第康莊之衢高門大屋尊寵之覽天下諸侯賓客言齊能致天下賢士也荀卿趙人年五十始來游學於齊騶衍之術迂大而閎辯奭也文具難施淳于髡久與處時有得善言故齊人頌曰談天衍雕龍奭炙轂過髡田駢之屬皆已死齊襄王時而荀卿最為老師齊尚脩列大夫之缺而荀卿三為祭酒焉齊人或讒荀卿荀卿乃適楚而春申君以為蘭陵令春申君死而荀卿廢因家蘭陵李斯嘗為弟子已而相秦荀卿嫉濁世之政亡國亂君相屬不遂大道而營於巫祝信禨祥鄙儒小拘如莊周等又猾稽亂俗於是推儒墨道德之行事興壞序列著數萬言而卒因葬蘭陵而趙亦有公孫龍為堅白同異之辯劇子之言魏有李悝盡地力之教楚有尸子長盧阿之吁子焉自如孟子至于吁子世多有其書故不論其傳云蓋墨翟宋之大夫善守禦為節用或曰並孔子時或曰在其後
