body:
  text: 平津侯主父列傳第五十二丞相公孫弘者齊菑川國薛縣人也字季少時為薛獄吏有辠免家貧牧豕海上年四十餘乃學春秋雜說養後母孝謹建元元年天子初即位招賢良文學之士是時弘年六十徵以賢良為博士使匈奴還報不合上意上怒以為不能弘迺病免歸元光五年有詔徵文學菑川國復推上公孫弘弘讓謝國人曰臣已嘗西應命以不能罷歸願更推選國人固推弘弘至太常太常令所徵儒士各對策百餘人弘第居下策奏天子擢弘對為第一召入見狀貌甚麗拜為博士是時通西南夷道置郡巴蜀民苦之詔使弘視之還奏事盛毀西南夷無所用上不聽弘為人恢奇多聞常稱以為人主病不廣大人臣病不儉節弘為布被食不重肉後母死服喪三年每朝會議開陳其端令人主自擇不肯面折庭爭於是天子察其行敦厚辯論有餘習文法吏事而又緣飾以儒術上大說之二歲中至左內史弘奏事有不可不庭辯之嘗與主爵都尉汲黯請閒汲黯先發之弘推其後天子常說所言皆聽以此日益親貴嘗與公卿約議至上前皆倍其約以順上旨汲黯庭詰弘曰齊人多詐而無情實始與臣等建此議今皆倍之不忠上問弘弘謝曰夫知臣者以臣為忠不知臣者以臣為不忠上然弘言左右幸臣每毀弘上益厚遇之元朔三年張歐免以弘為御史大夫是時通西南夷東置滄海北築朔方之郡弘數諫以為罷敝中國以奉無用之地願罷之於是天子乃使朱買臣等難弘置朔方之便發十策弘不得一弘迺謝曰山東鄙人不知其便若是願罷西南夷滄海而專奉朔方上乃許之汲黯曰弘位在三公奉祿甚多然為布被此詐也上問弘弘謝曰有之夫九卿與臣善者無過黯然今日庭詰弘誠中弘之病夫以三公為布被誠飾詐欲以釣名且臣聞管仲相齊有三歸侈擬於君桓公以霸亦上僭於君晏嬰相景公食不重肉妾不衣絲齊國亦治此下比於民今臣弘位為御史大夫而為布被自九卿以下至於小吏無差誠如汲黯言且無汲黯忠陛下安得聞此言天子以為謙讓愈益厚之卒以弘為丞相封平津侯弘為人意忌外寬內深諸嘗與弘有卻者雖詳與善陰報其禍殺主父偃徙董仲舒於膠西皆弘之力也食一肉脫粟之飯故人所善賓客仰衣食弘奉祿皆以給之家無所餘士亦以此賢之淮南衡山謀反治黨與方急弘病甚自以為無功而封位至丞相宜佐明主填撫國家使人由臣子之道今諸侯有畔逆之計此皆宰相奉職不稱恐竊病死無以塞責乃上書曰臣聞天下之通道五所以行之者三曰君臣父子兄弟夫婦長幼之序此五者天下之通道也智仁勇此三者天下之通德所以行之者也故曰力行近乎仁好問近乎智知恥近乎勇知此三者則知所以自治知所以自治然後知所以治人天下未有不能自治而能治人者也此百世不易之道也今陛下躬行大孝鑒三王建周道兼文武厲賢予祿量能授官今臣弘罷駑之質無汗馬之勞陛下過意擢臣弘卒伍之中封為列侯致位三公臣弘行能不足以稱素有負薪之病恐先狗馬填溝壑終無以報德塞責顧歸侯印乞骸骨避賢者路天子報曰古者賞有功襃有德守成尚文遭遇右武未有易此者也朕宿昔庶幾獲承尊位懼不能寧惟所與共為治者君宜知之蓋君子善善惡惡君若謹行常在朕躬君不幸罹霜露之病何恙不已迺上書歸侯乞骸骨是章朕之不德也今事少閒君其省思慮一精神輔以醫藥因賜告牛酒雜帛居數月病有瘳視事元狩二年弘病竟以丞相終子度嗣為平津侯度為山陽太守十餘歲坐法失侯主父偃者齊臨菑人也學長短縱橫之術晚乃學易春秋百家言游齊諸生閒莫能厚遇也齊諸儒生相與排擯不容於齊家貧假貸無所得迺北游燕趙中山皆莫能厚遇為客甚困孝武元光元年中以為諸侯莫足游者乃西入關見衛將軍衛將軍數言上上不召資用乏留久諸公賓客多厭之乃上書闕下朝奏暮召入見所言九事其八事為律令一事諫伐匈奴其辭曰臣聞明主不惡切諫以博觀忠臣不敢避重誅以直諫是故事無遺策而功流萬世今臣不敢隱忠避死以效愚計願陛下幸赦而少察之司馬法曰國雖大好戰必亡天下雖平忘戰必危天下既平天子大凱春蒐秋獮諸侯春振旅秋治兵所以不忘戰也且夫怒者逆德也兵者凶器也爭者末節也古之人君一怒必伏尸流血故聖王重行之夫務戰勝窮武事者未有不悔者也昔秦皇帝任戰勝之威蠶食天下并吞戰國海內為一功齊三代務勝不休欲攻匈奴李斯諫曰不可夫匈奴無城郭之居委積之守遷徙鳥舉難得而制也輕兵深入糧食必絕踵糧以行重不及事得其地不足以為制也遇其民不可役而守也勝必殺之非民父母也靡獘中國快心匈奴非長策也秦皇帝不聽遂使蒙恬將兵攻胡辟地千里以河為境地固澤鹵不生五穀然後發天下丁男以守北河暴兵露師十有餘年死者不可勝數終不能踰河而北是豈人眾不足兵革不備哉其勢不可也又使天下蜚芻輓粟起於黃腄琅邪負海之郡轉輸北河率三十鍾而致一石男子疾耕不足於糧饟女子紡績不足於帷幕百姓靡敝孤寡老弱不能相養道路死者相望蓋天下始畔秦也及至高皇帝定天下略地於邊聞匈奴聚於代谷之外而欲擊之御史成進諫曰不可夫匈奴之性獸聚而鳥散從之知搏影今以陛下盛德攻匈奴臣竊危之高帝不聽遂北至於代谷果有平城之圍高皇帝蓋悔之甚乃使劉敬往結和親之約然後天下忘干戈之事故兵法曰興師十萬日費千金夫秦常積眾暴兵數十萬人雖有覆軍殺將係虜單于之功亦適足以結怨深讎不足以償天下之費夫上虛府庫下敝百姓甘心於外國非完事也夫匈奴難得而制非一世也行盜侵驅所以為業也天性固然上及虞夏殷周固弗程督禽獸畜之不屬為人夫上不觀虞夏殷周之統而下循近世之失此臣之所大憂百姓之所疾苦也且夫兵久則變生事苦則慮易乃使邊境之民獘靡愁苦而有離心將吏相疑而外市故尉佗章邯得以成其私也夫秦政之所以不行者權分乎二子此得失之效也故周書曰安危在出令存亡在所用願陛下詳察之少加意而熟慮焉是時趙人徐樂齊人嚴安俱上書言世務各一事徐樂曰臣聞天下之患在於土崩不在於瓦解古今一也何謂土崩秦之末世是也陳涉無千乘之尊尺土之地身非王公大人名族之後無鄉曲之譽非有孔墨曾子之賢陶朱猗頓之富也然起窮巷奮棘矜偏袒大呼而天下從風此其故何也由民困而主不恤下怨而上不知俗已亂而政不脩此三者陳涉之所以為資也是之謂土崩故曰天下之患在於土崩何謂瓦解吳楚齊趙之兵是也七國謀為大逆號皆稱萬乘之君帶甲數十萬威足以嚴其境內財足以勸其士民然不能西攘尺寸之地而身為禽於中原者此其故何也非權輕於匹夫而兵弱於陳涉也當是之時先帝之德澤未衰而安土樂俗之民眾故諸侯無境外之助此之謂瓦解故曰天下之患不在瓦解由是觀之天下誠有土崩之勢雖布衣窮處之士或首惡而危海內陳涉是也況三晉之君或存乎天下雖未有大治也誠能無土崩之勢雖有彊國勁兵不得旋踵而身為禽矣吳楚齊趙是也況群臣百姓能為亂乎哉此二體者安危之明要也賢主所留意而深察也閒者關東五穀不登年歲未復民多窮困重之以邊境之事推數循理而觀之則民且有不安其處者矣不安故易動易動者土崩之勢也故賢主獨觀萬化之原明於安危之機脩之廟堂之上而銷未形之患其要期使天下無土崩之勢而已矣故雖有彊國勁兵陛下遂走獸射蜚鳥弘游燕之囿淫縱恣之觀極馳騁之樂自若也金石絲竹之聲不絕於耳帷帳之私俳優侏儒之笑不乏於前而天下無宿憂名何必湯武俗何必成康雖然臣竊以為陛下天然之聖寬仁之資而誠以天下為務則湯武之名不難侔而成康之俗可復興也此二體者立然後處尊安之實揚名廣譽於當世親天下而服四夷餘恩遺德為數世隆南面負扆攝袂而揖王公此陛下之所服也臣聞圖王不成其敝足以安安則陛下何求而不得何為而不成何征而不服乎哉嚴安上書曰臣聞周有天下其治三百餘歲成康其隆也刑錯四十餘年而不用及其衰也亦三百餘歲故五伯更起五伯者常佐天子興利除害誅暴禁邪匡正海內以尊天子五伯既沒賢聖莫續天子孤弱號令不行諸侯恣行彊陵弱眾暴寡田常篡齊六卿分晉並為戰國此民之始苦也於是彊國務攻弱國備守合從連橫馳車擊轂介冑生蟣蝨民無所告愬及至秦王蠶食天下并吞戰國稱號曰皇帝主海內之政壞諸侯之城銷其兵鑄以為鍾虡示不復用元元黎民得免於戰國逢明天子人人自以為更生嚮使秦緩其刑罰薄賦斂省繇役貴仁義賤權利上篤厚下智巧變風易俗化於海內則世世必安矣秦不行是風而循其故俗為智巧權利者進篤厚忠信者退法嚴政峻諂諛者眾日聞其美意廣心軼欲肆威海外乃使蒙恬將兵以北攻胡辟地進境戍於北河蜚芻輓粟以隨其後又使尉屠睢將樓船之士南攻百越使監祿鑿渠運糧深入越越人遁逃曠日持久糧食絕乏越人擊之秦兵大敗秦乃使尉佗將卒以戍越當是時秦禍北構於胡南挂於越宿兵無用之地進而不得退行十餘年丁男被甲丁女轉輸苦不聊生自經於道樹死者相望及秦皇帝崩天下大叛陳勝吳廣舉陳武臣張耳舉趙項梁舉吳田儋舉齊景駒舉郢周市舉魏韓廣舉燕窮山通谷豪士並起不可勝載也然皆非公侯之後非長官之吏也無尺寸之勢起閭巷杖棘矜應時而皆動不謀而俱起不約而同會壤長地進至于霸王時教使然也秦貴為天子富有天下滅世絕祀者窮兵之禍也故周失之弱秦失之彊不變之患也今欲招南夷朝夜郎降羌僰略濊州建城邑深入匈奴燔其蘢城議者美之此人臣之利也非天下之長策也今中國無狗吠之驚而外累於遠方之備靡敝國家非所以子民也行無窮之欲甘心快意結怨於匈奴非所以安邊也禍結而不解兵休而復起近者愁苦遠者驚駭非所以持久也今天下鍛甲砥劍橋箭累弦轉輸運糧未見休時此天下之所共憂也夫兵久而變起事煩而慮生今外郡之地或幾千里列城數十形束壤制旁脅諸侯非公室之利也上觀齊晉之所以亡者公室卑削六卿大盛也下觀秦之所以滅者嚴法刻深欲大無窮也今郡守之權非特六卿之重也地幾千里非特閭巷之資也甲兵器械非特棘矜之用也以遭萬世之變則不可稱諱也書奏天子天子召見三人謂曰公等皆安在何相見之晚也於是上乃拜主父偃徐樂嚴安為郎中偃數見上疏言事詔拜偃為謁者遷為中大夫一歲中四遷偃偃說上曰古者諸侯不過百里彊弱之形易制今諸侯或連城數十地方千里緩則驕奢易為淫亂急則阻其彊而合從以逆京師今以法割削之則逆節萌起前日鼂錯是也今諸侯子弟或十數而適嗣代立餘雖骨肉無尺寸地封則仁孝之道不宣願陛下令諸侯得推恩分子弟以地侯之彼人人喜得所願上以德施實分其國不削而稍弱矣於是上從其計又說上曰茂陵初立天下豪桀并兼之家亂眾之民皆可徙茂陵內實京師外銷姦猾此所謂不誅而害除上又從其計尊立衛皇后及發燕王定國陰事蓋偃有功焉大臣皆畏其口賂遺累千金人或說偃曰太橫矣主父曰臣結髮游學四十餘年身不得遂親不以為子昆弟不收賓客棄我我阸日久矣且丈夫生不五鼎食死即五鼎烹耳吾日暮途遠故倒行暴施之偃盛言朔方地肥饒外阻河蒙恬城之以逐匈奴內省轉輸戍漕廣中國滅胡之本也上覽其說下公卿議皆言不便公孫弘曰秦時常發三十萬眾築北河終不可就已而棄之主父偃盛言其便上竟用主父計立朔方郡元朔二年主父言齊王內淫佚行僻上拜主父為齊相至齊遍召昆弟賓客散五百金予之數之曰始吾貧時昆弟不我衣食賓客不我內門今吾相齊諸君迎我或千里吾與諸君絕矣毋復入偃之門乃使人以王與姊姦事動王王以為終不得脫罪恐效燕王論死乃自殺有司以聞主父始為布衣時嘗游燕趙及其貴發燕事趙王恐其為國患欲上書言其陰事為偃居中不敢發及為齊相出關即使人上書告言主父偃受諸侯金以故諸侯子弟多以得封者及齊王自殺上聞大怒以為主父劫其王令自殺乃徵下吏治主父服受諸侯金賓不劫王令自殺上欲勿誅是時公孫弘為御史大夫乃言曰齊王自殺無後國除為郡入漢主父偃本首惡陛下不誅主父偃無以謝天下乃遂族主父偃主父方貴幸時賓客以千數及其族死無一人收者唯獨洨孔車收葬之天子後聞之以為孔車長者也太史公曰公孫弘行義雖脩然亦遇時漢興八十餘年矣上方鄉文學招俊乂以廣儒墨弘為舉首主父偃當路諸公皆譽之及名敗身誅士爭言其惡悲夫太皇太后詔大司徒大司空蓋聞治國之道富民為始富民之要在於節儉孝經曰安上治民莫善於禮禮與奢也寧儉昔者管仲相齊桓霸諸侯有九合一匡之功而仲尼謂之不知禮以其奢泰侈擬於君故也夏禹卑宮室惡衣服後聖不循由此言之治之盛也德優矣莫高於儉儉化俗民則尊卑之序得而骨肉之恩親爭訟之原息斯乃家給人足刑錯之本也歟可不務哉夫三公者百寮之率萬民之表也未有樹直表而得曲影者也孔子不云乎子率而正孰敢不正舉善而教不能則勸維漢興以來股肱宰臣身行儉約輕財重義較然著明未有若故丞相平津侯公孫弘者也位在丞相而為布被脫粟之飯不過一肉故人所善賓客皆分奉祿以給之無有所餘誠內自克約而外從制汲黯詰之乃聞于朝此可謂減於制度而可施行者也德優則行否則止與內奢泰而外為詭服以釣虛譽者殊科以病乞骸骨孝武皇帝即制曰賞有功襃有德善善惡惡君宜知之其省思慮存精神輔以醫藥賜告治病牛酒雜帛居數月有瘳視事至元狩二年竟以善終于相位夫知臣莫若君此其效也弘子度嗣爵後為山陽太守坐法失侯夫表德章義所以率俗厲化聖王之制不易之道也其賜弘後子孫之次當為後者爵關內侯食邑三百戶徵詣公車上名尚書朕親臨拜焉班固稱曰公孫弘卜式兒寬皆以鴻漸之翼困於燕雀遠迹羊豕之閒非遇其時焉能致此位乎是時漢興六十餘載海內乂安府庫充實而四夷未賓制度多闕上方欲用文武求之如弗及始以蒲輪迎枚生見主父而歎息群臣慕嚮異人並出卜式試於芻牧弘羊擢於賈豎衛青奮於奴僕日磾出於降虜斯亦曩時版築飯牛之朋矣漢之得人於茲為盛儒雅則公孫弘董仲舒兒寬篤行則石建石慶質直則汲黯卜式推賢則韓安國鄭當時定令則趙禹張湯文章則司馬遷相如滑稽則東方朔枚皋應對則嚴助朱買臣曆數則唐都落下閎協律則李延年運籌則桑弘羊奉使則張騫蘇武將帥則衛青霍去病受遺則霍光金日磾其餘不可勝紀是以興造功業制度遺文後世莫及孝宣承統纂脩洪業亦講論六蓺招選茂異而蕭望之梁丘賀夏侯勝韋玄成嚴彭祖尹更始以儒術進劉向王襃以文章顯將相則張安世趙充國魏相邴吉于定國杜延年治民則黃霸王成龔遂鄭弘邵信臣韓延壽尹翁歸趙廣漢之屬皆有功迹見述於後累其名臣亦其次也
