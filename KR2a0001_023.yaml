body:
  text: 禮書第一太史公曰洋洋美德乎宰制萬物役使群眾豈人力也哉余至大行禮官觀三代損益乃知緣人情而制禮依人性而作儀其所由來尚矣人道經緯萬端規矩無所不貫誘進以仁義束縛以刑罰故德厚者位尊祿重者寵榮所以總一海內而整齊萬民也人體安駕乘為之金輿錯衡以繁其飾目好五色為之黼黻文章以表其能耳樂鐘磬為之調諧八音以蕩其心口甘五味為之庶羞酸鹹以致其美情好珍善為之琢磨圭璧以通其意故大路越席皮弁布裳朱弦洞越大羹玄酒所以防其淫侈救其彫敝是以君臣朝廷尊卑貴賤之序下及黎庶車輿衣服宮室飲食嫁娶喪祭之分事有宜適物有節文仲尼曰褅自既灌而往者吾不欲觀之矣周衰禮廢樂壞大小相踰管仲之家兼備三歸循法守正者見侮於世奢溢僭差者謂之顯榮自子夏門人之高弟也猶云出見紛華盛麗而說入聞夫子之道而樂二者心戰未能自決而況中庸以下漸漬於失教被服於成俗乎孔子曰必也正名於衛所居不合仲尼沒後受業之徒沈湮而不舉或適齊楚或入河海豈不痛哉至秦有天下悉內六國禮儀采擇其善雖不合聖制其尊君抑臣朝廷濟濟依古以來至于高祖光有四海叔孫通頗有所增益減損大抵皆襲秦故自天子稱號下至佐僚及宮室官名少所變改孝文即位有司議欲定儀禮孝文好道家之學以為繁禮飾貌無益於治躬化謂何耳故罷去之孝景時御史大夫鼂錯明於世務刑名數干諫孝景曰諸侯藩輔臣子一例古今之制也今大國專治異政不稟京師恐不可傳後孝景用其計而六國畔逆以錯首名天子誅錯以解難事在袁盎語中是後官者養交安祿而已莫敢復議今上即位招致儒術之士令共定儀十餘年不就或言古者太平萬民和喜瑞應辨至乃采風俗定制作上聞之制詔御史曰蓋受命而王各有所由興殊路而同歸謂因民而作追俗為制也議者咸稱太古百姓何望漢亦一家之事典法不傳謂子孫何化隆者閎博治淺者褊狹可不勉與乃以太初之元改正朔易服色封太山定宗廟百官之儀以為典常垂之於後云禮由人起人生有欲欲而不得則不能無忿忿而無度量則爭爭則亂先王惡其亂故制禮義以養人之欲給人之求使欲不窮於物物不屈於欲二者相待而長是禮之所起也故禮者養也稻粱五味所以養口也椒蘭芬茝所以養鼻也鐘鼓管弦所以養耳也刻鏤文章所以養目也疏房床笫几席所以養體也故禮者養也君子既得其養又好其辨也所謂辨者貴賤有等長少有差貧富輕重皆有稱也故天子大路越席所以養體也側載臭茝所以養鼻也前有錯衡所以養目也和鸞之聲步中武象驟中韶濩所以養耳也龍旂九斿所以養信也寢兕持虎鮫韅彌龍所以養威也故大路之馬必信至教順然后乘之所以養安也孰知夫出死要節之所以養生也孰知夫輕費用之所以養財也孰知夫恭敬辭讓之所以養安也孰知夫禮義文理之所以養情也人苟生之為見若者必死苟利之為見若者必害怠惰之為安若者必危情勝之為安若者必滅故聖人一之於禮義則兩得之矣一之於情性則兩失之矣故儒者將使人兩得之者也墨者將使人兩失之者也是儒墨之分治辨之極也彊固之本也威行之道也功名之總也王公由之所以一天下臣諸侯也弗由之所以捐社稷也故堅革利兵不足以為勝高城深池不足以為固嚴令繁刑不足以為威由其道則行不由其道則廢楚人鮫革犀兕所以為甲堅如金石宛之鉅鐵施鑽如蠭蠆輕利剽遫卒如熛風然而兵殆於垂涉唐昧死焉莊蹻起楚分而為四參是豈無堅革利兵哉其所以統之者非其道故也汝潁以為險江漢以為池阻之鄧林緣之以方城然而秦師至鄢郢舉若振槁是豈無固塞險阻哉其所以統之者非其道故也紂剖比干囚箕子為炮格刑殺無辜時臣下懍然莫必其命然而周師至而令不行乎下不能用其民是豈令不嚴刑不陖哉其所以統之者非其道故也古者之兵戈矛弓矢而已然而敵國不待試而詘城郭不集溝池不掘固塞不樹機變不張然而國晏然不畏外而固者無他故焉明道而均分之時使而誠愛之則下應之如景響有不由命者然後俟之以刑則民知辠矣故刑一人而天下服辠人不尤其上知辠之在己也是故刑罰省而威行如流無他故焉由其道故也故由其道則行不由其道則廢古者帝堯之治天下也蓋殺一人刑二人而天下治傳曰威厲而不試刑措而不用天地者生之本也先祖者類之本也君師者治之本也無天地惡生無先祖惡出無君師惡治三者偏亡則無安人故禮上事天下事地尊先祖而隆君師是禮之三本也故王者天太祖諸侯不敢懷大夫士有常宗所以辨貴賤貴賤治得之本也郊疇乎天子社至乎諸侯函及士大夫所以辨尊者事尊卑者事卑宜鉅者鉅宜小者小故有天下者事七世有一國者事五世有五乘之地者事三世有三乘之地者事二世有特牲而食者不得立宗廟所以辨積厚者流澤廣積薄者流澤狹也大饗上玄尊俎上腥魚先大羹貴食飲之本也大饗上玄尊而用薄酒食先黍稷而飯稻粱祭嚌先大羹而飽庶羞貴本而親用也貴本之謂文親用之謂理兩者合而成文以歸太一是謂大隆故尊之上玄尊也俎之上腥魚也豆之先大羹一也利爵弗啐也成事俎弗嘗也三侑之弗食也大昏之未廢齊也大廟之未內尸也始絕之未小斂一也大路之素幬也郊之麻絻喪服之先散麻一也三年哭之不反也清廟之歌一倡而三歎縣一鐘尚拊膈朱弦而通越一也凡禮始乎脫成乎文終乎稅故至備情文俱盡其次情文代勝其下復情以歸太一天地以合日月以明四時以序星辰以行江河以流萬物以昌好惡以節喜怒以當以為下則順以為上則明太史公曰至矣哉立隆以為極而天下莫之能益損也本末相順終始相應至文有以辨至察有以說天下從之者治不從者亂從之者安不從者危小人不能則也禮之貌誠深矣堅白同異之察入焉而弱其貌誠大矣擅作典制褊陋之說入焉而望其貌誠高矣暴慢恣睢輕俗以為高之屬入焉而隊故繩誠陳則不可欺以曲直衡誠縣則不可欺以輕重規矩誠錯則不可欺以方員君子審禮則不可欺以詐偽故繩者直之至也衡者平之至也規矩者方員之至也禮者人道之極也然而不法禮者不足禮謂之無方之民法禮足禮謂之有方之士禮之中能思索謂之能慮能慮勿易謂之能固能慮能固加好之焉聖矣天者高之極也地者下之極也日月者明之極也無窮者廣大之極也聖人者道之極也以財物為用以貴賤為文以多少為異以隆殺為要文貌繁情欲省禮之隆也文貌省情欲繁禮之殺也文貌情欲相為內外表裏並行而雜禮之中流也君子上致其隆下盡其殺而中處其中步驟馳騁廣騖不外是以君子之性守宮庭也人域是域士君子也外是民也於是中焉房皇周浹曲得其次序聖人也故厚者禮之積也大者禮之廣也高者禮之隆也明者禮之盡也
