body:
  text: 孔子世家第十七孔子生魯昌平鄉陬邑其先宋人也曰孔防叔防叔生伯夏伯夏生叔梁紇紇與顏氏女野合而生孔子禱於尼丘得孔子魯襄公二十二年而孔子生生而首上圩頂故因名曰丘云字仲尼姓孔氏丘生而叔梁紇死葬於防山防山在魯東由是孔子疑其父墓處母諱之也孔子為兒嬉戲常陳俎豆設禮容孔子母死乃殯五父之衢蓋其慎也郰人輓父之母誨孔子父墓然後往合葬於防焉孔子要絰季氏饗士孔子與往陽虎絀曰季氏饗士非敢饗子也孔子由是退孔子年十七魯大夫孟釐子病且死誡其嗣懿子曰孔丘聖人之後滅於宋其祖弗父何始有宋而嗣讓厲公及正考父佐戴武宣公三命茲益恭故鼎銘云一命而僂再命而傴三命而俯循牆而走亦莫敢余侮饘於是粥於是以餬余口其恭如是吾聞聖人之後雖不當世必有達者今孔丘年少好禮其達者歟吾即沒若必師之及釐子卒懿子與魯人南宮敬叔往學禮焉是歲季武子卒平子代立孔子貧且賤及長嘗為季氏史料量平嘗為司職吏而畜蕃息由是為司空已而去魯斥乎齊逐乎宋衛困於陳蔡之閒於是反魯孔子長九尺有六寸人皆謂之長人而異之魯復善待由是反魯魯南宮敬叔言魯君曰請與孔子適周魯君與之一乘車兩馬一豎子俱適周問禮蓋見老子云辭去而老子送之曰吾聞富貴者送人以財仁人者送人以言吾不能富貴竊仁人之號送子以言曰聰明深察而近於死者好議人者也博辯廣大危其身者發人之惡者也為人子者毋以有己為人臣者毋以有己孔子自周反于魯弟子稍益進焉是時也晉平公淫六卿擅權東伐諸侯楚靈王兵彊陵轢中國齊大而近於魯魯小弱附於楚則晉怒附於晉則楚來伐不備於齊齊師侵魯魯昭公之二十年而孔子蓋年三十矣齊景公與晏嬰來適魯景公問孔子曰昔秦穆公國小處辟其霸何也對曰秦國雖小其志大處雖辟行中正身舉五羖爵之大夫起纍紲之中與語三日授之以政以此取之雖王可也其霸小矣景公說孔子年三十五而季平子與郈昭伯以鬭雞故得罪魯昭公昭公率師擊平子平子與孟氏叔孫氏三家共攻昭公昭公師敗奔於齊齊處昭公乾侯其後頃之魯亂孔子適齊為高昭子家臣欲以通乎景公與齊太師語樂聞韶音學之三月不知肉味齊人稱之景公問政孔子孔子曰君君臣臣父父子子景公曰善哉信如君不君臣不臣父不父子不子雖有粟吾豈得而食諸他日又復問政於孔子孔子曰政在節財景公說將欲以尼谿田封孔子晏嬰進曰夫儒者滑稽而不可軌法倨傲自順不可以為下崇喪遂哀破產厚葬不可以為俗游說乞貸不可以為國自大賢之息周室既衰禮樂缺有閒今孔子盛容飾繁登降之禮趨詳之節累世不能殫其學當年不能究其禮君欲用之以移齊俗非所以先細民也後景公敬見孔子不問其禮異日景公止孔子曰奉子以季氏吾不能以季孟之閒待之齊大夫欲害孔子孔子聞之景公曰吾老矣弗能用也孔子遂行反乎魯孔子年四十二魯昭公卒於乾侯定公立定公立五年夏季平子卒桓子嗣立季桓子穿井得土缶中若羊問仲尼云得狗仲尼曰以丘所聞羊也丘聞之木石之怪夔罔閬水之怪龍罔象土之怪墳羊吳伐越墮會稽得骨節專車吳使使問仲尼骨何者最大仲尼曰禹致群神於會稽山防風氏後至禹殺而戮之其節專車此為大矣吳客曰誰為神仲尼曰山川之神足以綱紀天下其守為神社稷為公侯皆屬於王者客曰防風何守仲尼曰汪罔氏之君守封禺之山為釐姓在虞夏商為江罔於周為長翟今謂之大人客曰人長幾何仲尼曰僬僥氏三尺短之至也長者不過十之數之極也於是吳客曰善哉聖人桓子嬖臣曰仲梁懷與陽虎有隙陽虎欲逐懷公山不狃止之其秋懷益驕陽虎執懷桓子怒陽虎因囚桓子與盟而醳之陽虎由此益輕季氏季氏亦僭於公室陪臣執國政是以魯自大夫以下皆僭離於正道故孔子不仕退而脩詩書禮樂弟子彌眾至自遠方莫不受業焉定公八年公山不狃不得意於季氏因陽虎為亂欲廢三桓之適更立其庶孼陽虎素所善者遂執季桓子桓子詐之得脫定公九年陽虎不勝奔于齊是時孔子年五十公山不狃以費畔季氏使人召孔子孔子循道彌久溫溫無所試莫能己用曰蓋周文武起豐鎬而王今費雖小儻庶幾乎欲往子路不說止孔子孔子曰夫召我者豈徒哉如用我其為東周乎然亦卒不行其後定公以孔子為中都宰一年四方皆則之由中都宰為司空由司空為大司寇定公十年春及齊平夏齊大夫黎鉏言於景公曰魯用孔丘其勢危齊乃使使告魯為好會會於夾谷魯定公且以乘車好往孔子攝相事曰臣聞有文事者必有武備有武事者必有文備古者諸侯出疆必具官以從請具左右司馬定公曰諾具左右司馬會齊侯夾谷為壇位土階三等以會遇之禮相見揖讓而登獻酬之禮畢齊有司趨而進曰請奏四方之樂景公曰諾於是旍旄羽袚矛戟劍撥鼓噪而至孔子趨而進歷階而登不盡一等舉袂而言曰吾兩君為好會夷狄之樂何為於此請命有司有司卻之不去則左右視晏子與景公景公心怍麾而去之有頃齊有司趨而進曰請奏宮中之樂景公曰諾優倡侏儒為戲而前孔子趨而進歷階而登不盡一等曰匹夫而營惑諸侯者罪當誅請命有司有司如法焉手足異處景公懼而動知義不若歸而大恐告其群臣曰魯以君子之道輔其君而子獨以夷狄之道教寡人使得罪於魯君為之柰何有司進對曰君子有過則謝以質小人有過則謝以文君若悼之則謝以質於是齊侯乃歸所侵魯之鄆汶陽龜陰之田以謝過定公十三年夏孔子言於定公曰臣無藏甲大夫毋百雉之城使仲由為季氏宰將墮三都於是叔孫氏先墮郈季氏將墮費公山不狃叔孫輒率費人襲魯公與三子入于季氏之宮登武子之臺費人攻之弗克入及公側孔子命申句須樂頎下伐之費人北國人追之敗諸姑蔑二子奔齊遂墮費將墮成公斂處父謂孟孫曰墮成齊人必至于北門且成孟氏之保鄣無成是無孟氏也我將弗墮十二月公圍成弗克定公十四年孔子年五十六由大司寇行攝相事有喜色門人曰聞君子禍至不懼福至不喜孔子曰有是言也不曰樂其以貴下人乎於是誅魯大夫亂政者少正卯與聞國政三月粥羔豚者弗飾賈男女行者別於塗塗不拾遺四方之客至乎邑者不求有司皆予之以歸齊人聞而懼曰孔子為政必霸霸則吾地近焉我之為先并矣盍致地焉黎鉏曰請先嘗沮之沮之而不可則致地庸遲乎於是選齊國中女子好者八十人皆衣文衣而舞康樂文馬三十駟遺魯君陳女樂文馬於魯城南高門外季桓子微服往觀再三將受乃語魯君為周道游往觀終日怠於政事子路曰夫子可以行矣孔子曰魯今且郊如致膰乎大夫則吾猶可以止桓子卒受齊女樂三日不聽政郊又不致膰俎於大夫孔子遂行宿乎屯而師己送曰夫子則非罪孔子曰吾歌可夫歌曰彼婦之口可以出走彼婦之謁可以死敗蓋優哉游哉維以卒歲師己反桓子曰孔子亦何言師己以實告桓子喟然歎曰夫子罪我以群婢故也夫孔子遂適衛主於子路妻兄顏濁鄒家衛靈公問孔子居魯得祿幾何對曰奉粟六萬衛人亦致粟六萬居頃之或譖孔子於衛靈公靈公使公孫余假一出一入孔子恐獲罪焉居十月去衛將適陳過匡顏刻為僕以其策指之曰昔吾入此由彼缺也匡人聞之以為魯之陽虎陽虎嘗暴匡人匡人於是遂止孔子孔子狀類陽虎拘焉五日顏淵後子曰吾以汝為死矣顏淵曰子在回何敢死匡人拘孔子益急弟子懼孔子曰文王既沒文不在茲乎天之將喪斯文也後死者不得與于斯文也天之未喪斯文也匡人其如予何孔子使從者為甯武子臣於衛然後得去去即過蒲月餘反乎衛主蘧伯玉家靈公夫人有南子者使人謂孔子曰四方之君子不辱欲與寡君為兄弟者必見寡小君寡小君願見孔子辭謝不得已而見之夫人在絺帷中孔子入門北面稽首夫人自帷中再拜環珮玉聲璆然孔子曰吾鄉為弗見見之禮答焉子路不說孔子矢之曰予所不者天厭之天厭之居衛月餘靈公與夫人同車宦者雍渠參乘出使孔子為次乘招搖市過之孔子曰吾未見好德如好色者也於是醜之去衛過曹是歲魯定公卒孔子去曹適宋與弟子習禮大樹下宋司馬桓魋欲殺孔子拔其樹孔子去弟子曰可以速矣孔子曰天生德於予桓魋其如予何孔子適鄭與弟子相失孔子獨立郭東門鄭人或謂子貢曰東門有人其顙似堯其項類皋陶其肩類子產然自要以下不及禹三寸纍纍若喪家之狗子貢以實告孔子孔子欣然笑曰形狀末也而謂似喪家之狗然哉然哉孔子遂至陳主於司城貞子家歲餘吳王夫差伐陳取三邑而去趙鞅伐朝歌楚圍蔡蔡遷于吳吳敗趙王句踐會稽有隼集于陳廷而死楛矢貫之石砮矢長尺有咫陳湣公使使問仲尼仲尼曰隼來遠矣此肅慎之矢也昔武王克商通道九夷百蠻使各以其方賄來貢使無忘職業於是肅慎貢楛矢石砮長尺有咫先王欲昭其令德以肅慎矢分大姬配虞胡公而封諸陳分同姓以珍玉展親分異姓以遠方職使無忘服故分陳以肅慎矢試求之故府果得之孔子居陳三歲會晉楚爭彊更伐陳及吳侵陳陳常被寇孔子曰歸與歸與吾黨之小子狂簡進取不忘其初於是孔子去陳過蒲會公叔氏以蒲畔蒲人止孔子弟子有公良孺者以私車五乘從孔子其為人長賢有勇力謂曰吾昔從夫子遇難於匡今又遇難於此命也已吾與夫子再罹難寧鬭而死鬭甚疾蒲人懼謂孔子曰苟毋適衛吾出子與之盟出孔子東門孔子遂適衛子貢曰盟可負邪孔子曰要盟也神不聽衛靈公聞孔子來喜郊迎問曰蒲可伐乎對曰可靈公曰吾大夫以為不可今蒲衛之所以待晉楚也以衛伐之無乃不可乎孔子曰其男子有死之志婦人有保西河之志吾所伐者不過四五人靈公曰善然不伐蒲靈公老怠於政不用孔子孔子喟然歎曰苟有用我者朞月而已三年有成孔子行佛肸為中牟宰趙簡子攻范中行伐中矣佛肸畔使人召孔子孔子欲往子路曰由聞諸夫子其身親為不善者君子不入也今佛肸親以中矣畔子欲往如之何孔子曰有是言也不曰堅乎磨而不磷不曰白乎涅而不淄我豈匏瓜也哉焉能繫而不食孔子擊磬有荷蕢而過門者曰有心哉擊磬乎硜硜乎莫己知也夫而已矣孔子學鼓琴師襄子十日不進師襄子曰可以益矣孔子曰丘已習其曲矣未得其數也有閒曰已習其數可以益矣孔子曰丘未得其志也有閒曰已習其志可以益矣孔子曰丘未得其為人也有閒有所穆然深思焉有所怡然高望而遠志焉曰丘得其為人黯然而黑幾然而長眼如望羊如王四國非文其誰能為此也師襄子辟席再拜曰師蓋云文王操也孔子既不得用於衛將西見趙簡子至於河而聞竇鳴犢舜華之死也臨河而歎曰美哉水洋洋乎丘之不濟此命也夫子貢趨而進曰敢問何謂也孔子曰竇鳴犢舜華晉國之賢大夫也趙簡子未得志之時須此兩人而后從政及其已得志殺之乃從政丘聞之也刳胎殺夭則麒麟不至郊竭澤涸漁則蛟龍不合陰陽覆巢毀卵則鳳皇不翔何則君子諱傷其類也夫鳥獸之於不義也尚知辟之而況乎丘哉乃還息乎陬鄉作為陬操以哀之而反乎衛入主蘧伯玉家他日靈公問兵陳孔子曰俎豆之事則嘗聞之軍旅之事未之學也明日與孔子語見蜚鴈仰視之色不在孔子孔子遂行復如陳夏衛靈公卒立孫輒是為衛出公六月趙鞅內太子蒯聵于戚陽虎使太子絻八人衰絰偽自衛迎者哭而入遂居焉冬蔡遷于州來是歲魯哀公三年而孔子年六十矣齊助衛圍戚以衛太子蒯聵在故也夏魯桓釐廟燔南宮敬叔救火孔子在陳聞之曰災必於桓釐廟乎已而果然秋季桓子病輦而見魯城喟然歎曰昔此國幾興矣以吾獲罪於孔子故不興也顧謂其嗣康子曰我即死若必相魯相魯必召仲尼後數日桓子卒康子代立已葬欲召仲尼公之魚曰昔吾先君用之不終終為諸侯笑今又用之不能終是再為諸侯笑康子曰則誰召而可曰必召冉求於是使使召冉求冉求將行孔子曰魯人召求非小用之將大用之也是日孔子曰歸乎歸乎吾黨之小子狂簡斐然成章吾不知所以裁之子贛知孔子思歸送冉求因誡曰即用以孔子為招云冉求既去明年孔子自陳遷于蔡蔡昭公將如吳吳召之也前昭公欺其臣遷州來後將往大夫懼復遷公孫翩射殺昭公楚侵蔡秋齊景公卒明年孔子自蔡如葉葉公問政孔子曰政在來遠附邇他日葉公問孔子於子路子路不對孔子聞之曰由爾何不對曰其為人也學道不倦誨人不厭發憤忘食樂以忘憂不知老之將至云爾去葉反于蔡長沮桀溺耦而耕孔子以為隱者使子路問津焉長沮曰彼執輿者為誰子路曰為孔丘曰是魯孔丘與曰然曰是知津矣桀溺謂子路曰子為誰曰為仲由曰子孔丘之徒與曰然桀溺曰悠悠者天下皆是也而誰以易之且與其從辟人之士豈若從辟世之士哉耰而不輟子路以告孔子孔子憮然曰鳥獸不可與同群天下有道丘不與易也他日子路行遇荷蓧丈人曰子見夫子乎丈人曰四體不勤五穀不分孰為夫子植其杖而芸子路以告孔子曰隱者也復往則亡孔子遷于蔡三歲吳伐陳楚救陳軍于城父聞孔子在陳蔡之閒楚使人聘孔子孔子將往拜禮陳蔡大夫謀曰孔子賢者所刺譏皆中諸侯之疾今者久留陳蔡之閒諸大夫所設行皆非仲尼之意今楚大國也來聘孔子孔子用於楚則陳蔡用事大夫危矣於是乃相與發徒役圍孔子於野不得行絕糧從者病莫能興孔子講誦弦歌不衰子路慍見曰君子亦有窮乎孔子曰君子固窮小人窮斯濫矣子貢色作孔子曰賜爾以予為多學而識之者與曰然非與孔子曰非也予一以貫之孔子知弟子有慍心乃召子路而問曰詩云匪兕匪虎率彼曠野吾道非邪吾何為於此子路曰意者吾未仁邪人之不我信也意者吾未知邪人之不我行也孔子曰有是乎由譬使仁者而必信安有伯夷叔齊使知者而必行安有王子比干子路出子貢入見孔子曰賜詩云匪兕匪虎率彼曠野吾道非邪吾何為於此子貢曰夫子之道至大也故天下莫能容夫子夫子蓋少貶焉孔子曰賜良農能稼而不能為穡良工能巧而不能為順君子能脩其道綱而紀之統而理之而不能為容今爾不脩爾道而求為容賜而志不遠矣子貢出顏回入見孔子曰回詩云匪兕匪虎率彼曠野吾道非邪吾何為於此顏回曰夫子之道至大故天下莫能容雖然夫子推而行之不容何病不容然後見君子夫道之不脩也是吾醜也夫道既已大脩而不用是有國者之醜也不容何病不容然後見君子孔子欣然而笑曰有是哉顏氏之子使爾多財吾為爾宰於是使子貢至楚楚昭王興師迎孔子然後得免昭王將以書社地七百里封孔子楚令尹子西曰王之使使諸侯有如子貢者乎曰無有王之輔相有如顏回者乎曰無有王之將率有如子路者乎曰無有王之官尹有如宰予者乎曰無有且楚之祖封於周號為子男五十里今孔丘述三五之法明周召之業王若用之則楚安得世世堂堂方數千里乎夫文王在豐武王在鎬百里之君卒王天下今孔兵得據土壤賢弟子為佐非楚之福也昭王乃止其秋楚昭王卒于城父楚狂接輿歌而過孔子曰鳳兮鳳兮何德之衰往者不可諫兮來者猶可追也已而已而今之從政者殆而孔子下欲與之言趨而去弗得與之言於是孔子自楚反乎衛是歲也孔子年六十三而魯哀公六年也其明年吳與魯會繒徵百牢太宰嚭召季康子康子使子貢往然後得已孔子曰魯衛之政兄弟也是時衛君輒父不得立在外諸侯數以為讓而孔子弟子多仕於衛衛君欲得孔子為政子路曰衛君待子而為政子將奚先孔子曰必也正名乎子路曰有是哉子之迂也何其正也孔子曰野哉由也夫名不正則言不順言不順則事不成事不成則禮樂不興禮樂不興則刑罰不中刑罰不中則民無所錯手足矣夫君子為之必可名言之必可行君子於其言無所苟而已矣其明年冉有為季氏將師與齊戰於郎克之季康子曰子之於軍旅學之乎性之乎冉有曰學之於孔子季康子曰孔子何如人哉對曰用之有名播之百姓質諸鬼神而無憾求之至於此道雖累千社夫子不利也康子曰我欲召之可乎對曰欲召之則毋以小人固之則可矣而衛孔文子將攻太叔問策於仲尼仲尼辭不知退而命載而行曰鳥能擇木木豈能擇鳥乎文子固止會季康子逐公華公賓公林以幣迎孔子孔子歸魯孔子之去魯凡十四歲而反乎魯魯哀公問政對曰政在選臣季康子問政曰舉直錯諸枉則枉者直康子患盜孔子曰苟子之不欲雖賞之不竊然魯終不能用孔子孔子亦不求仕孔子之時周室微而禮樂廢詩書缺追迹三代之禮序書傳上紀唐虞之際下至秦繆編次其事曰夏禮吾能言之𣏌不足徵也殷禮吾能言之宋不足徵也足則吾能徵之矣觀殷夏所損益曰後雖百世可知也以一文一質周監二代郁郁乎文哉吾從周故書傳禮記自孔氏孔子語魯大師樂其可知也始作翕如縱之純如皦如繹如也以成吾自衛反魯然後樂正雅頌各得其所古者詩三千餘篇及至孔子去其重取可施於禮義上采契后稷中述殷周之盛至幽厲之缺始於衽席故曰關雎之亂以為風始鹿鳴為小雅始文王為大雅始清廟為頌始三百五篇孔子皆弦歌之以求合韶武雅頌之音禮樂自此可得而述以備王道成六藝孔子晚而喜易序彖繫象說卦文言讀易韋編三絕曰假我數年若是我於易則彬彬矣孔子以詩書禮樂教弟子蓋三千焉身通六藝者七十有二人如顏濁鄒之徒頗受業者甚眾孔子以四教文行忠信絕四毋意毋必毋固毋我所慎齊戰疾子罕言利與命與仁不憤不啟舉一隅不以三隅反則弗復也其於鄉黨恂恂似不能言者其於宗廟朝廷辯辯言唯謹爾朝與上大夫言誾誾如也與下大夫言侃侃如也入公門鞠躬如也趨進翼如也君召使儐色勃如也君命召不俟駕行矣魚餒肉敗割不正不食席不正不坐食於有喪者之側未嘗飽也是日哭則不歌見齊衰瞽者雖童子必變三人行必得我師德之不脩學之不講聞義不能徙不善不能改是吾憂也使人歌善則使復之然后和之子不語怪力亂神子貢曰夫子之文章可得聞也夫子言天道與性命弗可得聞也已顏淵喟然歎曰仰之彌高鑽之彌堅瞻之在前忽焉在後夫子循循然善誘人博我以文約我以禮欲罷不能既竭我才如有所立卓爾雖欲從之蔑由也已達巷黨人曰大哉孔子博學而無所成名子聞之曰我何執執御乎執射乎我執御矣牢曰子云不試故藝魯哀公十四年春狩大野叔孫氏車子鉏商獲獸以為不祥仲尼視之曰麟也取之曰河不出圖雒不出書吾已矣夫顏淵死孔子曰天喪予及西狩見麟曰吾道窮矣喟然歎曰莫知我夫子貢曰何為莫知子子曰不怨天不尤人下學而上達知我者其天乎不降其志不辱其身伯夷叔齊乎謂柳下惠少連降志辱身矣謂虞仲夷逸隱居放言行中清廢中權我則異於是無可無不可子曰弗乎弗乎君子病沒世而名不稱焉吾道不行矣吾何以自見於後世哉乃因史記作春秋上至隱公下訖哀公十四年十二公據魯親周故殷運之三代約其文辭而指博故吳楚之君自稱王而春秋貶之曰子踐土之會實召周天子而春秋諱之曰天王狩於河陽推此類以繩當世貶損之義後有王者舉而開之春秋之義行則天下亂臣賊子懼焉孔子在位聽訟文辭有可與人共者弗獨有也至於為春秋筆則筆削則削子夏之徒不能贊一辭弟子受春秋孔子曰後世知丘者以春秋而罪丘者亦以春秋明歲子路死於衛孔子病子貢請見孔子方負杖逍遙於門曰賜汝來何其晚也孔子因歎歌曰太山壞乎梁柱摧乎哲人萎乎因以涕下謂子貢曰天下無道久矣莫能宗予夏人殯於東階周人於西階殷人兩柱閒昨暮予夢坐奠兩柱之閒予始殷人也後七日卒孔子年七十三以魯哀公十六年四月己丑卒哀公誄之曰旻天下弔不憖遺一老俾屏余一人以在位煢煢余在疚嗚呼哀哉尼父毋自律子貢曰君其不沒於魯乎夫子之言曰禮失則昏名失則愆失志為昏失所為愆生不能用死而誄之非禮也稱余一人非名也孔子葬魯城北泗上弟子皆服三年三年心喪畢相訣而去則哭各復盡哀或復留唯子贛廬於冢上凡六年然後去弟子及魯人往從冢而家者百有餘室因命曰孔里魯世世相傳以歲時奉祠孔子冢而諸儒亦講禮鄉飲大射於孔子冢孔子冢大一頃故所居堂弟子內後世因廟藏孔子衣冠琴車書至于漢二百餘年不絕高皇帝過魯以太牢祠焉諸侯卿相至常先謁然後從政孔子生鯉字伯魚伯魚年五十先孔子死伯魚生伋字子思年六十二嘗困於宋子思作中庸子思生白字子上年四十七子上生求字子家年四十五子家生箕字子京年四十六子京生穿字子高年五十一子高生子慎年五十七嘗為魏相子慎生鮒年五十七為陳王涉博士死於陳下鮒弟子襄年五十七嘗為孝惠皇帝博士遷為長沙太守長九尺六寸子襄生忠年五十七忠生武武生延年及安國安國為今皇帝博士至臨淮太守蚤卒安國生卬卬生驩太史公曰詩有之高山仰止景行行止雖不能至然心鄉往之余讀孔氏書想見其為人適魯觀仲尼廟堂車服禮器諸生以時習禮其家余祗迴留之不能去云天下君王至于賢人眾矣當時則榮沒則已焉孔子布衣傳十餘世學者宗之自天子王侯中國言六藝者折中於夫子可謂至聖矣
