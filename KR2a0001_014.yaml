武公滅晉侯湣以寶獻周周命武公為晉君并其地十九十一三二十一十四十六二十三鄭厲公元年厲公亡後十七歲復入十二四十六八晉武公稱并晉已立三十八年不更元因其元年二十葬雍初以人從死十二伐鄧滅之四二十二十五十七二十四二諸侯伐我十三甲辰五十七九三十九武公卒子詭諸立為獻公秦德公元年武公弟十三五二十三十六十八二十五三十四惠王元年取陳后十八十晉獻公詭諸元年二初作伏祠社磔狗邑四門楚堵敖糴元年六二十四十七十九二十六四十五二燕衛伐王王奔溫立子穨十九十一二秦宣公元年二七取衛女文公弟二十五十八二十二十七五十六伐王王奔溫立子穨三二十十二三二三八二十六十九蔡穆侯聤肸元年二十八六十七鄭執我仲父四誅穨入惠王二十一十三四三四九二十七二十二二十九七救周亂入王十八五太子母早死惠后生叔帶二十二十四陳完自陳來奔田常始此也五伐驪戎得姬四作密畤五弟惲殺堵敖自立十二十八二十一厲公子完奔齊三三十鄭文公捷元年十九六二十三公如齊觀社十五六五楚成王惲元年十一二十九二十二四三十一二二十七二十四十六七六二十二三十二十三五曹釐公夷元年三二十一八二十五十七八盡殺故晉侯群公子七三十三三十一二十四六二四二十二九二十六十八九始城絳都八四十四衛懿公赤元年二十五七三五二十三甲寅十賜齊侯命二十七十九十九五十五二二十六八四六二十四十一二十八二十十一十六十六三二十七九五七二十五十二二十九二十一十二太子申生居曲沃重耳居蒲城夷吾居屈驪姬故十一七十七四二十八十六八二十六十三三十二十二十三十二八十八五二十九十一七九二十七十四三十一二十三伐山戎為燕也十四秦成公元年九十九六三十十二八十二十八十五三十二莊公弟叔牙鴆死慶父弒子般季友奔陳立湣公二十四十五二十二十七三十一十三九十一二十九十六魯湣公開元年二十五十六滅魏耿霍始封趙夙耿畢萬魏始此三十一二十一八三十二十四曹昭公元年十二三十十七二慶父殺湣公季友自陳立申為釐公殺慶父二十六十七申生將軍君子知其廢四十二二十二翟伐我公好鶴士不戰滅我國國怨惠公亂滅其後更立黔牟弟衛戴公元年三十三十五二十三三十一十八魯釐公申元年哀姜喪自齊至二十七殺女弟魯莊公夫人淫故十八秦穆公任好元年十三二十三衛文公燬元年戴公弟也三十四十六三十四三十二十九二二十八為衛築楚丘救戎狄伐十九荀息以幣假道于虞以伐虢滅下陽二十四二十四二齊桓公率諸侯為我城楚丘三十五十七四十五三十三甲子二十三二十九與蔡姬共舟蕩公公怒歸蔡姬二十三十五二十五三三十六十八以女故齊伐我五十六燕襄公元年二十一四三十率諸侯伐蔡蔡潰遂伐楚責包茅貢二十一申生以驪姬讒自殺重耳奔蒲夷吾奔屈四迎婦于晉十六齊伐我至陘使屈完盟二十六四三十七十九六十七二二十二五三十一二十二滅虞虢重耳奔狄五十七二十七五三十八二十七十八三二十三六三十二率諸侯伐鄭二十三夷吾奔梁六十八伐許許君肉袒謝楚從之二十八六三十九二十一八十九四二十四七三十三二十四七十九二十九七四十二十二九二十五二十五襄王立畏太叔八三十四二十五伐翟以重耳故八二十三十公疾太子茲父讓兄目夷賢公不聽八四十一二十三曹共公元年二十一六襄王元年諸侯立王九齊率我伐晉亂至高梁還三十五夏會諸侯于葵丘天子使宰孔賜胙命無拜二十六公卒立奚齊里克殺之及卓子立夷吾九夷吾使郤芮賂求入二十一三十一公薨未葬齊桓會葵丘九四十二二十四二二十二七二十三十六使隰朋立晉惠公晉惠公夷吾元年誅里克倍秦約十丕鄭子豹亡來二十二宋襄公茲父元年目夷相十四十三二十五三二十三八三戎伐我太叔帶召之欲誅叔帶叔帶奔齊十一三十七二十一救王伐戎戎去二十三伐黃二十一四十四二十六四二十四有妾夢天與之蘭生穆公蘭九四十二三十八使管仲平戎于周欲以上卿禮讓受下卿三十二二十四三十二四十五二十七五二十五十甲戌五十三三十九使仲孫請王言叔帶王怒四饑請粟秦與我十三丕豹欲無與公不聽輸晉粟起雍至絳二十五四十三陳穆公款元年二十八六二十六十一六十四四十五秦饑請粟晉倍之十四二十六滅六英五十四二二十九七二十七十二七十五五月日有食之不書史官失之四十一六秦虜惠公復立之十五以盜食善馬士得破晉二十七六十五三蔡莊侯甲午元年八二十八十三八十六四十二王以戎寇告齊齊徵諸侯戍周七重耳聞管仲死去翟之齊十六為河東置官司二十八七隕五石六鷁退飛過我都十六四二九二十九十四九十七四十三八十七二十九八十七五三十三十十五十十八齊孝公昭元年九十八三十九十八六四十一三十一十六十一十九二十十九滅梁梁好城不居民罷相驚故亡三十一十十九七五十二三十二十七十二二十三十一二十三十二十一二十八六十三三十三十八十三二十一四十二二十一三十三執宋襄公復歸之十二召楚盟二十一九七十四三十四十九十四叔帶復歸於周二十二五歸王弟帶十三太子圉質秦亡歸二十二三十四十三泓之戰楚敗公二十二十八十五三十五君如楚宋伐我二十甲申十五二十三六伐宋以其不同盟十四圉立為懷公二十三迎重耳於楚厚禮之妻之女重耳願歸三十五重耳過厚禮之十四公疾死泓戰二十三重耳從齊過無禮十一九十六重耳過無禮僖負羈私善三十六重耳過無禮叔詹諫二十一十六王奔汜汜鄭地也二十四七晉文公元年誅子圉魏武子為魏大夫趙衰為原大夫咎犯曰求霸莫如內王二十四以兵送重耳三十六宋成公王臣元年二十四十二十十七三十七二十二十七晉納王二十五八二二十五欲內王軍河上三十七二二十五十三十一十八三十八二十三十八二十六九三宋服二十六三十八三倍楚親晉衛成公鄭元年十四十二十九三十九二十四十九二十七十孝公薨弟潘因衛公子開方殺孝公子立潘四救宋報曹衛恥二十七三十九使子玉伐宋四楚伐我我告急於晉二十五十三二十四十二十五二十王狩河陽二十八公如踐土會朝齊昭公潘元年會晉敗楚朝周王五侵曹伐衛取五鹿執曹伯諸侯敗楚而朝河陽周命賜公土地二十八會晉伐楚朝周四十晉敗子玉于城濮五晉救我楚兵去三晉伐我取五鹿公出奔立公子瑕會晉朝復歸衛十六會晉伐楚朝周王十四會晉伐楚朝周王二十一晉伐我執公復歸之四十一二十六二十一二十九二六二十九四十一六四晉以衛與宋陳共公朔元年十五二十二四十二二十七二十二三十三七聽周歸衛成公與秦圍鄭三十圍鄭有言即去四十二七五周入成公復衛二十六二十三四十三秦晉圍我以晉故二十八二十三三十一四八三十一四十三八六三十七二十四四十四二十九二十四三十二五九文公薨三十二將襲鄭蹇叔曰不可四十四九七四十八二十五四十五文公薨三十甲午二十五三十三僖公薨六狄侵我晉襄公歡元年破秦于殽三十三襲鄭晉敗我殽四十五十八五十九二十六鄭穆公蘭元年秦襲我弦高詐之三十一二十六魯文公興元年七二伐衛衛伐我三十四敗殽將亡歸公復其官四十六王欲殺太子立職太子恐與傅潘崇殺王王欲食熊蹯死不聽自立為王十一九晉伐我我伐晉六二十二十七二三十二二十七二八三秦報我殽敗于汪三十五伐晉報殽敗我于汪楚穆王商臣元年以其太子宅賜崇為相十二十七二十一二十八三三十三二十八三公如晉九四秦伐我取王官我不出三十六以孟明等伐晉晉不敢出二晉伐我十三十一八二十二二十九四三十四二十九四十五伐秦圍邧新城三十七晉伐我圍邧新城三滅江十四十二公如晉九二十三三十五三十五三十五十一六趙成子欒貞子霍伯臼季皆卒三十八四滅六蓼十五十三十二十四三十一六三十六三十一六十二七公卒趙盾為太子少欲更立君恐誅遂立太子為靈公三十九繆公薨葬殉以人從死者百七十人君子譏之故不言卒五十六十四十一二十五三十二七三十七三十二七十三晉靈公夷皋元年趙盾專政秦康公罃元年六十七公孫固殺成公十五十二二十六三十三八三十八三十三襄王崩八王使衛來求金以葬非禮十四二秦伐我取武城報令孤之戰二七宋昭公杵臼元年襄公之子十六十三二十七三十四九三十九頃王元年九十五三率諸侯救鄭三八伐鄭以其服晉二十七十四二十八三十五十楚伐我四十甲辰二十十六四伐秦拔少梁秦取我北徵四晉伐我取少梁我伐晉取北徵九三十八十五二十九曹文公壽元年十一燕桓公元年三十一敗長翟于鹹而歸得長翟十七五五十四敗長翟長丘十九十六三十二十二二四十二十八六秦取我羈馬與秦戰河曲秦師遁六伐晉取羈馬怒與我大戰河曲十一五二十十七三十一三十三三五十三十九七得隨會七晉詐得隨會十二六二十一十八三十二四十四四六頃王崩公卿爭政故不赴十四彗星入北斗周史曰七年宋齊晉君死二十昭公卒弟商人殺太子自立是為懿公八趙盾以車八百乘納捷菑平王室八楚莊王侶元年七二十二陳靈公平國元年三十三五十五五匡王元年十五六月辛丑日蝕齊伐我齊懿公商人元年九我入蔡九二八二十三二三十四晉伐我莊侯薨六齊入我郛十六六二十六二不得民心十十三滅庸九襄夫人使衛伯殺昭公弟鮑立二十四三蔡文侯申元年七十七七三十七齊伐我三伐魯十一率諸侯平宋十一四宋文公鮑元年昭公弟晉率諸侯平我二十五四二八十八八四十八襄仲殺嫡立庶子為宣公四公刖邴歜父而奪閻職妻二人共殺公立桓公子惠公十二十二五二二十六五三九十九九五魯宣公俀元年魯立宣公不正公室卑齊惠公元元年取魯濟西之田十三趙盾救陳宋伐鄭秦共公和元年六伐宋陳以倍我服晉故三楚鄭伐我以我倍楚故也二十七六四十二十與楚侵陳遂侵宋晉使趙盾伐我以倍晉故十甲寅六匡王崩二二王子成父敗長翟十四趙穿殺靈公趙盾使穿迎公子黑臀于周立之趙氏賜公族二七四華元以羊羹故陷於鄭二十八七五十一二十一與宋師戰獲華元十一定王元年三三晉成公黑臀元年伐鄭三八伐陸渾至雒問鼎輕重五贖華元亡歸圍曹二十九八六十二宋圍我二十二華元亡歸十二二四四二四九若敖氏為亂滅之伐鄭六三十九七十三鄭靈公夷元年公子歸生以黿故殺靈公十三三五五三中行桓子荀林父救鄭伐陳五十七三十一十楚伐鄭與我平晉中行桓子距楚救鄭伐我八十四鄭襄公堅元年靈公庶弟楚伐我晉來救十四四六六四與衛侵陳秦桓公元年十一八三十二與晉侵陳十一晉衛侵我九十五二十五五七七五二十二九三十三十二十十六三十六六八七月日蝕八六與魯伐秦獲秦諜殺之絳市六日而蘇三晉伐我獲諜十三伐陳滅舒蓼十三十四十三楚伐我十一十七四燕宣公元年七九九七使桓子伐楚以諸侯師伐陳救鄭成公薨四十四伐鄭晉郤缺救鄭敗我十一三十五十四十二十八五楚伐我晉來救敗楚師八十四月日蝕十公卒崔杼有寵高國逐之奔衛晉景公據元年與宋伐鄭五十五十二衛穆公遫元年齊崔杼來奔十五夏徵舒以其母