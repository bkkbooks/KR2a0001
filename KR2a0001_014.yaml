body:
  text: 十二諸侯年表太史公讀春秋曆譜諜至周厲王未嘗不廢書而歎也曰嗚呼師摯見之矣紂為象箸而箕子唏周道缺詩人本之衽席關雎作仁義陵遲鹿鳴刺焉及至厲王以惡聞其過公卿懼誅而禍作厲王遂奔于彘亂自京師始而共和行政焉是後或力政彊乘弱興師不請天子然挾王室之義以討伐為會盟主政由五伯諸侯恣行淫侈不軌賊臣篡子滋起矣齊晉秦楚其在成周微甚封或百里或五十里晉阻三河齊負東海楚介江淮秦因雍州之固四海迭興更為伯主文武所褒大封皆威而服焉是以孔子明王道干七十餘君莫能用故西觀周室論史記舊聞興於魯而次春秋上記隱下至哀之獲麟約其辭文去其煩重以制義法王道備人事浹七十子之徒口受其傳指為有所刺譏褒諱挹損之文辭不可以書見也魯君子左丘明懼弟子人人異端各安其意失其真故因孔子史記具論其語成左氏春秋鐸椒為楚威王傳為王不能盡觀春秋采取成敗卒四十章為鐸氏微趙孝成王時其相虞卿上采春秋下觀近勢亦著八篇為虞氏春秋呂不韋者秦莊襄王相亦上觀尚古刪拾春秋集六國時事以為八覽六論十二紀為呂氏春秋及如荀卿孟子公孫固韓非之徒各往往捃托春秋之文以著書不可勝紀漢相張蒼曆譜五德上大夫董仲舒推春秋義頗著文焉太史公曰儒者斷其義馳說者騁其辭不務綜其終始曆人取其年月數家隆於神運譜諜獨記世諡其辭略欲一觀諸要難於是譜十二諸侯自共和訖孔子表見春秋國語學者所譏盛衰大指著于篇為成學治古文者要刪焉年周魯齊晉秦楚宋衛陳蔡曹鄭燕吳公元前庚申共和元年厲王子居召公宮是為宣王王少大臣共和行政真公濞十五年一云十四年武公壽十年靖侯宜臼十八年秦仲四年熊勇七年釐公十八年釐侯十四年幽公寧十四年武侯二十三年夷伯二十四年惠侯二十四年二十六十一晉釐侯司徒元年五八十九十五十五二十四二十五二十五三十七十二二六九二十十六十六二十五二十六二十六四十八十三三七十二十一十七十七二十六二十七二十七甲子五十九十四四八楚熊嚴元年二十二十八十八蔡夷侯元年二十八二十八六二十十五五九二二十三十九十九二二十九二十九七二十一十六六十三二十四二十二十三三十三十八二十二十七七十一四二十五二十一二十一四曹幽伯彊元年三十一九二十三十八八十二五二十六二十二二十二五二三十二十二十四十九九十三六二十七二十三二十三六三三十三十一二十五二十十十四七二十八二十四陳釐公孝元年七四三十四十二二十六二十一十一十五八宋惠公覸元年二十五二八五三十五十三二十七二十二十二十六九二二十六三九六三十六十四宣王即位共和罷二十八二十三十三十七十三二十七四十七三十七甲戌宣王元年二十九二十四十四十八楚熊霜元年四二十八五十一八三十八二三十二十五十五十九二五二十九六十二九燕釐侯莊元年三魯武公敖元年二十六十六二十三六三十七十三曹戴伯鮮元年二四二齊厲公無忌元年十七二十一四七三十一八十四二三五三二十八二十二五八三十二九十五三四六四三晉獻侯籍元年二十三六九三十三十十六四五七五四二秦莊公其元年楚熊徇元年十三十四十一十七五六八六五三二二十一三十五十二十八六七九七六四三三十二三十六十三十九七八十八七五四四十三三十七十四二十八九甲申十一九八六五五十四三十八十五二十一九十十二十九七六六十五三十九十六二十二十十一十三魯懿公戲元年齊文公赤元年八七七十六四十十七二十三十一十二十四二二九八八十七四十一十八二十四十二十三十五三三十九九十八四十二十九二十五十三十四十六四四十一十十十九衛武公和元年二十二十六十四十五十七五五穆侯弗生元年十一十一二十二二十一二十七十五十六十八六六二十二十二二十一三二十二二十八十六十七十九七七三十三十三二十二四二十三蔡釐侯所事元年十七十八二十八八四取齊女為夫人十四十四二十三五二十四二十八十九甲午二十一九九五十五十五二十四六二十五三十九二十二十二魯孝公稱元年伯御立為君稱為諸公子云伯御武公孫十六十六十六二十五七二十六四二十鄭桓公友元年始封周宣王母弟二十一二十三二十一七以伐條生太子仇十七十七二十六八二十七五二十一二二十二二十四三十二八十八十八二十七九二十八六二十二三二十三二十五四齊成公說元年九十九十九二十八十二十九七二十三四二十四二十六五二十以千畝戰生仇弟成師二子名反君子譏之後亂二十二十二十九十一三十八二十四五二十五二十七六三十一二十一二十一三十十二三十一九二十五六二十六二十八七四十二二十二二十二三十一宋惠公薨十三三十二十二十六七二十七二十九八五十三二十三楚熊鄂元年宋戴公立元年十四三十三十一二十七八二十八三十九六十四二十四二二十五三十四十二二十八九二十九甲辰三十一十七十五二十五三三十六三十五十三二十九十三十三十二十一周宣王誅伯御立其弟稱是為孝公八十六二十六四四十七三十六十四三十十一三十一三十三十二九十七二十七五五十八陳武公靈元年十五曹惠伯雉元年十二三十二三十四十三齊莊公贖元年十八二十八六六十九二十六二十三三十三三十五十四二十九二十九七七二十三十七三十四三十四三十六十五三二十三十八八二十一四十八四十五三十五三十七十六四二十一三十一九九二十二五