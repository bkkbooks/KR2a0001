吳戰七十九六三五火欲禳之子産曰不如修德四二與楚戰二十一十八二十四二十三五八火十一火十火七四平公薨六火五共公薨三二十二十九地震二十五三十四六九十二十一八曹悼公午元年七燕平公元年四二十三二十齊景公與晏子狩入魯問禮二十六獵魯界因入魯四十五七誅伍奢尚太子建奔宋伍胥奔吳十公毋信詐殺諸公子楚太子建來奔見亂之鄭十三十二九平侯薨靈侯孫東國殺平侯子而自立二八楚太子建從宋來奔二五伍員來奔二十四二十一公如晉至河晉謝之歸日蝕二十七五十六八蔡侯來奔十一十四十三蔡悼侯東國元年奔楚三九三六二十五二十二日蝕二十八六周室亂公平亂立敬王十七九十二十五十四二四十四七敬王元年二十三地震二十九七十八十吳伐敗我十三十六十五吳敗我兵取胡沈三五十一楚建作亂殺之五八公子光敗楚二二十四鸜鵒來巢三十八十九十一吳卑梁人爭桑伐取我鍾離十四十七十六蔡昭侯申元年悼侯弟六十二公如晉請內王六九甲申三二十五公欲誅季氏三桓氏攻公公出居鄆三十一九二十十二十五十八十七二七十三七十四二十六齊取我鄆以處公三十二彗星見晏子曰田氏有德於齊可畏十知櫟趙鞅內王於王城二十一十三欲立子西子西不肯秦女子立為昭王宋景公頭曼元年十九十八三八十四八十一五二十七三十三十一二十二楚昭王珍元年誅無忌以說衆二二十十九四九十五九十二公子光使專諸殺僚自立六二十八公如晉求入晉弗聽處之乾侯三十四十二六卿誅公族分其邑各使其子為大夫二十三二三二十一二十五曹襄公元年十六十吳闔閭元年七二十九公自乾侯如鄆齊侯曰主君公恥之復之乾侯三十五十三二十四三四二十二二十一六二鄭獻公蠆元年十一二八三十三十六十四頃公薨二十五四吳三公子來奔封以扞吳五二十三二十二七三二十二三三公子奔楚九三十一日蝕三十七晉定公午元年二十六五吳伐我六潛六二十四二十三八四三十三四伐楚六潛十晉使諸侯為我築城三十二公卒乾侯三十八二率諸侯為周築城二十七六七二十五二十四九五平公弟通殺襄公自立四十四五十一魯定公宋元年昭公喪自乾侯至三十九三二十八七囊瓦伐吳敗我豫章蔡侯來朝八二十六二十五十朝楚以裘故留曹隱公元年五十五六楚伐我迎擊敗之取楚之居巢十二二四十四二十九八九二十七二十六十一二六十六七甲午十三三四十一五三十九蔡昭侯留三歲得裘故歸十二十八二十七十二與子常裘得歸如晉請伐楚三七十七八十四與晉率諸侯侵楚四四十二六周與我率諸侯侵楚三十一楚包胥請救十吳蔡伐我入郢昭王亡伍子胥鞭平王墓十一二十九與蔡爭長二十八十三與衛爭長楚侵我吳與我伐楚入郢四八十八九與蔡伐楚入郢十五五陽虎執季桓子與盟釋之日蝕四十三七三十二十一秦救至吳去昭王復入十二三十陳懷公柳元年十四曹靖公路元年九十九十十六王子朝之徒作亂故王奔晉六四十四八三十三十二吳伐我番楚恐徙鄀十三三十一二十五二十魯侵我燕簡公元年十一伐楚取番十七劉子迎王晉入王七齊伐我四十五侵衛伐魯九入周敬王三十四十三十四三十二齊侵我三十六三十一二十二十八八陽虎欲伐三桓三桓攻陽虎虎奔陽關四十六魯伐我我伐魯十伐衛三十五十四子西為民泣民亦泣蔡昭侯恐十五三十三晉魯侵伐我四公如吳吳留之因死吳十七四靖公薨十二三十三陳懷公來留之死於吳十九九伐陽虎虎奔齊四十七囚陽虎虎奔晉十一陽虎來奔三十六哀公薨十五十六陽虎來奔三十四陳湣公越元年十八曹伯陽元年十三獻公薨四十四二十十公會齊侯於夾谷孔子相齊歸我地四十八十二秦惠公元年彗星見十六十七三十五二十九二鄭聲公勝元年鄭益弱五十五二十一十一四十九十三二生躁公懷公簡公十七十八三十六三二十三國人有夢衆君子立社宮謀亡曹振鐸請待公孫彊許之二六十六二十二十二齊來歸女樂季桓子受之孔子行五十遺魯女樂十四三十八十九三十七伐曹四二十一四衛伐我三七十七甲辰二十三十三五十一十五趙鞅伐范中行四十九二十三十八孔子來祿之如魯五二十二五四八十八二十四十四五十二十六五二十二十一三十九太子蒯聵出奔六孔子來二十三六公孫彊好射獻鴈君使為司城夢者子行五子産卒九十九伐越敗我傷闔閭指以死二十五十五定公薨日蝕五十三十七六二十一滅胡以吳敗我倍之二十二鄭伐我四十七二十四七六伐宋十吳王夫差元年二十六魯哀公將元年五十四伐晉十八趙鞅圍范中行朝歌齊衛伐我七二十二率諸侯圍蔡二十三四十一伐晉八吳伐我二十五楚伐我以吳怨故八七十一二伐越二十七二五十五輸范中行氏粟十九趙鞅圍范中行鄭來救我敗之八二十三二十四四十二靈公薨蒯聵子輒立晉納太子蒯聵于戚九二十六畏楚私召吳人乞遷于州來州來近吳九八救范中行氏與趙鞅戰於鐵敗我師十二三二十八三地震五十六二十九二十四二十五孔子過宋桓魋惡之衛出公輒元年十二十七十宋伐我九燕獻公元年四二十九四五十七乞救范氏二十一趙鞅拔邯鄲柏人有之十惠公薨二十五二十六二十一二十八大夫共誅昭侯十一十二五三十五五十八景公薨立嬖姬子為太子二十二趙鞅敗范中行中行奔齊伐衛秦悼公元年二十六二十七三晉伐我救范氏故十二蔡成侯朔元年十二十一三六三十一六齊晏孺子元年田乞詐立陽生殺孺子二十三二二十七救陳王死城父二十八伐曹四十三吳伐我楚來救二十三宋伐我十二四七伐陳三十二七公會吳王于繒吳徵百牢季康子使子貢謝之齊悼公陽生元年二十四侵衛三楚惠王章元年二十九侵鄭圍曹五晉侵我十四三十四宋圍我鄭救我十三五八魯會我繒甲寅三十三八吳為邾伐我至城下盟而去齊取我三邑二伐魯取三邑二十五四二子西召建子勝於吳為白公三十曹倍我我滅之六十五四十五宋滅曹虜伯陽十四六九伐魯三十四九三二十六五三伐陳陳與吳故三十一鄭圍我敗之于雍丘七十六倍楚與吳成五十五圍宋敗我師雍丘伐我七十三十五十與吳伐齊四吳魯伐我鮑子殺悼公齊人立其子壬為簡公二十七使趙鞅伐齊六四伐陳三十二伐鄭八孔子自陳來十七六十六八十一與魯伐齊救陳誅五員三十六十一齊伐我冉有言故迎孔子孔子歸齊簡公元年魯與吳敗我二十八七五三十三九孔子歸魯十八七十七九十二與魯敗齊三十七十二與吳會橐皋用田賦二二十九八六白公勝數請子西伐鄭以父怨故三十四十公如晉與吳會橐皋十九八十八宋伐我十十三與魯會橐皋三十八十三與吳會黃池三三十與吳會黃池爭長九七伐陳三十五鄭敗我師十一二十九十九敗宋師十一十四與晉會黃池三十九十四西狩獲麟衛出公來奔四田常殺簡公立其弟驁為平公常相之專國權三十一十八三十六十二父蒯聵入輒出亡二十一十二十十二十五四十十五子服景伯使齊子貢為介齊歸我侵地齊平公驁元年景公孫也齊自是稱田氏三十二十一九三十七熒惑守心子韋曰善衛莊公蒯聵元年二十二十一二十一十三十六四十一十六孔子卒二三十三十二十白公勝殺令尹子西攻惠王葉公攻白公白公自殺惠王復國三十八二二十三楚滅陳殺湣公十二二十二十四十七四十二十七三三十四十三十一三十九三莊公辱戎州人戎州人與趙簡子攻莊公出奔十三二十三十五十八越敗我甲子四十三敬王崩十八二十七卒四二十五卒三十五三十七卒十四卒子厲共公立十二五十七卒四十六十四卒衛君起元年石傅逐起出輒復入十四十九卒二十四三十八卒十六二十八卒十九二十三卒
