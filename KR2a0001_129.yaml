body:
  text: 貨殖列傳第六十九老子曰至治之極鄰國相望雞狗之聲相聞民各甘其食美其服安其俗樂其業至老死不相往來必用此為務挽近世塗民耳目則幾無行矣太史公曰夫神農以前吾不知已至若詩書所述虞夏以來耳目欲極聲色之好口欲窮芻豢之味身安逸樂而心誇矜藝能之榮使俗之漸民久矣雖戶説以眇論終不能化故善者因之其次利道之其次教誨之其次整齊之最下者與之爭夫山西饒材竹穀纑旄玉石山東多魚鹽漆絲聲色江南出楠梓薑柱金錫連丹沙犀玳瑁珠璣齒革龍門碣石北多馬牛羊旃裘筋角銅鐵則千里往往山出棊置此其大較也皆中國人民所喜好謠俗被服飲食奉生送死之具也故待農而食之虞而出之工而成之商而通之此寧有政教發徵期會哉人各任其能竭其力以得所欲故物賤之徵貴貴之徵賤各勸其業樂其事若水之趨下日夜無休時不召而自來不求而民出之豈非道之所符而自然之驗邪周書曰農不出則乏其食工不出則乏其事商不出則三寶絶虞不出則財匱少財匱少而山澤不辟矣此四者民所衣食之原也原大則饒原小則鮮上則富國下則富家貧富之道莫之奪豫而巧者有餘拙者不足故太公望封於營丘地潟鹵人民寡於是太公勸其女功極技巧通魚鹽則人物歸之繈至而輻湊故齊冠帶衣履天下海岱之間斂袂而往朝焉其後齊中衰管子修之設輕重九府則桓公以霸九合諸侯一匡天下而管氏亦有三歸位在陪臣富於列國之君是以齊富強至於威宣也故曰倉廩實而知禮節衣食足而知榮辱禮生於有而廢於無故君子富好行其德小人富以適其力淵深而魚生之山深而獸往之人富而仁義附焉富者得藝益彰失藝則客無所之以而不樂夷狄益甚諺曰千金之子不死於市此非空言也故曰天下熙熙皆為利來天下壤壤皆為利往夫千乘之王萬家之侯百室之君尚猶患貧而況匹夫編戶之民乎昔者越王句踐困於會稽之上乃用范蠡計然計然曰知鬭則修備時用則知物二者形則萬貨之情可得而觀已故歲在金穰水毀木飢火旱旱則資舟水則資車物之理也六歲穰六歲旱十二歲一大飢夫糶二十病農九十病末末病則財不出農病則草不辟矣上不過八十下不減三十則農末俱利平糶齊物關市不乏治國之道也積著之理務完物無息幣以物相貿易腐敗而食之貨勿留無敢居貴論其有餘不足則知貴賤貴上極則反賤賤下極則反貴貴出如糞土賤取如珠玉財幣欲其行如流水修之十年國富厚賂戰士士赴矢石如渴得飲遂報強吳觀兵中國稱號五霸范蠡既雪會稽之恥乃喟然而歎曰計然之策七越用其五而得意既已施於國吾欲用之家乃乘扁舟浮於江湖變名易姓適齊為鴟夷子皮之陶為朱公朱公以為陶天下之中諸侯四通貨物所交易也乃治産積居與時逐而不責於人故善治生者能擇人而任時十九年之中三致千金再分散與貧交疏昆弟此所謂富好行其德者也後年衰老而聽子孫子孫修業而息之遂至巨萬故言富者皆稱陶朱公子贛既學於仲尼退而仕於衛廢著鬻財於曹魯之間七十子之徒賜最為饒益原憲不厭糟粳匿於窮巷子貢結駟連騎束帛之幣以聘享諸侯所至國君無不分庭與之抗禮夫使孔子名布揚於天下者子貢先後之也此所謂得藝而益彰者乎白圭周人也當魏文侯時李克務盡地力而白圭樂觀時變故人棄我取人取我與夫歲孰取穀豫之絲漆繭出取帛絮豫之食太陰在卯穰明歲衰惡至午旱明歲美至酉穰明歲衰惡至子大旱明歲美有水至卯積著率歲倍欲長錢取下穀長石斗取上種能薄飲食忍嗜欲節衣服與用事僮僕同苦樂趨時若猛獸摯鳥之發故曰吾治生産猶伊尹呂尚之謀孫吳用兵商鞅行法是也是故其智不足與權變勇不足以決斷仁不能以取豫強不能有所守雖欲學吾術終不告之矣蓋天下言生治祖白圭白圭其有所試矣能試有所長非苟而已也猗頓用盬鹽起而邯鄲郭縱以鐵冶成業與王者埒富烏氏倮畜牧及衆斥賣求奇繪物間獻遺戎王戎王什倍其償與之畜畜至用谷量馬牛秦始皇帝令倮比封君以時與列臣朝請而巴寡婦清其先得丹穴而擅其利數世家亦不訾清寡婦也能守其業用財自衛不見侵犯秦皇帝以為貞婦而客之為築女懷清臺夫倮鄙人牧長清窮鄉寡婦禮抗萬乘名顯天下豈非以富邪漢興海內為一開關梁弛山澤之禁是以富商大賈周流天下交易之物莫不通得其所欲而徙豪傑諸侯強族於京師關中自汧雍以東至河華膏壤沃野千里自虞夏之貢以為上田而公劉適邠大王王季在岐文王作豐武王治鎬故其民猶有先王之遺風好稼穡殖五穀地重重為邪及秦文德繆居雍隙隴蜀之貨物而多賈獻公徙櫟邑櫟邑北卻戎翟東通三晉亦多大賈孝昭治咸陽因以漢都長安諸陵四方輻湊並至而會地小人衆故其民益玩巧而事末也南則巴蜀巴蜀亦沃野地饒巵薑丹沙石銅鐵竹木之器南御滇僰僰僮西近邛笮笮馬旄牛然四塞棧道千里無所不通唯褒斜綰轂其口以所多易所鮮天水隴西北地上郡與關中同俗然西有羌中之利北有戎翟之畜畜牧為天下饒然地亦窮險唯京師要其道故關中之地於天下三分之一而人衆不過什三然量其富什居其六昔唐人都河東殷人都河內周人都河南夫三河在天下之中若鼎足王者所更居也建國各數百千歲土地小狹民人衆都國諸侯所聚會故其俗纖儉習事楊平陽陳西賈秦翟北賈種代種代石北也地邊胡數被寇人民矜懻忮好氣任俠為姦不事農商然迫近北夷師旅亟往中國委輸時有奇羡其民羯羠不均自全晉之時固已患其僄悍而武靈王益厲之其謠俗猶有趙之風也故楊平陽陳掾其間得所欲溫軹西賈上黨北賈趙中山中山地薄人衆猶有沙丘紂淫地餘民民俗悁急仰機利而食丈夫相聚遊戲悲歌慷慨起則相隨椎剽休則掘冢巧姦冶多美物為倡優女子則鼓鳴瑟跕屣遊媚貴富入後宮遍諸侯然邯鄲亦漳河之間一都會也北通燕涿南有鄭衛鄭衛俗與趙相類然近梁魯微重而矜節濮上之邑徙野王野王好氣任俠衛之風也夫燕亦勃碣之間一都會也南通齊趙東北邊胡上谷至遼東地踔遠人民希數被寇大與趙代俗相類而民雕捍少慮有魚鹽棗栗之饒北鄰烏桓夫餘東綰穢貉朝鮮真番之利洛陽東賈齊魯南賈梁楚故泰山之陽則魯其陰則齊齊帶山海膏壤千里宜桑麻人民多文綵布帛魚鹽臨災亦海岱之間一都會也其俗寬緩闊達而足智好議論地重難動搖怯於衆鬭勇於持刺故多劫人者大國之風也其中具五民而鄒魯濱洙泗猶有周公遺風俗好儒備於禮故其民齪齪頗有桑麻之業無林澤之饒地小人衆儉嗇畏罪遠邪及其衰好賈趨利甚於周人夫自鴻溝以東芒碭以北屬巨野此梁宋也陶睢陽亦一都會也昔堯作於成陽舜漁於雷澤湯止于亳其俗猶有先王遺風重厚多君子好稼穡雖無山川之饒能惡衣食致其蓄藏越楚則有三俗夫自淮北沛陳汝南南郡此西楚也其俗剽輕易發怒地薄寡於積聚江陵故郢都西通巫巴東有雲夢之饒陳在楚夏之交通魚鹽之貨其民多賈徐僮取慮則清刻矜己諾彭城以東東海吳廣陵此東楚也其俗類徐僮朐繒以北俗則齊浙江南則越夫吳自闔廬春申王濞三人招致天下之喜遊子弟東有海鹽之饒章山之銅三江五湖之利亦江東一都會也衡山九江江南豫章長沙是南楚也其俗大類西楚郢之後徙壽春亦一都會也而合肥受南北潮皮革鮑木輸會也與閩中干越雜俗故南楚好辭巧説少信江南卑溼丈夫早夭多竹木豫章出黃金長沙出連錫然堇堇物之所有取之不足以更費九疑蒼梧以南至儋耳者與江南大同俗而楊越多焉番禺亦其一都會也珠璣犀玳瑁果布之湊潁川南陽夏人之居也夏人政尚忠朴猶有先王之遺風潁川敦願秦末世遷不軌之民於南陽南陽西通武關鄖關東南受漢江淮宛亦一都會也俗雜好事業多賈其任俠交通潁川故至今謂之夏人夫天下物所鮮所多人民謠俗山東食海鹽山西食鹽鹵領南沙北固往往出鹽大體如此矣總之楚越之地地廣人希飯稻羹魚或火耕而水耨果隋螺蛤不待賈而足地藝饒食無飢饉之患以故呰窳偷生無積聚而多貧是故江淮以南無凍餓之人亦無千金之家沂泗水以北宜五穀桑麻六畜地小人衆數被水旱之害民好畜藏故秦夏梁魯好農而重民三河宛陳亦然加以商賈齊趙設智巧仰機利燕代田畜而事蠶由此觀之賢人深謀於廊廟論議朝廷守信死節隱居巖穴之士設為名高者安歸乎歸於富厚也是以廉吏久久更富廉賈歸富富者人之情性所不學而俱欲者也故壯士在軍攻城先登陷陳卻敵斬將搴旗前蒙矢石不避湯火之難者為重賞使也其在閭巷少年攻剽椎埋劫人作姦掘冢鑄幣任俠并兼借交報仇篡逐幽隱不避法禁走死地如騖者其實皆為財用耳今夫趙女鄭姬設形容揳鳴琴揄長袂躡利屣目挑心招出不遠千里不擇老少者奔富厚也遊間公子飾冠劍連車騎亦為富貴容也弋射漁獵犯晨夜冒霜雪馳坑谷不避猛獸之害為得味也博戲馳逐鬭雞走狗作色相矜必爭勝者重失負也醫方諸食技術之人焦神極能為重糈也吏士舞文弄法刻章偽書不避刀鋸之誅者沒於賂遺也農工商賈畜長固求富益貨也此有知盡能索耳終不餘力而讓財矣諺曰百里不販樵千里不販糴居之一歲種之以穀十歲樹之以木百歲來之以德德者人物之謂也今有無秩祿之奉爵邑之入而樂與之比者命曰素封封者食租稅歲率戶二百千戶之君則二十萬朝覲聘享出其中庶民農工商賈率亦歲萬息二千百萬之家則二十萬而更徭租賦出其中衣食之欲恣所好美矣故曰陸地牧馬二百蹄牛蹄角千千足羊澤中千足彘水居千石魚陂山居千章之材安邑千樹棗燕秦千樹栗蜀漢江陵千樹橘淮北常山已南河濟之間千樹萩陳夏千畝漆齊魯千畝桑麻渭川千畝竹及名國萬家之城帶郭千畝畝鍾之田若千畝巵茜千畦薑韭此其人皆與千戶侯等然是富給之資也不窺市井不行異邑坐而待收身有處士之義而取給焉若至家貧親老妻子軟弱歲時無以祭祀進醵飲食被服不足以自通如此不慚恥則無所比矣是以無財作力少有鬭智既饒爭時此其大經也今治生不待危身取給則賢人勉焉是故本富為上末富次之姦富最下無巖處奇士之行而長貧賤好語仁義亦足羞也凡編戶之民富相什則卑下之伯則畏憚之千則役萬則僕物之理也夫用貧求富農不如工工不如商刺繡文不如倚市門此言末業貧者之資也通邑大都酤一歲千釀醯醬千瓨漿千甔屠牛羊彘千皮販穀糶千鍾薪稿千車船長千丈木千章竹竿萬個其軺車百乘牛車千兩木器髤者千杖銅器千鈞素木鐵器若巵茜千石馬蹄躈千牛千足羊彘千雙僮手指千筋角丹沙千斤其帛絮細布千鈞文采千匹榻布皮革千石漆千斗糱麴鹽豉千答鮐鮆千斤鯫千石鮑千鈞棗栗千石者三之狐鼦裘千皮羔羊裘千石旃席千具他果菜千鍾子貸金錢千貫節駔會貪賈三之廉賈五之此亦比千乘之家其大率也他雜業不中什二則非吾財也請略道當世千里之中賢人所以富者令後世得以觀擇焉蜀卓氏之先趙人也用鐵冶富秦破趙遷卓氏卓氏見虜略獨夫妻推輦行詣遷處諸遷虜少有餘財爭與吏求近處處葭萌唯卓氏曰此地狹薄吾聞汶山之下沃野下有蹲鴟至死不飢民工於市易賈乃求遠遷致之臨邛大喜即鐵山鼓鑄運籌策傾滇蜀之民富至僮千人田池射獵之樂擬於人君程鄭山東遷虜也亦冶鑄賈椎髻之民富埒卓氏俱居臨邛宛孔氏之先梁人也用鐵冶為業秦伐魏遷孔氏南陽大鼓鑄規陂池連車騎遊諸侯因通商賈之利有遊間公子之賜與名然其贏得過當愈於纖嗇家致富數千金故南陽行賈盡法孔氏之雍容魯人俗儉嗇而曹邴氏尤甚以鐵冶起富至巨萬然家自父兄子孫約俯有拾仰有取貰貸行賈遍郡國鄒魯以其故多去文學而趨利者以曹邴氏也齊俗賤奴虜而刀間獨愛貴之桀黠奴人之所患也唯刀間收取使之逐漁鹽商賈之利或連車騎交守相然愈益任之終得其力起富數千萬故曰寧爵毋刀言其能使豪奴自饒而盡其力周人既纖而師史尤甚轉轂以百數賈郡國無所不至洛陽街居在齊秦楚趙之中貧人學事富家相矜以久賈數過邑不入門設任此等故師史能致七千萬宣曲任氏之先為督道倉吏秦之敗也豪傑皆爭取金玉而任氏獨窖倉粟楚漢相距滎陽也民不得耕種米石至萬而豪傑金玉盡歸任民任氏以此起富富人爭奢侈而任氏折節為儉力田畜田畜人爭取賤賈任氏獨取貴善富者數世然任公家約非田畜所出弗衣食公事不畢則身不得飲酒食肉以此為閭里率故富而主上重之塞之斥也唯橋姚已致馬千匹牛倍之羊萬頭粟以萬鍾計吳楚七國兵起時長安中列侯封君行從軍旅齎貸子錢子錢家以為侯邑國在關東關東成敗未決莫肯與唯無鹽氏出捐千金貸其息什之三月吳楚平一歲之中則無鹽氏之息什倍用此富埒關中關中富商大賈大抵盡諸田田嗇田蘭韋家栗氏安陵杜杜氏亦巨萬此其章章尤異者也皆非有爵邑奉祿弄法犯姦而富盡椎埋去就與時俯仰獲其贏利以末致財用本守之以武一切用文持之變化有概故足術也若至力農畜工虞商賈為權利以成富大者傾郡中者傾縣下者傾鄉里者不可勝數夫纖嗇筋力治生之正道也而富者必用奇勝田農掘業而秦揚以蓋一州掘冢姦事也而田叔以起博戲惡業也而桓發用富行賈丈夫賤行也而雍樂成以饒販脂辱處也而雍伯千金賣漿小業也而張氏千萬灑削薄技也而郅氏鼎食胃脯簡微耳濁氏連騎馬醫淺方張里擊鍾此皆誠一之所致由是觀之富無經業則貨無常主能者輻湊不肖者瓦解千金之家比一都之君巨萬者乃與王者同樂豈所謂素封者邪非也
