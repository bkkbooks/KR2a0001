body:
  text: 東越列傳第五十四閩越王無諸及越東海王搖者其先皆越王句踐之後也姓騶氏秦已并天下皆廢為君長以其地為閩中郡及諸侯畔秦無諸搖率越歸鄱陽令吳芮所謂鄱君者也從諸侯滅秦當是之時項籍主命弗王以故不附楚漢擊項籍無諸搖率越人佐漢漢五年復立無諸為閩越王王閩中故地都東冶孝惠三年舉高帝時越功曰閩君搖功多其民便附乃立搖為東海王都東甌世俗號為東甌王後數世至孝景三年吳王濞反欲從閩越閩越未肯行獨東甌從吳及吳破東甌受漢購殺吳王丹徒以故皆得不誅歸國吳王子子駒亡走閩越怨東甌殺其父常勸閩越擊東甌至建元三年閩越發兵圍東甌東甌食盡困且降乃使人告急天子天子問太尉田蚡蚡對曰越人相攻擊固其常又數反覆不足以煩中國往救也自秦持棄弗屬於是中大夫莊助詰蚡曰特患力弗能救德弗能覆誠能何故棄之且秦舉咸陽而棄之何乃越也今小國以窮困來告急天子天子弗振彼當安所告訴又何以子萬國乎上曰太尉未足與計吾初即位不欲出虎符發兵郡國乃遣莊助以節發兵會稽會稽太守欲距不為發兵助乃斬一司馬諭意指遂發兵浮海救東甌未至閩越引兵而去東甌請舉國徙中國乃悉舉衆來處江淮之間至建元六年閩越擊南越南越守天子約不敢擅發兵擊而以聞上遣大行王恢出豫章大農韓安國出會稽皆為將軍兵未踰嶺閩越王郢發兵距險其弟餘善乃與相宗族謀曰王以擅發兵擊南越不請故天子兵來誅今漢兵衆強今即幸勝之後來益多終滅國而止今殺王以謝天子天子聽罷兵固一國完不聽乃力戰不勝即亡入海皆曰善即鏦殺王使使奉其頭致大行大行曰所為來者誅王今王頭至謝罪不戰而耘利莫大焉乃以便宜案兵告大農軍而使使奉王頭馳報天子詔罷兩將兵曰郢等首惡獨無諸孫繇君丑不與謀焉乃使郎中將立丑為越繇王奉閩越先祭祀餘善已殺郢威行於國國民多屬竊自立為王繇王不能矯其衆持正天子聞之為餘善不足復興師曰餘善數與郢謀亂而後首誅郢師得不勞因立餘善為東越王與繇王並處至元鼎五年南越反東越王餘善上書請以卒八千人從樓船將軍擊呂嘉等兵至揭揚以海風波為解不行持兩端陰使南越及漢破番禺不至是時樓船將軍楊僕使使上書願便引兵擊東越上曰士卒勞倦不許罷兵令諸校屯豫章梅領待命元鼎六年秋餘善聞樓船請誅之漢兵臨境且往乃遂反發兵距漢道號將軍騶力等為吞漢將軍入白沙武林梅嶺殺漢三校尉是時漢使大農張成故山州侯齒將屯弗敢擊卻就便處皆坐畏懦誅餘善刻武帝璽自立詐其民為妄言天子遣橫海將軍韓説出句章浮海從東方往樓船將軍楊僕出武林中尉王溫舒出梅嶺越侯為戈船下瀨將軍出若邪白沙元封元年冬咸入東越東越素發兵距險使徇北將軍守武林敗樓船軍數校尉殺長吏樓船將軍率錢唐轅終古斬徇北將軍為禦兒侯自兵未往故越衍侯吳陽前在漢漢使歸諭餘善餘善弗聽及橫海將軍先至越衍侯吳陽以其邑七百人反攻越軍於漢陽從建成侯敖與其率從繇王居股謀曰餘善首惡劫守吾屬今漢兵至衆強計殺餘善自歸諸將儻幸得脫乃遂俱殺餘善以其衆降橫海將軍故封繇王居股為東成侯萬戶封建成侯敖為開陵侯封越衍侯吳陽為北石侯封橫海將軍説為案道侯封橫海校尉福為繚嫈侯福者成陽共王子故為海常坐法失侯舊從軍無功以宗室故侯諸將皆無成功莫封東越將多軍漢兵至棄其軍降封為無錫侯於是天子曰東越狹多阻閩越悍數反覆詔軍吏皆將其民徙處江淮間東越地遂虛太史公曰越雖蠻夷其先豈嘗有大功德於民哉何其久也歷數代常為君王句踐一稱伯然餘善至大逆滅國遷衆其先苗裔繇王居股等猶尚封為萬戶侯由此知越世世為公侯矣蓋禹之餘烈也
