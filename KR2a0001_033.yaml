body:
  text: 魯周公世家第三周公旦者周武王弟也自文王在時旦為子孝篤仁異於群子及武王即位旦常輔翼武王用事居多武王九年東伐至盟津周公輔行十一年伐紂至牧野周公佐武王作牧誓破殷入商宮已殺紂周公把大鉞召公把小鉞以夾武王釁社告紂之罪于天及殷民釋箕子之囚封紂子武庚祿父使管叔蔡叔傅之以續殷祀徧封功臣同姓戚者封周公旦於少昊之虛曲阜是為魯公周公不就封留佐武王武王克殷二年天下未集武王有疾不豫群臣懼太公召公乃繆卜周公曰未可以戚我先王周公於是乃自以為質設三壇周公北面立戴璧秉圭告于太王王季文王史策祝曰惟爾元孫王發勤勞阻疾若爾三王是有負子之責於天以旦代王發之身旦巧能多材多蓺能事鬼神乃王發不如旦多材多蓺不能事鬼神乃命于帝庭敷佑四方用能定汝子孫于下地四方之民罔不敬畏無墜天之降葆命我先王亦永有所依歸今我其即命於元龜爾之許我我以其璧與圭歸以俟爾命爾不許我我乃屏璧與圭周公已令史策告太王王季文王欲代武王發於是乃即三王而卜卜人皆曰吉發書視之信吉周公喜開籥乃見書遇吉周公入賀武王曰王其無害旦新受命三王維長終是圖茲道能念予一人周公藏其策金縢匱中誡守者勿敢言明日武王有瘳其後武王既崩成王少在強葆之中周公恐天下聞武王崩而畔周公乃踐阼代成王攝行政當國管叔及其群弟流言於國曰周公將不利於成王周公乃告太公望召公奭曰我之所以弗辟而攝行政者恐天下畔周無以告我先王太王王季文王三王之憂勞天下久矣於今而后成武王蚤終成王少將以成周我所以為之若此於是卒相成王而使其子伯禽代就封於魯周公戒伯禽曰我文王之子武王之弟成王之叔父我於天下亦不賤矣然我一沐三捉髮一飯三吐哺起以待士猶恐失天下之賢人子之魯慎無以國驕人管蔡武庚等果率淮夷而反周公乃奉成王命興師東伐作大誥遂誅管叔殺武庚放蔡叔收殷餘民以封康叔於衛封微子於宋以奉殷祀寧淮夷東土二年而畢定諸侯咸服宗周天降祉福唐叔得禾異母同穎獻之成王成王命唐叔以餽周公於東土作餽禾周公既受命禾嘉天子命作嘉禾東土以集周公歸報成王乃為詩貽王命之曰鴟鴞王亦未敢訓周公成王七年二月乙未王朝步自周至豐使太保召公先之雒相土其三月周公往營成周雒邑卜居焉曰吉遂國之成王長能聽政於是周公乃還政於成王成王臨朝周公之代成王治南面倍依以朝諸侯及七年後還政成王北面就臣位匑匑如畏然初成王少時病周公乃自揃其蚤沈之河以祝於神曰王少未有識奸神命者乃旦也亦藏其策於府成王病有瘳及成王用事人或譖周公周公奔楚成王發府見周公禱書乃泣反周公周公歸恐成王壯治有所淫佚乃作多士作毋逸毋逸稱為人父母為業至長久子孫驕奢忘之以亡其家為人子可不慎乎故昔在殷王中宗嚴恭敬畏天命自度治民震懼不敢荒寧故中宗饗國七十五年其在高宗久勞于外為與小人作其即位乃有亮闇三年不言言乃讙不敢荒寧密靖殷國至于小大無怨故高宗饗國五十五年其在祖甲不義惟王久為小人于外知小人之依能保施小民不侮鰥寡故祖甲饗國三十三年多士稱曰自湯至于帝乙無不率祀明德帝無不配天者在今後嗣王紂誕淫厥佚不顧天及民之從也其民皆可誅文王日中昃不暇食饗國五十年作此以誡成王成王在豐天下已安周之官政未次序於是周公作周官官別其宜作立政以便百姓百姓說周公在豐病將沒曰必葬我成周以明吾不敢離成王周公既卒成王亦讓葬周公於畢從文王以明予小子不敢臣周公也周公卒後秋未穫暴風雷禾盡偃大木盡拔周國大恐成王與大夫朝服以開金縢書王乃得周公所自以為功代武王之說二公及王乃問史百執事史百執事曰信有昔周公命我勿敢言成王執書以泣曰自今後其無繆卜乎昔周公勤勞王家惟予幼人弗及知今天動威以彰周公之德惟朕小子其迎我國家禮亦宜之王出郊天乃雨反風禾盡起二公命國人凡大木所偃盡起而築之歲則大孰於是成王乃命魯得郊祭文王魯有天子禮樂者以襃周公之德也周公卒子伯禽固已前受封是為魯公魯公伯禽之初受封之魯三年而後報政周公周公曰何遲也伯禽曰變其俗革其禮喪三年然後除之故遲太公亦封於齊五月而報政周公周公曰何疾也曰吾簡其君臣禮從其俗為也及後聞伯禽報政遲乃歎曰嗚呼魯後世其北面事齊矣夫政不簡不易民不有近平易近民民必歸之伯禽即位之後有管蔡等反也淮夷徐戎亦並興反於是伯禽率師伐之於肸作肸誓曰陳爾甲冑無敢不善無敢傷牿馬牛其風臣妾逋逃勿敢越逐敬復之無敢寇攘踰牆垣魯人三郊三隧歭爾芻茭糗糧楨榦無敢不逮我甲戌築而征徐戎無敢不及有大刑作此肸誓遂平徐戎定魯魯公伯禽卒子考公酋立考公四年卒立弟熙是謂煬公煬公築茅闕門六年卒子幽公宰立幽公十四年幽公弟㵒殺幽公而自立是為魏公魏公五十年卒子厲公擢立厲公三十七年卒魯人立其弟具是為獻公獻公三十二年卒子真公濞立真公十四年周厲王無道出奔彘共和行政二十九年周宣王即位三十年真公卒弟敖立是為武公武公九年春武公與長子括少子戲西朝周宣王宣王愛戲欲立戲為魯太子周之樊仲山父諫宣王曰廢長立少不順不順必犯王命犯王命必誅之故出令不可不順也令之不行政之不立行而不順民將棄上夫下事上少事長所以為順今天子建諸侯立其少是教民逆也若魯從之諸侯效之王命將有所壅若弗從而誅之是自誅王命也誅之亦失不誅亦失王其圖之宣王弗聽卒立戲為魯太子夏武公歸而卒戲立是為懿公懿公九年懿公兄括之子伯御與魯人攻弒懿公而立伯御為君伯御即位十一年周宣王伐魯殺其君伯御而問魯公子能道順諸侯者以為魯後樊穆仲曰魯懿公弟稱肅恭明神敬事耆老賦事行刑必問於遺訓而咨於固實不干所問不犯所咨宣王曰然能訓治其民矣乃立稱於夷宮是為孝公自是後諸侯多畔王命孝公二十五年諸侯畔周犬戎殺幽王秦始列為諸侯二十七年孝公卒子弗湟立是為惠公惠公三十年晉人弒其君昭侯四十五年晉人又弒其君孝侯四十六年惠公卒長庶子息攝當國行君事是為隱公初惠公適夫人無子公賤妾聲子生子息息長為娶於宋宋女至而好惠公奪而自妻之生子允登宋女為夫人以允為太子及惠公卒為允少故魯人共令息攝政不言即位隱公五年觀漁於棠八年與鄭易天子之太山之邑祊及許田君子譏之十一年冬公子揮諂謂隱公曰百姓便君君其遂立吾請為君殺子允君以我為相隱公曰有先君命吾為允少故攝代今允長矣吾方營菟裘之地而老焉以授子允政揮懼子允聞而反誅之乃反譖隱公於子允曰隱公欲遂立去子子其圖之請為子殺隱公子允許諾十一月隱公祭鍾巫齊于社圃館于蒍氏揮使人弒隱公于蒍氏而立子允為君是為桓公桓公元年鄭以璧易天子之許田二年以宋之賂鼎入於太廟君子譏之三年使揮迎婦于齊為夫人六年夫人生子與桓公同日故名曰同同長為太子十六年會于曹伐鄭入厲公十八年春公將有行遂與夫人如齊申繻諫止公不聽遂如齊齊襄公通桓公夫人公怒夫人夫人以告齊侯夏四月丙子齊襄公饗公公醉使公子彭生抱魯桓公因命彭生摺其脅公死于車魯人告于齊曰寡君畏君之威不敢寧居來脩好禮禮成而不反無所歸咎請得彭生以除醜於諸侯齊人殺彭生以說魯立太子同是為莊公莊公母夫人因留齊不敢歸魯莊公五年冬伐衛內衛惠公八年齊公子糾來奔九年魯欲內子糾於齊後桓公桓公發兵擊魯魯急殺子糾召忽死齊告魯生致管仲魯人施伯曰齊欲得管仲非殺之也將用之用之則為魯患不如殺以其屍與之莊公不聽遂囚管仲與齊齊人相管仲十三年魯莊公與曹沬會齊桓公於柯曹沬劫齊桓公求魯侵地已盟而釋桓公桓公欲背約管仲諫卒歸魯侵地十五年齊桓公始霸二十三年莊公如齊觀社三十二年初莊公築臺臨黨氏見孟女說而愛之許立為夫人割臂以盟孟女生子斑斑長說梁氏女往觀圉人犖自牆外與梁氏女戲斑怒鞭犖莊公聞之曰犖有力焉遂殺之是未可鞭而置也斑未得殺會莊公有疾莊公有三弟長曰慶父次曰叔牙次曰季友莊公取齊女為夫人曰哀姜哀姜無子哀姜娣曰叔姜生子開莊公無適嗣愛孟女欲立其子斑莊公病而問嗣於弟叔牙叔牙曰一繼一及魯之常也慶父在可為嗣君何憂莊公患叔牙欲立慶父退而問季友季友曰請以死立斑也莊公曰曩者叔牙欲立慶父柰何季友以莊公命命牙待於鍼巫氏使鍼季劫飲叔牙以鴆曰飲此則有後奉祀不然死且無後牙遂飲鴆而死魯立其子為叔孫氏八月癸亥莊公卒季友竟立子斑為君如莊公命侍喪舍于黨氏先時慶父與哀姜私通欲立哀姜娣子開及莊公卒而季友立斑十月己未慶父使圉人犖殺魯公子斑於黨氏季友犇陳慶父竟立莊公子開是為湣公湣公二年慶父與哀姜通益甚哀姜與慶父謀殺湣公而立慶父慶父使卜齮襲殺湣公於武闈季友聞之自陳與湣公弟申如邾請魯求內之魯人欲誅慶父慶父恐奔莒於是季友奉子申入立之是為釐公釐公亦莊公少子哀姜恐奔邾季友以賂如莒求慶父慶父歸使人殺慶父慶父請奔弗聽及使大夫奚斯行哭而往慶父聞奚斯音乃自殺齊桓公聞哀姜與慶父亂以危魯乃召之邾而殺之以其屍歸戮之魯魯釐公請而葬之季友母陳女故亡在陳陳故佐送季友及子申季友之將生也父魯桓公使人卜之曰男也其名曰友閒于兩社為公室輔季友亡則魯不昌及生有文在掌曰友遂以名之號為成季其後為季氏慶父後為孟氏也釐公元年以汶陽鄪封季友季友為相九年晉里克殺其君奚齊卓子齊桓公率釐公討晉亂至高梁而還立晉惠公十七年齊桓公卒二十四年晉文公即位三十三年釐公卒子興立是為文公文公元年楚太子商臣弒其父成王代立三年文公朝晉襄公十一年十月甲午魯敗翟于鹹獲長翟喬如富父終甥舂其喉以戈殺之埋其首於子駒之門以命宣伯初宋武公之世鄋瞞伐宋司徒皇父帥師禦之以敗翟于長丘獲長翟緣斯晉之滅路獲喬如弟棼如齊惠公二年鄋瞞伐齊齊王子城父獲其弟榮如埋其首於北門衛人獲其季弟簡如鄋瞞由是遂亡十五年季文子使於晉十八年二月文公卒文公有二妃長妃齊女為哀姜生子惡及視次妃敬嬴嬖愛生子俀俀私事襄仲襄仲欲立之叔仲曰不可襄仲請齊惠公惠公新立欲親魯許之冬十月襄仲殺子惡及視而立俀是為宣公哀姜歸齊哭而過市曰天乎襄仲為不道殺適立庶市人皆哭魯人謂之哀姜魯由此公室卑三桓彊宣公俀十二年楚莊王彊圍鄭鄭伯降復國之十八年宣公卒子成公黑肱立是為成公季文子曰使我殺適立庶失大援者襄仲襄仲立宣公公孫歸父有寵宣公欲去三桓與晉謀伐三桓會宣公卒季文子怨之歸父奔齊成公二年春齊伐取我隆夏公與晉郤克敗齊頃公於鞌齊復歸我侵地四年成公如晉晉景公不敬魯魯欲背晉合於楚或諫乃不十年成公如晉晉景公卒因留成公送葬魯諱之十五年始與吳王壽夢會鍾離十六年宣伯告晉欲誅季文子文子有義晉人弗許十八年成公卒子午立是為襄公是時襄公三歲也襄公元年晉立悼公往年冬晉欒書弒其君厲公四年襄公朝晉五年季文子卒家無衣帛之妾廄無食粟之馬府無金玉以相三君君子曰季文子廉忠矣九年與晉伐鄭晉悼公冠襄公於衛季武子從相行禮十一年三桓氏分為三軍十二年朝晉十六年晉平公即位二十一年朝晉平公二十二年孔丘生二十五年齊崔杼弒其君莊公立其弟景公二十九年吳延陵季子使魯問周樂盡知其意魯人敬焉三十一年六月襄公卒其九月太子卒魯人立齊歸之子裯為君是為昭公昭公年十九猶有童心穆叔不欲立曰太子死有母弟可立不即立長年鈞擇賢義鈞則卜之今裯非適嗣且又居喪意不在戚而有喜色若果立必為季氏憂季武子弗聽卒立之比及葬三易衰君子曰是不終也昭公三年朝晉至河晉平公謝還之魯恥焉四年楚靈王會諸侯於申昭公稱病不往七年季武子卒八年楚靈王就章華臺召昭公昭公往賀賜昭公寶器已而悔復詐取之十二年朝晉至河晉平公謝還之十三年楚公子棄疾弒其君靈王代立十五年朝晉晉留之葬晉昭公魯恥之二十年齊景公與晏子狩竟因入魯問禮二十一年朝晉至河晉謝還之二十五年春鸜鵒來巢師己曰文成之世童謠曰鸜鵒來巢公在乾侯鸜鵒入處公在外野季氏與郈氏鬭雞季氏芥雞羽郈氏金距季平子怒而侵郈氏郈昭伯亦怒平子臧昭伯之弟會偽讒臧氏匿季氏臧昭伯囚季氏人季平子怒囚臧氏老臧郈氏以難告昭公昭公九月戊戌伐季氏遂入平子登臺請曰君以讒不察臣罪誅之請遷沂上弗許請囚於鄪弗許請以五乘亡弗許子家駒曰君其許之政自季氏久矣為徒者眾眾將合謀弗聽郈氏曰必殺之叔孫氏之臣戾謂其眾曰無季氏與有孰利皆曰無季氏是無叔孫氏戾曰然救季氏遂敗公師孟懿子聞叔孫氏勝亦殺郈昭伯郈昭伯為公使故孟氏得之三家共伐公公遂奔己亥公至于齊齊景公曰請致千社待君子家曰棄周公之業而臣於齊可乎及止子家曰齊景公無信不如早之晉弗從叔孫見公還見平子平子頓首初欲迎昭公孟孫季孫後悔及止二十六年春齊伐魯取鄆而居昭公焉夏齊景公將內公令無受魯賂申豐汝賈許齊臣高齕子將粟五千庾子將言於齊侯曰群臣不能事魯君有異焉宋元公為魯如晉求內之道卒叔孫昭子求內其君無病而死不知天棄魯乎抑魯君有罪于鬼神也願君且待齊景公從之二十八年昭公如晉求入季平子私於晉六卿六卿受季氏賂諫晉君晉君乃止居昭公乾侯二十九年昭公如鄆齊景公使人賜昭公書自謂主君昭公恥之怒而去乾侯三十一年晉欲內昭公召季平子平子布衣跣行因六卿謝罪六卿為言曰晉欲內昭公眾不從晉人止三十二年昭公卒於乾侯魯人共立昭公弟宋為君是為定公定公立趙𥳑子問史墨曰季氏亡乎史墨對曰不亡季友有大功於魯受鄪為上卿至于文子武子世增其業魯文公卒東門遂殺適立庶魯君於是失國政政在季氏於今四君矣民不知君何以得國是以為君慎器與名不可以假人定公五年季平子卒陽虎私怒囚季桓子與盟乃捨之七年齊伐我取鄆以為魯陽虎邑以從政八年陽虎欲盡殺三桓適而更立其所善庶子以伐之載季桓子將殺之桓子詐而得脫三桓共攻陽虎陽虎居陽關九年魯伐陽虎陽虎奔齊已而奔晉趙氏十年定公與齊景公會於夾谷孔子行相事齊欲襲魯君孔子以禮歷階誅齊淫樂齊侯懼乃止歸魯侵地而謝過十二年使仲由毀三桓城收其甲兵孟氏不肯墮城伐之不克而止季桓子受齊女樂孔子去十五年定公卒子將立是為哀公哀公五年齊景公卒六年齊田乞弒其君孺子七年吳王夫差彊伐齊至繒徵百牢於魯季康子使子貢說吳王及太宰嚭以禮詘之吳王曰我文身不足責禮乃止八年吳為鄒伐魯至城下盟而去齊伐我取三邑十年伐齊南邊十一年齊伐魯季氏用冉有有功思孔子孔子自衛歸魯十四年齊田常弒其君簡公於俆州孔子請伐之哀公不聽十五年使子服景伯子貢為介適齊齊歸我侵地田常初相欲親諸侯十六年孔子卒二十二年越王句踐滅吳王夫差二十七年春季康子卒夏哀公患三桓將欲因諸侯以劫之三桓亦患公作難故君臣多閒公游于陵阪遇孟武伯於街曰請問余及死乎對曰不知也公欲以越伐三桓八月哀公如陘氏三桓攻公公奔于衛去如鄒遂如越國人迎哀公復歸卒于有山氏子寧立是為悼公悼公之時三桓勝魯如小侯卑於三桓之家十三年三晉滅智伯分其地有之三十七年悼公卒子嘉立是為元公元公二十一年卒子顯立是為穆公穆公三十三年卒子奮立是為共公共公二十二年卒子屯立是為康公康公九年卒子匽立是為景公景公二十九年卒子叔立是為平公是時六國皆稱王平公十二年秦惠王卒二十年平公卒子賈立是為文公文公元年楚懷王死于秦二十三年文公卒子讎立是為頃公頃公二年秦拔楚之郢楚頃王東徙于陳十九年楚伐我取徐州二十四年楚考烈王伐滅魯頃公亡遷於下邑為家人魯絕祀頃公卒于柯魯起周公至頃公凡三十四世太史公曰余聞孔子稱曰甚矣魯道之衰也洙泗之閒齗齗如也觀慶父及叔牙閔公之際何其亂也隱桓之事襄仲殺適立庶三家北面為臣親攻昭公昭公以奔至其揖讓之禮則從矣而行事何其戾也
