body:
  text: 循吏列傳第五十九太史公曰法令所以導民也刑罰所以禁姦也文武不備良民懼然身修者官未曾亂也奉職循理亦可以為治何必威嚴哉孫叔敖者楚之處士也虞丘相進之於楚莊王以自代也三月為楚相施教導民上下和合世俗盛美政緩禁止吏無姦邪盜賊不起秋冬則勸民山採春夏以水各得其所便民皆樂其生莊王以為幣輕更以小為大百姓不便皆去其業市令言之相曰市亂民莫安其處次行不定相曰如此幾何項乎市令曰三月頃相曰罷吾今令之復矣後五日朝相言之王曰前日更幣以為輕今市令來言曰市亂民莫安其處次行之不定臣請遂令復如故王許之下令三日而市復如故楚民俗好庳車王以為庳車不便馬欲下令使高之相曰令數下民不知所從不可王必欲高車臣請教閭里使高其梱乘車者皆君子君子不能數下車王許之居半歲民悉自高其車此不教而民從其化近者視而效之遠者四面望而法之故三得相而不喜知其材自得之也三去相而不悔知非己之罪也子產者鄭之列大夫也鄭昭君之時以所愛徐摯為相國亂上下不親父子不和大宮子期言之君以子產為相為相一年豎子不戲狎斑白不提挈僮子不犁畔二年市不豫賈三年門不夜關道不拾遺四年田器不歸五年士無尺籍喪期不令而治治鄭二十六年而死丁壯號哭老人兒啼曰子產去我死乎民將安歸公儀休者魯博士也以高弟為魯相奉法循理無所變更百官自正使食祿者不得與下民爭利受大者不得取小客有遺相魚者相不受答曰聞君嗜魚遺君魚何故不受也相曰以嗜魚故不受也今為相能自給魚今受魚而免誰復給我魚者吾故不受也食茹而美拔其園葵而棄之見其家織布好而疾出其家婦燔其機云欲令農士工女安所讎其貨乎石奢者楚昭王相也堅直廉正無所阿避行縣道有殺人者相追之乃其父也縱其父而還自繫焉使人言之王曰殺人者臣之父也夫以父立政不孝也廢法縱罪非忠也臣罪當死王曰追而不及不當伏罪子其治事矣石奢曰不私其父非孝子也不奉主法非忠臣也王赦其罪上惠也伏誅而死臣職也遂不受令自刎而死李離者晉文公之理也過聽殺人自拘當死文公曰官有貴賤罰有輕重下吏有過非子之罪也李離曰臣居官為長不與吏讓位受祿為多不與下分利今過聽殺人傅其罪下吏非所聞也辭不受令文公曰子則自以為有罪寡人亦有罪邪李離曰理有法失刑則刑失死則死公以臣能聽微決疑故使為理今過聽殺人罪當死遂不受令伏劍而死太史公曰孫叔敖出一言郢市復子產病死鄭民號哭公儀子見好布而家婦逐石奢縱父而死楚昭名立李離過殺而伏劍晉文以正國法
