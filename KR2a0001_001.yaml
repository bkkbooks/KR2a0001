body:
  text: 軒轅之時神農氏世衰諸侯相侵伐暴虐百姓而神農氏弗能征於是軒轅乃習用干戈以征不享諸侯咸來賓從而蚩尤最為暴莫能伐炎帝欲侵陵諸侯諸侯咸歸軒轅軒轅乃修德振兵治五氣藝五種撫萬民度四方教熊羆貔貅貙虎以與炎帝戰於阪泉之野三戰然後得其志蚩尤作亂不用帝命於是黃帝乃徵師諸侯與蚩尤戰於涿鹿之野遂禽殺蚩尤而諸侯咸尊軒轅為天子代神農氏是為黃帝天下有不順者黃帝從而征之平者去之披山通道未嘗寧居東至于海登丸山及岱宗西至于空桐登雞頭南至于江登熊湘北逐葷粥合符釜山而邑于涿鹿之阿遷徙往來無常處以師兵為營衛官名皆以雲命為雲師置左右大監監于萬國萬國和而鬼神山川封禪與為多焉獲寶鼎迎日推策舉風后力牧常先大鴻以治民順天地之紀幽明之占死生之説存亡之難時播百穀草木淳化鳥獸蟲蛾旁羅日月星辰水波土石金玉勞勤心力耳目節用水火材物有土德之瑞故號黃帝黃帝二十五子其得姓者十四人黃帝居軒轅之丘而娶於西陵之女是為嫘祖嫘祖為黃帝正妃生二子其後皆有天下其一曰玄囂是為青陽青陽降居江水其二曰昌意降居若水昌意娶蜀山氏女曰昌僕生高陽高陽有聖德焉黃帝崩葬橋山其孫昌意之子高陽立是為帝顓頊也帝顓頊高陽者黃帝之孫而昌意之子也靜淵以有謀疏通而知事養材以任地載時以象天依鬼神以制義治氣以教化潔誠以祭祀北至于幽陵南至于交址西至于流沙東至于蟠木動靜之物大小之神日月所照莫不砥屬帝顓頊生子曰窮蟬顓頊崩而玄囂之孫高辛立是為帝嚳帝嚳高辛者黃帝之曾孫也高辛父曰蟜極蟜極父曰玄囂玄囂父曰黃帝自玄囂與蟜極皆不得在位至高辛即帝位高辛於顓頊為族子高辛生而神靈自言其名普施利物不於其身聰以知遠明以察微順天之義知民之急仁而威惠而信修身而天下服取地之財而節用之撫教萬民而利誨之曆日月而迎送之明鬼神而敬事之其色郁郁其德嶷嶷其動也時其服也士帝嚳溉執中而遍天下日月所照風雨所至莫不從服帝嚳娶陳鋒氏女生放勳娶娵訾氏女生摯帝嚳崩而摯代立帝摯立不善而弟放勳立是為帝堯帝堯者放勳其仁如天其知如神就之如日望之如雲富而不驕貴而不舒黃收純衣彤車乘白馬能明馴德以親九族九族既睦便章百姓百姓昭明合和萬國乃命羲和敬順昊天數法日月星辰敬授民時分命羲仲居郁夷曰暘谷敬道日出便程東作日中星鳥以殷中春其民析鳥獸字微申命羲叔居南交便程南為敬致日永星火以正中夏其民因鳥獸希革申命和仲居西土曰昧谷敬道日入便程西成夜中星虛以正中秋其民夷易鳥獸毛毨申命和叔居北方曰幽都便在伏物日短星昴以正中冬其民燠鳥獸氄毛歲三百六十六日以閏月正四時信飭百官衆功皆興堯曰誰可順此事放齊曰嗣子丹朱開明堯曰吁頑凶不用堯又曰誰可者歡兜曰共工旁聚布功可用堯曰共工善言其用僻似恭漫天不可堯又曰嗟四嶽湯湯洪水滔天浩浩懷山襄陵下民其憂有能使治者皆曰鯀可堯曰鯀負命毀族不可嶽曰異哉試不可用而已堯於是聽嶽用鯀九歲功用不成堯曰嗟四嶽朕在位七十載汝能庸命踐朕位嶽應曰鄙德忝帝位堯曰悉舉貴戚及疏遠隱匿者衆皆言於堯曰有矜在民間曰虞舜堯曰然朕聞之其何如嶽曰盲者子父頑母嚚弟傲能和以孝蒸蒸治不至姦堯曰吾其試哉於是堯妻之二女觀其德於二女舜飭下二女於媯汭如婦禮堯善之乃使舜慎和五典五典能從乃遍入百官百官時序賓於四門四門穆穆諸侯遠方賓客皆敬堯使舜入山林川澤暴風雷雨舜行不迷堯以為聖召舜曰女謀事至而言可績三年矣女登帝位舜讓於德不懌正月上日舜受終於文祖文祖者堯大祖也於是帝堯老命舜攝行天子之政以觀天命舜乃在璿璣玉衡以齊七政遂類于上帝禋于六宗望于山川辨于群神揖五瑞擇吉月日見四嶽諸牧班瑞歲二月東巡狩至於岱宗祡望秩於山川遂見東方君長合時月正日同律度量衡修五禮五玉三帛二生一死為摯如五器卒乃復五月南巡狩八月西巡狩十一月北巡狩皆如初歸至于祖禰廟用特牛禮五歲一巡狩群后四朝遍告以言明試以功車服以庸肇十有二州決川象以典刑流宥五刑鞭作官刑撲作教刑金作贖刑眚災過赦怙終賊刑欽哉欽哉惟刑之靜哉歡兜進言共工堯曰不可而試之工師共工果淫辟四嶽舉鯀治鴻水堯以為不可嶽強請試之試之而無功故百姓不便三苗在江淮荊州數為亂於是舜歸而言於帝請流共工於幽陵以變北狄放歡兜於崇山以變南蠻遷三苗於三危以變西戎殛鯀於羽山以變東夷四罪而天下咸服堯立七十年得舜二十年而老令舜攝行天子之政薦之於天堯辟位凡二十八年而崩百姓悲哀如喪父母三年四方莫舉樂以思堯堯知子丹朱之不肖不足授天下於是乃權授舜授舜則天下得其利而丹朱病授丹朱則天下病而丹朱得其利堯曰終不以天下之病而利一人而卒授舜以天下堯崩三年之喪畢舜讓辟丹朱於南河之南諸侯朝覲者不之丹朱而之舜獄訟者不之丹朱而之舜謳歌者不謳歌丹朱而謳歌舜舜曰天也夫而後之中國踐天子位焉是為帝舜虞舜者名曰重華重華父曰瞽叟瞽叟父曰橋牛橋牛父曰句望句望父曰敬康敬康父曰窮蟬窮蟬父曰帝顓頊顓頊父曰昌意以至舜七世矣自從窮蟬以至帝舜皆微為庶人舜父瞽叟盲而舜母死瞽叟更娶妻而生象象傲瞽叟愛後妻子常欲殺舜舜避逃及有小過則受罪順事父及後母與弟日以篤謹匪有解舜冀州之人也舜耕歷山漁雷澤陶河濱作什器於壽丘就時於負夏舜父瞽叟頑母嚚弟象傲皆欲殺舜舜順適不失子道兄弟孝慈欲殺不可得即求嘗在側舜年二十以孝聞三十而帝堯問可用者四嶽咸薦虞舜曰可於是堯乃以二女妻舜以觀其內使九男與處以觀其外舜居媯汭內行彌謹堯二女不敢以貴驕事舜親戚甚有婦道堯九男皆益篤舜耕歷山歷山之人皆讓畔漁雷澤雷澤上人皆讓居陶河濱河濱器皆不苦窳一年而所居成聚二年成邑三年成都堯乃賜舜絺衣與琴為築倉廩豫牛羊瞽叟尚復欲殺之使舜上塗廩瞽叟從下縱火焚廩舜乃以兩笠自扞而下去得不死後瞽叟又使舜穿井舜穿井為匿空旁出舜既入深瞽叟與象共下土實井舜從匿空出去瞽叟象喜以舜為已死象曰本謀者象象與其父母分於是曰舜妻堯二女與琴象取之牛羊倉廩豫父母象乃止舜宮居鼓其琴舜往見之象鄂不懌曰我思舜正鬱陶舜曰然爾其庶矣舜復事瞽叟愛弟彌謹於是堯乃試舜五典百官皆治昔高陽氏有才子八人世得其利謂之八愷高辛氏有才子八人世謂之八元此十六族者世濟其美不隕其名至於堯堯未能舉舜舉八愷使主后土以揆百事莫不時序舉八元使布五教于四方父義母慈兄友弟恭子孝內平外成昔帝鴻氏有不才子掩義隱賊好行凶慝天下謂之渾沌少暭氏有不才子毀信惡忠崇飾惡言天下謂之窮奇顓頊氏有不才子不可教訓不知話言天下謂之檮杌此三族世憂之至于堯堯未能去縉雲氏有不才子貪于飲食冒于貨賄天下謂之叨餮天下惡之比之三凶舜賓於四門乃流四凶族遷于四裔以御螭魅於是四門辟言毋凶人也舜入于大麓烈風雷雨不迷堯乃知舜之足授天下堯老使舜攝行天子政巡狩舜得舉用事二十年而堯使攝政攝政八年而堯崩三年喪畢讓丹朱天下歸舜而禹皋陶契后稷伯夷夔龍倕益彭祖自堯時而皆舉用未有分職於是舜乃至於文祖謀于四嶽辟四門明通四方耳目命十二牧論帝德行厚德遠佞人則蠻夷率服舜謂四嶽曰有能奮庸美堯之事者使居官相事皆曰伯禹為司空可美帝功舜曰嗟然禹汝平水土維是勉哉禹拜稽首讓於稷契與皋陶舜曰然往矣舜曰棄黎民始飢汝后稷播時百穀舜曰契百姓不親五品不馴汝為司徒而敬敷五教在寬舜曰皋陶蠻夷猾夏寇賊姦軌汝作士五刑有服五服三就五流有度五度三居維明能信舜曰誰能馴豫工皆曰垂可於是以垂為共工舜曰誰能馴豫上下草木鳥獸皆曰益可於是以益為朕虞益拜稽首讓于諸臣朱虎熊羆舜曰往矣汝諧遂以朱虎熊羆為佐舜曰嗟四嶽有能典朕三禮皆曰伯夷可舜曰嗟伯夷以汝為秩宗夙夜維敬直哉維靜潔伯夷讓夔龍舜曰然以夔為典樂教稚子直而溫寬而栗剛而毋虐簡而毋傲詩言意歌長言聲依永律和聲八音能諧毋相奪倫神人以和夔曰於豫擊石拊石百獸率舞舜曰龍朕畏忌讒説殄偽振驚朕衆命汝為納言夙夜出入朕命惟信舜曰嗟女二十有二人敬哉惟時相天事三歲一考功三考絀陟遠近衆功咸興分北三苗此二十二人咸成厥功皋陶為大理平民各伏得其實伯夷主禮上下咸讓垂主工師百工致功益主虞山澤辟棄主稷百穀時茂契主司徒百姓親和龍主賓客遠人至十二牧行而九州莫敢辟違唯禹之功為大披九山通九澤決九河定九州各以其職來貢不失厥宜方五千里至于荒服南撫交址北發西戎析枝渠廋氐羌北山戎發息慎東長鳥夷四海之內咸戴帝舜之功於是禹乃興九招之樂致異物鳳皇來翔天下明德皆自虞帝始舜年二十以孝聞年三十堯舉之年五十攝行天子事年五十八堯崩年六十一代堯踐帝位踐帝位三十九年南巡狩崩於蒼梧之野葬於江南九疑是為零陵舜之踐帝位載天子旗往朝父瞽叟夔夔唯謹如子道封弟象為諸侯舜子商均亦不肖舜乃豫薦禹於天十七年而崩三年喪畢禹亦乃讓舜子如舜讓堯子諸侯歸之然後禹踐天子位堯子丹朱舜子商均皆有疆土以奉先祀服其服禮樂如之以客見天子天子弗臣示不敢專也自黃帝至舜禹皆同姓而異其國號以章明德故黃帝為有熊帝顓頊為高陽帝嚳為高辛帝堯為陶唐帝舜為有虞帝禹為夏后而別氏姓姒氏契為商姓子氏棄為周姓姬氏太史公曰學者多稱五帝尚矣然尚書獨載堯以來而百家言黃帝其文不雅馴薦紳先生難言之孔子所傳宰豫問五帝德及帝繫姓儒者或不傳余嘗西至空桐北過涿鹿東漸於海南浮江淮矣至長老皆各往往稱黃帝堯舜之處風教固殊焉總之不離古文者近是豫觀春秋國語其發明五帝德帝繫姓章矣顧弟弗深考其所表見皆不虛書缺有間矣其軼乃時時見於他説非好學深思心知其意固難為淺見寡聞道也余并論次擇其言尤雅者故著為本紀書首
