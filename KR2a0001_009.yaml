body:
  text: 呂太后本紀呂太后者高祖微時妃也生孝惠帝女魯元太后及高祖為漢王得定陶戚姬愛幸生趙隱王如意孝惠為人仁弱高祖以為不類我常欲廢太子立戚姬子如意如意類我戚姬幸常從上之關東日夜啼泣欲立其子代太子呂后年長常留守希見上益疏如意立為趙王後幾代太子者數矣賴大臣爭之及留侯策太子得毋廢呂后為人剛毅佐高祖定天下所誅大臣多呂后力呂后兄二人皆為將長兄周呂侯死事封其子呂台為酈侯子産為交侯次兄呂釋之為建成侯高祖十二年四月甲辰崩長樂宮太子襲號為帝是時高祖八子長男肥孝惠兄也異母肥為齊王餘皆孝惠弟戚姬子如意為趙王薄夫人子恆為代王諸姬子子恢為梁王子友為淮陽王子長為淮南王子建為燕王高祖弟交為楚王兄子濞為吳王非劉氏功臣番君吳芮子臣為長沙王呂后最怨戚夫人及其子趙王乃令永巷囚戚夫人而召趙王使者三反趙相建平侯周昌謂使者曰高帝屬臣趙王趙王年少竊聞太后怨戚夫人欲召趙王并誅之臣不敢遣王王且亦病不能奉詔呂后大怒乃使人召趙相趙相徵至長安乃使人復召趙王王來未到孝惠帝慈仁知太后怒自迎趙王霸上與入宮自挾與趙王起居飲食太后欲殺之不得閒孝惠元年十二月帝晨出射趙王少不能蚤起太后聞其獨居使人持鴆飲之犁明孝惠還趙王已死於是乃徙淮陽王友為趙王夏詔賜酈侯父追諡為令武侯太后遂斷戚夫人手足去眼輝耳飲瘖藥使居廁中命曰人彘居數日乃召孝惠帝觀人彘孝惠見問乃知其戚夫人乃大哭因病歲餘不能起使人請太后曰此非人所為臣為太后子終不能治天下孝惠以此日飲為淫樂不聽政故有病也二年楚元王齊悼惠王皆來朝十月孝惠與齊王燕飲太后前孝惠以為齊王兄置上坐如家人之禮太后怒乃令酌兩卮鴆置前令齊王起為壽齊王起孝惠亦起取卮欲俱為壽太后乃恐自起泛孝惠卮齊王怪之因不敢飲詳醉去問知其鴆齊王恐自以為不得脫長安憂齊內史士說王曰太后獨有孝惠與魯元公主今王有七十餘城而公主乃食數城王誠以一郡上太后為公主湯沐邑太后必喜王必無憂於是齊王乃上城陽之郡尊公主為王太后呂后喜許之乃置酒齊邸樂飲罷歸齊王三年方築長安城四年就半五年六年城就請侯來會十月朝賀七年秋八月戊寅孝惠帝崩發喪太后哭泣不下留侯子張辟彊為侍中年十五謂丞相曰太后獨有孝惠今崩哭不悲君知其解乎丞相曰何解辟彊曰帝毋壯子太后畏君等君今請拜呂台呂産呂祿為將將兵居南北軍及諸呂皆入宮居中用事如此則太后心安君等幸得脫禍矣丞相乃如辟彊計太后說其哭乃哀呂氏權由此起乃大赦天下九月辛丑葬太子即位為帝謁高廟元年號令一出太后太后稱制議欲立諸呂為王問右丞相王陵王陵曰高帝刑白馬盟曰非劉氏而王天下共擊之今王呂氏非約也太后不說問左丞相陳平絳侯周勃勃等對曰高帝定天下王子弟今太后稱制王昆弟諸呂無所不可太后喜罷朝王陵讓陳平絳侯曰始與高帝喋血盟諸君不在邪今高帝崩太后女主欲王呂氏諸君從欲阿意背約何面目見高帝地下陳平絳侯曰於今面折廷爭臣不如君夫全社稷定劉氏之後君亦不如臣王陵無以應之十一月太后欲廢王陵乃拜為帝太傅奪之相權王陵遂病免歸乃以左丞相平為右丞相以辟陽侯審食其為左丞相左丞相不治事令監宮中如郎中令食其故得幸太后常用事公卿皆因而決事乃追尊酈侯父為悼武王欲以王諸呂為漸四月太后欲侯諸呂乃先封高祖之功臣郎中令無擇為博城侯魯元公主薨賜諡為魯元太后子偃為魯王魯王父宣平侯張敖也封齊悼惠王子章為朱虛侯以呂祿女妻之齊丞相壽為平定侯少府延為梧侯乃封呂種為沛侯呂平為扶柳侯張買為南宮侯太后欲王呂氏先立孝惠後宮子彊為淮陽王子不疑為常山王子山為襄城侯子朝為軹侯子武為壺關侯太后風大臣大臣請立酈侯呂台為呂王太后許之建成康侯釋之卒嗣子有罪廢立其弟呂祿為胡陵侯續康侯後二年常山王薨以其弟襄城侯山為常山王更名義十一月呂王台薨諡為肅王太子嘉代立為王三年無事四年封呂嬃為臨光侯呂他為俞侯呂更始為贅其侯呂忿為呂城侯及諸侯丞相五人宣平侯女為孝惠皇后時無子詳為有身取美人子名之殺其母立所名子為太子孝惠崩太子立為帝帝壯或聞其母死非真皇后子乃出言曰后安能殺吾母而名我我未壯壯即為變太后聞而患之恐其為亂乃幽之永巷中言帝病甚左右莫得見太后曰凡有天下治為萬民命者蓋之如天容之如地上有歡心以安百姓百姓欣然以事其上歡欣交通而天下治今皇帝病久不已乃失惑惛亂不能繼嗣奉宗廟祭祀不可屬天下其代之群臣皆頓首言皇太后為天下齊民計所以安宗廟社稷甚深群臣頓首奉詔帝廢位太后幽殺之五月丙辰立常山王義為帝更名曰弘不稱元年者以太后制天下事也以軹侯朝為常山王置太尉官絳侯勃為太尉五年八月淮陽王薨以弟壺關侯武為淮陽王六年十月太后曰呂王嘉居處驕恣廢之以肅王台弟呂産為呂王夏赦天下封齊悼惠王子興居為東牟侯七年正月太后召趙王友友以諸呂女為后弗愛愛他姬諸呂女妒怒去讒之於太后誣以罪過曰呂氏安得王太后百歲後吾必擊之太后怒以故召趙王趙王至置邸不見令衛圍守之弗與食其群臣或竊饋輒捕論之趙王餓乃歌曰諸呂用事兮劉氏危迫脅王侯兮彊授我妃我妃既妒兮誣我以惡讒女亂國兮上曾不寤我無忠臣兮何故棄國自決中野兮蒼天舉直于嗟不可悔兮寧蚤自財為王而餓死兮誰者憐之呂氏絶理兮託天報仇丁丑趙王幽死以民禮葬之長安民冢次己丑日食晝晦太后惡之心不樂乃謂左右曰此為我也二月徙梁王恢為趙王呂王産徙為梁王梁王不之國為帝太傅立皇子平昌侯太為呂王更名梁曰呂呂曰濟川太后女弟呂嬃有女為營陵侯劉澤妻澤為大將軍太后王諸呂恐即崩後劉將軍為害乃以劉澤為琅邪王以慰其心梁王恢之徙王趙心懷不樂太后以呂産女為趙王后王后從官皆諸呂擅權微伺趙王趙王不得自恣王有所愛姬王后使人鴆殺之王乃為歌詩四章令樂人歌之王悲六月即自殺太后聞之以為王用婦人棄宗廟禮廢其嗣宣平侯張敖卒以子偃為魯王敖賜諡為魯元王秋太后使使告代王欲徙王趙代王謝願守代邊太傅産丞相平等言武信侯呂祿上侯位次第一請立為趙王太后許之追尊祿父康侯為趙昭王九月燕靈王建薨有美人子太后使人殺之無後國除八年十月立呂肅王子東平侯呂通為燕王封通弟呂莊為東平侯三月中呂后祓還過軹道見物如蒼犬據高后掖忽弗復見卜之云趙王如意為祟高后遂病掖傷高后為外孫魯元王偃年少蚤失父母孤弱乃封張敖前姬兩子侈為新都侯壽為樂昌侯以輔魯元王偃及封中大謁者張釋為建陵侯呂榮為祝茲侯諸中宦者令丞皆為關內侯食邑五百戶七月中高后病甚乃令趙王呂祿為上將軍軍北軍呂王産居南軍呂太后誡産祿曰高帝已定天下與大臣約曰非劉氏王者天下共擊之今呂氏王大臣弗平我即崩帝年少大臣恐為變必據兵衛宮慎毋送喪毋為人所制辛巳高后崩遺詔賜諸侯王各千金將相列侯郎吏皆以秩賜金大赦天下以呂王産為相國以呂祿女為帝后高后已葬心左丞相審食其為帝太傅朱虛侯劉章有氣力東牟侯興居其弟也皆齊哀王弟居長安當是時諸呂用事擅權欲為亂畏高帝故大臣絳灌等未敢發朱虛侯婦呂祿女陰知其謀恐見誅乃陰令人告其兄齊王欲令發兵西誅諸呂而立朱虛侯欲從中與大臣為應齊王欲發兵其相弗聽八月丙午齊王欲使人誅相相召平乃反舉兵欲圍王王因殺其相遂發兵東詐奪琅邪王兵并將之而西語在齊王語中齊王乃遺諸侯王書曰高帝平定天下王諸子弟悼惠王王齊悼惠王薨孝惠帝使留侯良立臣為齊王孝惠崩高后用事春秋高聽諸呂擅廢帝更立又比殺三趙王滅梁趙燕以王諸呂分齊為四忠臣進諫上惑亂弗聽今高后崩而帝春秋富未能治天下固恃大臣諸侯而諸呂又擅自尊官聚兵嚴威劫列侯忠臣矯制以令天下宗廟所以危寡人率兵入誅不當為王者漢聞之相國呂産等乃遣潁陰侯灌嬰將兵擊之灌嬰至滎陽乃謀曰諸呂權兵關中欲危劉氏而自立今我破齊還報此益呂氏之資也乃留屯滎陽使使諭齊王及諸侯與連和以待呂氏變共誅之齊王聞之乃還兵西界待約呂祿呂産欲發亂關中內憚絳侯朱虛等外畏齊楚兵又恐灌嬰畔之欲待灌嬰兵與齊合而發猶豫未決當是時濟川王太淮陽王武常山王朝名為少帝弟及魯元王呂后外孫皆年少未之國居長安趙王祿梁王産各將兵居南北軍皆呂氏之人列侯群臣莫自堅其命太尉絳侯勃不得入軍中主兵曲周侯酈商老病其子寄與呂祿善絳侯乃與丞相陳平謀使人劫酈商令其子寄往紿說呂祿曰高帝與呂后共定天下劉氏所立九王呂氏所立三王皆大臣之議事已布告諸侯諸侯皆以為宜今太后崩帝少而足下佩趙王印不急之國守藩乃為上將將兵留此為大臣諸侯所疑足下何不歸將印以兵屬太尉請梁王歸相國印與大臣盟而之國齊兵必罷大臣得安足下高枕而王千里此萬世之利也呂祿信然其計欲歸將印以兵屬太尉使人報呂産及諸呂老人或以為便或曰不便計猶豫未有所決呂祿信酈寄時與出游獵過其姑呂嬃嬃大怒曰若為將而棄軍呂氏今無處矣乃悉出珠玉寶器散堂下曰毋為他人守也左丞相食其免八月庚申旦平陽侯窋行御史大夫事見相國産計事郎中令賈壽使從齊來因數産曰王不蚤之國今雖欲行尚可得邪具以灌嬰與齊楚合從欲誅諸呂告産乃趣産急入宮平陽侯頗聞其語乃馳告丞相太尉太尉欲入北軍不得入襄平侯通尚符節乃令持節矯內太尉北軍太尉復令酈寄與典客劉揭先說呂祿曰帝使太尉守北軍欲足下之國急歸將印辭去不然禍且起呂祿以為酈兄不欺己遂解印屬典客而以兵授太尉太尉將之入軍門行令軍中曰為呂氏右袒為劉氏左袒軍中皆左袒為劉氏太尉行至將軍呂祿亦已解上將印去太尉遂將北軍然尚有南軍平陽侯聞之以呂産謀告丞相平丞相平乃召朱虛侯佐太尉太尉令朱虛侯監軍門令平陽侯告衛尉毋入相國産殿門呂産不知呂祿已去北軍乃入未央宮欲為亂殿門弗得入裴回往來平陽侯恐弗勝馳語太尉太尉尚恐不勝諸呂未敢訟言誅之乃遣朱虛侯謂曰急入宮衛帝朱虛侯請卒太尉豫卒千餘人入未央宮門遂見産廷中日餔時遂擊産産走天風大起以故其從官亂莫敢鬭逐産殺之郎中府吏廁中朱虛侯已殺産帝命謁者持節勞朱虛侯朱虛侯欲奪節信謁者不肯朱虛侯則從與載因節信馳走斬長樂衛尉呂更始還馳入北軍報太尉太尉起拜賀朱虛侯曰所患獨呂産今已誅天下定矣遂遣人分部悉捕諸呂男女無少長者皆斬之辛酉捕斬呂祿而笞殺呂嬃使人誅燕王呂通而廢魯王偃壬戌以帝太傅食其復為左丞相戊辰徙濟川王王梁立趙幽王子遂為趙王遣朱虛侯章以誅諸呂氏事告齊王令罷兵灌嬰兵亦罷滎陽而歸諸大臣相與陰謀曰少帝及梁淮陽常山王皆非真孝惠子也呂后以計詐名他人子殺其母養後宮令孝惠子之立以為後及諸王以彊呂氏今皆已夷滅諸呂而置所立即長用事吾屬無類矣不如視諸王最賢者立之或言齊悼惠王高帝長子今其適子為齊王推本言之高帝適長孫可立也大臣皆曰呂氏以外家惡而幾危宗廟亂功臣今齊王母家駟鈞駟鈞惡人也即立齊王則復為呂氏欲立淮南王以為少母家又惡乃曰代王方今高帝見子最長仁孝寬厚太后家薄氏謹良且立長故順以仁孝聞於天下便乃相與共陰使人召代王代王使人辭謝再反然後乘六乘傳後九月晦日己酉至長安舍代邸大臣皆往謁奉天子璽上代王共尊立為天子代王數讓群臣固請然後聽東牟侯興居曰誅呂氏吾無功請得除宮乃與太僕汝陰侯滕公入宮前謂少帝曰足下非劉氏不當立乃顧麾左右執戟者掊兵罷去有數人不肯去兵宦者令張澤諭告亦去兵滕公乃召乘輿車載少帝出少帝曰欲將我安之乎滕公曰出就舍舍少府乃奉天子法駕迎代王於邸報曰宮謹除代王即夕入未央宮有謁者十人持戟衛端門曰天子在也足下何為者而入代王乃謂太尉太尉往諭謁者十人皆掊兵而去代王遂入而聽政夜有司分部誅滅梁淮陽常山王及少帝於邸代王立為天子二十三年崩諡為孝文皇帝太史公曰孝惠皇帝高后之時黎民得離戰國之苦君臣俱欲休息乎無為故惠帝垂拱高后女主稱制政不出房戶天下晏然刑罰罕用罪人是希民務稼穡衣食滋殖
