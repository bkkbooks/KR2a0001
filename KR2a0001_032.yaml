body:
  text: 齊太公世家第二太公望呂尚者東海上人其先祖嘗為四嶽佐禹平水土甚有功虞夏之際封於呂或封於申姓姜氏夏商之時申呂或封枝庶子孫或為庶人尚其後苗裔也本姓姜氏從其封姓故曰呂尚呂尚蓋嘗窮困年老矣以漁釣奸周西伯西伯將出獵卜之曰所獲非龍非螭非虎非羆所獲霸王之輔於是周西伯獵果遇太公於渭之陽與語大說曰自吾先君太公曰當有聖人適周周以興子真是邪吾太公望子久矣故號之曰太公望載與俱歸立為師或曰太公博聞嘗事紂紂無道去之游說諸侯無所遇而卒西歸周西伯或曰呂尚處士隱海濱周西伯拘羑里散宜生閎夭素知而招呂尚呂尚亦曰吾聞西伯賢又善養老盍往焉三人者為西伯求美女奇物獻之於紂以贖西伯西伯得以出反國言呂尚所以事周雖異然要之為文武師周西伯昌之脫羑里歸與呂尚陰謀修德以傾商政其事多兵權與奇計故後世之言兵及周之陰權皆宗太公為本謀周西伯政平及斷虞芮之訟而詩人稱西伯受命曰文王伐崇密須犬夷大作豐邑天下三分其二歸周者太公之謀計居多文王崩武王即位九年欲修文王業東伐以觀諸侯集否師行師尚父左杖黃鉞右把白旄以誓曰蒼兕蒼兕總爾眾庶與爾舟楫後至者斬遂至盟津諸侯不期而會者八百諸侯諸侯皆曰紂可伐也武王曰未可還師與太公作此太誓居二年紂殺王子比干囚箕子武王將伐紂卜龜兆不吉風雨暴至群公盡懼唯太公彊之勸武王武王於是遂行十一年正月甲子誓於牧野伐商紂紂師敗績紂反走登鹿臺遂追斬紂明日武王立于社群公奉明水衛康叔封布采席師尚父牽牲史佚策祝以告神討紂之罪散鹿臺之錢發鉅橋之粟以振貧民封比干墓釋箕子囚遷九鼎脩周政與天下更始師尚父謀居多於是武王已平商而王天下封師尚父於齊營丘東就國道宿行遲逆旅之人曰吾聞時難得而易失客寢甚安殆非就國者也太公聞之夜衣而行犂明至國萊侯來伐與之爭營丘營丘邊萊萊人夷也會紂之亂而周初定未能集遠方是以與太公爭國太公至國脩政因其俗簡其禮通商工之業便魚鹽之利而人民多歸齊齊為大國及周成王少時管蔡作亂淮夷畔周乃使召康公命太公曰東至海西至河南至穆陵北至無棣五侯九伯實得征之齊由此得征伐為大國都營丘蓋太公之卒百有餘年子丁公呂伋立丁公卒子乙公得立乙公卒子癸公慈母立癸公卒子哀公不辰立哀公時紀侯譖之周周烹哀公而立其弟靜是為胡公胡公徙都薄姑而當周夷王之時哀公之同母少弟山怨胡公乃與其黨率營丘人襲攻殺胡公而自立是為獻公獻公元年盡逐胡公子因徙薄姑都治臨菑九年獻公卒子武公壽立武公九年周厲王出奔居彘十年王室亂大臣行政號曰共和二十四年周宣王初立二十六年武公卒子厲公無忌立厲公暴虐故胡公子復入齊齊人欲立之乃與攻殺厲公胡公子亦戰死齊人乃立厲公子赤為君是為文公而誅殺厲公者七十人文公十二年卒子成公脫立成公九年卒子莊公購立莊公二十四年犬戎殺幽王周東徙雒秦始列為諸侯五十六年晉弒其君昭侯六十四年莊公卒子釐公祿甫立釐公九年魯隱公初立十九年魯桓公弒其兄隱公而自立為君二十五年北戎伐齊鄭使太子忽來救齊齊欲妻之忽曰鄭小齊大非我敵遂辭之三十二年釐公同母弟夷仲年死其子曰公孫無知釐公愛之令其秩服奉養比太子三十三年釐公卒太子諸兒立是為襄公襄公元年始為太子時嘗與無知鬭及立絀無知秩服無知怨四年魯桓公與夫人如齊齊襄公故嘗私通魯夫人魯夫人者襄公女弟也自釐公時嫁為魯桓公婦及桓公來而襄公復通焉魯桓公知之怒夫人夫人以告齊襄公齊襄公與魯君飲醉之使力士彭生抱上魯君車因拉殺魯桓公桓公下車則死矣魯人以為讓而齊襄公殺彭生以謝魯八年伐紀紀遷去其邑十二年初襄公使連稱管至父戍葵丘瓜時而往及瓜而代往戍一歲卒瓜時而公弗為發代或為請代公弗許故此二人怒因公孫無知謀作亂連稱有從妹在公宮無寵使之閒襄公曰事成以女為無知夫人冬十二月襄公游姑棼遂獵沛丘見彘從者曰彭生公怒射之彘人立而啼公懼墜車傷足失屨反而鞭主屨者茀三百茀出宮而無知連稱管至父等聞公傷乃遂率其眾襲宮逢主屨茀茀曰且無入驚宮驚宮未易入也無知弗信茀示之創乃信之待宮外令茀先入茀先入即匿襄公戶閒良久無知等恐遂入宮茀反與宮中及公之幸臣攻無知等不勝皆死無知入宮求公不得或見人足於戶閒發視乃襄公遂弒之而無知自立為齊君桓公元年春齊君無知游於雍林雍林人嘗有怨無知及其往游雍林人襲殺無知告齊大夫曰無知弒襄公自立臣謹行誅唯大夫更立公子之當立者唯命是聽初襄公之醉殺魯桓公通其夫人殺誅數不當淫於婦人數欺大臣群弟恐禍及故次弟糾奔魯其母魯女也管仲召忽傅之次弟小白奔莒鮑叔傅之小白母衛女也有寵於釐公小白自少好善大夫高傒及雍林人殺無知議立君高國先陰召小白於莒魯聞無知死亦發兵送公子糾而使管仲別將兵遮莒道射中小白帶鉤小白詳死管仲使人馳報魯魯送糾者行益遲六日至齊則小白已入高傒立之是為桓公桓公之中鉤詳死以誤管仲已而載溫車中馳行亦有高國內應故得先入立發兵距魯秋與魯戰于乾時魯兵敗走齊兵掩絕魯歸道齊遺魯書曰子糾兄弟弗忍誅請魯自殺之召忽管仲讎也請得而甘心醢之不然將圍魯魯人患之遂殺子糾于笙瀆召忽自殺管仲請囚桓公之立發兵攻魯心欲殺管仲鮑叔牙曰臣幸得從君君竟以立君之尊臣無以增君君將治齊即高傒與叔牙足也君且欲霸王非管夷吾不可夷吾所居國國重不可失也於是桓公從之乃詳為召管仲欲甘心實欲用之管仲知之故請往鮑叔牙迎受管仲及堂阜而脫桎梏齋祓而見桓公桓公厚禮以為大夫任政桓公既得管仲與鮑叔隰朋高傒修齊國政連五家之兵設輕重魚鹽之利以贍貧窮祿賢能齊人皆說二年伐滅郯郯子奔莒初桓公亡時過郯郯無禮故伐之五年伐魯魯將師敗魯莊公請獻遂邑以平桓公許與魯會柯而盟魯將盟曹沬以匕首劫桓公於壇上曰反魯之侵地桓公許之已而曹沬去匕首北面就臣位桓公後悔欲無與魯地而殺曹沬管仲曰夫劫許之而倍信殺之愈一小快耳而棄信於諸侯失天下之援不可於是遂與曹沬三敗所亡地於魯諸侯聞之皆信齊而欲附焉七年諸侯會桓公於甄而桓公於是始霸焉十四年陳厲公子完號敬仲來奔齊齊桓公欲以為卿讓於是以為工正田成子常之祖也二十三年山戎伐燕燕告急於齊齊桓公救燕遂伐山戎至于孤竹而還燕莊公遂送桓公入齊境桓公曰非天子諸侯相送不出境吾不可以無禮於燕於是分溝割燕君所至與燕命燕君復修召公之政納貢于周如成康之時諸侯聞之皆從齊二十七年魯湣公母曰哀姜桓公女弟也哀姜淫於魯公子慶父慶父弒湣公哀姜欲立慶父魯人更立釐公桓公召哀姜殺之二十八年衛文公有狄亂告急於齊齊率諸侯城楚丘而立衛君二十九年桓公與夫人蔡姬戲船中蔡姬習水蕩公公懼止之不止出船怒歸蔡姬弗絕蔡亦怒嫁其女桓公聞而怒興師往伐三十年春齊桓公率諸侯伐蔡蔡潰遂伐楚楚成王興師問曰何故涉吾地管仲對曰昔召康公命我先君太公曰五侯九伯若實征之以夾輔周室賜我先君履東至海西至河南至穆陵北至無棣楚貢包茅不入王祭不具是以來責昭王南征不復是以來問楚王曰貢之不入有之寡人罪也敢不共乎昭王之出不復君其問之水濱齊師進次于陘夏楚王使屈完將兵扞齊齊師退次召陵桓公矜屈完以其眾屈完曰君以道則可若不則楚方城以為城江漢以為溝君安能進乎乃與屈完盟而去過陳陳袁濤塗詐齊令出東方覺秋齊伐陳是歲晉殺太子申生三十五年夏會諸侯于葵丘周襄王使宰孔賜桓公文武胙彤弓矢大路命無拜桓公欲許之管仲曰不可乃下拜受賜秋復會諸侯於葵丘益有驕色周使宰孔會諸侯頗有叛者晉侯病後遇宰孔宰孔曰齊侯驕矣弟無行從之是歲晉獻公卒里克殺奚齊卓子秦穆公以夫人入公子夷吾為晉君桓公於是討晉亂至高梁使隰朋立晉君還是時周室微唯齊楚秦晉為彊晉初與會獻公死國內亂秦穆公辟遠不與中國會盟楚成王初收荊蠻有之夷狄自置唯獨齊為中國會盟而桓公能宣其德故諸侯賓會於是桓公稱曰寡人南伐至召陵望熊山北伐山戎離枝孤竹西伐大夏涉流沙束馬懸車登太行至卑耳山而還諸侯莫違寡人寡人兵車之會三乘車之會六九合諸侯一匡天下昔三代受命有何以異於此乎吾欲封泰山禪梁父管仲固諫不聽乃說桓公以遠方珍怪物至乃得封桓公乃止三十八年周襄王弟帶與戎翟合謀伐周齊使管仲平戎於周周欲以上卿禮管仲管仲頓首曰臣陪臣安敢三讓乃受下卿禮以見三十九年周襄王弟帶來奔齊齊使仲孫請王為帶謝襄王怒弗聽四十一年秦穆公虜晉惠公復歸之是歲管仲隰朋皆卒管仲病桓公問曰群臣誰可相者管仲曰知臣莫如君公曰易牙如何對曰殺子以適君非人情不可公曰開方如何對曰倍親以適君非人情難近公曰豎刀如何對曰自宮以適君非人情難親管仲死而桓公不用管仲言卒近用三子三子專權四十二年戎伐周周告急於齊齊令諸侯各發卒戍周是歲晉公子重耳來桓公妻之四十三年初齊桓公之夫人三曰王姬徐姬蔡姬皆無子桓公好內多內寵如夫人者六人長衛姬生無詭少衛姬生惠公元鄭姬生孝公昭葛嬴生昭公潘密姬生懿公商人宋華子生公子雍桓公與管仲屬孝公於宋襄公以為太子雍巫有寵於衛共姬因宦者豎刀以厚獻於桓公亦有寵桓公許之立無詭管仲卒五公子皆求立各十月乙亥齊桓公卒易牙入與豎刀因內寵殺群吏而立公子無詭為君太子昭奔宋桓公病五公子各樹黨爭立及桓公卒遂相攻以故宮中空莫敢棺桓公尸在床上六十七日尸蟲出于戶十二月乙亥無詭立乃棺赴辛巳夜斂殯桓公十有餘子要其後立者五人無詭立三月死無謚次孝公次昭公次懿公次惠公孝公元年三月宋襄公率諸侯兵送齊太子昭而伐齊齊人恐殺其君無詭齊人將立太子昭四公子之徒攻太子太子走宋宋遂與齊人四公子戰五月宋敗齊四公子師而立太子昭是為齊孝公宋以桓公與管仲屬之太子故來征之以亂故八月乃葬齊桓公六年春齊伐宋以其不同盟于齊也夏宋襄公卒七年晉文公立十年孝公卒孝公弟潘因衛公子開方殺孝公子而立潘是為昭公昭公桓公子也其母曰葛嬴昭公元年晉文公敗楚於城濮而會諸侯踐土朝周天子使晉稱伯六年翟侵齊晉文公卒秦兵敗於殽十二年秦穆公卒十九年五月昭公卒子舍立為齊君舍之母無寵於昭公國人莫畏昭公之弟商人以桓公死爭立而不得陰交賢士附愛百姓百姓說及昭公卒子舍立孤弱即與眾十月即墓上弒齊君舍而商人自立是為懿公懿公桓公子也其母曰密姬懿公四年春初懿公為公子時與丙戎之父獵爭獲不勝及即位斷丙戎父足而使丙戎僕庸職之妻好公內之宮使庸職驂乘五月懿公游於申池二人浴戲職曰斷足子戎曰奪妻者二人俱病此言乃怨謀與公游竹中二人弒懿公車上棄竹中而亡去懿公之立驕民不附齊人廢其子而迎公子元於衛立之是為惠公惠公桓公子也其母衛女曰少衛姬避齊亂故在衛惠公二年長翟來王子城父攻殺之埋之於北門晉趙穿弒其君靈公十年惠公卒子頃公無野立初崔杼有寵於惠公惠公卒高國畏其偪也逐之崔杼奔衛頃公元年楚莊王彊伐陳二年圍鄭鄭伯降已復國鄭伯六年春晉使郤克於齊齊使夫人帷中而觀之郤克上夫人笑之郤克曰不是報不復涉河歸請伐齊晉侯弗許齊使至晉郤克執齊使者四人河內殺之八年晉伐齊齊以公子彊質晉晉兵去十年春齊伐魯衛魯衛大夫如晉請師皆因郤克晉使郤克以車八百乘為中軍將士燮將上軍欒書將下軍以救魯衛伐齊六月壬申與齊侯兵合靡笄下癸酉陳于鞌逄丑父為齊頃公右頃公曰馳之破晉軍會食射傷郤克流血至履克欲還入壁其御曰我始入再傷不敢言疾恐懼士卒願子忍之遂復戰戰齊急丑父恐齊侯得乃易處頃公為右車絓於木而止晉小將韓厥伏齊侯車前曰寡君使臣救魯衛戲之丑父使頃公下取飲因得亡脫去入其軍晉郤克欲殺丑父丑父曰代君死而見僇後人臣無忠其君者矣克舍之丑父遂得亡歸齊於是晉軍追齊至馬陵齊侯請以寶器謝不聽必得笑克者蕭桐叔子令齊東畝對曰叔子齊君母齊君母亦猶晉君母子安置之且子以義伐而以暴為後其可乎於是乃許令反魯衛之侵地十一年晉初置六卿賞鞌之功齊頃公朝晉欲尊王晉景公晉景公不敢受乃歸歸而頃公弛苑囿薄賦斂振孤問疾虛積聚以救民民亦大說厚禮諸侯竟頃公卒百姓附諸侯不犯十七年頃公卒子靈公環立靈公九年晉欒書弒其君厲公十年晉悼公伐齊齊令公子光質晉十九年立子光為太子高厚傅之令會諸侯盟於鍾離二十七年晉使中行獻子伐齊齊師敗靈公走入臨菑晏嬰止靈公靈公弗從曰君亦無勇矣晉兵遂圍臨菑臨菑城守不敢出晉焚郭中而去二十八年初靈公取魯女生子光以為太子仲姬戎姬戎姬嬖仲姬生子牙屬之戎姬戎姬請以為太子公許之仲姬曰不可光之立列於諸侯矣今無故廢之君必悔之公曰在我耳遂東太子光使高厚傅牙為太子靈公疾崔杼迎故太子光而立之是為莊公莊公殺戎姬五月壬辰靈公卒莊公即位執太子牙於句竇之丘殺之八月崔杼殺高厚晉聞齊亂伐齊至高唐莊公三年晉大夫欒盈奔齊莊公厚客待之晏嬰田文子諫公弗聽四年齊莊公使欒盈閒入晉曲沃為內應以兵隨之上太行入孟門欒盈敗齊兵還取朝歌六年初棠公妻好棠公死崔杼取之莊公通之數如崔氏以崔杼之冠賜人侍者曰不可崔杼怒因其伐晉欲與晉合謀襲齊而不得閒莊公嘗笞宦者賈舉賈舉復侍為崔杼閒公以報怨五月莒子朝齊齊以甲戌饗之崔杼稱病不視事乙亥公問崔杼病遂從崔杼妻崔杼妻入室與崔杼自閉戶不出公擁柱而歌宦者賈舉遮公從官而入閉門崔杼之徒持兵從中起公登臺而請解不許請盟不許請自殺於廟不許皆曰君之臣杼疾病不能聽命近於公宮陪臣爭趣有淫者不知二命公踰牆射中公股公反墜遂弒之晏嬰立崔杼門外曰君為社稷死則死之為社稷亡則亡之若為己死己亡非其私暱誰敢任之門開而入枕公尸而哭三踊而出人謂崔杼必殺之崔杼曰民之望也舍之得民丁丑崔杼立莊公異母弟杵臼是為景公景公母魯叔孫宣伯女也景公立以崔杼為右相慶封為左相二相恐亂起乃與國人盟曰不與崔慶者死晏子仰天曰嬰所不唯忠於君利社稷者是從不肯盟慶封欲殺晏子崔杼曰忠臣也舍之齊太史書曰進杼弒莊公崔杼殺之其弟復書崔杼復殺之少弟復書崔杼乃舍之景公元年初崔杼生子成及彊其母死取東郭女生明東郭女使其前夫子無咎與其弟偃相崔氏成有罪二相急治之立明為太子成請老於崔崔杼許之二相弗聽曰崔宗邑不可成彊怒告慶封慶封與崔杼有郤欲其敗也成彊殺無咎偃於崔杼家家皆奔亡崔杼怒無人使一宦者御見慶封慶封曰請為子誅之使崔杼仇盧蒲嫳攻崔氏殺成彊盡滅崔氏崔杼婦自殺崔杼毋歸亦自殺慶封為相國專權三年十月慶封出獵初慶封已殺崔杼益驕嗜酒好獵不聽政令慶舍用政已有內郤田文子謂桓子曰亂將作田鮑高欒氏相與謀慶氏慶舍發甲圍慶封宮四家徒共擊破之慶封還不得入奔魯齊人讓魯封奔吳吳與之朱方聚其族而居之富於在齊其秋齊人徙葬莊公僇崔杼尸於市以說眾九年景公使晏嬰之晉與叔向私語曰齊政卒歸田氏田氏雖無大德以公權私有德於民民愛之十二年景公如晉見平公欲與伐燕十八年公復如晉見昭公二十六年獵魯郊因入魯與晏嬰俱問魯禮三十一年魯昭公辟季氏難奔齊齊欲以千社封之子家止昭公昭公乃請齊伐魯取鄆以居昭公三十二年彗星見景公坐柏寢嘆曰堂堂誰有此乎群臣皆泣晏子笑公怒晏子曰臣笑群臣諛甚景公曰彗星出東北當齊分野寡人以為憂晏子曰君高臺深池賦斂如弗得刑罰恐弗勝茀星將出彗星何懼乎公曰可禳否晏子曰使神可祝而來亦可禳而去也百姓苦怨以萬數而君令一人禳之安能勝眾口乎是時景公好治宮室聚狗馬奢侈厚賦重刑故晏子以此諫之四十二年吳王闔閭伐楚入郢四十七年魯陽虎攻其君不勝奔齊請齊伐魯鮑子諫景公乃囚陽虎陽虎得亡奔晉四十八年與魯定公好會夾谷犂鉏曰孔丘知禮而怯請令萊人為樂因執魯君可得志景公害孔丘相魯懼其霸故從犂鉏之計方會進萊樂孔子歷階上使有司執萊人斬之以禮讓景公景公慚乃歸魯侵地以謝而罷去是歲晏嬰卒五十五年范中行反其君於晉晉攻之急來請粟田乞欲為亂樹黨於逆臣說景公曰范中行數有德於齊不可不救乃使乞救而輸之粟五十八年夏景公夫人燕姬適子死景公寵妾芮姬生子荼荼少其母賤無行諸大夫恐其為嗣乃言願擇諸子長賢者為太子景公老惡言嗣事又愛荼母欲立之憚發之口乃謂諸大夫曰為樂耳國何患無君乎秋景公病命國惠子高昭子立少子荼為太子逐群公子遷之萊景公卒太子荼立是為晏孺子冬未葬而群公子畏誅皆出亡荼諸異母兄公子壽駒黔奔衛公子駔陽生奔魯萊人歌之曰景公死乎弗與埋三軍事乎弗與謀師乎師乎胡黨之乎晏孺子元年春田乞偽事高國者每朝乞驂乘言曰子得君大夫皆自危欲謀作亂又謂諸大夫曰高昭子可畏及未發先之大夫從之六月田乞鮑牧乃與大夫以兵入公宮攻高昭子昭子聞之與國惠子救公公師敗田乞之徒追之國惠子奔莒遂反殺高昭子晏圉奔魯八月齊秉意茲田乞敗二相乃使人之魯召公子陽生陽生至齊私匿田乞家十月戊子田乞請諸大夫曰常之母有魚菽之祭幸來會飲會飲田乞盛陽生橐中置坐中央發橐出陽生曰此乃齊君矣大夫皆伏謁將與大夫盟而立之鮑牧醉乞誣大夫曰吾與鮑牧謀共立陽生鮑牧怒曰子忘景公之命乎諸大夫相視欲悔陽生前頓首曰可則立之否則已鮑牧恐禍起乃復曰皆景公子也何為不可乃與盟立陽生是為悼公悼公入宮使人遷晏孺子於駘殺之幕下而逐孺子母芮子芮子故賤而孺子少故無權國人輕之悼公元年齊伐魯取讙闡初陽生亡在魯季康子以其妹妻之及歸即位使迎之季姬與季魴侯通言其情魯弗敢與故齊伐魯竟迎季姬季姬嬖齊復歸魯侵地鮑子與悼公有郤不善四年吳魯伐齊南方鮑子弒悼公赴于吳吳王夫差哭於軍門外三日將從海入討齊齊人敗之吳師乃去晉趙鞅伐齊至賴而去齊人共立悼公子壬是為簡公簡公四年春初簡公與父陽生俱在魯也監止有寵焉及即位使為攻田成子憚之驟顧於朝御鞅言簡公曰田監不可並也君其擇焉弗聽子我夕田逆殺人逢之遂捕以入田氏方睦使囚病而遺守囚者酒醉而殺守者得亡子我盟諸田於陳宗初田豹欲為子我臣使公孫言豹豹有喪而止後卒以為臣幸於子我子我謂曰吾盡逐田氏而立女可乎對曰我遠田氏矣且其違者不過數人何盡逐焉遂告田氏子行曰彼得君弗先必禍子子行舍於公宮夏五月壬申成子兄弟四乘如公子我在幄出迎之遂入閉門宦者禦之子行殺宦者公與婦人飲酒於檀臺成子遷諸寢公執戈將擊之太史子餘曰非不利也將除害也成子出舍于庫聞公猶怒將出曰何所無君子行拔劍曰需事之賊也誰非田宗所不殺子者有如田宗乃止子我歸屬徒攻闈與大門皆弗勝乃出田氏追之豐丘人執子我以告殺之郭關成子將殺大陸子方田逆請而免之以公命取車於道出雍門田豹與之車弗受曰逆為余請豹與余車余有私焉事子我而有私於其讎何以見魯衛之士庚辰田常執簡公于俆州公曰余蚤從御鞅言不及此甲午田常弒簡公于俆州田常乃立簡公弟驁是為平公平公即位田常相之專齊之政割齊安平以東為田氏封邑平公八年越滅吳二十五年卒子宣公積立宣公五十一年卒子康公貸立田會反廩丘康公二年韓魏趙始列為諸侯十九年田常曾孫田和始為諸侯遷康公海濱二十六年康公卒呂氏遂絕其祀田氏卒有齊國為齊威王彊於天下太史公曰吾適齊自泰山屬之琅邪北被于海膏壤二千里其民闊達多匿知其天性也以太公之聖建國本桓公之盛修善政以為諸侯會盟稱伯不亦宜乎洋洋哉固大國之風也
